[project]
name = "evo-p0p3"
version = "0.1.0"
description = "Evo-Articraft P0 prompt contract and P3 kinematic fidelity evaluation"
requires-python = ">=3.11"
dependencies = [
    "mujoco>=3.1",
    "numpy>=1.24",
    "pyyaml>=6.0",
]

[project.scripts]
p0 = "evo_p0p3.p0.cli:main"
p3 = "evo_p0p3.p3.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["evo_p0p3"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
