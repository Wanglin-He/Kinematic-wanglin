      evo_p0p3/p3/mjcf.py for this predicate, or add an `exact=True` mode to it.

      - Metric: f(q) = prod(max(0, min(hi_c,hi_k) - max(lo_c,lo_k))) / prod(hi_c - lo_c), child in the
