      item. 0.02 is right only for a 13-point grid (step 0.02) on [0, 0.24]; a 5-point grid gives 0.06.
      Likewise "+0.30000" for (door, drawer_1) is the minimum only if q1 >= 0.02 is sampled — at q1 =
      0 exactly the value is +0.300666, and "+0.04000" for (door, drawer_2) is +0.044721 at q2 = 0. The
      item''s oracle is grid-dependent with the grid undeclared.


      WRONG #3. The URDF declares drawer travel [0, 0.24], but P0-revised Example A (the only cabinet
      contract in the spec) declares range {unit: m, min: 0.0, max: 0.40} with states {closed: 0.0, open:
      0.40}. Paired with Example A verbatim, KF1.range_and_reference FAILS on control and defect alike,
      contradicting "KF1.range_and_reference pass". The item never names its companion contract.


      WRONG #4. "KF1.axis pass" is not safe for door_hinge. The contract''s axis.relational is {type:
      interface_line, between: [door, cabinet_body]}, defined as "the longest principal direction of the
      contact region". The 0.43-wide door panel overlays BOTH side walls, so the contact region is two
      vertical slabs at x = +/-0.2075. Measured PCA over 11196 sampled points: variances 0.04308 (x) vs
      0.03224 (z), first principal direction [1,0,0], |cos| to the hinge axis = 0.0 -> FAIL at axis_angle_deg
      15. It passes only under a "largest extent" reading (0.62 z vs 0.43 x). A gold-standard asset must
      not sit on an unresolved reading of the predicate.'
    fix: '1. Never read a raw mj_geomDistance return as a reported clearance. Freeze distmax small and
      make the forbidden predicate a pure threshold test: distmax = 2 * forbidden_penetration_m = 0.002,
      fail iff mj_geomDistance(m, d, g1, g2, 0.002, fromto) < -forbidden_penetration_m. I verified the
      glitch never appears while distmax <= 0.039 (returns the clamped distmax correctly at 0.002/0.005/0.01/0.02/0.03/0.039).
      Rewrite the evidence line as "forbidden_pair pass 3/3, all clearances >= distmax (0.002 m)", or,
      if a real clearance number is wanted, compute it with an exact analytic primitive-primitive routine
      (every geom here is box/cylinder/sphere) and label it as computed, not read from MuJoCo.


      2. Add a mandatory narrowphase guard to the spec: if the scalar return is <= 0 but ||fromto[3:6]
      - fromto[0:3]|| > 1e-6, the narrowphase failed — discard the sample and recompute at reduced distmax,
      or emit a hard "distance_unreliable" evidence flag. That inequality is exactly the signature of
      the failure I measured.


      3. Pin the sweep in the item: "13 samples per independent DOF, endpoints included — drawer step
      0.02 m over [0, 0.24], door step 0.1745 rad over [0, 2.094]; full Cartesian product; first failing
      sample = lexicographically first in (q1, q2, qd) ascending order." Then the asserted first failing
      q1 = 0.02 m and max_drift 0.240000 are reproducible.


      4. Ship the companion contract with the asset. It must be Example A with drawer range max changed
      0.40 -> 0.24 and states.open 0.40 -> 0.24 (do not instead widen the URDF to 0.40 — a 0.36-deep drawer
      travelling 0.40 m out of a 0.40-deep carcass leaves the cabinet entirely and would break KF3 elsewhere).


      5. Remove the interface_line ambiguity, either by pinning the algorithm in P0 to "direction of maximum
      extent of the contact region" (not PCA), or by changing the asset so the contact region is unambiguous:
      inset the door so it seats in the 0.40 m opening rather than overlaying both side walls symmetrically
      — e.g. door_panel size 0.395 0.02 0.62 at origin xyz "-0.198 0 0.34" with the hinge origin moved
      to "0.198 -0.2095 0". Re-verify that on_edge_of still gives fraction 1.0 and that the (door, cabinet_body)
      required stop_contact still reads about -0.0005 m at closed.


      6. Minor, worth stating in the item so an implementer does not over-credit it: the behavioural half
      of rigid_follower cannot fail when the structural half passes — in a rigid subtree the relative
      pose is constant by construction of mj_kinematics. It only adds information in the failing branch,
      where it separates "detached and the leader actually moves it" from "detached but the leader''s
      joint never moves". Say that explicitly rather than "both halves of the check fire", which reads
      as two independent signals.'
- item: cabinet_swept_interference
  lens: gold
  verdict:
    sound: false
    problem: "I built the URDF, injected the stated `<mujoco>` compiler block, loaded it in MuJoCo (3.3.7,\
      \ mj_geomDistance present), and swept it. It parses and compiles cleanly (8 bodies / 3 joints /\
      \ 13 geoms, ncon=0 as expected). Most of the `expected` block reproduces exactly. But three claims\
      \ are false, and the first one destroys the asset's entire reason for existing.\n\n**(1) FATAL —\
      \ the defect IS visible at a declared-state corner, so the asset does not discriminate the implementation\
      \ it was built to catch.**\n\n`defect` says \"The interference exists only in the interior of the\
      \ range\"; `expected` says \"an implementation that samples only the declared states and not the\
      \ interior of the range scores this asset 1.0.\" Both are false. The sweep has three independent\
      \ DOFs, and `asset_states` declares `open` for the drawers too. At the pure corner sample **q =\
      \ (drawer_1=any, drawer_2=0.24, door=0.0)** — i.e. drawer_2 open, door closed, every joint at a\
      \ declared state — I measure\n\n    door / drawer_2 = -0.16000 m\n\nMeasured corner table (drawer_1\
      \ free, both values identical):\n    (·, 0.00, 0.000) = +0.02000    (·, 0.00, 2.094) = +0.02708\n\
      \    (·, 0.24, 0.000) = **-0.16000**  (·, 0.24, 2.094) = +0.01709\n\nCause: making the door taller\
      \ put door_panel at z∈[0.03,0.90], overlapping drawer_2's band [0.69,0.91]. Rotation about a vertical\
      \ axis preserves z, so the *same* z-overlap that arms the swept interference also puts the closed\
      \ door directly in drawer_2's pull-out path along −y. An endpoint-only implementation scores this\
      \ asset 2/3, identically to a correct one, and is not caught.\n\nThis is not a tuning error — it\
      \ is structurally unfixable in the current design. Any part that translates through the door's closed\
      \ plane must be z-disjoint from the door to be corner-clear; but if it is z-disjoint from the door\
      \ it can never be swept into, because a vertical hinge preserves z. So with a vertical door hinge\
      \ and front-pulling drawers, no choice of numbers makes (door, drawer_k) interior-only if the interference\
      \ is carried by the full-width panel.\n\n**(2) `(door, drawer_1) min +0.05000 m` is not reproducible.**\
      \ The true separation is ≥0.05 m at all q (door z≤0.90, drawer_1 z≥0.95). But `mj_geomDistance`\
