      F. Freeze the on_edge_of plane rule in the anchor item so this asset''s "fraction 1.0000" is determined:
      plane through the joint axis whose normal is the component of (part geometric centre - xanchor)
      perpendicular to xaxis, normalized; N/A when that vector''s norm is below 1e-9 (axis through the
