      \ the first point is not even on door_panel, which ends at z=0.90) at 78 of 1001 uniformly sampled\
      \ θ — including **k=4, θ=0.5584 on the implied 16-point grid the other numbers come from**. I reproduced\
      \ it in a standalone two-box MJCF: 159/2001 samples wrong. It is a degenerate parallel-face box-box\
      \ case, insensitive to `distmax` (tested 0.051→5.0). So the min-over-sweep an implementation actually\
      \ reports for that pair is 0.00000, not +0.05000. It does not flip the verdict (0.0 > −0.001, still\
      \ passes, S_forbidden still 2/3), but any implementation checked against the stated evidence string\
      \ is marked wrong.\n\n**(3) `worst q = 0.698` is an unbroken tie and the sweep grid is never stated.**\
      \ The −0.21000 minimum is a plateau (it is just the z-overlap 0.90−0.69), spanning θ∈[0.5884, 0.9680]\
      \ — 726 of 4001 samples tie at the exact minimum. On the implied grid both k=5 (0.6980) and k=6\
      \ (0.8376) return −0.21000. Reverse-engineering confirms every θ in `expected` is 2.094·k/15, so\
      \ the item silently assumes a 16-point sweep; nothing in the item says so, and \"first failing q\
      \ = 0.1396\" is a grid value, not a crossing (true crossing 0.051712; true re-clear 1.528534 vs\
      \ stated 1.5356).\n\nEverything else checks out: xanchor = (−0.2155, −0.2095, 0); on_edge_of = 1.0000\
      \ (all door vertices at x_rel ∈ {0.0005, 0.4305}); required stop_contact 3/3 at −0.00050 for all\
      \ three pairs; (drawer_1, drawer_2) = +0.04000 flat; (door, cabinet_body) = −0.24000 mid-swing,\
      \ correctly not a forbidden pair; endpoints +0.02000 / +0.02708.\n\nScripts: /private/tmp/claude-501/-Users-wanglin-Projects-Articraft--claude-worktrees-evo-articraft-verifier-856ef5/b56010b7-3646-4c78-939c-312f618f2b2b/scratchpad/\
      \ (asset.urdf, fixed.urdf, t2.py, t4.py, t6.py)."
    fix: "Move the interference off the full-width panel and onto a narrow band of the door that, **at\
      \ closed, lies outside drawer_2's x-footprint** (drawer_2 spans x∈[−0.19,0.19]; the door is hinged\
