      \ would no longer live in the file under test — which defeats the purpose of a fault-injection asset.\
      \ Use MJCF."
- item: A0.parse_and_canonicalize
  lens: p0check
  verdict:
    sound: false
    problem: "Empirically falsified against PyYAML 6.0.3 / 5.3.1 (CPython 3.9). Six defects; D1 and D2\
      \ are fatal.\n\nD1 — DETERMINISM, FATAL. contract_hash depends on Python *object identity*, not\
      \ on contract content, so the claim's central promise (\"byte-exact artifact\") is false. `SafeRepresenter.ignore_aliases`\
      \ exempts only scalars; safe_dump emits `&id001`/`*id001` for ANY container appearing twice by id().\
      \ Step 4 says \"writing converted values back in place\", and revised P0 §09 mandates default-filling\
      \ (\"epsilon 可省略，省略时用 tolerances.coupling_residual\"). The textbook implementation — `c.setdefault('residual_norm',\
      \ DEFAULT_NORM)` with one module-level dict — was measured:\n  contract == contract2 -> True  |\
      \  same hash -> False\n  h1 19ce7855d92a93fab3fc…   h2 e7fe4fed912bde61c943…\nTwo identical contracts,\
      \ two hashes. Worse, the emitted \"canonical\" artifact then CONTAINS aliases, which step 2 declares\
      \ grounds for rejection — canon(x) is not admissible input to A0, so canonicalization is not idempotent/closed.\
      \ And the stated pass_condition passes anyway: `safe_load(dump) == canonicalized -> True` while\
      \ `'*id' in dump -> True`. Nothing catches it.\n\nD2 — COMPUTABILITY, FATAL. Two steps are unimplementable\
      \ as literally written.\n(a) `inspect.signature(yaml.safe_load)` is `(stream)` — verified, no Loader\
      \ parameter. Step 1 mandates safe_load; step 3 mandates installing a custom construct_mapping. You\
      \ cannot do both. The only routes are `yaml.load(stream, Loader=StrictSafeLoader)`, or `yaml.add_constructor(...,\
      \ Loader=SafeLoader)` which mutates process-global state and silently changes every other YAML consumer\
      \ in the process.\n(b) Step 2 requires rejecting anchors/aliases, but safe_load erases them and\
      \ the spec names no API for it. Identity is neither sound nor complete as a detector: aliased scalars\
      \ (`x: &e 0.005` / `y: *e`) give `x is y -> True`, while independently written equal strings give\
      \ `p is q -> False`; and an unreferenced anchor (`a: &x {k: 1}`) is completely invisible post-load\
      \ (`o['a'] is o['b'] -> False`). Only the event/node stream sees them (`yaml.parse()` yields `MappingStartEvent(anchor='x')`,\
      \ `AliasEvent(anchor='x')`).\n\nD3 — pass_condition too weak to verify the claim. `safe_load(dump)\
      \ == canonicalized` is value equality: it ignores key order (`safe_load(\"b: 2\\na: 1\\n\") == {'a':1,'b':2}\
      \ -> True`), so it cannot detect loss of the order-preservation the claim rests on; it never checks\
      \ byte-exactness or idempotence; and it fails spuriously on NaN (`{'k': nan}` -> `k: .nan` -> reload\
      \ unequal).\n\nD4 — INCOMPLETENESS. The claim says \"both hashes\" but the algorithm defines exactly\
      \ one (contract_hash). The second — presumably the tolerances-block hash R3/§12 requires be emitted\
      \ with every result — has no scope, prefix, or serialization defined.\n\nD5 — the stated can_it_fail\
      \ does not exercise this predicate. The §12-vs-examples discrepancy is real (§12 shows tolerances\
      \ as a standalone top-level block; examples A and B both nest it under kinematic_claims), but an\
      \ author following both puts the keys in DIFFERENT mappings, where step 3 provably does not fire\
      \ — the strict loader returned `{'tolerances': {...}, 'kinematic_claims': {'tolerances': {...}}}`\
      \ with no error. The item concedes it punts to A12. NOT a tautology (malformed YAML, non-mapping\
      \ root, and same-mapping duplicates do fail — verified \"duplicate key 'tolerances' line 2\"), but\
      \ the justification is wrong.\n\nD6 — YAML 1.1 coercion, invisible to the round-trip check. Verified:\
      \ `012 -> 10` (octal), `no -> False`, `1:30 -> 90` (sexagesimal), `2026-08-19 -> datetime.date`.\
      \ Corruption happens before the round-trip, so it passes.\n\nCLEARED: no whole-asset bbox-diagonal\
      \ normalization anywhere. Emitter stability better than feared — PyYAML 5.3.1 vs 6.0.3, and pure-Python\
      \ SafeDumper vs libyaml CSafeDumper, produced byte-identical output on a realistic contract fragment\
      \ and on 1e17 / 1e-7 / -0.0 / pi."
    fix: "D1 — deep-copy before dumping AND hard-disable aliasing in the dumper:\n    class NoAliasDumper(yaml.SafeDumper):\n\
      \        def ignore_aliases(self, data): return True\n    dump = yaml.dump(copy.deepcopy(obj), Dumper=NoAliasDumper,\
      \ sort_keys=False,\n                     default_flow_style=False, allow_unicode=True, width=10**9,\n\
      \                     line_break='\\n', explicit_start=False)\nVerified this repairs all three symptoms:\
      \ `alias in dump -> False`, `hashes match -> True`, `idempotent -> True`.\n\nD2 — rewrite steps\
      \ 1–3 as three explicit passes over the same byte string, in this order:\n  Pass 1 (lexical, on\
      \ bytes): `for ev in yaml.parse(text): if isinstance(ev, yaml.AliasEvent) or getattr(ev,'anchor',None)\
      \ is not None: reject(anchor_name=ev.anchor, line=ev.start_mark.line+1, column=ev.start_mark.column+1)`.\
      \ This is the only place aliases/anchors are detectable.\n  Pass 2 (structural): `class StrictSafeLoader(yaml.SafeLoader)`\
      \ overriding `construct_mapping` to raise on a repeated key; load with `yaml.load(text, Loader=StrictSafeLoader)`\
      \ — NOT `yaml.safe_load`, and NOT `yaml.add_constructor` on the global SafeLoader. Record duplicate_key_path\
      \ as the full dotted path, not just the key.\n  Pass 3: reject non-mapping root / empty document\
      \ / any non-finite float (NaN, ±inf) anywhere.\n\nD3 — replace the pass_condition with byte-level\
      \ idempotence plus an explicit order check:\n    dump2 = canonicalize_and_dump(yaml.load(dump, Loader=StrictSafeLoader))\n\
      \    assert dump2 == dump                      # byte compare, not ==\n    assert '&id' not in dump\
      \ and '*id' not in dump\n    assert key_order_walk(safe_load(dump)) == key_order_walk(canonicalized)\n\
      where key_order_walk yields (path, tuple(mapping.keys())) depth-first, so a reordering is actually\
      \ caught.\n\nD4 — either define the second hash concretely (e.g. tolerances_hash = sha256(b'evo-p0-tolerances/1\\\
      n' + canonical_dump_of(resolved_tolerances_block))) and add it to the evidence list, or strike \"\
      both hashes\" from the claim and say \"the contract hash\".\n\nD5 — replace can_it_fail with a case\
      \ that actually fails A0: a same-mapping duplicate (verified to raise), a top-level sequence instead\
      \ of a mapping, or a contract using `<<:` merge keys (which require an alias and so trip pass 1).\
      \ Separately, add an explicit structural rejection for `tolerances` present at BOTH top level and\
      \ inside kinematic_claims, since the revised P0 is genuinely self-contradictory about its home —\
      \ and pin its canonical location in the spec (the two worked examples agree on kinematic_claims.tolerances,\
      \ so put it there and fix §12).\n\nD6 — after pass 2, assert every identifier-position value (required_parts[].id/group,\
      \ joints[].id/part/parent, rigid_attachments follower/leader, couplings[].id and relation.dependent/independent,\
      \ independent_dofs[], asset_states keys, contact_policy parts/state) is `isinstance(x, str)`; reject\
      \ with evidence field coerced_scalar_path otherwise.\n\nAlso pin the PyYAML version in requirements\
      \ and emit it alongside contract_hash — `sort_keys` only exists from PyYAML 5.1, so the algorithm\
      \ silently produces a sorted (wrong) dump on anything older."
- item: A1.referential_integrity
  lens: p0check
  verdict:
    sound: false
    problem: 'Not a tautology (a contract can fail it — `drawer_front` in the v1 example really is undeclared),
      no MuJoCo API is invoked so COMPUTABILITY is vacuously fine, and it normalizes by nothing, so the
      bbox-diagonal ban is respected. It fails on DETERMINISM, on completeness of its own claim, and on
      DEGENERACY. Seven defects, ranked:


      **(1) DETERMINISM — group references have no surface syntax and no PID/GID collision rule.** `group`
      is the one field this revision added, and A1 is the only place it is ever resolved (no worked example
      in the revised P0 uses a group at a consumption site — example A''s `contact_policy` uses bare instance
      ids throughout). Two unresolved questions: (a) revised P0 §04 writes the group reference as `{group:
      drawer}` — a *mapping* — but A1 rule 5 says "the value must be a non-empty str". If §04''s brace
      syntax is literal, A1 rejects every legal group reference and no contract using a group can pass
      the gate; if the reference is a bare string, §04''s syntax is wrong. A1 never says which. (b) Nothing
      anywhere forbids `required_parts: [{id: drawer, ...}, {id: drawer_a, group: drawer}]`. With a bare-string
      reference, `parts: [drawer, cabinet_body]` then resolves to 1 part or N parts depending on whether
      PID or GID is consulted first — A1 says "must be in PID, or in GID when group_ok" with no precedence.
      Two conforming implementations produce different KF3 pair sets, hence different `S_forbidden` denominators,
      from byte-identical input. This is precisely the name-matching-by-inference failure A1 exists to
      eliminate.


      **(2) DETERMINISM — `argmin` Levenshtein has no tie-break, and GID is declared as a *set*.** Step
      3 defines PID and JID as "ordered list" but step 2 defines GID as "a set of ... values" — under
      CPython, string set iteration order varies with `PYTHONHASHSEED` across processes. And the legal
      set for a group_ok=true site is PID ∪ GID, so both the candidate order and the tie outcome are undefined.
      Ties are not exotic here, they are the *normal* case, because this revision replaced `count: 3`
      with enumerated instances that differ by one digit. Measured on the revised flagship example A (PID
      = cabinet_body, drawer_1, drawer_2, door, handle_1, handle_2, door_knob; GID = drawer, handle):
      `drawer_3` → distance 1 tie between `drawer_1` and `drawer_2`; `handle_3` → distance 1 tie between
      `handle_1` and `handle_2`. `nearest_declared` and `levenshtein_distance` are emitted evidence, so
      the report is not byte-reproducible. Levenshtein itself is also undefined (unit costs? Damerau transpositions?
      case-sensitive? Unicode normalization?), as is whether token comparison in rule 5 is raw byte equality
      or normalized.


      **(3) The frozen table is incomplete, which falsifies the claim.** The claim is "every part ID and
      every joint ID appearing at **any** reference site". The table pulls one site out of `dynamics_claims`
      (`functional_scenarios[i].foreach_part[k]`) and omits the two others in the same block, both of
      which are exactly where a downstream run hits "part/joint not found": `dynamics_claims.functional_scenarios[i].observation.joint_pattern`
      (a **joint** reference, e.g. `"{part}_slide"` → `drawer_1_slide`) and `dynamics_claims.input_protocol.<name>.target_part_pattern`
      (a **part** reference, e.g. `"{part}"`). Both are templated, which is a second decision A1 never
      makes: expand against `foreach_part` and check the expansion, or forbid literals there. Also `axis.relational.between`
      is hardcoded to `between[0]` and `between[1]`, so `between: [door, cabinet_body, hinge_pin]` leaves
      `hinge_pin` silently unchecked.


      **(4) It walks a field that does not exist in the authoritative schema, with `deviates_from_spec`
      empty.** `kinematic_claims.passive_dofs[i] (see A20)` — `passive_dofs` appears nowhere in any of
      the five documents (verified by grep across all of them). Either A20 introduces it, in which case
      A1 must declare the dependency and the P0 schema must be amended, or the field is invented. Silently
      walking a path the authoritative P0 does not define is a spec deviation.


      **(5) DEGENERACY — no legal token for `joints[i].parent` when `type: free`.** The joint type vocabulary
      is `slide | hinge | ball | free` and A10 explicitly contemplates free joints. A MuJoCo free joint
      attaches a body to the world; there is no part to name as parent, and neither P0 revision defines
      a `world`/`base`/`null` sentinel (grep confirms `world` appears in the revised P0 only in "world
      z"). A1 as written rejects any legitimate free-floating-asset contract before generation, or each
      implementer invents a private exemption.


      **(6) DEGENERACY — null-valued optional containers are not defined as "site absent", and a literal
      reading fails the flagship example.** Rule 5 says "for every site **present** in this contract:
      the value must be a non-empty str" without defining "present". A10 *mandates* `anchor: null` (not
      key omission) for slide/ball/free, and `canonical_frame.front: null` is the default. Under a reading
      where "present" means the parent key exists, both slide joints in example A and its `front` fail
      A1 — i.e. the contract A1 ships as its own reference is rejected by A1.


      **(7) The `can_it_fail` calibration evidence is wrong in both directions — I replayed A1''s own
      frozen table against the v1 example.** It cannot fail on `contact_policy.allowed[0].parts=[''drawer'',''cabinet_body'']`:
      v1 declares `{id: drawer, count: 3}` and `{id: cabinet_body, count: 1}`, so both tokens are literally
      in PID; and `contact_policy.allowed[*]` is not even a path in A1''s own table, since v2 renamed
      it to required/permitted/forbidden. Meanwhile the item states "four tokens" and misses 9 real violations.
      The actual result is **13 violation records over 6 distinct tokens**: `part_relations[1].object=drawer_front`;
      `proportion_claims[0].parts[0..2]=drawer_1/2/3`; `proportion_claims[1].object=drawer_front`; `joints[0..2].part=drawer_1/2/3`;
      `forbidden[0].parts[0..1]=drawer_side,cabinet_wall`; `functional_scenarios[0].foreach_part[0..2]=drawer_1/2/3`.
      The dominant failure mode in the only worked negative example — v1''s `count` instances never expanding
      — is the one the item does not mention.


      Minor, also unspecified: no duplicate check on `couplings[].id` (KF2 aggregates `mean_g` over couplings,
      and duplicate ids make evidence paths ambiguous); no defined message or evidence shape when a token
      is a non-str (int, list, dict); violation emission order across the three table sections not stated;
      the `na_condition` argument leans on A3/A8, which do not fire for an all-fixed contract — only A2
      carries it, and only if `required_parts` is asserted non-empty, which nothing does.'
    fix: '**(1) Freeze group addressing.** Add to step 2/5: a group reference is the bare string form
      (drop §04''s `{group: X}` brace shorthand, or amend P0 §04 to the bare form — pick one and state
      it). Add a new rejection at step 2: `PID ∩ GID ≠ ∅` → `A1.group_label_collides_with_part_id`, evidence
      `{colliding_token, declaring_part_index, declaring_group_members}`. With collisions rejected up
      front, resolution at any group_ok=true site is unique and no precedence rule is needed. Also reject
      a `group` value that is not a non-empty str, and note that a group with exactly one member is legal.


      **(2) Make the whole check order-deterministic.** Redefine GID as an *ordered list*: group labels
      in order of first appearance in `required_parts`, deduplicated, preserving that order. Define `candidates(site)
      = PID (in declaration order) ++ GID (in first-appearance order)` for part sites, `JID` for joint
      sites. Specify Levenshtein as classic unit-cost insert/delete/substitute (no transpositions), computed
      on raw Unicode codepoints with no case folding and no normalization; specify token comparison in
      rule 5 as exact codepoint equality (no strip, no case fold, no NFC) — and say so explicitly, since
      the point of A1 is that nothing is inferred. Tie-break: smallest distance, then earliest index in
      `candidates`. Emit violations in a fixed order: table-row order as printed, then ascending array
      index, then ascending sub-index. Then the evidence block is byte-reproducible.


      **(3) Complete the table.** Add, kind=joint, group_ok=false: `dynamics_claims.functional_scenarios[i].observation.joint_pattern`.
      Add, kind=part, group_ok=true: `dynamics_claims.input_protocol.<name>.target_part_pattern`. Add
      the template rule: if the value contains `{part}`, substitute each element of the enclosing scenario''s
      expanded `foreach_part` in turn and check every expansion (evidence path `...observation.joint_pattern[expanded:drawer_1]`);
      a value with no `{...}` is checked as a literal; any `{token}` other than `{part}` → `A1.unknown_template_variable`.
      Replace `between[0]` / `between[1]` with `between[k]` for all k, plus an arity check `len(between)
      == 2` → `A1.relational_between_arity`.


      **(4)** Either delete `passive_dofs` from the table, or keep it and set `deviates_from_spec` to:
      "walks `kinematic_claims.passive_dofs[]`, a field introduced by A20 and not present in the 2026-08-19
      P0 schema; P0 §07/§10 must be amended before this row is live." Make the row conditional on the
      field being present so a P0-conformant contract is unaffected.


      **(5)** Add a reserved-token rule: `joints[i].parent` accepts the literal `world` in addition to
      any member of PID; `world` is forbidden as a `required_parts[].id` and as a `group` value (reject
      with `A1.reserved_token_as_declared_id`). Add the consistency rule `type == free ⇒ parent == "world"`
      (route to A10 if you prefer to keep A1 purely referential). Evidence for a `world` parent: `kind=part,
      token=world, resolved_as=reserved`.


      **(6)** Add to step 5 a definition of "present": a site is present iff every ancestor container
      on its dotted path exists and is non-null, and the leaf key itself exists. Explicitly: `anchor:
      null` ⇒ `anchor.on_edge_of` and `anchor.through_center_of` are absent; `front: null` ⇒ `front.outward_normal_of`
      is absent; `couplings: []`, `rigid_attachments: []`, `permitted: []` contribute no sites. A present
      leaf whose value is not a non-empty str → `A1.non_string_reference` with `token_repr` (the `repr()`
      of the value) and `token_type` in evidence, rather than falling through to the Levenshtein path.


      **(7)** Replace the `can_it_fail` text with the replayed result: "Applying the frozen table to the
      v1 example in the original P0 yields 13 violation records over 6 distinct tokens — `drawer_front`
      at `part_relations[1].object` and `proportion_claims[1].object`; `drawer_1/2/3` at `proportion_claims[0].parts[0..2]`,
      `joints[0..2].part`, and `functional_scenarios[0].foreach_part[0..2]` (v1''s `{id: drawer, count:
      3}` never defined an expansion); `drawer_side` and `cabinet_wall` at `contact_policy.forbidden[0].parts[0..1]`.
      Note that `contact_policy.allowed[0].parts=[''drawer'',''cabinet_body'']` does **not** fail: both
      tokens are declared in v1, and `allowed` is not a path in this table." Use this as the regression
      fixture — it is the only worked negative example available, and its expected output should be checked
      in as 13 records in the frozen emission order.


      **Minor:** add `A1.duplicate_coupling_id` over `kinematic_claims.couplings[].id` alongside the existing
      duplicate checks (KF2''s `mean_g` needs a unique key). Add `A1.empty_required_parts` so the `na_condition`
      argument actually holds, and restate that argument as resting on A2 alone (A3/A8 do not fire for
      an all-fixed contract).'
- item: A2.part_geometry_total
  lens: p0check
  verdict:
    sound: false
    problem: 'Five defects; the first two are demonstrated, not hypothetical.


      P1 — THE PASS CONDITION DOES NOT ENFORCE THE CLAIM (primary). The claim is "exactly one entry for
      every declared required part". Step 2 says "reject duplicates", but the pass_condition is only `missing
      == [] and extra == [] and every geometry non-empty`, and the evidence list has no field for a duplicate.
      Because `missing` is computed against `set(GEOM_IDS)`, a duplicated row is invisible to it. I ran
      the algorithm exactly as written on Revised-P0 Example A with a second `door_knob` row carrying
      handle_1''s text ("long thin curved bar with rounded ends") added: result `(True, [], set(), [])`
      — PASS. So an ambiguous contract in which GF2''s per-part text T_p is undefined (GF2 = mean_p mean_v
      cos(E_img, E_text(T_p)), P2 §GF2, requires exactly one T_p per part) is admitted, and the cardinality
      half of the claim is unenforced. Worse, the "reject duplicates" step is unimplementable against
      the natural load shape: the sibling implementation at /Users/wanglin/Projects/Articraft/.claude/worktrees/evo-articraft-verifier-856ef5/evo-p0p3/evo_p0p3/p0/loader.py:138
      `_part_geometry` returns `dict[str, str]` (declared `Mapping[str, str]` at evo_p0p3/p0/schema.py:473),
      so duplicates collapse last-write-wins before any check runs. The spec never says A2 must see the
      raw ordered row list.


      P2 — NONDETERMINISTIC EVIDENCE. `extra = set(GEOM_IDS) − PID` is a set. `missing` was explicitly
      given an order ("in PID declaration order"); `extra` and `empty_geometry_ids` were not. Python salts
      str hashing per process, so `extra_part_geometry_ids` is not byte-identical across runs — I got
      five different orderings of the same five ids under PYTHONHASHSEED=1..5. This is exactly the "set
      iteration order dependence" the review criteria name.


      P3 — PID IS DELEGATED TO AN UNPINNED DEFINITION, AND THE OBVIOUS READING FAILS THE GOLD CONTRACT.
      Step 1 is "Build PID (A1 step 1)". A1 is referential integrity over *references*, and Revised P0
      §04 makes `group` labels legitimate addressable identifiers ("{group: drawer} 展开成 [drawer_1, drawer_2]"),
      so A1''s step-1 identifier set plausibly contains `drawer` and `handle` as well as the seven instance
      ids. Reusing that set here makes A2 demand part_geometry rows for the group labels, and Revised-P0
      Example A — the reference-correct contract — FAILs A2 with missing_part_ids=[''drawer'',''handle''].
      A2 must define PID locally instead of importing it.


      P4 — DEGENERACY / CRASH SURFACE, AND THE N/A JUSTIFICATION CITES THE WRONG FIELD. na_condition argues
      "never N/A — required_parts is mandatory", but the field that can be absent is part_geometry, not
