      \ construction; mjEQ_JOINT == 2; efc_type == 0 is mjCNSTR_EQUALITY and efc_pos carries the signed\
      \ violation (I read -0.7 for a a0=0.7 pin at qpos=0). No whole-asset bounding-box diagonal is used\
