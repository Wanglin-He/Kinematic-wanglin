      0.04 m to 0.000000 against forbidden_penetration_m = 0.001. The gold-standard control now passes
      by exactly zero margin on a predicate it has nothing to do with — one MuJoCo build returning -1e-9
      instead of +0.0 fails the control, breaking the "correct asset must score 1.0" invariant this whole
      set exists to establish.


