      \ to 1.0 and b to 0.0 when the attribute is absent (8 of the corpus's 17 mimic tags omit multiplier,\
      \ so the default rule is load-bearing, not decorative). polycoef=\"b m 0 0 0\" is exactly MuJoCo's\
