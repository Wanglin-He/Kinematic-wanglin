- item: A5.independent_dofs_resolvable
  lens: p0check
  verdict:
    sound: false
    problem: "A5 is not a tautology, names no MuJoCo API, and normalizes by nothing — those checks pass.\
      \ It fails on DEGENERACY, DETERMINISM, and internal contradiction.\n\n(1) HEADLINE — step 4 does\
      \ not achieve the harm it names; two one-line bypasses reproduce it exactly while passing A5.\n\
      The stated harm of `empty_sweep_set` is \"every state set would be the single reference configuration,\
      \ and every forbidden/required pair would be evaluated at one sample only.\" Non-emptiness does\
      \ not prevent that.\n  (a) Partial coverage. Example A with `independent_dofs: [door_hinge]`. A1\
      \ passes (declared), A5 passes (sequence, no dups, non-empty), A6 is vacuous (no couplings). KF3\
      \ now pins drawer_1_slide and drawer_2_slide at reference for the whole sweep: `forbidden: [drawer_1,\
      \ drawer_2]` can never be violated, and `required: {[drawer_1, cabinet_body], closed, stop_contact}`\
      \ is evaluated at exactly one configuration. Identical defect, zero detection. This is a regression\
      \ against code the team already wrote — `/Users/wanglin/Projects/Articraft/.claude/worktrees/evo-articraft-verifier-856ef5/evo-p0p3/evo_p0p3/p0/admission.py:222`\
      \ already reports undriven joints under code A5.\n  (b) Zero-span range. `independent_dofs: [drawer_1_slide]`\
      \ with `range: {unit: m, min: 0.0, max: 0.0}`. Non-empty, no duplicates, resolvable — and nothing\
      \ in P0's A1–A12 requires `max > min` (A11 checks only unit/type compatibility; grep for a span\
      \ check in admission.py returns nothing). The sweep collapses to one sample anyway. It also zeroes\
      \ `state_match_relative × (max − min)`, so state classification degrades to exact equality — the\
      \ precise failure P0 §10 was written to prevent — and makes `residual_norm: {by: dependent_range_span}`\
      \ a division by zero.\n  (c) The converse case shows why step 4 must be *kept* as well as strengthened:\
      \ a coupling 2-cycle (j1 dependent on j2, j2 dependent on j1) with `independent_dofs: []` satisfies\
      \ any per-joint \"is independent or is some coupling's dependent\" test while nothing is ever driven.\
      \ The existing one-hop union at admission.py:222 (`driven = indep | {cp.relation.dependent for cp\
      \ in couplings}`) admits exactly this.\n\n(2) DETERMINISM — `duplicate_ids` has no specified ordering.\
      \ The obvious implementation (`{x for x in D if D.count(x) > 1}`) is a set of strings; with the\
      \ default random PYTHONHASHSEED I measured 7 distinct orderings across 8 fresh processes. Same contract\
      \ in, different evidence bytes out.\n\n(3) The N/A clause is self-contradictory and leaves a failure\
      \ unreported. \"N/A only when joints == [], in which case independent_dofs must be []\" asserts\
      \ a MUST inside a branch that is by definition not evaluated: there is no failure code, no evidence\
      \ field, and no denominator for it. `joints: []` with a non-empty `independent_dofs` therefore falls\
      \ through to A1, whose message (\"not a declared joint\") misdiagnoses a static object as a typo.\
      \ `joints: null` / absent is also not `[]`, so the N/A branch does not fire at all.\n\n(4) Dangling\
      \ reference. \"its ORDER is load-bearing for A27\" — P0-revised's admission table is A1–A12; grepping\
      \ both P0-revised and P3 finds no A13 or higher. An engineer told \"no further decisions\" cannot\
      \ resolve this.\n\n(5) The rationale for step 3 is false as stated. \"A repeated DOF doubles its\
      \ sample count and silently reweights KF3\": KF3's collision half aggregates as per-pair max penetration\
      \ / min clearance over samples, and S_forbidden/S_required are counted per *pair*, not per sample\
      \ — maxima are idempotent under repeated samples, so a duplicate cannot move them. And for k samples\
      \ per DOF a duplicate multiplies total grid size by k, not 2. The real harms are combinatorial cost,\
      \ non-deterministic `first failing q` evidence, and reweighting of any per-sample-averaged sub-score\
      \ (S_motion, if it is ever defined that way). Keep the check; the stated reason will mislead whoever\
      \ later decides error-vs-warning.\n\n(6) Entry typing is unspecified, and the two hazards both crash\
      \ or corrupt. Step 1 constrains only the container. `independent_dofs: [door_hinge, [door_hinge]]`\
      \ raises `TypeError: unhashable type: 'list'` on any set/dict-based duplicate scan (verified). PyYAML\
      \ is YAML 1.1, so a joint id `on` or `no` parses as `True`/`False` (verified) and then compares\
      \ unequal to every string in JID, producing an A1 message about a joint named \"True\".\n\n(7) Unstated\
      \ precondition. Step 2's \"entry ∈ JID\" presumes joint IDs are unique, but no rule in A1–A12 requires\
      \ it; if JID is built as `{j.id for j in joints}`, two joints sharing an id collapse silently and\
      \ the entry binds ambiguously.\n\n(8) ball/free joints are unhandled. Entries are joint *IDs*, so\
      \ one entry of type `free` is 6 DOFs with no defined 1-D sweep parameterization (P0 A11 does not\
      \ even assign `range.unit` to `free`). Step 4 forces such a joint into the list to satisfy non-emptiness,\
      \ where KF3 has no rule for it. This is a plausible false rejection for a single-body asset whose\
      \ only joint is a free root joint."
    fix: 'Rescope A5 to "the sweep driver set is well-formed and actually drives every declared joint,"
      and specify it as follows. Inputs: J = kinematic_claims.joints (declaration order), D = kinematic_claims.independent_dofs,
      C = kinematic_claims.couplings.


      Step 0 — normalize and assert preconditions. Absent or YAML `null` for J or D is normalized to `[]`
      and echoed as `[]` in evidence. J[i].id must be pairwise distinct, else A5.duplicate_joint_id (JID
      is otherwise not a well-defined map); if this is meant to be A1''s job, say so by name here.


      Step 1 — typing, before any hashing. D must be a YAML sequence and every entry a YAML string scalar.
      Reject mappings, sequences, null, int, bool → A5.malformed_independent_dofs, evidence bad_entries:
      [{index, repr, yaml_type}]. Doing this first is what prevents the unhashable-list TypeError; rejecting
      bool is what catches `on`/`no`/`yes`/`off`. Order is preserved; never sorted.


      Step 2 — membership. Each entry ∈ JID, reported under A1''s code (unchanged).


      Step 3 — duplicates, deterministically. Single left-to-right pass over D into an insertion-ordered
      dict counter. duplicate_ids = ids with count ≥ 2, emitted in order of first occurrence in D, each
      as {id, indices: [all 0-based indices]}. Never construct it from a set. → A5.duplicate_independent_dof.
      Replace the rationale with: duplicates multiply the Cartesian grid by k (the per-DOF sample count)
      without adding a distinct configuration, make `first failing q` depend on enumeration order, and
      reweight any per-sample-averaged sub-score; they cannot move max penetration or min clearance.


      Step 4 — emptiness (keep, unchanged). len(J) > 0 and len(D) == 0 → A5.empty_sweep_set. Necessary
      and not subsumed by step 5: it is the only rule that catches a coupling cycle with D == [].


      Step 5 — coverage by transitive closure (new; this is what closes bypass (a)). driven = list(D)
      deduped by first occurrence. Repeat until fixpoint, iterating C in declaration order on each pass:
      for each c, if c.relation.independent ∈ driven and c.relation.dependent ∉ driven, append c.relation.dependent.
      Then undriven = [j.id for j in J if j.id not in driven], in J''s declaration order. undriven non-empty
      → A5.undriven_joint, evidence undriven_ids, driven_ids. Use the closure, not the one-hop union at
      admission.py:222 — the union accepts a 2-cycle, the closure does not, and the closure correctly
      accepts a chain D=[j1] → j2 dep of j1 → j3 dep of j2.


      Step 6 — degenerate span (new; closes bypass (b)). For every id ∈ D, its joint must satisfy range.max
      − range.min > min_range_span, a new frozen entry in the tolerances block (declare min_range_span_m
      and min_range_span_rad, or simply require strict max > min and say so). Violation → A5.degenerate_sweep_range,
      evidence degenerate_span_ids. Justify it by the same three consequences: one sample, state_match
      tolerance collapses to exact equality, dependent_range_span normalization divides by zero. If this
      is instead delegated to a new A13, name A13 explicitly here rather than leaving it unowned.


      Step 7 — multi-DOF joints. State the rule instead of leaving it open: joints of type ball or free
      are exempt from steps 5 and 6 and do not count toward step 4''s non-emptiness requirement; they
      are pinned at reference by KF3 and recorded in evidence as unsweepable_joints. (Or, if KF3 is to
      sweep them, define the parameterization there and cite it.) Either way A11 must be extended to give
      `free` a range.unit or declare its range N/A.


      Step 8 — N/A, made non-contradictory. A5 is N/A only when J == [] AND D == []. J == [] with D non-empty
      is a failure, A5.dofs_without_joints — not N/A, and not delegated to A1, whose "not a declared joint"
      text misdiagnoses a static object as a typo.


      Fix the dangling reference in step 1: either renumber A27 to a check that exists, or restate the
      reason without it — "order determines the sweep''s sample enumeration order and therefore the reported
      first failing q, so it must be preserved verbatim and never sorted."


      Evidence on failure: predicate_id, independent_dofs (verbatim, original order), joint_ids (declaration
      order), n_joints, duplicate_ids (first-occurrence order, with indices), undriven_ids, driven_ids,
      bad_entries, degenerate_span_ids, unsweepable_joints, tolerances_hash.'
- item: A6.dependent_not_independent
  lens: p0check
  verdict:
    sound: false
    problem: "The predicate is NOT a tautology (good: `couplings[].relation.dependent` and `independent_dofs[]`\
      \ are two independently authored P0 fields; the Example-B variant `independent_dofs: [gear_large_spin,\
      \ gear_small_spin]` really does fail, and the stated rationale matches P0 §10 \"扫掠只驱动这些关节；依赖关节的值由\
      \ couplings.relation 算出\"). It names no MuJoCo API, so computability is moot, and it normalizes\
      \ by nothing, so the whole-asset-diagonal ban is not touched. It fails on DETERMINISM and DEGENERACY.\n\
      \n(1) DETERMINISM — demonstrated, not theoretical. Step 1 builds `DEP` as a set comprehension and\
      \ step 2 as `DEP ∩ set(independent_dofs)`; step 3 then iterates that set to emit \"one message per\
      \ joint id\". Python salts `str.__hash__` per process (PEP 456 SipHash, PYTHONHASHSEED random by\
      \ default), so set iteration order over joint-id strings differs between runs. I ran the literal\
      \ structure five times in five processes and got five different orders:\n  ['lever_c','gear_small_spin','arm_b','shaft_e','cam_d']\n\
      \  ['arm_b','lever_c','cam_d','gear_small_spin','shaft_e']\n  ['gear_small_spin','shaft_e','arm_b','lever_c','cam_d']\n\
      \  ['lever_c','gear_small_spin','shaft_e','arm_b','cam_d']\n  ['gear_small_spin','cam_d','lever_c','shaft_e','arm_b']\n\
      The admission report is therefore not byte-identical for identical input, and the `evidence.dependent_set`\
      \ field is a set with no serialization order specified either.\n\n(2) DETERMINISM — unspecified\
      \ tie-break. Step 3 says to name \"the coupling id that made it dependent\" (singular) and `evidence`\
      \ carries a singular `coupling_id`, but nothing in A6 or anywhere else in the revised P0 forbids\
      \ one joint from being the `dependent` member of two or more couplings. `DEP` as a set collapses\
      \ exactly that multiplicity, and the spec gives no rule for which coupling id to report. Nor is\
      \ a duplicate `coupling.id` across two couplings excluded, which makes the reported id ambiguous\
      \ in a second way.\n\n(3) DEGENERACY — step 4 catches the 1-cycle and misses the 2-cycle, though\
      \ its own stated justification covers both. Step 4 rejects `dependent == independent` because it\
      \ \"would otherwise make A22's component arithmetic divide a one-vertex component by a self-loop\
      \ edge\". The identical pathology survives one step removed: c1 {dependent: B, independent: A},\
      \ c2 {dependent: A, independent: B}, with `independent_dofs: []`. Then DEP = {A, B}, clash = {A,B}\
      \ ∩ ∅ = ∅, and neither coupling has dependent == independent, so A6 as written PASSES — yet no sweep\
      \ value can ever be resolved for A or B and A22 receives a two-vertex component with two edges.\
      \ Nothing else in the admission list A1–A12 catches this: A5 only requires independent_dofs entries\
      \ to exist in `joints`, and no check requires independent_dofs to be non-empty. Since this item\
      \ explicitly takes on the job of handing A22 a well-formed graph, stopping at self-loops is arbitrary.\n\
      \n(4) DEGENERACY — malformed input crashes instead of failing. `c.relation.dependent` is dereferenced\
      \ unguarded. A coupling missing `relation`, `relation.dependent`, or `relation.independent` raises\
      \ rather than returning an admission FAIL. An admission gate must never crash on the very thing\
      \ it exists to reject.\n\n(5) N/A semantics undefined for a gate. A6 is an admission check (\"任一条不满足\
      \ → 提示词退回修改，不进入资产生成\"), i.e. a boolean gate, not a scored metric with an applicable-only denominator.\
      \ `na_condition: \"N/A when couplings == []\"` never says N/A means admission proceeds. Example\
      \ A ships `couplings: []`, so the canonical example hits this path."
    fix: "Replace the set-based algorithm with a declaration-ordered one, and generalize step 4 to acyclicity.\n\
      \nPreconditions: A6 runs only after A1 (referential integrity) and A5 have passed, so every id compared\
      \ is known to resolve. IDs are compared by exact equality of the post-YAML-scalar string — no case\
      \ folding, no whitespace normalization, no name inference.\n\n1. Build `dep_map`, an insertion-ordered\
      \ dict (Python `dict`, never a `set`), by iterating `couplings` in declaration order (list index\
      \ order as parsed), appending `c.id` to `dep_map[c.relation.dependent]`.\n   1a. If any coupling\
      \ lacks `relation`, `relation.dependent`, or `relation.independent`, emit `A6.malformed_coupling`\
      \ with `coupling_index`, `coupling_id` (or `null`), `missing_field`, and FAIL. Do not raise.\n \
      \  1b. If two couplings share the same `id`, emit `A6.duplicate_coupling_id` with both `coupling_index`\
      \ values and FAIL — otherwise the reported `coupling_id` is ambiguous.\n2. Clash detection, ordered:\
      \ iterate `independent_dofs` in declaration order, dedup by first occurrence. For each id present\
      \ in `dep_map`, emit exactly one `A6.dependent_driven_independently` carrying `joint_id`, `coupling_ids`\
      \ (the full list from `dep_map[joint_id]`, in coupling declaration order — replace the singular\
      \ `coupling_id` in the evidence schema with this list), and `independent_dofs_index` (index of first\
      \ occurrence). Messages are emitted in `independent_dofs` declaration order, which fixes the report\
      \ byte-for-byte.\n3. Serialize `evidence.independent_dofs` and `evidence.dependent_set` as ordered\
      \ lists — `independent_dofs` in declaration order, and rename `dependent_set` to `dependent_joints`,\
      \ emitted as `list(dep_map.keys())` (coupling declaration order). No bare sets anywhere in the evidence\
      \ payload.\n4. Replace step 4's self-coupling special case with a full acyclicity check, which subsumes\
      \ it. Build directed edges `relation.independent -> relation.dependent` over all couplings. Run\
      \ Kahn's algorithm with the ready-queue ordered by first-declaration index (deterministic tie-break,\
      \ must be stated). Any vertices remaining when the queue empties lie on a cycle: emit `A6.coupling_cycle`\
      \ with the residual vertex list in first-declaration order and the participating `coupling_ids`.\
      \ A self-loop `dependent == independent` is the 1-cycle case and falls out of the same code — keep\
      \ the distinct code `A6.self_coupling` for it (a one-vertex residual) so the evidence still names\
      \ the arity-1 case explicitly, and note in the rationale that it is a fixed-value assertion (`q\
      \ = k·q + b`: uniquely solvable for k≠1, vacuous for k=1,b=0, unsatisfiable for k=1,b≠0) rather\
      \ than a coupling. Record the topological order Kahn produces as `evidence.coupling_eval_order`;\
      \ KF3 needs it anyway to resolve cascades (c1: dep=B indep=A, then c2: dep=C indep=B) in the right\
      \ sequence, and emitting it here means it is computed once, deterministically.\n5. Define N/A explicitly:\
      \ `couplings == []` → `A6 = N/A`, and N/A at an admission gate means **admission proceeds** (vacuous\
      \ pass), never \"unknown\" and never a blocking result. State this in the item, since Example A\
      \ takes this path.\n\nOne gap to assign rather than fix here (out of A6's claim as written, but\
      \ currently owned by nobody in A1–A12): no check requires each coupling's `relation.independent`\
      \ to be reachable from `independent_dofs` — either a member of it, or the `dependent` of another\
      \ coupling. A contract with c1 {dep: B, indep: A} and `independent_dofs: [C]`, with A in no driving\
      \ set, passes A6, A5 and the acyclicity check above, yet KF3 has no value to write for A and therefore\
      \ none for B. Either extend A6's claim to include this reachability condition (it is the same graph,\
      \ one extra pass over the topological order from step 4, so nearly free) or name the sibling item\
      \ that owns it — but do not leave it unassigned."
- item: A7.contact_states_defined
  lens: p0check
  verdict:
    sound: false
    problem: 'WHAT SURVIVES: not a tautology (a typo token genuinely fails; the `home_position` example
      is real); no MuJoCo API is named, so no invented-API risk; no whole-asset bbox normalization. I
      also verified the step-3 extension is NOT a dead branch: `dynamics_claims.functional_scenarios[].initial_state`
      and `target: {state: open}` appear verbatim in v1 P0 §Minimal schema (revised P0 never re-specifies
      dynamics_claims but §03 still routes it), and dynamics_claims is correctly written top-level, not
      under kinematic_claims.


      SEVEN DEFECTS:


      1. LEGACY REJECTION MISSES HALF OF v1, AND MISSING-`state` IS UNDEFINED. v1 P0''s contact_policy
      uses BOTH forms: `{parts: [drawer, cabinet_body], states: [closed], relation: stop_contact}` (list)
      and `{parts: [drawer_side, cabinet_wall], states: all}` (bare SCALAR under the plural key). Step
      1 rejects only "`states:` with a list value", so the second survives step 1; step 2 then looks for
      key `state`, finds none, and the algorithm never says what happens. Three readings are equally consistent
      with the text — skip the entry (silently unscored), default to `all` (silently converts a one-state
      `stop_contact` obligation into a whole-sweep one), or error. Non-deterministic across implementers.


      2. THE REJECTION RULE COLLIDES WITH A STILL-VALID KEY OF THE SAME NAME. Revised P0 keeps plural
      `states:` on every joint as a name→value MAP (`states: {closed: 0.0, open: 0.40}`, `{home: 0.0}`).
      Step 3''s "extend the same check to every other state-consuming site so the rule is not contact-only"
      reads as extending step 1 too; an implementer who applies "reject `states:`" to `joints[].states`
      rejects both canonical examples in the authoritative document.


      3. THE CHECK DOES NOT DELIVER ITS OWN STATED PURPOSE — RECIPROCAL DIRECTION MISSING. Membership
      in asset_states.keys() is necessary, not sufficient. §10 defines classification as: sample q is
      in state s ⟺ for every joint j in scope, |q_j − states_j[s]| ≤ tol·span. A token can be a perfectly
      good asset_states key while ZERO in-scope joints declare it in `joints[].states` — e.g. `{parts:
      [door, cabinet_body], state: home, relation: stop_contact}` with `asset_states: {home: {...}}` but
      door_hinge declaring only closed/open, or `home: {scope: all_declaring}` when no joint declares
      `home`. Then the ∀-over-empty-set is vacuously TRUE, every sweep sample is classified into the state,
      and stop_contact''s "min sd over in-state samples ≤ required_contact_m" is evaluated over the entire
      sweep — strictly easier, a vacuous pass for a broken asset. The opposite implementation (a non-declaring
      joint means "never in state") classifies zero samples and makes the same entry always FAIL. Same
      contract, opposite score, and nothing in the spec picks. This is exactly the empty-set-scores-vacuously
      hole that §09''s bound(g) factor and §11''s "分母为 0 报 N/A，不是 1.0" exist to close, and A7 is the only
      place it is catchable before generation. Note the item''s own rationale has the mechanism backwards:
      an empty sample set makes `required` FAIL; it is `forbidden` (max penetration over ∅) that passes
      vacuously.


      4. `all` IS TREATED AS RESERVED BUT NOTHING FORBIDS IT AS AN asset_states KEY. With `asset_states:
      {all: {...}}`, step 2''s ordering silently resolves `state: all` to literal-all and discards the
      author''s declared scope/tolerance. Silent ambiguity.


      5. YAML COERCION UNPINNED WHILE STEP 1 DEMANDS "A SCALAR STRING". Under PyYAML / YAML 1.1, unquoted
      `state: on` / `off` / `yes` / `no` parses to a bool, not a str — plausible state names for a switch,
      valve, or lamp asset. `True == ''all''` is False and `True ∈ keys()` is False unless the asset_states
      key is also unquoted, so a legitimate contract dies with a misleading `A7.undefined_state`, and
      quoting one side but not the other flips the verdict. Loader version and non-str handling are unspecified.


      6. EVIDENCE SCHEMA DOESN''T COVER THE EXTENSION THE ITEM ITSELF ADDS; ORDERING UNSPECIFIED. `class`/`entry_index`/`parts`
      are contact_policy-shaped — a violation at `functional_scenarios[2].target.state` has no `parts`
      and no class in {required, permitted, forbidden}. `declared_asset_states` is a dict-key collection
      with no stated ordering (dict/set iteration → not byte-identical). Nothing says whether to report
      the first violation or all of them, in what class order, or whether a scenario''s `entry_index`
      is pre- or post-`foreach_part` expansion (v1 scenarios carry `foreach_part: [drawer_1, drawer_2,
      drawer_3]`).


      7. na_condition ASSUMES THE BLOCKS EXIST. contact_policy is not mandatory in P0 §15 (only "复杂机构必须声明"),
      and asset_states may be absent. "all three classes empty" is undefined when the block is absent,
      and "require value ∈ asset_states.keys()" is undefined when asset_states is absent.'
    fix: "Replace the algorithm with Steps 0–7. Steps 0–4 leave both canonical contracts passing unchanged\
      \ (A: closed/open declared by drawer_1_slide, drawer_2_slide, door_hinge; B: home declared by both\
      \ gear joints) — verified.\n\nSTEP 0 — PARSE, FROZEN. Pin the loader (PyYAML `yaml.safe_load`, YAML\
      \ 1.1) and record it in the tolerances hash line. Absent `kinematic_claims.contact_policy` ≡ `{required:\
      \ [], permitted: [], forbidden: []}`; an absent class ≡ `[]`; absent `kinematic_claims.asset_states`\
      \ ≡ `{}`. Any state value or asset_states key that is not `str` after loading → `A7.state_not_string`,\
      \ evidence carrying the repr and the Python type name, remediation \"quote the token\". This is\
      \ what catches unquoted on/off/yes/no instead of letting them surface as undefined_state.\n\nSTEP\
      \ 1 — LEGACY. Reject any entry carrying the key `states` at a state-consuming site (contact_policy.{required,permitted,forbidden}[]\
      \ and functional_scenarios[]), regardless of value type — v1 wrote both `states: [closed]` and `states:\
      \ all` → `A7.legacy_states_key`, message naming the migration `states`→`state` and list→scalar.\
      \ EXPLICITLY EXEMPT `joints[].states`: it is a different, still-valid field (name→value map) and\
      \ A7 never inspects it for legacy syntax.\n\nSTEP 2 — PRESENCE. Every contact_policy entry MUST\
      \ carry `state`; absent → `A7.missing_state`. Never default to `all` — defaulting silently widens\
      \ a one-state stop_contact obligation to the whole sweep.\n\nSTEP 3 — RESOLUTION. `all` is reserved:\
      \ if `all` appears among asset_states keys → `A7.reserved_state_name`. Otherwise value == \"all\"\
      \ → accept; else require value ∈ asset_states keys, else `A7.undefined_state`.\n\nSTEP 4 — REALIZABILITY\
      \ (new; this is what makes A7 deliver its stated purpose). For every non-`all` token, resolve the\
      \ scope set exactly as §10 does and require it NON-EMPTY:\n  • scope `all_declaring`: J(s) = {joint\
      \ j : s ∈ j.states}; empty → `A7.unrealizable_state`.\n  • scope `named_parts`: J(s, entry) = {joint\
      \ j : j.part ∈ entry.parts AND s ∈ j.states}; empty → `A7.unrealizable_state`, evidence listing\
      \ per named part whether it owns a joint and whether that joint declares s.\nRow rationale to record:\
      \ with J empty the §10 ∀ is vacuously true, every sweep sample lands in the state, and stop_contact\
      \ is evaluated over the whole sweep instead of the closed subset — a strictly easier test; the opposite\
      \ reading classifies zero samples and always fails. A7 must forbid the situation rather than let\
      \ KF3 pick a reading.\nDo NOT add the converse rule (\"every `joints[].states` key must be an asset_states\
      \ key\") — a joint may carry labels nothing consumes; requiring it would over-reject valid contracts.\n\
      \nSTEP 5 — DYNAMICS EXTENSION (intent unchanged). Apply Steps 0–4 to `dynamics_claims.functional_scenarios[].initial_state`\
      \ and `[].target.state` (only when `target` carries a `state` key), with scope `all_declaring` per\
      \ §10. Evaluate PRE-`foreach_part` expansion; `entry_index` = the declared scenario index.\n\nSTEP\
      \ 6 — DETERMINISM AND EVIDENCE. Report ALL violations, never only the first. Frozen iteration order:\
      \ contact_policy classes in the literal order [required, permitted, forbidden], entries in declaration\
      \ order; then functional_scenarios in declaration order, emitting `initial_state` before `target.state`.\
      \ Widen the evidence record to {predicate_id, site, class, entry_index, field, parts, state_token,\
      \ declared_asset_states, declaring_joints}, where site ∈ {contact_policy, functional_scenarios},\
      \ class is null for the dynamics site, field ∈ {state, initial_state, target.state}, parts is null\
      \ for the dynamics site, and declared_asset_states / declaring_joints are emitted as lists sorted\
      \ by UTF-8 byte order.\n\nSTEP 7 — na_condition RESTATED. N/A iff the token set collected across\
      \ all sites in Step 6's order is empty. This subsumes absent contact_policy, absent dynamics_claims,\
      \ and a dynamics_claims with no state-carrying scenario, with no special cases."
- item: A8.axis_form_present
  lens: p0check
  verdict:
    sound: false
    problem: "Three defects, any one of which lets a joint through unchecked or forces the coder to make\
      \ decisions the spec does not make.\n\n(1) BRANCH COVERAGE IS NOT EXHAUSTIVE — `na_condition: \"\
      never N/A — every joint hits one branch\"` is false. Steps 3 and 4 test `j.type in {slide,hinge}`\
      \ and `j.type in {ball,free}`. Any other value matches neither branch, so the joint falls off the\
      \ end of the algorithm and passes A8 with NO axis requirement at all. This is not hypothetical:\
      \ the established facts note the source assets are URDF, whose joint vocabulary is `revolute` /\
      \ `continuous` / `prismatic` / `fixed`, and an LLM authoring a contract will write `type: revolute`\
      \ for a door hinge with high probability. Nothing else catches it either — P0 §15 lists no admission\
      \ check on the `type` vocabulary (A11 only checks `range.unit`-vs-`type` compatibility, and is itself\
      \ undefined for an unknown type; A10 only constrains `anchor` for the three known unaxed types).\
      \ So `{id: door_hinge, part: door, parent: box, type: revolute, axis: {}, ...}` passes A8 silently\
      \ — the exact contract A8's own `can_it_fail` says must be rejected.\n\n(2) MISSING `axis` KEY HAS\
      \ NO ASSIGNED (or a wrong) ERROR ID. Step 1 says \"require the `axis` key to be present\" but names\
      \ no failure code and no evidence shape; steps 3–5 all dereference `j.axis`, which raises KeyError.\
      \ The engineer must decide whether absent-key folds into `A8.no_axis_form` or gets its own id, and\
      \ what `axis_block` (a listed evidence field) contains when there is no block. Worse, for ball/free\
      \ the spec routes absent-key to `A8.axis_on_unaxed_joint` (\"step 4: require axis to be present\
      \ with value null, else A8.axis_on_unaxed_joint\") — a message that says the opposite of the actual\
      \ fault, since the fault is an absent axis, not a stray one.\n\n(3) `is not None` IS TOO WEAK TO\
      \ DELIVER THE STATED GUARANTEE. A8's purpose per P0 §15 is \"否则 KF1 的轴向 claim 没有参照\", and this item's\
      \ rationale is that an axis-free joint \"contributes nothing but still consumes a denominator slot\"\
      . But step 2 counts a form as present on mere non-nullness, validating no content, so contracts\
      \ that are structurally unusable by KF1 pass:\n  • `semantic: \"diagonal\"` or `semantic: \"\"`\
      \ — the semantic vocabulary is frozen to vertical|horizontal (§07); anything else is uninterpretable.\n\
      \  • `relational: {}`, or `relational: {type: toward, from: handle_1}` with no `to`, or `relational:\
      \ {type: interface_line, from: a, to: b}` (wrong subkeys for that type) — §07 defines four types\
      \ with different required subfields (interface_normal/toward → from+to; interface_line → between:[a,b];\
      \ symmetry_axis_of → part). Nothing before generation checks them, and A1 reference-integrity only\
      \ helps if it is specified to recurse into `axis.relational` and the field exists at all.\n  • `numeric:\
      \ [0, 0, 0]` — non-null, passes A8, and KF1's specified comparison (|cos θ| against `mjData.xaxis`)\
      \ then divides by ‖v‖ = 0 and yields NaN. `numeric: [1, 2, 3]` also passes despite §07 requiring\
      \ a unit vector.\nIn every one of these the joint keeps its KF1 denominator slot and yields N/A\
      \ or NaN — the failure mode A8 exists to prevent.\n\nSecondary: step 5 says \"Reject any key inside\
      \ axis outside the three (A30 does this generically; A8 reports it with the joint-specific message)\"\
      \ — it is unspecified whether both A8 and A30 emit a row, and which id an implementation reports;\
      \ and unspecified whether an extra key changes A8's own verdict."
    fix: "Rewrite the algorithm as follows (all comparisons case-sensitive on exact strings; all part\
      \ IDs resolved against `required_parts` per R1/A1).\n\nStep 0 (new, short-circuits the rest for\
      \ that joint): require `j.type ∈ {\"slide\",\"hinge\",\"ball\",\"free\"}` exactly. Otherwise emit\
      \ `A8.unknown_joint_type` with evidence `{predicate_id, joint_id, joint_type}` and do not evaluate\
      \ steps 1–5 for this joint. Change `na_condition` to: \"never N/A — every joint hits exactly one\
      \ of the four branches (unknown_type / axed / unaxed / malformed).\"\n\nStep 1: if the `axis` key\
      \ is absent, emit `A8.axis_key_absent` (for every type, both branches) with `axis_key_present: false`\
      \ and `axis_block: null`. Reserve `A8.axis_on_unaxed_joint` strictly for ball/free where `axis`\
      \ IS present and is not `null`.\n\nStep 2 (replace the non-null test with per-form well-formedness;\
      \ malformed counts as ABSENT for the ≥1 test, and is additionally reported so \"declared but unusable\"\
      \ is never silently identical to \"not declared\"):\n  • semantic well-formed ⟺ value ∈ {\"vertical\"\
      ,\"horizontal\"}.\n  • relational well-formed ⟺ a mapping whose `type` ∈ {\"interface_normal\",\"\
      interface_line\",\"toward\",\"symmetry_axis_of\"} AND whose key set is exactly {type}∪R(type), where\
      \ R(interface_normal)=R(toward)={from,to}, R(interface_line)={between}, R(symmetry_axis_of)={part};\
      \ for interface_line, `between` is a list of exactly 2 distinct declared part IDs; for the others\
      \ every named part ID is declared; `from ≠ to`.\n  • numeric well-formed ⟺ a list of exactly 3 finite\
      \ floats with ‖v‖₂ ≥ 1e-6. If 1e-6 ≤ ‖v‖₂ and |‖v‖₂ − 1| > 1e-3, accept but normalize v ← v/‖v‖₂\
      \ and record the pre-normalized value in evidence (do not bounce a contract over a rounding error);\
      \ if ‖v‖₂ < 1e-6 it is malformed. This is what stops KF1's |cos θ| from producing NaN.\n  Emit `A8.malformed_axis_form`\
      \ (evidence: the offending form name and its raw value) for each malformed form, regardless of whether\
      \ some other form is well-formed.\n  `forms = [k for k in (\"semantic\",\"relational\",\"numeric\"\
      ) if k in j.axis and j.axis[k] is not None and well_formed(k, j.axis[k])]` — literal-tuple iteration\
      \ order preserved, so `declared_axis_forms` stays byte-identical.\n\nStep 3 unchanged (slide/hinge:\
      \ len(forms) ≥ 1 else `A8.no_axis_form`). Step 4 unchanged in intent — the ball/free deviation is\
      \ correct and is stylistically consistent with P0's A10, which already spells `anchor` as \"恒为 null\"\
      \ for exactly slide/ball/free — but must now read: axis present AND `axis is null` (JSON/YAML null,\
      \ not `{}`, not `[]`); `axis: {}` on ball/free emits `A8.axis_on_unaxed_joint`, absent key emits\
      \ `A8.axis_key_absent`.\n\nStep 5: A8 does NOT emit extra-key violations — that is A30's alone,\
      \ and an extra key never changes A8's verdict (A8 evaluates only the three known names). Delete\
      \ \"A8 reports it with the joint-specific message\" from step 5.\n\nEvidence fields become: `predicate_id,\
      \ joint_id, joint_type, axis_key_present, declared_axis_forms, malformed_axis_forms, axis_block`\
      \ (with `axis_block: null` when the key is absent)."
- item: A9.numeric_requires_anchored_front
  lens: p0check
  verdict:
    sound: false
    problem: 'A9 is not a tautology (a contract really can declare `numeric` with `front: null`), does
      no MuJoCo work, and normalizes by nothing — those three checks pass. It fails on DEGENERACY, on
      an unvalidated payload, on a self-contradictory clause, and on determinism.


      (1) DEGENERACY — the algorithm raises on inputs no other admission rule excludes. Nothing in A1–A12
      requires `canonical_frame` to exist (A12 covers only `tolerances`; §06 introduces the block as NEW
      and merely happens to appear in both worked examples). A contract that omits the block, or omits
      `front` inside it, makes step 2''s `canonical_frame.front` a KeyError rather than "not anchored".
      Step 1 has the same hole: a joint with no `axis` key, or `axis` written as a string/list, is exactly
      the contract A8 exists to reject — but §15 evaluates all twelve rules and rejects on any failure,
      so A9 is still evaluated on it and must not crash. Likewise `kinematic_claims` or `joints` absent
      (a static, non-articulated task) must resolve to any_numeric=False, not a KeyError. "Never N/A —
      evaluated for every contract" is only true if every lookup is total.


      (2) The `axis.numeric` payload is validated by NO admission rule, and A9 is the only rule that ever
      looks at it. A8 is satisfied by mere key presence; A9 gates on `not None`. So `numeric: [0,0,0]`,
      `numeric: [0,-2,0]`, `numeric: [1,2]`, `numeric: "forward"` all clear admission whenever `front`
      is anchored. §07 scores numeric by |cos θ| against the joint''s world axis: zero-norm gives 0/0
      → NaN, non-unit gives |cos| > 1 → arccos NaN, a 2-list raises. The blow-up then lands in KF1 *after*
      an asset has been generated — precisely the class of failure the pre-generation gate exists to prevent.
      This is the same asymmetry the item already conceded on the other side of the implication ("A1 checks
      the id; A9 checks the shape"): it shape-checks `front` and not `numeric`.


      (3) Step 2 contradicts itself: "whose value is a declared part id (A1 checks the id; A9 checks the
      shape)". Either A9 validates membership in `required_parts` — duplicating A1, and reporting one
      contract error as two rejections, against the "one claim serves one check" rule — or it does not,
      in which case "is a declared part id" must be struck. An engineer cannot write this without deciding.
      Worse, A9''s assumption that "A1 checks the id" holds only if A1''s reference-extraction enumerates
      the path `kinematic_claims.canonical_frame.front.outward_normal_of`; A1''s text is generic ("any
      part ID referenced in any field"), so if that path is not named, an unanchorable front passes A1
      and A9 both.


      (4) DETERMINISM — `joints_with_numeric_axis` has no stated order, and no rule for a joint missing
      an `id`.


      (5) The remedy is unspecified, and one of the two available remedies is documented in the same P0
      as harmful. A9 rejects; the author may repair by deleting `numeric` OR by anchoring `front`. §06''s
      own worked anchor, `cabinet_front_panel`, is not in Example A''s `required_parts` and cannot be
      added without paying §05''s stated costs: A2 then forces a `part_geometry` line for it, sending
      a thin flat panel into GF2''s per-part CLIP scoring ("基本是噪声"), and G1 requires it to bind to a non-empty
      geom set — so a cabinet legitimately modeled as one box mesh now FAILS the Gate and drops out of
      every metric. A9 as written invites the repair that silently converts good assets into Gate failures.


      (6) A9''s pass condition is a shape test, but its justification is "anchored ⇒ scorable", and that
      implication is not yet true anywhere. §06 gives no algorithm for `outward_normal_of`: no definition
      of which of a panel''s two antiparallel face normals is "outward" (a sign flip inverts every numeric
      verdict), no behavior for a near-isotropic anchor part, no degenerate case when the resolved front
      is parallel to `up: gravity` (front × up = 0, no frame). And §07''s numeric row ("直接比 … 扛不住整机旋转")
      contradicts §06 ("据此建立物体坐标系"): a numeric vector expressed in an asset-derived canonical frame DOES
      survive a whole-asset yaw, so §07''s "扛不住" column is false under anchoring — and since A9 forces
      every scored numeric into the anchored reading, the §16① rotate-90° experiment would certify numeric
      as rotation-robust and push the team to "converge to numeric, simplest" on an artifact of this rule.'
    fix: 'Rewrite the algorithm with total lookups, add the missing payload check, and drop the duplicated
      id check.


      Step 1 (total): `kc = contract.get("kinematic_claims") or {}`; `joints = kc.get("joints") or []`.
      For each joint j (skip non-mapping entries): `ax = j.get("axis"); num = ax.get("numeric") if isinstance(ax,
      dict) else None`. A joint declares numeric iff `num is not None`. `any_numeric = any(...)`. Missing
      `kinematic_claims`/`joints`/`axis`, or a non-mapping `axis`, contributes nothing and never raises.


      Step 1b (NEW — payload shape): a declaration counts as well-formed iff `num` is a list/tuple of
      exactly 3 finite floats (no NaN/inf, bools rejected) with L2 norm ≥ 1e-6. If `num is not None` and
      it fails that test → reject with `A9.numeric_axis_malformed`, listing `[{joint_id, numeric}]`. Malformed
      entries still set `any_numeric = True` (so a contract cannot dodge the front requirement by writing
      garbage). Freeze the downstream convention in the same line: KF1 normalizes to `v/‖v‖` at read time,
      so `[0,-2,0]` is legal and `[0,0,0]` is the only zero case, already excluded here.


      Step 2 (total + shape only): `cf = kc.get("canonical_frame"); front = cf.get("front") if isinstance(cf,
      dict) else None`. `anchored` iff `isinstance(front, dict) and set(front.keys()) == {"outward_normal_of"}
      and isinstance(front["outward_normal_of"], str) and front["outward_normal_of"].strip() != ""`. Strike
      "is a declared part id" from A9 entirely — A1 owns membership. Split the failure codes so the author
      sees the right repair: `front is None` or `cf` missing → not anchored; `front` non-None but failing
      the shape test (`true`, `"front"`, `{}`, `{normal_of: x}`, `{outward_normal_of: x, up: y}`) → reject
      with `A9.front_anchor_malformed` regardless of `any_numeric`, since a malformed front is a contract
      error even when unused.


      Step 3: if `any_numeric and not anchored` → `A9.numeric_axis_without_front`. The rejection text
      must name the default remedy: "delete `axis.numeric` and keep `semantic`/`relational`". Add the
      standing rule: anchoring `front` is admissible only when the anchor part is already required by
      the task on its own merits — a part the generator must model regardless — and a part may never be
      added to `required_parts` solely to legalize a numeric axis, because A2 then forces a `part_geometry`
      entry into GF2''s CLIP scoring and G1 then forces the generator to emit a separate geom for it (§05).


      Step 4 (unchanged): `anchored and not any_numeric` → `A9.front_anchored_unused`, WARNING only.


      Determinism: `joints_with_numeric_axis` is emitted in `kinematic_claims.joints[]` declaration order,
      ids verbatim; a joint with no `id` key is rendered as `joints[i]` with its 0-based index. Evidence
      fields become `predicate_id, joints_with_numeric_axis, malformed_numeric_axes, canonical_frame_front,
      front_anchor_part, front_shape_ok`.


      Two cross-item prerequisites to record, not code inside A9: (a) A1''s reference-extraction list
      must explicitly include the path `kinematic_claims.canonical_frame.front.outward_normal_of`, or
      nobody checks that id; (b) before any numeric claim is scored, KF1 must freeze the `outward_normal_of`
      resolution algorithm — which face normal is "outward" and its sign convention, the N/A condition
      for a near-isotropic anchor part, and the N/A condition when the resolved front is within `axis_angle_deg`
      of `up` — and P0 must reconcile §07''s "扛不住整机旋转" with §06''s "建立物体坐标系", since under anchoring the
      numeric form is rotation-robust and §16①''s rotate-90° experiment would otherwise draw the opposite
      conclusion.'
- item: A10.anchor_null_for_translational
  lens: p0check
  verdict:
    sound: false
    problem: "PRIMARY: `ball` does not belong in the banned set, and the rationale the item explicitly\
      \ says it will emit into the failure message is a factually false statement about MuJoCo.\n\nThe\
      \ item's rationale reads: \"a ball/free joint's rotation centre is its own body frame origin, so\
      \ any anchor predicate over it is a tautology\". That is false for ball. In MuJoCo, mj_kinematics\
      \ applies the same \"correct for off-center rotation\" branch to BOTH hinge and ball: jnt_pos IS\
      \ the ball joint's rotation centre. Measured (mujoco 3.3.7 on this machine; note the env brief says\
      \ 3.11 — ball jnt_pos semantics are long-standing and unchanged, but I verified on 3.3.7):\n\n \
      \ type   jnt_pos honored?          child-pose delta from moving jnt_pos (0,0,0)->(0.3,0.4,0)\n \
      \ slide  stored, affects xanchor   0.0 — bit-for-bit identical geom_xpos+xquat over 101 qpos samples\n\
      \  free   ZEROED by the compiler    0.0 (m.jnt_pos reads back [0,0,0] even when written 0.3 0.4\
      \ 0)\n  ball   YES — it is the centre    0.479 m at a 57 deg rotation\n  hinge  YES            \
      \           0.479 m\n\nSo the ban is correct for slide and free, and wrong for ball.\n\nConsequences:\n\
      1. A10 rejects at admission a claim that is measurable, discriminative, and non-tautological: `type:\
      \ ball, anchor: {through_center_of: X}`. Measured on a disc with a ball joint, ||xanchor - centroid||\
      \ = 0.0000 centred vs 0.1900 mounted off-centre. Nothing here is derived from the field being checked\
      \ — at qpos=0 the off-centre rotation correction cancels, so geom_xpos is unaffected by jnt_pos\
      \ while xanchor moves. This is NOT the earlier fault-injection trap: that one displaced the URDF\
      \ joint <origin>, i.e. the child body frame pos, which does carry geometry with it; MJCF jnt_pos\
      \ is a different quantity and does not.\n2. The item says the rationale is \"carried into the message\"\
      , so every A10 failure on a ball joint would print a false MuJoCo fact as evidence — poison for\
      \ anyone calibrating or debugging.\n3. It removes exactly the wheel/knob/gear case that P0 §07 introduced\
      \ `through_center_of` for, shrinking KF1's numerator.\n\nNote the item is faithful to P0 (§07 anchor\
      \ table and §15 A10 both say slide/ball/free 恒为 null), so `deviates_from_spec: \"\"` is accurate\
      \ — but P0 is wrong on this line, and this item inherits the error rather than catching it.\n\n\
      SECONDARY (each would force the implementer to decide something the spec should have decided):\n\
      4. Key-presence ownership is ambiguous and cross-references an unverifiable A17 (P0's admission\
      \ list stops at A12). \"require j.anchor is None (the key must be PRESENT with the null value —\
      \ see A17)\" admits three incompatible implementations: `j[\"anchor\"]` raises KeyError on an absent\
      \ key (crash, not a finding); `j.get(\"anchor\")` silently passes an absent key; checking presence\
      \ here double-fires with A17 on one defect.\n5. Truthiness trap: `anchor: {}` and `anchor: false`\
      \ must FAIL, but `if not j.get(\"anchor\")` lets both pass. The item says \"is None\" but never\
      \ forbids the truthiness form, and the `anchor_block` evidence field invites it.\n6. Missing/unknown\
      \ `type` (e.g. a contract writing URDF's `prismatic` instead of `slide`) makes the membership test\
      \ False, so A10 passes vacuously with an anchor block attached and no stated owner.\n7. Determinism\
      \ is unstated: one finding per offending joint or one aggregate, emission order, and serialization\
      \ of `anchor_block` are all unspecified, so \"byte-identical outputs\" is not guaranteed.\n8. N/A\
      \ semantics unstated: A10 is a pass/fail admission gate, not a scored predicate, so its N/A must\
      \ not be fed into any KF1 applicability denominator.\n\nNon-issues, confirmed: no MuJoCo API is\
      \ invoked (pre-generation lint), no whole-asset bounding-box normalization, and the check is genuinely\
      \ non-tautological for slide/free since it lints human-authored YAML."
    fix: "1. Narrow A10 to {slide, free}. New id: A10.anchor_null_for_slide_free. Claim: \"Joints of type\
      \ slide or free declare anchor: null.\"\n\n2. Add sibling item A10b.anchor_form_for_ball:\n   -\
      \ For each joint j with j.type == \"ball\": anchor must be either None or a dict whose single key\
      \ is `through_center_of`.\n   - `{on_edge_of: X}` on a ball -> A10b.on_edge_of_on_ball_joint. Justification\
      \ (true, unlike the current one): on_edge_of needs a plane containing the joint AXIS LINE to split\
      \ the part's vertices; a ball joint has no axis, so the predicate has no definition. This is a definitional\
      \ gap, not a tautology.\n   - Any other key -> A10b.unknown_anchor_form.\n   - N/A when no joint\
      \ has type \"ball\".\n   - Evidence: predicate_id, joint_id, joint_type, anchor_block, anchor_key.\n\
      \n3. Rewrite the emitted rationale per type; delete the ball clause entirely:\n   - slide: \"MJCF\
      \ jnt_pos on a slide leaves the child body pose bit-for-bit identical at every qpos (verified over\
      \ 101 samples); it changes only the reported mjData.xanchor. An xanchor-based predicate would therefore\
      \ vary numerically while being physically vacuous — which is a stronger reason to ban it than 'translation\
      \ has no centre'.\"\n   - free: \"The MuJoCo compiler zeroes jnt_pos for free joints; m.jnt_pos\
      \ reads back [0,0,0] regardless of what was written.\"\n   Do not say anything about ball in an\
      \ A10 message.\n\n4. Downstream KF1 must be told the ball form is a DIFFERENT distance function\
      \ from the hinge form, or the implementer will reuse the line formula:\n   - hinge `through_center_of:\
      \ P` -> perpendicular distance from the axis LINE (point d.xanchor[j], direction d.xaxis[j]) to\
      \ P's centroid.\n   - ball  `through_center_of: P` -> point-to-point distance ||d.xanchor[j] - c_P||.\n\
      \   - Both: pass iff distance <= tolerances.anchor_center_offset_max * diag(AABB of P's OWN geoms,\
      \ via body_geomadr/body_geomnum on the Gate-bound body). Part-own AABB only — never a whole-asset\
      \ diagonal.\n   - c_P: centroid of P's own geom d.geom_xpos entries, computed at the same qpos the\
      \ anchor is read at (use qpos0 / the reference pose, stated once and frozen).\n   - N/A if P binds\
      \ to zero geoms (degenerate/empty geom set), or if diag(AABB) == 0 (single degenerate geom) — never\
      \ divide by zero.\n\n5. Pin down the secondary points, verbatim, in the algorithm text:\n   - `anchor\
      \ = j.get(\"anchor\", MISSING)` with a module-level sentinel. If `anchor is MISSING`, A10/A10b do\
      \ NOT fire — key presence is owned solely by A17, so one defect yields exactly one finding. If A17\
      \ does not exist in the final spec, move presence-checking here and say so explicitly; do not leave\
      \ it split.\n   - Fire only when `anchor is not None` (identity test). Explicitly forbid the truthiness\
      \ form `if not anchor` — `{}`, `false`, `\"\"`, and `0` must all FAIL.\n   - If `j.get(\"type\"\
      )` is absent or outside the frozen vocabulary {slide, hinge, ball, free}, A10/A10b do not fire;\
      \ the type-vocabulary admission check (add one if absent) owns that defect and must run before A10\
      \ so a `type: prismatic` joint with an anchor block cannot pass unowned.\n   - Emit one finding\
      \ per offending joint, iterating `kinematic_claims.joints` in list order. Serialize `anchor_block`\
      \ as `json.dumps(anchor, sort_keys=True, ensure_ascii=False, separators=(\",\",\":\"))`.\n   - State\
      \ that A10/A10b are admission gates: their pass/fail/N/A never enters a KF1 numerator or denominator.\n\
      \n6. Contract-level erratum: P0 §07's anchor table row \"slide / ball / free -> 恒为 null\" and §15\
      \ A10 both need the same one-line edit (move ball to its own row: \"ball -> null | {through_center_of:\
      \ <part>}\"). Flag this to whoever freezes the contract — the item is P0-conformant today, so fixing\
      \ the predicate without fixing P0 will make them disagree.\n   Fallback if P0 must stay frozen this\
      \ round: keep ball banned but record it as a deliberate scope decision (\"no ball-joint anchor predicate\
      \ is implemented in this round\"), and still delete the false MuJoCo clause from the emitted message.\
      \ Practical exposure today is low — URDF has no ball joint type, so the URDF-derived corpus cannot\
      \ produce one — but P0 §16 ④ leaves the MJCF-native path open and §07 keeps ball in the frozen type\
      \ vocabulary, so the spec must not encode a false fact about it."
- item: A11.range_unit_matches_type
  lens: p0check
  verdict:
    sound: false
    problem: "Not a tautology, no invented API, no whole-asset-diagonal normalization — but the `ball`\
      \ branch is wrong against MuJoCo and internally inconsistent with the item's own step-3 reasoning,\
      \ and there are three smaller holes.\n\n(1) BALL BRANCH IS UNIMPLEMENTABLE (decisive). Verified\
      \ in MuJoCo (`MjModel.from_xml_string`):\n  - `<joint type=\"ball\" limited=\"true\" range=\"-1.0\
      \ 1.0\"/>` → hard compile error: `Error: range[0] should be 0 in ball joint`.\n  - `range=\"0 1.0\"\
      ` → OK, jnt_type=1, nq=4, nv=3, jnt_range=[[0.0, 1.0]].\n  So for mjJNT_BALL, jnt_range is NOT an\
      \ interval on a scalar coordinate: range[0] must be exactly 0 and range[1] is the maximum rotation\
      \ magnitude (a cone half-angle).\n  A11 as written puts ball in the same shape branch as hinge and\
      \ only requires `max > min + 1e-12`, so it ADMITS `ball: {unit: rad, min: -1.0, max: 1.0}`. No compliant\
      \ model can implement that contract — the MuJoCo compiler refuses it — and KF1's stated value-by-value\
      \ comparison against jnt_range would compare -1.0 to 0.0 and fail every asset. That is exactly the\
      \ failure class the admission gate exists to prevent (\"否则数值无法比对\").\n  It also contradicts step\
      \ 3: the argument used to ban `range` on `free` (\"7 qpos and 6 DOF; a scalar [min,max] cannot be\
      \ compared to jnt_range\") applies to ball with 4 qpos / 3 DOF. Every downstream consumer A11 feeds\
      \ assumes a scalar q_j: asset_states classification `|q_j − states_j[s]| ≤ relative × (max − min)`\
      \ (P0 §10), A12's `travel_scale_min` = child AABB diagonal / declared travel span, and KF3's 1-D\
      \ sweep over [min,max]. None of the three is defined for a quaternion coordinate, and A11 is the\
      \ only gate that decides what shapes reach them.\n  Extra degeneracy: `ball {min: 0, max: 4.0}`\
      \ compiles fine (verified; MuJoCo applies no upper cap and even accepts `range=\"0 -1\"` for ball),\
      \ but the geodesic rotation angle never exceeds π, so the limit is unreachable — a silently unlimited\
      \ ball declared as limited, which A11 currently passes.\n\n(2) NO ELSE-BRANCH FOR AN UNKNOWN/MISSING\
      \ `type`. The algorithm indexes a frozen 4-key table and na_condition asserts \"never N/A — every\
      \ joint has a type and hits a branch\". The corpus is URDF, so `revolute`, `prismatic`, `continuous`,\
      \ `fixed` are precisely the tokens an author copies (the item's own can_it_fail scenario is an author\
      \ copying the wrong row). Those produce a KeyError, not a diagnostic. The item names its ordering\
      \ dependency on A18 explicitly but silently assumes an unstated type-vocabulary gate.\n\n(3) `limited:\
      \ false` / CONTINUOUS JOINTS UNRESOLVED. Step 2 admits the optional `limited` key from A18, but\
      \ step 5 unconditionally demands finite min/max with a positive span, so `min/max: null` or ±inf\
      \ is rejected under the misleading code `degenerate_range`. Established facts say URDF `continuous`\
      \ → hinge with jnt_limited=0, i.e. the common case. Verified: whenever jnt_limited==0 MuJoCo leaves\
      \ jnt_range=[0,0] (and for free joints it forces jnt_limited=0 even when `limited=\"true\"` is written,\
      \ so the item's free-branch rationale is correct). A11 is the only place that fixes what shape reaches\
      \ KF1, so it must say whether unlimited joints carry finite numbers and what those numbers mean.\n\
      \n(4) ERROR PRECEDENCE / DETERMINISM NOT STATED. A hinge with `unit: m` AND a zero span violates\
      \ step 2 and step 5 simultaneously; the item never says whether one code or all codes are emitted,\
      \ nor in what order, though `evidence` implies a single record.\n\n(5) THE can_it_fail JUSTIFICATION\
      \ IS FACTUALLY WRONG. After A18 canonicalization the unit token is fully determined by type for\
      \ slide/hinge, so it feeds no downstream arithmetic — KF1 compares 0.0/2.094 against jnt_range identically\
      \ whether the contract says m or rad. There is no \"pass by coincidence\" that step 2 prevents;\
      \ as justified, step 2 reads as decorative and a reviewer could delete it."
    fix: 'Split ball out of the hinge branch and close the four holes.


      Step 0 (new, before everything): `type` must be present and ∈ {slide, hinge, ball, free}; else emit
      A11.unknown_joint_type with evidence {joint_id, type_token, allowed_types} and stop processing that
      joint. Alternatively, if another admission item freezes the type enum, name it and state that it
      must run before A11, the same way A18 is named.


      Step 2 (slide, hinge only): unchanged — range is a mapping with exactly {unit, min, max} plus optional
      {limited}; unit ∈ {m} for slide, {rad} for hinge; else A11.unit_type_mismatch.


      Step 2b (ball, new branch): require exactly {unit, min, max} plus optional {limited}; require unit
      == ''rad''; require `abs(min) <= 1e-12` else A11.ball_range_min_nonzero, evidence {joint_id, min,
      note: "MuJoCo requires jnt_range[0]==0 for mjJNT_BALL; a ball range is a cone half-angle, not an
      interval"}; require `1e-12 < max <= pi + 1e-12` else A11.ball_range_max_out_of_bounds, evidence
      {joint_id, max, allowed_interval: "(0, pi]"} (a max above pi is unreachable and therefore silently
      unlimited). Declare in this item that the ball''s normalization span is `max`, NOT `max - min`,
      and that A12''s travel_scale_min and asset_states'' relative tolerance both read that value — A12
      says "declared travel span" and would otherwise read the wrong quantity.


      Step 2c (ball states / sweep, new): a ball joint has no scalar coordinate, so either (a) require
      `states` values on a ball joint to be a 4-float unit quaternion, and freeze the comparison as geodesic
      angle `2*acos(min(1, abs(dot(q, q_s))))  <=  state_match_relative * max`; or (b) if that rule is
      not frozen elsewhere, forbid `states` on ball joints, forbid ball ids in `independent_dofs`, and
      emit A11.ball_states_unsupported — marking ball joints N/A for asset_states and for the KF3 sweep.
      Pick one and write it here; without it KF3 cannot sample or classify a ball joint at all.


      Step 5 (revised): min and max must be finite floats in every branch, with `max > min + 1e-12` for
      slide/hinge and `max > 1e-12` for ball; ±inf and null are rejected with a dedicated code A11.non_finite_range
      (not degenerate_range). State explicitly that when `limited` is false these finite numbers are the
      SWEEP WINDOW, not an enforced limit, and that KF1 compares them value-by-value against jnt_range
      only when limited is true — when limited is false KF1 must instead assert `jnt_limited == 0` and
      skip the numeric comparison, since MuJoCo leaves jnt_range = [0,0] for every unlimited joint (verified)
      and a literal comparison would fail every URDF `continuous` joint.


      Determinism clause (new): iterate `joints` in contract list order; within a joint evaluate steps
      0, 2/2b/2c, 3, 5 in that order and emit only the first failing code; one evidence record per failing
      joint.


      Rewrite can_it_fail to the real mechanism: A18 can convert deg→rad but cannot convert a length token
      to an angle, so a hinge whose surviving unit is `m` is a number A18 passed through unconverted,
      and the contract''s numbers were presumptively copied from the slide row (Example A''s `door_hinge`
      written as `{unit: m, min: 0.0, max: 2.094}`). The value of the check is rejecting a contract whose
      numbers have no defined meaning, not preventing a coincidental KF1 pass. Also add a second failing
      example that the current text cannot catch: `ball_socket` written as `{unit: rad, min: -0.5, max:
      0.5}` → A11.ball_range_min_nonzero, since no MuJoCo model can compile that range.'
- item: A12.tolerances_complete
  lens: p0check
  verdict:
    sound: false
    problem: "A12's own invocation table rejects BOTH authoritative worked examples in the revised P0\
      \ — the exact failure mode the item's `deviates_from_spec` claims it exists to prevent.\n\n**1.\
      \ (Decisive) `distance_query_distmax_m` makes examples A and B hard-fail.**\nStep 2's last row:\
      \ `distance_query_distmax_m ⟸ contact_policy has any non-empty class`. Example A (P0 rev §13, lines\
      \ 859-882) has all three contact classes non-empty and declares nine tolerance keys — none of them\
      \ `distance_query_distmax_m`. Example B (§14, lines 960-976) likewise. So for both, `missing = {distance_query_distmax_m}`\
      \ → `A12.tolerance_missing` → hard reject. I evaluated the full table against both contracts:\n\
      \  - A: declared 9, REQUIRED 8, missing `['distance_query_distmax_m']`, superfluous `['anchor_center_offset_max','coupling_residual']`\
      \ → FAIL\n  - B: declared 7, REQUIRED 7, missing `['distance_query_distmax_m']`, superfluous `['coupling_residual']`\
      \ → FAIL\nThis also falsifies the item's own arithmetic. It says \"example A declares nine keys\
      \ but invokes eight\", which reads as eight-of-the-nine. In fact A invokes only **seven** of its\
      \ nine (it has no `through_center_of` anchor and `couplings: []`), and the eighth required key is\
      \ one it never declares. The sentence \"the invocation table is the only reading under which both\
      \ worked examples are admissible\" is false as written — under this table neither is admissible.\n\
      \n**2. Per-item tolerances that the contract genuinely invokes are neither required nor domain-checked,\
      \ and one of them collides with a block key.**\n`p0_inputs` lists `couplings[].epsilon` but step\
      \ 6 domain-checks only keys inside the `tolerances` block. A coupling with `epsilon: 0`, `-1`, `true`,\
      \ or `NaN` passes A12 untouched, while the same value inside the block would be a hard reject. Worse,\
      \ `asset_states[s].tolerance.relative` (P0 rev §10, lines 620-621, 648) is the number that **actually**\
      \ performs state classification per §10's 解法 — `|q_j − states_j[s]| ≤ tolerance.relative × span`.\
      \ `tolerances.state_match_relative` is therefore a second declaration of the same threshold with\
      \ no stated precedence, and A12 hard-requires the block key while leaving the per-state key unvalidated\
      \ and unbounded. A contract that correctly puts the tolerance inline and omits the block key is\
      \ falsely rejected; a contract with `asset_states.closed.tolerance.relative: 0.9` (every sample\
      \ classifies into every state) passes. This directly contradicts the claim \"declares every tolerance\
      \ key that this contract can actually invoke\".\n\n**3. Non-determinism in the emitted evidence.**\
      \ `missing`, `unknown`, and `superfluous` are set differences (steps 3-5) and `out_of_domain` is\
      \ a per-key scan, but no ordering is specified anywhere. Python `set` iteration over strings varies\
      \ with `PYTHONHASHSEED` between processes, so `missing_keys` / `unknown_keys` / `out_of_domain`\
      \ are not byte-identical run to run. The `missing_key_reasons` mapping has the same problem if a\
      \ key is invoked by more than one claim (e.g. `axis_angle_deg` invoked by three separate joints,\
      \ `travel_scale_min` by four) — no rule says which claim gets named or that all are listed.\n\n\
      **4. `na_condition` and step 1 disagree about an absent block.** The N/A clause demands \"tolerances\
      \ must still be present as an explicit empty mapping {}\" for a fully static contract, but step\
      \ 1 only defines error ids for *misplaced* (top-level) and *duplicated* blocks. If `kinematic_claims.tolerances`\
      \ is simply absent and REQUIRED_KEYS is empty, then `missing == ∅` and `unknown == ∅` and the pass_condition\
      \ is satisfied — the explicit-`{}` requirement is unenforceable as specified. Nothing is said about\
      \ `tolerances` present as a non-mapping (list, string, null) either.\n\n**5. Two triggers fire on\
      \ cases where the predicate is N/A, producing false rejects.**\n  - `axis_angle_deg ⟸ any joint\
      \ has any axis form`. A8 requires an axis form on *every* joint with no ball/free exemption, so\
      \ a free-joint-only contract must declare an axis, the trigger fires, and the key is hard-required\
      \ for a KF1 predicate that is N/A (a free/ball joint has no meaningful `jnt_axis`). The parenthetical\
      \ \"(given A8, always, unless all joints are ball/free)\" describes the correct rule but the trigger\
      \ does not implement it.\n  - `distance_query_distmax_m ⟸ contact_policy has any non-empty class`\
      \ fires on a `permitted`-only policy, where per §11's frozen relation table `rest_contact` has \"\
      无谓词，仅豁免 forbidden\" — no distance query is ever issued.\n\n**6. Claim overreach on the domains (secondary).**\
      \ \"every value lies in a domain that keeps its own predicate non-trivial\" does not hold for the\
      \ absolute-length keys: `required_contact_m ∈ (0,1]` admits 1.0 (every pair on a sub-metre cabinet\
      \ reads as touching → `stop_contact`/`mesh_contact` can never fail), `forbidden_penetration_m ∈\
      \ (0,1]` admits 1.0 (no penetration can ever exceed it), `follower_drift_m ∈ (0,1]` admits 1.0 (a\
      \ handle left behind on the carcass passes). Symmetrically `travel_scale_min ∈ (0,10]` admits values\
      \ at which the predicate trivially *fails* for every asset. The two ratio bounds anchored at 0.5\
      \ are correctly reasoned; the metre-valued ones are sanity bounds only, and the claim should say\
      \ so rather than assert non-triviality.\n\nNo tautology at the item level (a contract can plainly\
      \ fail it), no whole-asset-diagonal normalization, and no MuJoCo API is touched — this is a pre-generation\
      \ check, so COMPUTABILITY is vacuous. The failures are 1-5."
    fix: "**Fix 1 (required, unblocks everything else): reconcile the vocabulary with the published examples.**\
      \ Choose one and state it in A12:\n  (a) Amend P0 rev §12 to publish **ten** keys, adding `distance_query_distmax_m:\
      \ 0.05  # mj_geomDistance distmax, frozen`, and amend both worked examples (§13 lines 873-882 and\
      \ §14 lines 969-976) to declare it. A12 then reads: \"FROZEN_VOCAB = the ten keys published in §12\
      \ as amended 2026-08-19; examples A and B are amended to declare `distance_query_distmax_m`.\" —\
      \ preferred, because R3 forbids code-side defaults and `distmax` is a real frozen sampling parameter\
      \ per §11's 实现口径 (\"并冻结 distmax\").\n  (b) If the examples must stand verbatim, move `distance_query_distmax_m`\
      \ out of REQUIRED_KEYS into an `OPTIONAL_VOCAB` whose omission is a warning and whose value, when\
      \ omitted, is supplied by A28's frozen constant — and say explicitly that this is a scoped carve-out\
      \ from R3.\nAlso correct the prose: \"example A declares nine keys, invokes seven of them, and (under\
      \ amendment (a)) requires an eighth it must now add.\" Add a regression assertion to the implementation:\
      \ A12 must PASS on the amended examples A and B — run it as a fixture, since this defect is exactly\
      \ what an unrun table produces.\n\n**Fix 2: extend the check to per-item tolerances and resolve\
      \ the state-tolerance collision.**\n  - Add step 6b: for each `couplings[i]`, if `epsilon` is present\
      \ it must be a finite non-bool number in `(0, inf)`; emit `A12.out_of_domain` with `path: couplings[i].epsilon`.\
      \ For each `asset_states[s]`, `tolerance.relative` must be present, finite, non-bool, in `(0, 0.5)`;\
      \ emit with `path: asset_states.<s>.tolerance.relative`.\n  - Declare precedence once, in P0 §10\
      \ and mirrored here: **`asset_states[s].tolerance.relative` is authoritative for state classification;\
      \ `tolerances.state_match_relative` is its default, used only when the per-state key is absent.**\
      \ Then change the trigger to `state_match_relative ⟸ asset_states != {} and at least one state omits\
      \ tolerance.relative` — the exact same shape as the `coupling_residual` trigger, which already handles\
      \ this pattern correctly. Under that rule both examples' `state_match_relative` becomes superfluous-warning,\
      \ which is consistent and harmless.\n\n**Fix 3: make the output byte-identical.** Emit `missing_keys`,\
      \ `unknown_keys`, and `superfluous_keys` sorted by their index in the ordered `FROZEN_VOCAB` tuple\
      \ (unknown keys, which have no index, sorted lexicographically by `str` and appended). Emit `out_of_domain`\
      \ as a list of `{key, value, domain}` in that same FROZEN_VOCAB order, per-item paths (`couplings[i].epsilon`,\
      \ `asset_states.<s>....`) appended afterwards in declaration order of the source document. For `missing_key_reasons`,\
      \ list **all** invoking claims, each as a stable path string, sorted by that path — e.g. `axis_angle_deg\
      \ -> [\"joints[0].axis.semantic\",\"joints[1].axis.semantic\",\"joints[2].axis.relational\"]`.\n\
      \n**Fix 4: define the absent and malformed cases.** Add to step 1: \"`kinematic_claims.tolerances`\
      \ absent → `A12.tolerances_absent` (hard reject) regardless of whether REQUIRED_KEYS is empty; present\
      \ but not a mapping → `A12.tolerances_malformed`; present as `{}` with REQUIRED_KEYS empty → PASS.\"\
      \ That is the only wording under which the na_condition's \"explicit empty mapping\" is actually\
      \ enforced.\n\n**Fix 5: narrow the two over-firing triggers.**\n  - `axis_angle_deg ⟸ any joint\
      \ with type ∈ {hinge, slide} has any axis form` (a ball/free joint's declared axis is N/A in KF1\
      \ and must not pull in the key).\n  - `distance_query_distmax_m ⟸ contact_policy.required != []\
      \ or contact_policy.forbidden != []` (a `permitted`-only policy issues no distance query).\n  While\
      \ there, pin down `travel_scale_min`'s trigger against its own definition: P0 §12 glosses it as\
      \ `子体 AABB 对角线 / 声明行程`, which is dimensionally undefined when `range.unit == rad` (metres over radians).\
      \ Either the sibling KF item must define the hinge case as arc length (`r_eff × Δθ`, with `r_eff`\
      \ stated) — in which case the current `type ∈ {slide,hinge}` trigger is right — or the key is slide-only\
      \ and the trigger must read `type == slide and finite range and max−min > 0`. A12 must cite whichever\
      \ the sibling item fixes; it cannot leave this open, because a hinge-only contract like example\
      \ B is hard-required to declare the key today.\n\n**Fix 6: weaken the claim to what the domains\
      \ actually guarantee.** Restate as: \"the two scale-free ratio bounds (`anchor_side_fraction_min\
      \ > 0.5`, `state_match_relative < 0.5`) are non-triviality bounds and are load-bearing; the metre-valued\
      \ bounds `(0,1]` are sanity bounds only — absolute lengths cannot be checked for non-triviality\
      \ before the asset exists, and their calibration is deferred to the fault-injection procedure in\
      \ §12.\" Optionally add a WARNING (not a reject) when `required_contact_m`, `forbidden_penetration_m`,\
      \ or `follower_drift_m` exceeds 0.05 m, since no plausible household asset needs a 5 cm contact\
      \ threshold."
- item: A13.group_namespace_and_expansion
  lens: p0check
  verdict:
    sound: false
    problem: 'The item survives the tautology / computability / normalization checks (pre-generation,
      no MuJoCo calls, no whole-asset diagonal; a contract genuinely can declare a group label equal to
      a part id, and revised-P0 §11 does score S_forbidden per-pair, so expansion really does move a denominator).
      It fails on six other points, in severity order.


      P1 — HARD CONFLICT WITH A1: EVERY GROUP-USING CONTRACT IS UNPASSABLE. Revised P0 §15 A1 reads "任何字段引用的
      part ID 必须在 required_parts 里". Under A13''s bare-token addressing, `contact_policy.forbidden[0].parts
      = [drawer, cabinet_body]` puts the token `drawer` in a parts[] field; an engineer implementing A1
      literally rejects it, because `drawer` is not in required_parts[].id. A13 never amends A1 and never
      states an evaluation order, so A1 and A13 together reject exactly the contracts A13 exists to enable.
      This is load-bearing, not cosmetic: A1 is the check the whole revision is built around.


      P2 — STEP 4''s `else [a]` SWALLOWS TYPOS, AND STEP 3''s NON-EMPTY CHECK IS DEAD. GID is defined
      as the labels declared in required_parts[].group, and members(g) is derived by filtering the same
      list, so `require len(members) >= 1` cannot fail for any g in GID — it is dead code. Meanwhile the
      check that should exist is missing: step 4 says "A = members(a) if a ∈ GID else [a]", so a token
      that is neither a declared part id nor a declared group label (`drawes`, or a group referenced but
      never declared on any part) is silently promoted to a part id, emitted as a pair, and only surfaces
      later as a Gate G1 bind failure — the precise "is it a contract typo or an asset defect?" confusion
      A1 was written to eliminate. The item reproduces the defect it claims to close.


      P3 — NON-DETERMINISTIC EVIDENCE. Step 2 is written as `collide = GID ∩ set(PID)` and `colliding_ids`
      is an emitted evidence field. Python string hashing is seed-randomized per process, so set-intersection
      iteration order is not reproducible. Measured, four separate interpreter runs on the same five labels:
      [''handle'',''panel'',''shelf'',''drawer'',''tray''], [''handle'',''panel'',''tray'',''drawer'',''shelf''],
      [''shelf'',''tray'',''panel'',''handle'',''drawer''], [''shelf'',''tray'',''drawer'',''handle'',''panel''].
      Same inputs, four different evidence rows — this violates the byte-identical-output requirement
      directly.


      P4 — GROUP-LEGAL SITES ARE NEVER ENUMERATED. The claim says "every group token appearing at a group-legal
      site" but the site set is never closed. §04 says only "供 contact_policy 等集合寻址" — "contact_policy
      *etc.*". So it is undefined whether a group token is legal in joints[].part, joints[].parent, rigid_attachments[].follower/leader,
      anchor.on_edge_of, anchor.through_center_of, axis.relational.{from,to,between,part}, canonical_frame.front.outward_normal_of,
      or part_relations[].{subject,object}. This is not hypothetical: `{follower: handle, leader: drawer}`
      would make A4''s "each attached part appears exactly once as follower" satisfiable or unsatisfiable
      depending on the reading, and a group at anchor.on_edge_of has no defined KF1 semantics at all (which
      part''s vertices get split by the axis plane?).


      P5 — proportion_claims IS DECLARED AS AN INPUT WITH NO ALGORITHM. p0_inputs names proportion_claims[].parts[],
      but step 4 defines expansion only for "a contact entry whose parts = [a, b]". proportion_claims
      is not a symmetric unordered pair: §05''s form is `{parts: [drawer_1, drawer_2], measure: height,
      target_ratio: [1, 1], tolerance: 0.10}`, where target_ratio is a positional list matched element-wise
      to parts. Expanding a 3-member group there leaves a 2-element target_ratio against 3 parts — undefined.
      The `{subject, object}` variant is not mentioned either. proportion_claims also routes to GF4 (P2
      geometry), so expansion reweights a metric outside KF3 that the item''s rationale never considers.


      P6 — THE 64 CAP IS BOTH AN UNFROZEN THRESHOLD AND INEFFECTIVE. R3 requires "每一个阈值都写在契约里、和声明一起冻结、随评测结果输出哈希。没有阈值默认值散落在代码里"
      — 64 is a threshold living in code, exactly what R3 forbids, and it is absent from the §12 tolerances
      block. Worse, it does not achieve its stated purpose: a shelf with 12 books gives C(12,2)=66 forbidden
      pairs and is rejected, forcing the author to hand-enumerate the same 66 entries, which reweights
      S_forbidden identically. The cap bounds magnitude and blocks legitimate contracts without addressing
      the reweighting it names as the harm.


      Minor: `A13.empty_group_expansion` also fires for a plain self-pair `parts: [door, door]` where
      no group is involved, so the id misdescribes the fault; and the emission target "the claim manifest
      (A31)" is a forward reference to an item not present in revised P0 §15 (which runs A1–A12) and whose
      schema is therefore unknown at implementation time.'
    fix: "Six changes; adopt F1 and the rest follow cheaply.\n\nF1 — ADOPT THE TAGGED REFERENCE FORM P0\
      \ ALREADY SHOWS, AND MAKE IT MANDATORY. §04's only statement about expansion writes the reference\
      \ as `{group: drawer}`, not a bare string. Mandate that: at a group-legal site an element is either\
      \ a bare string (always and only a part id) or the single-key mapping `{group: <label>}` (always\
      \ and only a group). This dissolves P1 (A1 is unchanged and still applies to every bare string,\
      \ because a group reference is no longer a string) and dissolves the shadowing case entirely — `parts:\
      \ [{group: drawer}, cabinet_body]` is unambiguous even when a part named `drawer` exists, so no\
      \ contract ever needs renaming. Keep step 2's collision check anyway, but demote it from a hard\
      \ reject to a warning `A13.group_shadows_part_id` emitted for author legibility. Rewrite the claim\
      \ sentence accordingly: the namespaces are separated by syntax, not by a disjointness ban.\n  If\
      \ the bare-token form is kept instead for authoring convenience, then A13 must carry an explicit\
      \ amendment to A1 — \"A1 accepts a token at a group-legal site that resolves to either a declared\
      \ part id or a declared group label; A13 runs before A1 and hands it the expanded pair list\" —\
      \ and step 2's ban must stay a hard reject. State whichever choice is made in the item text; do\
      \ not leave both readings open.\n\nF2 — CLOSE THE RESOLUTION RULE, DELETE THE DEAD CHECK. Replace\
      \ step 3's `require len(members) >= 1` (unfalsifiable, since GID is derived from the same field)\
      \ with a referenced-vs-declared check on the use side: for every token t at a group-legal site,\
      \ if t is not a declared part id and not in GID → hard reject `A13.unresolvable_token`, evidence\
      \ {token, entry_class, entry_index, declared_part_ids, declared_group_labels}. Delete the `else\
      \ [a]` fallback in step 4 — an unresolved token must never silently become a part id.\n\nF3 — MAKE\
      \ EVERY ORDERED STRUCTURE A LIST. Forbid Python sets anywhere in the algorithm text. Write PID and\
      \ GID as declaration-ordered lists; write the collision scan as `colliding = [g for g in GID if\
      \ g in PID_index]` where PID_index is a dict built in declaration order (membership test only, never\
      \ iterated). Pair canonicalization stays `tuple(sorted((x, y)))` — lexicographic, deterministic\
      \ — and de-duplication stays first-occurrence over the ordered product. Add an explicit sentence:\
      \ all emitted evidence lists are in declaration order and the implementation must not iterate any\
      \ set or dict-keys collection derived from a set.\n\nF4 — ENUMERATE THE GROUP-LEGAL SITES AS A CLOSED\
      \ WHITELIST. Legal: contact_policy.{required,permitted,forbidden}[].parts[], and proportion_claims[].parts[]\
      \ (see F5). Illegal — a group token there is hard reject `A13.group_at_singular_site`, evidence\
      \ {token, field_path}: joints[].part, joints[].parent, joints[].axis.relational.{from,to,between[],part},\
      \ joints[].anchor.{on_edge_of,through_center_of}, rigid_attachments[].{follower,leader}, part_relations[].{subject,object},\
      \ part_geometry[].id, canonical_frame.front.outward_normal_of, independent_dofs[], couplings[].relation.{dependent,independent}.\
      \ Rationale to record: each of those sites resolves to exactly one body or one geom set, and A3/A4's\
      \ \"exactly once\" counting is undefined over a set.\n\nF5 — GIVE proportion_claims ITS OWN EXPANSION\
      \ RULE, OR DROP IT FROM p0_inputs. Preferred rule, stated explicitly: in the `{parts: [...], target_ratio:\
      \ [r1, r2]}` form, expansion is legal only when target_ratio is [1, 1] (an all-equal claim); it\
      \ then expands to the same canonicalized unordered pair list as a contact entry, each pair inheriting\
      \ measure and tolerance, and each expanded pair counting as one GF4 claim. Any other target_ratio\
      \ with a group token → hard reject `A13.group_with_positional_ratio`, because a positional 2-list\
      \ has no meaning over an n-member set. Group tokens are illegal in the `{subject, object}` form\
      \ (positional, singular — covered by F4). If this rule is not wanted, remove proportion_claims[].parts[]\
      \ from p0_inputs so the implementer is not left holding an undefined input.\n\nF6 — REPLACE THE\
      \ CAP WITH A FROZEN LIMIT PLUS A WEIGHTING RULE. (a) Move the number into the contract: add `max_group_expansion_pairs:\
      \ 64` to the §12 tolerances block so it is frozen with the declaration and enters the tolerances\
      \ hash, per R3; the code reads it, never a literal. (b) The cap alone does not fix reweighting,\
      \ so add the rule that does: one contract entry contributes exactly one unit to the KF3 denominator\
      \ regardless of how many pairs it expands to, and the entry passes iff all of its expanded pairs\
      \ pass (min over pairs for forbidden, all-of for required). Per-pair signed distances still go into\
      \ evidence via expanded_pairs, so nothing is hidden — but a 45-pair `[{group: book}, {group: book}]`\
      \ entry can no longer outvote a hand-written single pair, and the same protection applies to the\
      \ 66 hand-enumerated entries the cap would otherwise have forced. State whether hand-written entries\
      \ are also unit-weighted (they must be, or the two authoring styles score differently for the same\
      \ contract).\n\nAlso: rename `A13.empty_group_expansion` to `A13.degenerate_self_pair` and let it\
      \ cover both the group-crossed-with-itself-one-member case and the plain `parts: [door, door]` case.\
      \ And either pin down A31's manifest schema or specify the fields A13 emits standalone — predicate_id,\
      \ entry_class, entry_index, group_label, members, expanded_pairs, expanded_count, entry_weight —\
      \ so the item is implementable without A31 existing yet."
