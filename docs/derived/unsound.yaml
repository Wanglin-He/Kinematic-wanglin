      \ geoms with geom_type in {mjGEOM_PLANE, mjGEOM_HFIELD}.\n  2. Pair (j,k), j<k, is CO-DEPENDENT\
      \ for a declared contact pair (P,Q) iff\n       ((P in moved(j)) XOR (Q in moved(j)))  AND  ((P\
      \ in moved(k)) XOR (Q in moved(k))).\n     This is the exact condition for \"the P-Q relative pose\
      \ depends on both q_j and q_k\". In the counterexample above, P=hand is in moved(shoulder) and in\
      \ moved(wrist), Q=obstacle is in neither, so (shoulder,wrist) is co-dependent -- the pair the current\
      \ rule discards.\n  3. Prune with proximity applied to the two PARTS, over BOTH DOFs' samples:\n\
      \       B_P = SA_P^j union SA_P^k ,  B_Q = SA_Q^j union SA_Q^k\n       margin = max(pair_inflation_frac\
      \ * min(diag(B_P), diag(B_Q)), margin_floor_m)\n       proximate iff for every axis a: B_P.min[a]\
      \ - margin <= B_Q.max[a] AND B_Q.min[a] - margin <= B_P.min... (both directions, as written today)\n\
      \     (j,k) is ADJACENT iff at least one declared contact pair (P,Q) is both co-dependent and proximate.\
      \ Record the witnessing (P,Q).\n  This is still a swept-part-AABB normalization -- never a whole-asset\
      \ diagonal -- and uses the same arrays already listed (m.geom_aabb, m.geom_type, d.geom_xpos, d.geom_xmat).\n\
      \n--- Fix 2: delete nested_subtree ---\nRemove it. It is unreachable and its intended case is now\
      \ handled by moved(j)/moved(k) overlap. If a same-body multi-joint asset must be flagged, state\
      \ the condition as \"M_j and M_k share any geom\", which already covers it.\n\n--- Fix 3: make the\
      \ evidence a function ---\nReplace adjacency_reason (single enum) with three independent booleans\
      \ plus the witness:\n  codependent_pairs: [[P,Q], ...]  (all of them, sorted by contract index of\
      \ P then Q)\n  proximate: bool ; shared_geoms: bool ; adjacent: bool\n  witness_pair: the first\
      \ co-dependent AND proximate (P,Q) in that sorted order\nKeep per_axis_gap[3] and margin, reported\
      \ for witness_pair so the decision is re-derivable.\n\n--- Fix 4: value and register the thresholds\
      \ ---\nAdd to the frozen tolerances block (hashed and emitted with results, per R3/A12), or to a\
