- item: KF2.expected_dof
  lens: kf2
  verdict:
    sound: false
    problem: 'Three defects, two of them fatal, verified by running MuJoCo (installed version is 3.3.7;
      there is no MuJoCo "3.11", so every "measured in 3.11" claim in this item needs re-sourcing).


      FATAL 1 — Step 4 crashes on the canonical coupling asset (empty complement).

      Step 4 evaluates max(|J_full[i, Vc]|) where Vc = complement of V in range(m.nv). P0-revised Example
      B (the gearbox, the ONLY non-empty coupling example in the contract) has housing role=fixed, i.e.
      welded to world, plus exactly the two member hinges -> nv = 2 -> V = [1, 0], Vc = []. numpy raises
      "ValueError: zero-size array to reduction operation maximum which has no identity". Measured on
      all four variants of that asset (correct equality / duplicated equality / equality+weld / no equality).
      This is not an exotic edge case: every minimal coupled asset — fixed base plus exactly the two member
      joints — hits it, and it is the flagship KF2 example.


      FATAL 2 — d.ten_J is SPARSE whenever mj_isSparse(m); the prescribed reshape silently reads zeros
      and fails correct assets.

      The spec states "d.ten_J (flat, reshape to (m.ntendon, m.nv) - measured: dense in 3.11, no ten_J_rownnz
      exists)". Both halves are false. mjData exposes ten_J_rownnz, ten_J_rowadr, ten_J_colind, and when
      mj_isSparse(m)==1 (nv >= 60 under jacobian=auto, or jacobian=sparse) ten_J is packed sparsely. Measured:
      fixed tendon on j40/j41 at nv=70 gives ten_J_rownnz=[2], ten_J_rowadr=[0], ten_J_colind=[40,41],
      values [1,-3] sitting at FLAT positions 0 and 1. The binding still returns a (ntendon, nv)-shaped
      array, so .reshape(m.ntendon, m.nv) succeeds silently and row[V] returns [0., 0.]. A zero row contributes
      rank 0 -> dof_observed = 2 - 0 = 2 != expected_dof 1 -> a CORRECT tendon-implemented coupling FAILS.
      The failure is silent, direction-biased (only tendon implementations, only large-nv assets), and
      will be mistaken for real signal. Measured control at nv=5, same tendon on j3/j4: dense, naive read
      = [1,-3] correct — so the bug appears only above the auto threshold, which is exactly how it survives
      casual testing.


      DEFECT 3 — the "measured" justification for deviation (2) is unreproducible; range="0 0" does not
      compile.

      The rationale for synthesizing the tendon row rests on "measured, a zero-width limited fixed tendon
      produces NO efc row while it is satisfied (nefc=0 on the manifold)". In 3.3.7, <fixed limited="true"
      range="0 0"> is REJECTED by the compiler: ValueError: Error: invalid limits in tendon (min must
      be strictly < max). The model described was never measured. The underlying phenomenon is real —
      I reproduced it with range="-1e-9 1e-9": nefc=1 containing only the equality row, efc_type=[mjCNSTR_EQUALITY],
      no mjCNSTR_LIMIT_TENDON row — but the spec (and P0-revised section 09, which prints range="0 0"
      verbatim as the model-side example) names an uncompilable asset.


      Secondary issues that should be fixed in the same pass:

      (a) Step 5 appends the tendon row WITHOUT the step-4 outside-support filter it applies to equality
      rows. A fixed tendon carrying a third joint would still be counted as a full rank-1 constraint on
      V — precisely the mis-attribution that deviation (1) exists to prevent.

      (b) No guard for jd == ji. Admission A6 forbids a dependent joint appearing in independent_dofs
      but not dependent == independent; then V = [k, k], A has two identical columns, rank <= 1, dof_observed
      >= 1, and the check can silently pass.

      (c) rank is taken at a single q_ref; a configuration-dependent rank drop is unspecified.

      (d) rank_cut = max(tol*s[0], 1e-12) is unspecified when A is all-zero (s[0] = 0).

      (e) evidence field member_dof_indices=V does not state the ordering; measured V = [1, 0] for the
      gear pair (dependent first, not sorted). Harmless for rank, but must be pinned for byte-identical
      evidence.


      What DOES check out, so the repair is local rather than a rewrite: the predicate is not a tautology
      and discriminates in both claimed directions. Measured on the nv=2 gearbox — correct equality: J
      = [[-3, 1]], rank 1, dof_observed 1, PASS. Duplicated identical equality: 2 identical rows, rank
      1, dof 1, PASS (no spurious failure, as claimed). equality + <weld body1="gear_small" body2="gear_large"/>:
      7 equality rows with efc_pos ALL 0.0 (so KF2.residual is genuinely blind, as claimed), restricted
      rank 2, dof_observed 0, FAIL. No equality at all: nefc=0, rank 0, dof 2, FAIL. The efc_J branch
      is correct as written: dense (nv=2,3,5) gives mj_isSparse=0 and len(efc_J) == nefc*nv exactly with
      efc_J_rownnz reading back [0] (garbage, so the mandatory branch is justified); sparse (nv=70) gives
      len(efc_J)=nJ and the exact mju_sparse2dense call as written densifies to columns [40,41]=[1,-3];
      the pybind signature matches (res 2-D writable c-contiguous, four 1-D int/float arrays); nefc==0
      is safe on BOTH branches (reshape -> (0,nv); sparse2dense -> (0,nv), no error). mjCNSTR_EQUALITY
      == 0 and equality rows exist after mj_forward with no stepping. No whole-asset bounding-box normalization
      anywhere — rank and dof are dimensionless integers. Determinism is otherwise fine (ordered range
      scan for R, SVD).'
    fix: "FIX 1 (empty complement). In step 4, guard the reduction and state the semantics explicitly:\n\
      \  outside_i = 0.0 if len(Vc) == 0 else float(np.max(np.abs(J_full[i, Vc])))\n  keep row i iff d.efc_type[i]\
      \ == mjCNSTR_EQUALITY and outside_i <= rank_zero_abs\nAdd to the spec text: \"When nv == 2 (fixed\
      \ base plus exactly the two member joints, e.g. P0-revised Example B) Vc is empty; every equality\
      \ row is then retained by definition and rows_excluded_touching_outside = 0.\" Apply the same guard\
      \ anywhere else a complement reduction appears.\n\nFIX 2 (ten_J sparsity). Replace the step-5 read\
      \ with the same mandatory branch already used for efc_J, and correct the mj_inputs line to list\
      \ d.ten_J_rownnz, d.ten_J_rowadr, d.ten_J_colind (they exist):\n  if mujoco.mj_isSparse(m) == 0:\n\
      \      T = np.asarray(d.ten_J).reshape(m.ntendon, m.nv)\n  else:\n      rownnz = np.asarray(d.ten_J_rownnz)[:m.ntendon]\n\
      \      nnz    = int(rownnz.sum())\n      T      = np.zeros((m.ntendon, m.nv))\n      mujoco.mju_sparse2dense(T,\n\
      \          np.asarray(d.ten_J).ravel()[:nnz],\n          rownnz,\n          np.asarray(d.ten_J_rowadr)[:m.ntendon],\n\
      \          np.asarray(d.ten_J_colind).ravel()[:nnz])\n  tendon_row = T[t]\nVerified: at nv=70 this\
      \ yields tendon_row[V] = [1, -3] where the naive reshape yielded [0, 0]; at nv=5 both agree. Emit\
      \ is_ten_J_sparse in the evidence alongside is_sparse. Also add a regression test that pins a tendon\
      \ coupling in a model with nv >= 60 — the bug is invisible below the auto threshold.\n\nFIX 3 (uncompilable\
      \ control). Delete the claim that a range=\"0 0\" limited fixed tendon was measured; replace the\
      \ rationale with the reproducible one: \"a limited fixed tendon whose range is narrower than tendon_bilateral_width_max\
      \ produces no efc row while satisfied (measured with range='-1e-9 1e-9': nefc = 1, containing only\
      \ the mjCNSTR_EQUALITY row; no mjCNSTR_LIMIT_TENDON row appears until the limit is violated). MuJoCo\
      \ rejects range='0 0' at compile time (invalid limits in tendon), so a zero-width limit cannot be\
      \ authored.\" Correspondingly, KF2.bound's tendon_limit recognizer must match on m.tendon_limited[t]\
      \ == 1 and (m.tendon_range[t,1] - m.tendon_range[t,0]) <= tendon_bilateral_width_max, a new frozen\
      \ key in the tolerances block (propose 1e-6, calibrate by injection), not on range == [0, 0]. Flag\
      \ to the P0 owner that section 09's model-side example prints range=\"0 0\" and does not compile.\n\
      \nFIX 4 (secondaries).\n(a) Apply the step-4 outside-support test (with the empty-Vc guard) to the\
      \ synthesized tendon row too; if it touches outside V, exclude it, increment rows_excluded_touching_outside,\
      \ and set tendon_limit_row_synthesized = False.\n(b) Add to na_condition: \"N/A when relation.dependent\
      \ == relation.independent (degenerate coupling); emit degenerate_self_coupling in the evidence.\"\
      \ Better, add an admission check A13 to P0 forbidding it.\n(c) State that rank is evaluated only\
      \ at q_ref and that a rank drop at that single sample is accepted; or, if the residual sweep is\
      \ already being run, take rank = max over the same frozen sweep samples and report per-sample ranks.\
      \ Pick one and write it down — either is deterministic, silence is not.\n(d) Specify: if s.size\
      \ == 0 or s[0] <= 1e-12 then rank = 0 and rank_cut = 1e-12.\n(e) Specify V = [jnt_dofadr[dependent],\
      \ jnt_dofadr[independent]] in that order, not sorted, and say so in the evidence field description."
- item: KF2.residual
  lens: kf2
  verdict:
    sound: false
    problem: 'STEP R asserts for kind eq_joint that "r_raw = d.efc_pos[rows[0]] (signed, in the dependent
      joint''s units)". That is false. MuJoCo''s joint equality residual is always expressed in the units
      of **joint1** (the model''s first slot): efc_pos = (q_j1 - qpos0_j1) - P(q_j2 - qpos0_j2). Whether
      joint1 happens to be the contract''s dependent joint is entirely the generator''s free choice, and
      the spec never reads it — mj_inputs lists only "m.eq_data (column 10 = torquescale)" and omits m.eq_objtype
      / m.eq_obj1id / m.eq_obj2id / m.eq_data[e][0:5], so the code as written literally cannot tell the
      two cases apart.


      When the model puts the INDEPENDENT joint in slot 1 (a legal, mathematically equivalent encoding
      that KF2.bound must accept — the spec itself accepts it, see its "verified control in the other
      direction"), the reported residual is off by exactly the factor a1 = m.eq_data[e][1] ~= 1/c, i.e.
      every reported r_raw is wrong by the contract coefficient c. Since r_norm is r_raw divided by a
      span, no normalisation branch repairs it. Measured on P0 Example B''s own contract (dependent gear_small_spin,
      independent gear_large_spin, coefficient 3.0, residual_norm {by: absolute, unit: rad}, epsilon 0.005,
      ROOT span [-6.283, 6.283], N=33):


      FALSE NEGATIVE — model <joint joint1="gear_large_spin" joint2="gear_small_spin" polycoef="0 0.3331211
      0 0 0"/> (a 3.00191:1 gear where the contract says 3:1). Spec computes r_max = 0.004000 <= 0.005
      -> PASS. True phase error of the dependent joint at the same samples = 0.012009 rad = 2.4x epsilon
      -> must FAIL. Understatement factor = c = 3; for an ordinary 20:1 reduction the factor is 20, so
      an error 20x over tolerance is scored as a pass.


      FALSE POSITIVE — mirror contract (dependent gear_large_spin, independent gear_small_spin, coefficient
      1/3), model <joint joint1="JS" joint2="JL" polycoef="0 3.00191 0 0 0"/>. Spec computes r_max = 0.012001
      -> FAIL. True dependent-unit error = 0.003998 <= 0.005 -> must PASS.


      So the defect is not conservative in either direction; it moves the pass/fail boundary by the contract
      coefficient both ways. The spec''s own control experiment cannot catch it: it validates the swapped-role
      model only at efc_pos = 0, and 0 divided by any scale is still 0 — zero residual is precisely the
      single point at which a scale error is invisible.


      Secondary, also must-fix:

      (a) STEP Q.1 is nondeterministic. "while the current joint is the .dependent of some coupling h,
      move to h''s .independent" has no tie-break, and P0 admission A6 only forbids a dependent from appearing
      in independent_dofs — nothing forbids one joint being the .dependent of two couplings. With two
      matching h the ROOT, chain_composed_coefficient, the whole sample grid and the verdict all depend
      on dict/list iteration order.

      (b) tolerances.coupling_samples and tolerances.coupling_path_dof_samples are introduced with code-side
      defaults (33, 5). P0 principle R3 and admission A12 forbid threshold defaults living in code; these
      two silently change every sample grid and therefore every r_max and first_failing_index.'
    fix: "1. Add to mj_inputs: m.eq_objtype, m.eq_obj1id, m.eq_obj2id, m.eq_data[e][0:5], m.qpos0 (already\
      \ listed), mujoco.mjtObj.mjOBJ_JOINT.\n\n2. Rewrite STEP R, kind eq_joint. Let jd, ji be the model\
      \ joint ids of the contract's dependent and independent joints, x0d = m.qpos0[m.jnt_qposadr[jd]],\
      \ and P = m.eq_data[e][0:5] (quartic, P(u) = a0 + a1*u + a2*u^2 + a3*u^3 + a4*u^4).\n   - require\
      \ m.eq_objtype[e] == mjOBJ_JOINT; s1 = int(m.eq_obj1id[e]), s2 = int(m.eq_obj2id[e]).\n   - if s1\
      \ == jd and s2 == ji: r_raw = d.efc_pos[rows[0]]; residual_slot_swapped = False. (Already in dependent-joint\
      \ units, as the spec assumed.)\n   - elif s1 == ji and s2 == jd: the model states the inverse relation,\
      \ so convert to dependent-joint units by the model's own local slope. u = q_dep_written - x0d; g\
      \ = a1 + 2*a2*u + 3*a3*u^2 + 4*a4*u^3. If |g| < 1e-9 -> N/A(model_relation_not_invertible) for coupling\
      \ g (report the sample index at which it degenerated). Else r_raw = -d.efc_pos[rows[0]] / g; residual_slot_swapped\
      \ = True; record slope_used = g. Note g is recomputed per sample, so a nonlinear polycoef is handled\
      \ exactly at first order and the linear case (a2..a4 = 0, g = a1) is exact.\n   - else: the equality's\
      \ members are not the coupling's members -> that is a KF2.bound failure, not a residual; do not\
      \ compute here.\n   Apply the identical slot test to kind eq_tendon: identify which tendon slot\
      \ contains the dependent joint, and when it is tendon2 divide by the same model-polynomial slope\
      \ in addition to the existing /w_d.\n\n3. Add to the evidence list: residual_slot_swapped, model_polycoef\
      \ (all 5 coefficients), slope_used (per sample and at r_max), eq_obj1id, eq_obj2id.\n\n4. Add to\
      \ the fault-injection calibration suite a case that the current control misses: the swapped-slot\
      \ model evaluated at a NON-ZERO residual. Concretely both cases above must be asserted — polycoef\
      \ \"0 0.3331211 0 0 0\" with joint1=independent must FAIL at r_max = 0.012, and polycoef \"0 3.00191\
      \ 0 0 0\" in the mirror contract must PASS at r_max = 0.004. Validating a swapped-slot model only\
      \ at efc_pos = 0 proves nothing about scale.\n\n5. STEP Q.1 determinism: add P0 admission check\
      \ A13 — a joint id may appear as .dependent in at most one coupling. Until that lands, make the\
      \ walk explicit: candidates = [h for h in couplings if h.relation.dependent == current]; if len(candidates)\
      \ > 1 -> N/A(dependent_multiply_driven) for every coupling naming that joint; else take candidates[0],\
      \ iterating couplings in contract declaration order (a list, never a dict/set).\n\n6. Move coupling_samples\
      \ (33) and coupling_path_dof_samples (5) into the contract's tolerances block per R3/A12, so they\
      \ enter the frozen tolerance hash. Keep no code-side fallback; a contract missing them is an admission\
      \ failure, not a silent default."
- item: KF3.helper.rigid_sets
  lens: kf3
  verdict:
    sound: false
    problem: 'Six defects, ordered by severity. The MuJoCo API surface is clean (geom_aabb, jnt_bodyid,
      body_jntnum, geom_bodyid, geom_xpos/xmat all exist in 3.11 with the stated shapes; nothing invented;
      no whole-asset diagonal), and the frozen 8-corner ordering is genuinely correct as a body-fixed
      rigid point cloud. The failures are elsewhere.


      P1 (blocking) — "exact world AABB" is false; it is a conservative bound whose inflation is orientation-dependent.

      Step 7 takes the 8 corners of the geom''s LOCAL aabb, rotates them, and boxes them. That is the
      world AABB of the OBB, not of the geometry. Measured: a sphere r=0.05 (MuJoCo stores geom_aabb =
      cube (0,0,0,r,r,r)) has true world diag 0.173205; the spec''s diag is 0.2000 at 15 deg yaw, 0.21753
      at 30 deg, 0.22361 at 45 deg — up to 1.291x for yaw alone, sqrt(3)=1.732x for a general rotation.
      A thin door panel is nearly unaffected (1.009x), so the error is concentrated exactly on chunky/round
      parts — knobs, wheels, gears — which is precisely the population P0 example B targets with anchor_center_offset_max
      = 0.05 * diag(part) and the population travel_scale_min = 0.50 (child AABB diag / declared travel)
      is calibrated against. Two identical gearboxes modelled at different yaw get diag() values differing
      by 29%, so both thresholds move with a modelling convention rather than with asset quality. That
      is exactly the confounder P0 principle R2 exists to eliminate, and it will corrupt the fault-injection
      calibration curves in P0 section 12 because the injected severity and the measured normalizer move
      together.


      P2 (blocking) — the disjointness assertion is a tautology, and the one case can_it_fail names is
      ill-defined rather than caught.

      Step 6''s second sentence builds G_p by assigning each body to exactly one nearest-bound-ancestor-or-self.
      A partition cannot overlap. I ran it: on a tree 0=world, 1=cabinet(part A), 2=handle(part B, jntnum
      0, child of 1), 3=drawer(jntnum 1, child of 1), G_A={1}, G_B={2}, intersection empty — and it is
      empty by construction for every input. Meanwhile the failure can_it_fail claims it catches ("a Gate
      that bound two parts to the same body") does NOT trip the assertion: if bind[A]=bind[B]=1, then
      "the nearest bound ancestor-or-self of body 1" has two answers and the spec supplies no tie-break,
      so the result is whatever the implementation''s dict/set iteration yields. The assertion that is
      supposed to be the safety net is unreachable, and the case it was written for is a determinism hole
      instead. (Note also that step 6''s two sentences are given as one definition but are stated independently;
      they happen to agree on the trees I tested, which makes the redundancy harmless but not verified.)


      P3 (blocking) — an empty geom set is reachable and every consumer of it is undefined.

      worldAABB(set) is "elementwise min/max of the member AABBs" and diag/vol are built on it; for an
      empty set these are undefined (NaN or an exception), and CornerCloud is empty. na_condition says
      "never N/A", so there is no defined behaviour. The Gate''s non-empty-geom requirement (P0 section
      05) is asserted on the Gate''s own binding, not on G_p, and two steps here can empty a non-empty
      binding after the Gate has passed: step 3 drops PLANE/HFIELD, and step 6 subtracts every descendant
      bound to another part. Concretely: a body_p carrying no geoms of its own whose only geom-bearing
      rigid descendant is the bound body of an `attached` part (handle, door_knob — the normal P0 pattern)
      yields G_p = {}. This corpus makes that likely: URDF links with no <visual> are exactly the links
      that needed the injected dummy <inertial>, and the median asset has 5 bodies to 31 geoms, so geomless
      bodies are common.


      P4 — d.geom_xpos / d.geom_xmat are read without ever refreshing them. Step 7 consumes them, but
      no step calls mj_kinematics(m, d) or mj_forward(m, d) after qpos is written. As literally specified,
      every sample after the first returns the pose from whenever d was last updated.


      P5 — one required input is missing and several declared ones are unused. Step 5 evaluates m.jnt_bodyid[j]
      where j comes from independent_dofs, i.e. a P0 joint id string; mj_inputs supplies only the Gate
      table part_id -> body_id, so there is no stated route from a P0 joint id to a MuJoCo joint index
      — and the pass_condition asserts on exactly that mapping. Conversely m.geom_rbound is declared and
      never used, as are required_parts[].role, required_parts[].group, joints[].part, and joints[].parent.


      P6 — body_geomadr is -1 when body_geomnum is 0. Step 2''s range body_geomadr[b] .. body_geomadr[b]+body_geomnum[b]-1
      becomes -1..-2. In C or a range() it is empty and harmless, but in NumPy slicing arr[-1:-1] is also
      empty while arr[-1:] is not; the guard is not stated, and the "{g : geom_bodyid[g] in S}" set-builder
      and the address-range enumeration are given as equivalent without noting that equivalence relies
      on MuJoCo''s per-body geom contiguity.


      One non-defect worth recording rather than fixing: the claim sentence says "every driven joint resolves
      to a ... disjointness-checked geom set", but M_j (step 5) deliberately is not disjointness-checked
      and must not be — M_j for drawer_1_slide correctly contains handle_1''s geoms. Only the claim wording
      overreaches. Similarly, two joints on the same body (jnt_bodyid equal) silently yield identical
      M_j sets, which any downstream per-DOF motion test cannot distinguish; that should be detected and
      recorded here, not discovered later.'
    fix: "Six edits, all local to this item.\n\nF1 — rename and re-scope the box, and make the inflation\
      \ not matter.\nRename worldAABB(g) to obbWorldBound(g) and state plainly: \"the world axis-aligned\
      \ bound of the geom's oriented local AABB; conservative, not tight.\" Then split the two jobs it\
      \ is currently doing:\n  (a) Rigid point cloud (for KF3.motion.type_semantics): keep step 7 exactly\
      \ as written. The 8 OBB corners are body-fixed, so correspondence across samples is valid — this\
      \ is the right primitive and the true world AABB corners would be wrong here because they are not\
      \ body-fixed.\n  (b) Any scalar normalizer (diag used by travel_scale_min, anchor_center_offset_max,\
      \ follower drift scaling): do NOT use the world bound. Define instead diagLocal(p) = the diagonal\
      \ of the part's own bound expressed in the part's reference-pose body frame, computed once at the\
      \ frozen reference qpos and reused unchanged at every sample:\n      For each g in G_p, transform\
      \ its 8 local-AABB corners into body_p's frame using the reference-pose relative transform, box\
      \ the union, take the diagonal.\n  This is rotation-invariant under any rigid re-modelling of the\
      \ whole asset, which is what P0 R2 requires, and it removes the 1.0x-to-1.73x orientation-dependent\
      \ drift from every threshold. If a tight bound is ever genuinely needed for a mesh, use m.geom_dataid[g]\
      \ -> m.mesh_vertadr / m.mesh_vertnum / m.mesh_vert and transform actual vertices; declare those\
      \ four fields in mj_inputs if you take that route.\n\nF2 — replace the tautological disjointness\
      \ assertion with an assertion that can fire, and specify the tie-break.\nDelete \"G_p and G_p' are\
      \ disjoint for p != p'\" from pass_condition. Replace with three assertions evaluated BEFORE any\
      \ set construction:\n  A-inj: the Gate binding part_id -> body_id is injective. If two required_parts\
      \ map to the same body_id, abort KF3 for the asset with evidence {colliding_parts, shared_body_id}\
      \ as a Gate regression. This is the check can_it_fail was reaching for and it actually fires.\n\
      \  A-anc: record (do not abort) every pair (p, p') where body_p' lies in RigidSubtree(body_p); emit\
      \ nested_parts: [{outer, inner, inner_body_id}]. This is legal and normal (door / door_knob), but\
      \ it is the condition under which G_p is reduced, and it must be visible in the evidence so a reviewer\
      \ can tell a legitimate `attached` nesting from a Gate that collapsed two parts onto one chain.\n\
      \  A-jnt: every joint id in independent_dofs resolves through the Gate joint binding table to a\
      \ valid MuJoCo joint index in [0, m.njnt).\nAdditionally, make step 6 single-definition: keep only\
      \ the partition form (\"assign each body to its nearest bound ancestor-or-self, then G_p = geoms\
      \ of bodies assigned to p and reachable from body_p without crossing a joint\") and delete the subtractive\
      \ first sentence, so there is one normative algorithm rather than two asserted-equivalent ones.\
      \ With A-inj in force the assignment is total and unique, so the determinism hole closes.\n\nF3\
      \ — assert non-emptiness where it can actually break, and define the abort.\nAfter step 3 and again\
      \ after step 6, assert |G_p| >= 1 for every required part and |M_j| >= 1 for every driven joint.\
      \ On violation, abort KF3 for the asset and emit {part_id, bound_body_id, rigid_subtree_bodies,\
      \ geoms_before_type_filter, skipped_geom_types, geoms_lost_to_nested_parts, nested_parts}. Classify\
      \ it as a KF3 precondition failure distinct from a Gate regression, because the Gate's binding was\
      \ legitimately non-empty and this helper emptied it. Correspondingly amend na_condition, which currently\
      \ says \"never N/A\", to name this as the one defined abort path.\n\nF4 — state the FK refresh.\
      \ Add as step 0 of any per-sample evaluation: \"write qpos, then call mj_forward(m, d) (mj_kinematics(m,\
      \ d) suffices when only geom_xpos/geom_xmat and xanchor/xaxis are needed, but mj_forward is required\
      \ whenever efc_pos is also read in the same sample, so use mj_forward uniformly). d.geom_xpos and\
      \ d.geom_xmat are read only after this call.\"\n\nF5 — fix the input lists. Add to mj_inputs: \"\
      Gate binding table joint_id -> jnt_index\" and \"m.njnt\". Drop m.geom_rbound. Drop required_parts[].role,\
      \ required_parts[].group, joints[].part, joints[].parent from p0_inputs (or state where they are\
      \ consumed — role/group are not needed to build geom sets).\n\nF6 — guard the address range and\
      \ state the contiguity assumption. Step 2 becomes: \"for b in ascending order, if m.body_geomnum[b]\
      \ == 0 skip b (m.body_geomadr[b] is -1 in that case); otherwise emit g = body_geomadr[b] .. body_geomadr[b]+body_geomnum[b]-1\
      \ in ascending g. This enumeration equals {g : geom_bodyid[g] in S} because the MuJoCo compiler\
      \ stores each body's geoms contiguously starting at body_geomadr.\"\n\nF7 (claim wording + one added\
      \ diagnostic) — amend the claim sentence to \"…every part id resolves to a frozen, disjointness-asserted\
      \ geom set, and every driven joint resolves to a frozen geom set (deliberately NOT disjoint from\
      \ part sets: M_j for a drawer's slide correctly includes the geoms of a handle rigidly attached\
      \ to it)\". And add to the assertions: if two joints in independent_dofs share m.jnt_bodyid, record\
      \ shared_child_body: [{joint_a, joint_b, body_id}] in evidence, since their M_j sets are then identical\
      \ and no per-DOF geometric motion test can separate them."
- item: KF3.sweep.bounds_and_reference
  lens: kf3
  verdict:
    sound: false
    problem: 'Verified against a live MuJoCo install (3.3.7; note "3.11" is not a real MuJoCo version).
      Every named array/function exists with the stated shape and semantics — jnt_range (njnt,2), jnt_limited
      (njnt,) uint8, jnt_qposadr/jnt_dofadr (njnt,), qpos0 (nq,); mj_resetData restores qpos=qpos0; mj_kinematics
      and mj_forward both leave qpos bitwise untouched; mj_kinematics does not clamp to jnt_range; hinge/slide
      really do use (qpos - qpos0). So computability is fine. Seven substantive defects, two of them measured
      and decisive.


      D1 — DECISIVE. The central design decision''s justification is exactly inverted, and the choice
      erases the failure it claims to preserve. `deviates_from_spec` says "intersecting with the model''s
      limits would hide exactly the failure ''the drawer only opens 5 cm'', so the declared range wins."
      Measured with a slide at jnt_range=[0,0.05], limited=1, contract range [0,0.40]: writing qpos=0.40
      moves the drawer geom the full -0.400 m in world. Because mj_kinematics never clamps, sweeping the
      DECLARED range is precisely what makes the 5 cm limit invisible — the sweep realises full travel,
      motion coverage passes, the "open" asset_state at 0.40 is classified reachable, and every collision
      sample is taken at a pose the model forbids (fabricating forbidden-penetration verdicts at unreachable
      configurations, and false-passing required stop_contact at unreachable ones). Intersecting is what
      exposes it: coverage collapses to 0.05/0.40 = 12.5%. The item lists m.jnt_limited and m.jnt_range
      in mj_inputs and then forbids their use, so the defect leaves ZERO trace in the evidence fields.
      It also contradicts P3''s own words "deterministic FEASIBLE q-sweep" — beyond-limit poses are not
      feasible.


      D2 — DECISIVE, MEASURED. Step 4 resolves the ball scan axis in the wrong frame, and the error can
      produce a sweep in which nothing moves — manufacturing exactly the "fake joint" false positive KF3
      is built to catch. MuJoCo applies a ball joint''s qpos quaternion in the JOINT-OWNING (child) body''s
      frame, i.e. parent_xquat (x) body_quat, not the contract''s `parent` body frame. Test: child body
      euler="90 0 0" with a ball joint and a rod geom. Spec rule (c) "world +z expressed in the parent
      body frame" yields u=[0,0,1]; writing quat([0,0,1], pi/2) left the rod''s world position bitwise
      unchanged at [0,-0.3,0.3] — it spun about its own long axis. Expressing world +z in the CHILD frame
      gives u=[0,1,0] and the rod correctly swings to [0.3,0,0.3]. The same frame error applies to sub-rules
      (a) and (b). (Sub-case free is accidentally correct: MuJoCo rejects non-top-level free joints —
      "free joint can only be used on top level" — so its parent is always world, and free qpos[0:3] is
      world.)


      D3 — Step 5''s ladder is scalar-only but step 6(ii) must write it into ball/free joints. For a joint
      that IS declared but is not driven and has type ball or free, rungs (a)/(b) yield a scalar from
      joints[].states and rungs (c)/(d) index m.qpos0[adr_j] as a scalar — which is the quaternion w component
      for a ball and the world x coordinate for a free joint. The "ball/free: the qpos0 block verbatim"
      escape is written only for joints the contract does not declare at all. There is no defined value
      to write. The pass_condition cannot even be formulated here: x is a scalar theta while the address
      holds 4 or 7 numbers, so "reproduce x bitwise" is undefined for every ball/free driven DOF too.
      `can_it_fail` names this exact failure ("wrong qpos address for a ball/free joint") and classifies
      it as a harness bug instead of closing it in the spec.


      D4 — `M_j` and "the all-reference pose" are undefined, and step 3 is circular. `diag(worldAABB(M_j))`
      introduces M_j, which appears nowhere else — child body only, whole moving subtree, or the contract
      part bound to j? `worldAABB` is itself undefined (geom_xpos +/- rbound, transformed mesh vertices,
      which geoms — all geoms here are group=1 visual). And "the all-reference pose" is defined by step
      5 only for NON-driven joints; the value taken by the driven DOFs in that pose is never stated, yet
      step 3 needs it while computing the driven DOFs'' own interval. Two implementations pick different
      M_j, get different L, and emit different `range_substituted` — a determinism break. Worse, under
      the "moving subtree" reading a free joint''s subtree is the entire asset, so L becomes the whole-asset
      bounding-box diagonal — the normalizer the brief explicitly forbids (computable for only 19 of 607
      assets).


      D5 — The claim is falsified by its own algorithm. "the sample set is a function of the contract
      alone and is identical across generators" is false: the step-3 substitution reads model geometry
      (worldAABB), ball rule (c) reads qpos0, and ref rungs (c)/(d) read m.qpos0 directly. Measured: ref="0.02"
      on a slide gives qpos0=0.02, so that generator''s model yields a different reference pose than a
      generator whose model has ref=0, for the identical contract. Cross-generator comparability — the
      entire point of the item — does not hold as written.


      D6 — Step 7''s "trap" is stated too broadly and is false for the collision half. "All KF3 predictions
      therefore use differences q_k - q_0 ... never absolute qpos" does not hold for the state classifier
      or contact policy: P0 section 10 classifies a sample into state s by |q_j - states_j[s]| <= tol
      x span, an absolute-qpos test, and contact_policy.required ({drawer_1, cabinet_body}, state: closed)
      is scored only on samples so classified. Measured: with ref="0.02", writing the contract''s closed=0.0
      puts the body at xpos 0.48 while the author''s modelled rest/closed stop is at 0.50 — the required
      stop_contact test runs 2 cm away from the geometry it is meant to probe. The trap is announced as
      neutralised and is not.


      D7 — The sample set is never actually defined. The item is named `bounds_and_reference`, and the
      claim is about "the sample set", but nothing states samples-per-DOF, spacing on [lo,hi], or how
      the d DOFs combine (full grid N^d — example A has d=3 — versus one-at-a-time axial scans). Step
      7 already refers to "a sample in the same scan" as though scans were defined. P3''s "first failing
      q" and "covers the declared range" both depend on it.


      Minor: mj_inputs lists m.jnt_dofadr and m.nq, which the algorithm never uses (KF3 writes qpos, not
      qvel). Step 5 says "every joint j not driven" (which includes dependents) while step 6(ii) writes
      only "non-driven, non-dependent" — harmless but inconsistent.'
    fix: 'F1 (D1) — Keep the declared range as the scan interval (that part is right: it keeps the sample
      set contract-anchored), but stop discarding the model''s limits. Add, for every driven j with m.jnt_limited[j]==1:
      feasible_j = [lo_j, hi_j] INTERSECT m.jnt_range[j] (for jnt_limited[j]==0, feasible_j = [lo_j,hi_j]).
      Emit new evidence fields model_range_lo, model_range_hi, model_limited, reachable_fraction = len(feasible_j)/span_j,
      and tag every sample outside feasible_j with beyond_model_limit=True. Then route them: (a) KF3 motion
      coverage/reachability scores against reachable_fraction, so reachable_fraction < 1 - eps is the
      failure "the drawer only opens 5 cm" (12.5% in the measured case) and it now HAS a home; (b) S_collision
      required and forbidden pairs are scored ONLY on samples with beyond_model_limit=False, since a penetration
      at a configuration the model forbids is not a defect of the model; report the beyond-limit samples
      separately as diagnostics. If feasible_j is empty (declared range disjoint from model range), mark
      the DOF undriven, record range_disjoint_from_model, and let the motion score fail on reachable_fraction=0.
      Rewrite deviates_from_spec accordingly — the current sentence asserts the opposite of the measured
      behaviour.


      F2 (D2) — Replace step 4''s frame for ball (and for consistency free). Define, once, u_j in the
      frame MuJoCo actually uses: let b = m.jnt_bodyid[j] (the joint-owning body); after mj_resetData
      + mj_kinematics, let R_b = d.xmat[b].reshape(3,3) — the child body''s world orientation at qpos0
      with that body''s own joint at identity. Then u_j_local = R_b.T @ u_j_world, and write qpos[adr:adr+4]
      = quat(u_j_local, theta). Resolve u_j_world first (axis.numeric in the canonical frame when front
      is anchored; else the relational reference direction in world; else world +z), then rotate in. Verified:
      this makes the rod swing to [0.3,0,0.3] where the current text leaves it bitwise stationary at [0,-0.3,0.3].
      For free joints the parent is provably world (MuJoCo rejects non-top-level free joints), so qpos[adr:adr+3]
      += theta * u_j_world with no rotation — state that explicitly rather than saying "the same way".
      Add ball_axis_frame="joint_body" to evidence.


      F3 (D3) — Extend the ladder to blocks. State: for ball/free joints, a scalar from joints[].states
      or from the declared range is interpreted as theta and materialised through the same map as step
      4 (ball: qpos[adr:adr+4] = quat(u_j_local, theta); free: qpos[adr:adr+3] = qpos0[adr:adr+3] + theta*u_j_world,
      quaternion = qpos0[adr+3:adr+7]); rungs (c)/(d) are replaced for ball/free by "the qpos0 block verbatim",
      identically to the undeclared case, since clamping a quaternion component is meaningless. Restate
      the pass_condition in terms of the written block, not x: assert that after write_qpos the qpos block
      at every declared address equals, bitwise, the block the writer intended (store the intended block
      and compare), and drop "reproduce x bitwise" which is undefined for ball/free.


      F4 (D4) — Define M_j as "the set of geoms of the joint-owning body m.jnt_bodyid[j] only, enumerated
      via body_geomadr/body_geomnum" (matching the established binding rule, and never a subtree, so a
      free joint cannot smuggle in the whole-asset diagonal). Define worldAABB as the axis-aligned box
      in world coordinates over those geoms'' transformed vertices (mesh vertices via mesh_vertadr/mesh_vertnum
      transformed by geom_xpos/geom_xmat; primitives via their analytic extents), and add an explicit
      fallback: if M_j is empty, record substitution_undefined and mark the DOF undriven rather than emitting
      an arbitrary L. Break the circularity by defining the all-reference pose independently and first:
      every joint takes its step-5 ref value, driven DOFs included; compute all substitutions from that
      single pose; then form the scan intervals. Say this in the numbered order (new step 0: build the
      all-reference pose).


      F5 (D5) — Weaken the claim to what the algorithm delivers, and shrink the model dependence. Change
      the claim to "...the scan interval for every driven DOF is a function of the contract alone; reference
      values for non-driven joints fall back to the model''s rest pose only when the contract declares
      no state for that joint, and every such fallback is recorded in ref_source." Then make the fallback
      visible in aggregation: any joint scoring on rung (c) or (d) contributes ref_source=qpos0/qpos0_clamped
      to the evidence, and cross-generator comparisons must report the count of such joints alongside
      the score.


      F6 (D6) — Rewrite the step-7 trap so it is true. State the split: differential predicates (relative-pose
      semantics, travel, follower drift) use q_k - q_0 within a scan and are qpos0-independent; absolute
      predicates (asset_state classification, contact_policy required/permitted at a named state) are
      NOT, and must write state-anchored poses as qpos[adr] = m.qpos0[adr] + (declared_value - declared_reference),
      where declared_reference is the joint''s own states[''closed''] if present else states[''home'']
      else range.min. Additionally assert-and-record: if any hinge/slide joint has m.qpos0[adr] != 0,
      emit nonzero_qpos0_offset with the value. Real URDF-derived assets always have qpos0 = 0 for hinge/slide,
      so this costs nothing and protects the hand-written MJCF gold-standard set where ref can be nonzero.


      F7 (D7) — Either define the sample set here or name the sibling that does. Concretely, freeze it:
      N = 17 samples per driven DOF, linspace(lo_j, hi_j, N) inclusive of both endpoints (so declared
      closed/open endpoints are always sampled exactly); for d > 1 use axial scans plus the corners —
      d one-at-a-time scans through the all-reference pose (total d*(N-1)+1 samples) UNION the 2^d endpoint
      corners, in the contract''s DOF order, deduplicated by exact float equality with first-occurrence
      order preserved. This keeps the count linear in d instead of N^d (example A: 3 DOFs → 49+8 samples,
      not 4913), makes "first failing q" well-ordered, and makes "the same scan" in step 7 a defined object.
      Record sample_count and sample_scheme in evidence.'
- item: KF3.sweep.dependent_dofs
  lens: kf3
  verdict:
    sound: false
    problem: 'Five defects, the first two of which stop the code from running on real inputs.


      (1) THE PASS CONDITION CONTRADICTS STEPS 2 AND 3. It quantifies over "every coupling g", but step
      2 deliberately holds cycle members at ref_j (which violates every relation on the cycle) and step
      3 deliberately discards the losing coupling when two write the same dependent. So on exactly the
      two malformed-contract cases the algorithm says to tolerate and record, the harness assertion fires
      at 1e-12 and aborts the sweep. The assertion is also otherwise contentless: it re-checks the arithmetic
      of the line that just executed (val = c*qi + off stored into a float64 slot and read back differs
      by exactly 0), so it catches nothing except the cases where it is wrong to fire.


      (2) NO HANDLING FOR AN UNBOUND MEMBER. na_condition is only `couplings == []`. A1/A5/A6 are contract-internal
      admission rules; they say nothing about the model. The generator may simply not have produced a
      joint for the dependent (or independent) part — this is P0 section 14''s own hole (2), "根本没实现耦合",
      and with a median of 3 joints per asset across 545 loadable assets it is a common case, not an edge
      case. As written, `m.jnt_qposadr[dependent]` has no index to look up and the code raises. KF2 is
      expected to score this asset 0 via bound(g)=false, so the sweep must survive it, not crash.


      (3) THE BALL-DEPENDENT BRANCH IS UNSOUND AND MAKES THE ASSERTION ILL-DEFINED. P0''s relation is
      verbatim MuJoCo equality/joint polycoef semantics, and MuJoCo''s equality/joint accepts only scalar
      joints (hinge, slide) — no mechanism the contract admits can realize a scalar coupling onto a ball,
      so "quat(u_dep, value)" places the sample on a manifold no model can be graded against. Worse, `|q[dependent]
      - (coefficient*q[independent] + offset)|` is not defined on a 4-element quaternion slot; recovering
      the scalar from the stored unit quaternion wraps into (-pi, pi], so any |value| > pi fails the 1e-12
      check even when the write was correct — and the contract''s own gear example (coefficient 3.0 over
      a +/-6.283 independent range) reaches 18.85 rad. Symmetrically, step 3 reads "q[independent]" as
      a scalar with no rule for a ball or free independent, whose qposadr slot is 4 or 7 wide.


      (4) DETERMINISM GAP IN THE EMITTED EVIDENCE. `topological_order` and `coupling_cycle` are evidence
      fields, but no tie-break is specified. Kahn''s algorithm over a set/dict of ready nodes yields a
      different order per run and per interpreter; likewise nothing says which cycle is reported when
      several exist, nor where within a cycle the member list starts. The final qpos happens to be order-invariant
      (after conflict resolution each surviving dependent has exactly one writer), so the scores are stable
      — but the evidence is not byte-identical, which is what the determinism requirement covers.


      (5) THE SPACE OF q IS NOT PINNED, AND CLAMPING IS NOT STATED. Step 3 writes into the raw qpos array
      at m.jnt_qposadr[dependent], while coefficient/offset are contract-space quantities (the space in
      which states.closed = 0.0). If the shared write_qpos step (iv) maps a contract sample v to qpos
      = jnt_ref + v, the naive formula is wrong by coefficient*jnt_ref[ind] - jnt_ref[dep]. The URDF importer
      leaves jnt_ref = 0, so this is latent on today''s corpus and detonates on the first hand-written
      gold-standard MJCF with a nonzero ref — which section 16 says is the very next deliverable. The
      spec also never says whether the computed dependent value is clamped to m.jnt_range[dependent].


      Not defects, confirmed: m.jnt_qposadr and m.jnt_type exist in MuJoCo 3.11 with the stated (njnt,)
      shapes; nothing normalizes by a whole-asset bounding-box diagonal; mj_forward does not rewrite qpos,
      so the written sample survives to KF2''s efc_pos read; and the tautology criterion does not condemn
      the item per se, since it is declared unscored harness plumbing.'
    fix: "Rewrite the item as follows.\n\nSTEP 0 (new) — resolve and partition. Index every joint by its\
      \ position in kinematic_claims.joints (jix) and every coupling by its position in couplings (gix).\
      \ For each coupling g, resolve relation.dependent and relation.independent through the Gate's joint\
      \ binding table. Partition couplings into:\n  - APPLIED: both members resolve to a bound joint,\
      \ both have m.jnt_type in {mjJNT_HINGE, mjJNT_SLIDE}, the dependent is on no cycle, and g is the\
      \ lowest-gix coupling writing that dependent.\n  - EXCLUDED: everything else, each carrying exactly\
      \ one evidence code — coupling_unbound_member{member: \"dependent\"|\"independent\", joint_id},\
      \ coupling_nonscalar_member{member, jnt_type}, coupling_cycle{scc_members}, or coupling_dependent_conflict{dependent,\
      \ winning_gix, losing_gix}.\nFor every EXCLUDED g: do not write its dependent, hold that joint at\
      \ ref_j, hand KF2 bound(g) = false, and mark N/A every KF3 predicate that reads a body whose pose\
      \ depends on that joint. Define ref_j explicitly as m.jnt_ref[j] clamped into m.jnt_range[j] when\
      \ m.jnt_limited[j], so the code has no decision to make. State the propagation rule: a dependent\
      \ whose independent is held at ref_j but which is itself APPLIED still gets written from the held\
      \ value, stays on the manifold, and remains scored — only the held joints themselves and predicates\
      \ reading them go N/A.\n\nSTEP 1/2 — deterministic ordering. Build the edge independent -> dependent\
      \ over APPLIED-candidate couplings only. Run Tarjan SCC; every SCC of size >= 2, plus any self-loop,\
      \ is a cycle. Emit cycles as a list sorted by minimum member jix, each member list sorted ascending\
      \ by jix. Topologically order the acyclic remainder with Kahn's algorithm driven by a min-heap keyed\
      \ by jix, and emit topological_order as that exact sequence of joint ids. This makes topological_order\
      \ and coupling_cycle byte-identical run to run.\n\nSTEP 3 — the write, with the space stated. Fix\
      \ one convention in the spec text and use it in both the driven write and here. Recommended: qpos\
      \ is contract space, i.e. write_qpos step (iv) stores the contract value directly and KF1 audits\
      \ jnt_ref separately; then q[dependent] = coefficient * q[independent] + offset, written unclamped\
      \ to m.jnt_qposadr[dependent]. If instead step (iv) applies the ref offset, the formula must read\
      \ qpos[dep] = m.jnt_ref[dep] + coefficient * (qpos[ind] - m.jnt_ref[ind]) + offset. Add one sentence:\
      \ the value is written UNCLAMPED — clamping to m.jnt_range[dependent] would move the sample off\
      \ the coupling manifold and make KF2's residual uninterpretable; any resulting limit violation appears\
      \ in efc as mjCNSTR_LIMIT_JOINT rows, which KF2's mjCNSTR_EQUALITY filter already skips. Delete\
      \ the ball ladder entirely.\n\nPASS CONDITION — replace with something that can actually catch a\
      \ bug. Assert, over the APPLIED set only:\n  (a) for every g in APPLIED, |qpos[qposadr[dep]] - (coefficient\
      \ * qpos[qposadr[ind]] + offset)| <= 1e-12;\n  (b) every dependent of an APPLIED coupling is written\
      \ exactly once per sample, and the written set is disjoint from the driven set (re-verifies A6 against\
      \ the actual model binding rather than against the contract text);\n  (c) the value at every APPLIED\
      \ dependent's qposadr is unchanged by the subsequent mj_forward (catches an accidental mj_step or\
      \ quaternion renormalisation slipping into the sweep loop).\nState that (a) is vacuously satisfied\
      \ when APPLIED is empty and that EXCLUDED couplings are never asserted on, only reported.\n\nN/A\
      \ CONDITION — broaden from \"couplings == []\" to \"APPLIED == [] and EXCLUDED == []\", i.e. the\
      \ contract declares no couplings. When couplings is non-empty but APPLIED is empty (nothing resolvable),\
      \ the step writes nothing yet must still emit the full EXCLUDED evidence list and the corresponding\
      \ KF2 bound(g)=false records — that is a scored zero for KF2, not an N/A.\n\nEVIDENCE — add jnt_type\
      \ of both members, resolved MuJoCo joint ids, coupling_unbound_member, coupling_nonscalar_member,\
      \ the applied/excluded partition, and the qpos-space convention tag alongside the fields already\
      \ listed."
- item: KF3.sweep.layer1_scan
  lens: kf3
  verdict:
    sound: false
    problem: 'Three defects, one of which silently manufactures the exact failure mode KF3 is supposed
      to detect.


      (1) BALL/FREE DOFs are undefined and fail SILENTLY, producing a frozen part. Revised P0 admits `type:
      ball` and `type: free` in `joints[]` (A10 lists slide/ball/free for the null-anchor rule; A11 explicitly
      pairs `hinge/ball ↔ rad` units), and A5 only requires that every `independent_dofs` ID appear in
      `joints` — nothing forbids a ball DOF from being driven. Step 2 says "(hinge/slide only)" but steps
      1/4 still write a SCALAR `x_j = q_k` at `m.jnt_qposadr[j]`, which for a ball joint is the quaternion''s
      w slot (4 qpos entries) and for a free joint the x slot (7 entries). Measured: writing scalars over
      [-3.14, 3.14] into a ball address gives qpos = [q,0,0,0]; mj_kinematics normalizes internally to
      ±[1,0,0,0], so `xquat` is the IDENTITY and `geom_xpos` is bit-identical at every one of the 33 grid
      points. The harness would sweep a ball DOF, see the child geometry never move, and charge the asset
      with a fake joint. There is no error, no exception, no evidence field. Step 2 is also wrong for
      ball: `m.qpos0[m.jnt_qposadr[ball]]` is 1.0 (quaternion w), and for a gear-style range like [-6.283,
      6.283] the rule `lo < 1.0 < hi` fires and inserts 1.0 as a bogus 34th "angle".


      (2) The grid is built purely from the DECLARED interval and never consults `m.jnt_range`, yet step
      6 feeds every sample to the collision predicates. Measured: with only mj_kinematics/mj_forward there
      is no clamping — q = 5.0 written into a joint whose jnt_range is [0, 0.5] is used verbatim by FK.
      So an asset whose joint limit is correctly narrower than the contract''s declared travel gets driven
      into poses it forbids, and the resulting interpenetration is charged as a KF3 forbidden-contact
      failure. That double-charges a single contract/asset mismatch already scored by KF1 and turns S_collision
      into a proxy for the range claim. No evidence field records which samples were out of the model''s
      own limits.


      (3) The reverse pass is provably incapable of differing, but its samples are still scored. mj_kinematics
      is a pure function of qpos; measured, a stateful reverse pass with no mj_resetData yields geom_xpos
      bitwise identical to the fresh-reset forward pass at all 33 points. Since step 6 says "Collision
      predicates read all samples of all layers," every layer-1 q is evaluated twice with mj_geomDistance
      (the dominant cost) for zero information, and layer-1 forward samples carry double weight in any
      per-sample collision aggregate relative to layers 2/3.


      Minor, but they violate "no further decisions": `p0_inputs` names `kinematic_claims.independent_dofs`,
      a path that does not exist in the revised P0 (it is top-level `independent_dofs`; there is no `kinematic_claims`
      object). `lo_j`/`hi_j`/`span_j` are never bound to `range.min`/`range.max` (`range` is `{unit, min,
      max}`), with no stated handling of an A11 unit mismatch. The claim asserts "all other joints at
      their reference" but this item never defines "reference" (qpos0? range.min? states.closed?) — for
      URDF assets qpos0 is always 0 for hinge/slide, which may lie outside a declared range like [0.1,
      0.5], and the choice materially changes every collision result. The 1e-12 dedup threshold is a scale-blind
      absolute on values that may be metres or radians. And `pass_condition`''s "strictly increasing"
      aborts the harness when span_j == 0, which is only safe if `declared_travel_zero` is guaranteed
      to exclude every zero-span DOF — an unstated hard dependency.'
    fix: '(1) Gate layer 1 on scalar DOFs. Before step 1, resolve the bound MuJoCo joint index and require
      `m.jnt_type[j] in {mjJNT_HINGE (3), mjJNT_SLIDE (2)}`. If `m.jnt_type[j] in {mjJNT_BALL (1), mjJNT_FREE
      (0)}`, emit no layer-1 block, set every motion predicate for that DOF to N/A with reason `dof_not_scalar`,
      and add evidence fields `mj_jnt_type`, `n_qpos_of_dof`. Add a hard harness assertion in write_qpos:
      a scalar may be written at `m.jnt_qposadr[j]` only when `m.jnt_type[j] >= 2`; otherwise raise, never
      write. If ball DOFs must be swept later, define the mapping explicitly — `qpos[adr:adr+4] = [cos(q_k/2),
      a*sin(q_k/2)]` with `a` the KF1-resolved unit axis — and never reuse the scalar path. Free joints
      stay permanently N/A (A11 defines no range unit for them).


      (2) Keep sweeping the declared interval (so a truncated range is not rewarded) but tag every sample.
      Add per-sample boolean `outside_model_jnt_range = m.jnt_limited[j] and (q_k < m.jnt_range[j,0] -
      1e-9 or q_k > m.jnt_range[j,1] + 1e-9)`, and add `model_range_lo`, `model_range_hi`, `n_samples_outside_model_range`
      to this item''s evidence. Amend step 6: collision predicates evaluate all samples, but a forbidden-penetration
      violation whose failing samples are ALL flagged `outside_model_jnt_range` is reported as `collision_fail_outside_model_range`
      and excluded from S_collision — the range mismatch is scored once, by KF1.


      (3) Remove reverse-pass samples from the scored set. Amend step 6 to "Collision predicates read
      only the FORWARD-pass samples of all layers." Since mj_kinematics is stateless, the reverse pass
      can only ever detect impurity in write_qpos itself, so either (a) state that condition explicitly
      and keep the reverse pass unscored and diagnostic-only, or (b) delete the reverse pass and replace
      KF3.sweep.determinism with a cheaper equivalent: re-execute the layer-1 forward pass in a freshly
      allocated mjData and require bitwise equality of `d.qpos`, `d.geom_xpos`, `d.geom_xmat`, `d.xanchor`,
      `d.xaxis` at every k.


      Minor fixes: change `p0_inputs` to `independent_dofs, joints[].range, joints[].type`; define `lo_j
      = joints[j].range.min`, `hi_j = joints[j].range.max`, `span_j = hi_j - lo_j`, and state that MuJoCo
      qpos is always SI (m for slide, rad for hinge) so `range.unit` is used only for the A11 consistency
      assertion, which aborts on mismatch rather than converting. Define "reference" in this item, or
      cite the sibling item that does, and record the chosen ref value per DOF in the evidence. Replace
      the 1e-12 dedup threshold with `1e-9 * max(1, span_j)`. State the `declared_travel_zero` dependency
      explicitly in `na_condition`: "span_j == 0 must have been excluded by declared_travel_zero; if a
      zero-span DOF reaches layer 1 the harness aborts rather than emitting a degenerate grid."'
- item: KF3.sweep.determinism
  lens: kf3
  verdict:
    sound: false
    problem: 'Field/shape computability is fine (verified: d.xanchor (njnt,3), d.xaxis (njnt,3), d.geom_xpos
      (ngeom,3), d.geom_xmat (ngeom,9); no invented API; no whole-asset-diagonal normalization). Everything
      else fails.


      1. THE STATED TEETH DO NOT EXIST FOR THE BUG CLASS IT NAMES. Verified in t1.py: with a two-joint
      model swept over 9 samples, a harness that NEVER writes the dependent address ("a forgotten dependent"
      — the item''s own headline example) produces a reverse pass that is bit-identical at every sample,
      i.e. DETECTED = False. Only a stale value that VARIES along the sweep (a lagged dependent) is caught
      (DETECTED = True). A never-written address is constant, so it cancels in both traversal directions.
      The rationale in the algorithm field is factually wrong.


      2. "A MISMATCH IS A HARNESS FAULT AND NEVER AN ASSET DEFECT" IS FALSE. Verified in t2.py: under
      a stateful pass, any input-dependent branch that skips a qpos write — a declared coupling relation
      that is non-finite/undefined at some sample, a clamp, a guard — leaves a neighbour''s value in place,
      and the neighbour differs forward vs reverse. Sample 4 mismatched with zero harness coding error;
      the cause was the P0 coupling relation. Combined with "ABORTS the asset''s KF3 evaluation ... no
      score is emitted", this silently deletes from KF3''s denominator exactly the assets with pathological
      couplings, and mislabels an asset/P0 data defect as harness_nondeterminism. (Note mj_forward does
      NOT sanitize this for you: with qpos[0]=NaN it left qpos unchanged and raised no mjWARN_BADQPOS,
      count 0.)


      3. "STATEFUL" IS NEVER OPERATIONALLY DEFINED, so the item does not meet the "no further decisions"
      bar and is not deterministic across implementations. Reading (a), rewrite every qpos address each
      sample: verified bit-identical always (t1.py, "correct harness, reverse bit-identical: True") —
      a pure tautology that contributes nothing and doubles the FK cost of the whole layer-1 sweep. Reading
      (b), partial rewrite: has teeth only because the harness is deliberately written with the bug it
      is meant to detect. The spec fixes neither which addresses are written per sample, nor whether mjData
      is reset, nor whether mj_forward or mj_kinematics is called, nor whether dependents are recomputed
      or reused.


      4. THE GRID IS NOT PINNED, WHICH MAKES UNIVERSAL FALSE ABORTS LIKELY. "recompute the signature at
      the same q" does not require q_k to be materialized once. Verified in t3.py: an accumulated grid
      (q += step forward, q -= step backward) is bit-different at indices 0,1,2 of 9. Under memcmp that
      aborts EVERY asset with harness_nondeterminism.


      5. EVIDENCE FIELDS ARE ORDER-DEPENDENT. The signature is "the union of all G_p and all M_j" with
      no ordering rule. This does not change pass/fail (same order both passes) but first_mismatching_field
      and mismatching_geom_or_joint_id are defined by "first", so a Python set gives an arbitrary answer
      (t3.py: list({7,3,11,1}) -> [3,1,11,7], not sorted).


      6. N/A AND INPUTS ARE WRONG. "d == 0" reuses the symbol d that mj_inputs already binds to mjData;
      unreadable as written. Missing N/A: if G_p union M_j is empty the signature is zero bytes and memcmp
      is trivially equal, which is scored as pass rather than N/A. p0_inputs "none" is wrong — G_p needs
      the P0 part list plus the Gate part->body binding, and "every driven joint" needs P0 independent_dofs.


      7. Dead/incorrect justification: "a ball joint written with the wrong stride" cannot occur — URDF
      yields only hinge and slide here, so nq stride is always 1. And "mjData carries no state that influences
      mj_kinematics other than qpos" is not strictly true (mocap_pos/mocap_quat drive mocap-body poses),
      though URDF assets have no mocap bodies.'
    fix: "Delete KF3.sweep.determinism from the per-asset pipeline and replace it with two things.\n\n\
      A. MOVE THE REVERSE TRAVERSAL TO THE HARNESS UNIT-TEST SUITE, not the asset loop. It is a test of\
      \ code, so run it once on synthetic fixtures with deliberately injected qpos-write bugs (lagged\
      \ dependent, unrestored reference), assert the mismatch is raised, and never spend a second full\
      \ layer-1 traversal per asset for a check that is excluded from every denominator.\n\nB. IN THE\
      \ ASSET LOOP, KEEP A CHEAP O(1) WRITE-COMPLETENESS ASSERTION THAT ACTUALLY CATCHES THE NAMED BUG.\
      \ Define, once per asset, the full write-set W = every qpos address of every joint that is driven,\
      \ dependent, or held (union over all joints in the asset; addresses via m.jnt_qposadr and the joint's\
      \ nq). Materialize the sweep grid ONCE as Q[k] (float64 array, np.linspace over the frozen range)\
      \ and index it; never accumulate. Then before each mj_forward at sample k:\n  1. build q_target\
      \ = Q[k] for driven addresses, the coupling-derived value for dependents, the frozen reference for\
      \ held addresses, over ALL of W;\n  2. assert every address in W was assigned this sample (per-sample\
      \ boolean mask sized nq, reset to False at the top of each sample);\n  3. assert np.isfinite(q_target).all();\n\
      \  4. assert d.qpos[W].tobytes() == q_target[W].tobytes() after the write.\nThis catches the never-written\
      \ dependent (which the reverse pass provably does not), costs nothing, and needs no second traversal.\n\
      \nC. FIX THE ATTRIBUTION. A violation of B.2 or B.4 is a code bug: raise a hard exception that fails\
      \ the whole run, do not drop one asset. A violation of B.3 — a declared coupling relation producing\
      \ a non-finite dependent — is an ASSET/P0 defect: route it to the KF2 bound(g) = 0 path (per the\
      \ revised P0's binding factor) with evidence {joint_id, grid_index, relation, value}, never to harness_nondeterminism.\
      \ No asset may ever be silently removed from the KF3 denominator by this item.\n\nD. IF THE REVERSE\
      \ PASS IS KEPT ANYWAY, it must additionally specify, verbatim: signature field order fixed as geom_xpos,\
      \ geom_xmat, xanchor, xaxis; geom ids sorted ascending, joint ids sorted ascending (sorted(), never\
      \ set iteration); arrays taken as np.ascontiguousarray(...).tobytes(); the same materialized Q[k]\
      \ used by both passes; mjData never reset between samples; mj_forward (not mj_kinematics) called\
      \ once per sample; and the exact per-sample write-set. Rewrite na_condition as \"n_independent_dofs\
      \ == 0, or the joint has no layer-1 block, or G_p union M_j is empty\" (rename the symbol d — it\
      \ collides with mjData). Set p0_inputs to independent_dofs plus the Gate part->body binding, not\
      \ \"none\". Drop the ball-joint-stride justification."
- item: KF3.sweep.layer2_pair_grid
  lens: kf3
  verdict:
    sound: false
    problem: "The adjacency gate tests the wrong pair of sets, so it skips exactly the interactions the\
      \ claim promises to cover. Plus a dead clause, a non-deterministic evidence field, two unvalued\
      \ thresholds, and unhandled degeneracies.\n\n=== 1. FATAL: adjacency is decided between M_j and\
      \ M_k, but the interactions at stake are between MOVED sets and third parts ===\nStep 1 builds SA_j\
      \ from M_j, the RIGID set of DOF j (cited helper is KF3.helper.rigid_sets). The relative pose of\
      \ a declared contact pair (P,Q) depends on both q_j and q_k whenever P is in moved(j) and Q is in\
      \ moved(k) -- where moved(j) is the FULL descendant subtree of joint j plus every body driven through\
      \ a coupling by q_j. moved(j) is strictly larger than M_j: everything below the next joint down\
      \ is in moved(j) but not in M_j. Testing SA_j vs SA_k therefore answers \"can the two directly driven\
      \ links meet?\", which is a different question from \"does any evaluated contact pair depend on\
      \ both DOFs?\".\n\nBuilt and measured the counterexample in MuJoCo (script at /private/tmp/claude-501/-Users-wanglin-Projects-Articraft--claude-worktrees-evo-articraft-verifier-856ef5/b56010b7-3646-4c78-939c-312f618f2b2b/scratchpad/pairgrid.py).\
      \ A SCARA-like arm: shoulder yaw at z=1.0, elbow, then a vertical drop link, then a wrist pitch\
      \ carrying a hand at z~0.3; a static obstacle sphere at (0, 0.62, 0.48). Forbidden pair = (hand,\
      \ obstacle). Implementing steps 1-3 literally:\n\n  SA[shoulder] (upper arm only)  min=[-0.050 -0.602\
      \ 0.960]  max=[0.602 0.602 1.040]  diag=1.372\n  SA[wrist]    (hand only)       min=[ 0.570 -0.030\
      \ 0.270]  max=[0.802 0.030 0.502]  diag=0.334\n  per_axis_gap = [-0.032, -0.632, +0.458]   margin\
      \ = pair_inflation_frac * 0.334\n\n  pair_inflation_frac=0.05 -> margin 0.017 -> adjacent=False\n\
      \  pair_inflation_frac=0.25 -> margin 0.084 -> adjacent=False\n  pair_inflation_frac=0.50 -> margin\
      \ 0.167 -> adjacent=False   (z gap 0.458 dwarfs any sane margin)\n\nSigned distance (mj_geomDistance)\
      \ hand<->obstacle:\n  layer-1 sweep shoulder alone: min sd = +0.0700\n  layer-1 sweep elbow alone:\
      \    min sd = +0.7436\n  layer-1 sweep wrist alone:    min sd = +0.7404\n  9x9 grid (shoulder,elbow)\
      \  [adjacent=True, sampled]: min sd = +0.0700\n  9x9 grid (elbow,wrist)     [adjacent=True, sampled]:\
      \ min sd = +0.7325\n  9x9 grid (shoulder,wrist)  [adjacent=False, SKIPPED]: min sd = -0.0945  <--\
      \ 94 mm penetration\n\nA 94 mm penetration of a declared forbidden pair -- 94x the frozen forbidden_penetration_m\
      \ = 0.001 -- is invisible to the entire harness, and it is invisible precisely because the one pair\
      \ grid that would find it is the one the rule discards. The hand is in moved(shoulder) but not in\
      \ M_shoulder, so the gate never sees that the shoulder moves the hand. This is not a contrived pose:\
      \ it is the ordinary \"reach over and tuck under\" configuration of any 3-DOF arm, and the same\
      \ structure appears in any asset where a driven part carries a further driven part.\n\nCouplings\
      \ make it worse: for a coupled train the dependent bodies move with q_j but are outside M_j entirely,\
      \ so SA_j misses the whole output stage. Two gear trains with small far-apart input gears would\
      \ be judged non-adjacent while their coupled output arms sweep through each other.\n\n=== 2. The\
      \ nested_subtree adjacency reason is dead code ===\n\"(j,k) is adjacent unconditionally ... if the\
      \ child body of one lies in the rigid subtree of the other.\" A rigid subtree admits only descendants\
      \ with body_jntnum==0, and every joint's child body has body_jntnum>=1 (verified: body_jntnum=[0,1,1],\
      \ jnt_bodyid=[1,2] for a two-hinge chain). So a nested joint's child body is NEVER in an ancestor\
      \ joint's rigid subtree. The clause can only fire when two joints sit on the SAME body -- in which\
      \ case M_j==M_k and \"shared_geoms\" already fires. From URDF this is impossible anyway (one joint\
      \ per body). An engineer will implement a graph test that always returns false and believe nesting\
      \ is handled; it is not, and the case it was meant to cover is the very one finding 1 shows is missed.\n\
      \n=== 3. adjacency_reason is not a function of the inputs ===\nEvidence declares adjacency_reason\
      \ as a single value from (aabb | shared_geoms | nested_subtree), but the three conditions routinely\
      \ hold simultaneously (two rigid sets that share geoms also have overlapping AABBs). No precedence\
      \ is given, so the emitted evidence depends on the author's if/elif order. Violates the byte-identical\
      \ requirement for the certificate.\n\n=== 4. Two thresholds with no values and no home ===\npair_inflation_frac\
      \ and pair_grid_max are named but never valued, and neither appears in P0's frozen tolerances block,\
      \ which R3 requires to carry every threshold and A12 requires to be complete. The engineer must\
      \ invent both numbers -- the exact failure mode P0 revision #11 exists to prevent (\"13 unnamed\
      \ thresholds silently decided by whoever wrote the code\"). margin also has no absolute floor: min(diag)\
      \ is deliberately chosen, so a 3 cm knob paired with a 1.4 m door yields margin = 0.05 * 0.03 =\
      \ 1.5 mm, and adjacency becomes a knife-edge float comparison exactly where the parts are small.\n\
      \n=== 5. Degeneracies unhandled ===\n(a) mjGEOM_PLANE gets geom_aabb = center (0,0,-5e9), half-extent\
      \ (1e10,1e10,5e9) (verified, mjMAXVAL=1e10). One plane in a moved set makes diag(SA) ~ 3.5e10 and\
      \ every pair adjacent with an astronomical margin. m.geom_type is listed in mj_inputs but never\
      \ used in the algorithm -- this exclusion is where it belongs. URDF assets carry no planes, but\
      \ a harness-added ground plane or any mjGEOM_HFIELD would poison it.\n(b) A moved set with zero\
      \ geoms leaves SA_j undefined (inf/-inf); no rule given.\n(c) A DOF with no layer-1 samples (unresolvable\
      \ or continuous range -- URDF continuous becomes jnt_limited=0 with jnt_range=[0,0], so the declared\
      \ range is the only source) leaves SA_j undefined. The N/A condition covers only d<2 and \"no pair\
      \ adjacent\".\n(d) A zero-length range gives a single-pose SA_j -- works, but combined with (a)/(b)\
      \ the certificate denominators are undefined.\n(e) overlap_volume is 0 for every pair that is adjacent\
      \ only by margin inflation, so the cap ranking collapses into one large tie. The tie-break is specified,\
      \ so this is deterministic, but the spec never says whether vol() is of the raw or the inflated\
      \ boxes.\n\n=== 6. Ordered vs unordered pairs is ambiguous ===\nStep 2 says \"the ordered-independent\
      \ pair (j,k)\"; step 4 says \"pairs in ascending (j,k) by contract index\". Since t_a on j and t_b\
      \ on k generate the same 81 joint configurations under transposition, ordered pairs double the work\
      \ and duplicate every sample. The engineer must decide.\n\n=== INCIDENTAL (not this item, but it\
      \ lands on KF3's collision half) ===\nmj_geomDistance is not reliable for box-box at certain relative\
      \ yaws. Two boxes genuinely 0.09 m apart: yaw 0.0/0.3/1.276/1.400/1.5708/3.142 all return +0.090000,\
      \ but yaw=1.473 returns exactly +0.000000. A spurious zero passes \"max penetration <= forbidden_penetration_m\"\
      \ but also spuriously SATISFIES \"min sd <= required_contact_m\", i.e. it hands a free pass to an\
      \ asset whose required stop_contact never happens. Worth a separate item: either verify the reading\
      \ with a second query at a jittered pose, or restrict distance work to convex-hull/mesh geoms."
    fix: "Rewrite the item so the gate asks the same question the grid exists to answer, and close the\
      \ five smaller holes.\n\n--- Fix 1: gate on co-dependent contact pairs, not on rigid-set proximity\
