- item: KF2.gear_transmission
  lens: kf2
  verdict:
    sound: false
    problem: "FATAL — the predicate is unreachable on the real corpus. It can never fail, for the same\
      \ class of reason that bit the team before: the quantity it tests does not survive the pipeline.\n\
      \nMEASURED (MuJoCo 3.3.7, all 546 URDFs under /Users/wanglin/Desktop/articraft-data/cache/record_materialization/*/model.urdf,\
      \ loaded with the exact stated injection — <mujoco><compiler discardvisual=\"false\" inertiafromgeom=\"\
      true\" balanceinertia=\"true\" strippath=\"false\" fusestatic=\"false\"/></mujoco> plus a dummy\
      \ <inertial> into every <link> lacking one):\n  * 546/546 loaded. **m.nu == 0 in every single one.**\
      \ Also m.neq == 0 in every single one.\n  * grep over the corpus: 0 files contain \"<transmission\"\
      , 0 contain \"<actuator\", 0 contain \"<mujoco\". 7 files contain \"<mimic\" (22 mimic tags total).\n\
      \  * MuJoCo's URDF importer creates no actuators, ever. I verified it silently discards BOTH routes:\
      \ a ROS <transmission> block naming a joint -> nu=0, no warning; and an <actuator><motor joint=\"\
      ...\" gear=\"3\"/></actuator> block placed inside the injected <mujoco> extension element -> nu=0,\
      \ no warning, no error. There is no path by which an Articraft-materialized asset reaches m.nu >\
      \ 0.\n\nConsequence: step 2 always yields A == [], so `len(A) >= 1` in step 4 is unreachable, the\
      \ predicate always returns PASS whenever it is applicable, gear_ratio_implied is always None, and\
      \ verdict=gear_transmission_only can never be emitted. The entire `deviates_from_spec` ruling —\
      \ the three-point argument about gear amnesty and the empty-set loophole — defends a branch that\
      \ cannot execute. The `can_it_fail` field is honest about MJCF and I reproduced it exactly (two\
      \ hinges + two <motor gear=\"3\"/gear=\"1\">, no equality -> nu=2, neq=0, nefc=0, writing q_large\
      \ leaves q_small at 0), but P0-revised §16 ④ flags that MJCF assets do not yet exist; every asset\
      \ the evaluator will actually see is URDF, where nu is structurally 0.\n\nWORSE — it is aimed at\
      \ the wrong mechanism. The construct that actually occurs in this corpus is URDF <mimic>, and MuJoCo\
      \ drops it too: I loaded rec_car_sunroof_cassette_bd27f7208a2246d587d1d40085481e94 (which declares\
      \ <mimic joint=\"glass_hinge\" multiplier=\"1.8\"/>) and got nu=0, neq=0, ntendon=0, nefc=0 after\
      \ mj_forward. So for the 7 assets that genuinely declare a coupling in source, KF2.bound fails,\
      \ this predicate is applicable, and it reports PASS (\"not a gear transmission\") while emitting\
      \ nothing about why bound failed. It labels zero assets correctly and adds a report field that is\
      \ constant.\n\nSECONDARY DEFECTS (each independently worth fixing):\n  (a) gear_ratio_implied is\
      \ physically meaningless. For mjTRN_JOINT, gear[a][0] scales ctrl into qfrc for that one joint;\
      \ two separate motors with gears 3 and 1 encode no joint-to-joint kinematic ratio at all. Emitting\
      \ `gear_ratio_implied=3.0` beside `declared_coefficient=3.0` invites the false reading \"ratio correct,\
      \ mechanism wrong\", when in fact nothing is coupled. The direction (d/i vs i/d) is also an unjustified\
      \ arbitrary choice.\n  (b) The claim and the algorithm disagree. The claim says \"an actuator whose\
      \ gear ratio is being used as the stand-in\"; the algorithm tests only actuator existence. A plain\
      \ <position joint=\"gear_small_spin\"/> with default gear=1 — nothing to do with any ratio — would\
      \ be stamped verdict=gear_transmission_only.\n  (c) Coverage gaps if the mjModel-side test is kept\
      \ for future MJCF: mjTRN_JOINTINPARENT (confirmed present in mjtTrn) is a joint transmission and\
      \ is not matched; and mjTRN_TENDON on a fixed tendon is the ONLY MuJoCo construct where a gear genuinely\
      \ encodes a joint-to-joint ratio, and it is excluded by the trntype filter — i.e. the filter excludes\
      \ the one true positive and includes false ones.\n  (d) mj_id2name(m, mjOBJ_ACTUATOR, a) returns\
      \ None for unnamed actuators (verified: MJCF <motor> without name -> None). The evidence field actuator_names\
      \ must serialize None rather than assume a string.\n\nCLEAN: API names and shapes are all correct\
      \ (actuator_trntype (nu,), actuator_trnid (nu,2), actuator_gear (nu,6), mjtTrn.mjTRN_JOINT == 0,\
      \ mjMINVAL == 1e-15). No whole-asset bounding-box normalization. Iteration is over range(m.nu),\
      \ so deterministic. Division guarded."
    fix: "Move the detection from mjModel to the SOURCE XML, and generalize it from \"gear transmission\"\
      \ to \"coupling declared in source but discarded by the importer\" — the failure mode that actually\
      \ exists.\n\nRename the item: KF2.declared_but_dropped (verdict values below). Keep it a non-scoring\
      \ label attached to a KF2.bound failure, as the original intends.\n\nINPUTS. P0: kinematic_claims.couplings[g].relation.{dependent,\
      \ independent, coefficient, offset}. Gate: the URDF joint-name strings that jd and ji were bound\
      \ to (KF2.bound STEP B must expose the source-level joint NAMES, not only mjModel joint ids — add\
      \ that to KF2.bound's emitted result; the name is required because the constructs being searched\
      \ for do not exist in mjModel). Plus the raw pre-injection URDF text path.\n\nALGORITHM.\n1. Run\
      \ KF2.bound. If it is N/A, this is N/A (same reasons). If it passed, this is N/A.\n2. Parse the\
      \ ORIGINAL URDF with xml.etree.ElementTree (the pre-injection text, so the pipeline's own <mujoco>\
      \ block is not confused with a generator-authored one). Let Jd, Ji be the source joint-name strings\
      \ for jd, ji.\n3. Collect source-level evidence, in this fixed order, deterministically:\n   - S_mimic\
      \ = [(j.get('name'), mim.get('joint'), mim.get('multiplier', '1.0'), mim.get('offset', '0.0'))\n\
      \                for j in root.findall('joint') for mim in j.findall('mimic')\n                if\
      \ j.get('name') in (Jd, Ji) or mim.get('joint') in (Jd, Ji)]\n   - S_trans = [(t.get('name'), jt.get('name'))\
      \ for t in root.findall('transmission') for jt in t.findall('joint')\n                if jt.get('name')\
      \ in (Jd, Ji)]\n   - S_mjact = every <actuator>/* element under any <mujoco> child of <robot>, whose\
      \ joint attribute is in (Jd, Ji), with its gear attribute.\n   Iterate document order only; no sets,\
      \ no dicts.\n4. Verdict, first match wins, in this fixed precedence:\n   - S_mimic non-empty ->\
      \ verdict = coupling_declared_via_urdf_mimic_dropped_by_importer. This is the real case: MuJoCo\
      \ 3.x silently discards <mimic>, so neq=0 and bound is guaranteed false. Emit mimic_multiplier and\
      \ mimic_offset — these ARE directly comparable to declared coefficient/offset (polycoef semantics\
      \ q_dep = offset + mult*q_indep), so also emit coefficient_matches = (abs(float(mult) - coefficient)\
      \ <= 1e-6) as evidence only.\n   - else S_trans non-empty -> verdict = coupling_declared_via_urdf_transmission_dropped_by_importer.\n\
      \   - else S_mjact non-empty -> verdict = coupling_declared_via_mjcf_actuator_gear.\n   - else if\
      \ m.nu > 0 and an actuator targets jd or ji (keep the original mjModel scan, but widen trntype to\
      \ (mjTRN_JOINT, mjTRN_JOINTINPARENT), and separately scan mjTRN_TENDON actuators whose fixed tendon\
      \ wraps jd or ji via m.tendon_adr/m.tendon_num/m.wrap_type==mjWRAP_JOINT/m.wrap_objid) -> verdict\
      \ = actuation_only_no_position_constraint.\n   - else -> verdict = no_mechanism_declared_anywhere.\
      \ This is the majority case and is the informative one: the generator wrote nothing at all.\n5.\
      \ PASS iff verdict == no_mechanism_declared_anywhere is FALSE... no: keep it a pure label. Do not\
      \ emit pass/fail at all; emit only `verdict` plus evidence. That removes the current contradiction\
      \ between having a pass_condition and declaring \"does not alter the score\".\n\nDELETE gear_ratio_implied\
      \ entirely. Replace with `actuator_gear_col0_by_joint`: a list of (joint_name, gear[a][0]) pairs,\
      \ in ascending actuator-id order, with no ratio computed and no adjacency to declared_coefficient.\
      \ Rationale: gear scales ctrl into force for one joint; a ratio between two independent motors'\
      \ gears is not a kinematic quantity. If you want a genuine ratio, compute it only in the mjTRN_TENDON\
      \ branch, from the fixed tendon's joint coefs (m.wrap_prm for wrap_type==mjWRAP_JOINT), which is\
      \ where MuJoCo really encodes a joint-to-joint ratio.\n\nEVIDENCE (final): coupling_id, source_joint_names=[Jd,\
      \ Ji], verdict, mimic_records=S_mimic, mimic_multiplier, mimic_offset, coefficient_matches, transmission_records=S_trans,\
      \ mjcf_actuator_records=S_mjact, actuator_ids, actuator_names (may contain null — mj_id2name returns\
      \ None for unnamed actuators), actuator_trntype_names, actuator_gear_col0_by_joint, declared_coefficient,\
      \ declared_offset.\n\nDEGENERACY: m.nu == 0 -> no mjModel branch runs, source branches still do\
      \ (this is the fix). Jd == Ji (malformed contract) -> record once, deduplicate by document order,\
      \ and add verdict = degenerate_self_coupling. Unnamed source joints -> N/A with reason unbindable_joint_name,\
      \ matching KF2.bound. Multiple mimic tags on the same joint (the louver asset has 7 pointing at\
      \ one leader) -> keep all, verdict is unchanged.\n\nKEEP the existing ruling that this scores 0\
      \ via bound=False rather than N/A — the measurement supports it even more strongly than the item\
      \ argues: <mimic> declares the relation in source and MuJoCo produces neq=0, nefc=0, so the relation\
      \ is factually absent at the position level regardless of intent.\n\nVALIDATION BEFORE FREEZE: run\
      \ the new item over the 7 mimic assets (grep -l \"<mimic\" */model.urdf under /Users/wanglin/Desktop/articraft-data/cache/record_materialization/).\
      \ It must emit coupling_declared_via_urdf_mimic_dropped_by_importer for each, and must emit no_mechanism_declared_anywhere\
      \ for a coupling claim on any of the other 539. If it emits a constant across all 546, it is still\
      \ dead and must be cut rather than shipped."
- item: KF2.coefficient
  lens: kf2
  verdict:
    sound: false
    problem: 'The core mapping is correct — I reproduced every measured claim on a live MuJoCo build (mjNEQDATA=11,
      eq_data shape (neq,11) with col 10 = 1.0, mjMINVAL=1e-15; mjEQ_JOINT efc_pos = (q1-qpos0_1) - SUM
      a_k (q2-qpos0_2)^k gave exactly 0.0 at (3.5,1.25) and 0.25 at (3,1); fixed-tendon ten_length is
      absolute (-0.25 at qpos0, not 0); mjEQ_TENDON efc_pos = (len - tendon_length0) - a0; equality/joint
      rejects ball and free with "only HINGE and SLIDE joint allowed in constraint", so jnt_qposadr scalar
      indexing is safe). All three mainline branches reproduce zero residual on their own derived manifold
      to 1e-15: direct eq_joint -> c=3.000000000, swapped polycoef 0.3333333 -> c=3.000000300 (rel_err
      1e-7, passes), eq_tendon coefs 1/-3 -> c=+3.0 with the sign convention as written. It is not a tautology
      (polycoef "0 2 0 0 0" against declared 3.0 gives rel_err 0.333), it normalizes only by |c| (no whole-asset
      diagonal), and the aggregation deviation is justified: I reproduced the residual slope exactly (efc_pos
      = 0, 0.5, 1.0, 2.0 at q_ind = 0, 0.5, 1.0, 2.0, slope = c - c_model = 1). Three holes remain.


      (1) DECISIVE — unspecified tie-break in step 4 that produces a verified FALSE FAIL. MuJoCo accepts
      the SAME joint more than once in a fixed tendon; the compiler does not merge or reject them. Verified:
      <fixed><joint joint="jS" coef="1"/><joint joint="jL" coef="-1"/><joint joint="jL" coef="-2"/></fixed>
      compiles to wrap_objid [1 0 0], wrap_prm [1, -1, -2]. The member set is still exactly {jS, jL},
      so KF2.bound cannot screen it out. Step 4 says "w_i = m.wrap_prm[w] for the wrap w with m.wrap_objid[w]==ji"
      — singular, with two matching w and no tie-break. First-match yields w_i = -1 -> c_model = 1.0,
      which FAILS a correct 3:1 model (I confirmed max|efc_pos| = 10.0 on the first-match manifold and
      exactly 0.0 on the summed manifold, w_i = -3 -> c_model = 3.0). Compounding this, the algorithm
      sentence never scopes the wrap search to [tendon_adr[t], tendon_adr[t]+tendon_num[t]) nor filters
      wrap_type == mjWRAP_JOINT. Verified hazard: a spatial tendon''s wraps have wrap_type = mjWRAP_SITE(3),
      wrap_prm = 0.0, and wrap_objid holding SITE ids from a disjoint id space that can numerically equal
      a joint id — a global scan would match one and read w_d = 0.0, firing a spurious FAIL(dependent_has_zero_tendon_coefficient).


      (2) VERIFIED FALSE PASS — eq_obj2id == -1 is never checked. <joint joint1="jS" polycoef="0 3 0 0
      0"/> compiles with eq_obj2id = [-1]; MuJoCo evaluates the polynomial at 0 and enforces only q_jS
      = qpos0_jS + a0, so a[1] = 3 is dead data. Step 2''s role test is a bare two-way if/else on m.eq_obj1id[e]==jd,
      so it reads c_model = 3.0 and PASSES a model that implements no coupling at all (I measured max|efc_pos|
      = 13.5 on the true 3:1 manifold). This is precisely the "declaration-reading check carries no information"
      failure the team was already burned by, and the item guards other degeneracies (|a1| <= mjMINVAL,
      nonlinear polycoef) while leaving this one open.


      (3) The tendon_limit branch rests on a case MuJoCo forbids. P0''s own example <fixed limited="true"
      range="0 0"> does NOT compile — "Error: invalid limits in tendon". Every legal limited tendon therefore
      has a band of nonzero width, and inside that band MuJoCo instantiates NO constraint row at all (verified:
      nefc = 0, efc_pos empty for range "-0.001 0.001" and "0 0.5" at interior qpos; a row of efc_type
      mjCNSTR_LIMIT_TENDON appears only outside). So for kind == tendon_limit the algorithm can report
      c_model = 3.0 and PASS on a model where the two joints are in fact free — falsifying the item''s
      own claim wording, "the coefficient the bound constraint actually enforces". The unconditional L_target
      = midpoint that the item hands to KF2.offset is likewise a fiction for any band wider than the tolerance.


      Minor: the pass_condition contradicts itself at c == 0 — clause 1 gives |c_model| <= 0.02 * 1e-9
      = 2e-11 while clause 2 gives |c_model| <= 0.02; and evidence emits rel_err = |c_model|/1e-9 (~1e9
      * c_model) while the decision uses abs_err. Also tolerances.coupling_coefficient_rel is absent from
      P0 section 12''s tolerances block, which admission check A12 requires to be complete and hashed
      before generation — it cannot ship as a code-side default.'
    fix: "(1) Replace step 4's wrap lookup with a scoped, type-filtered SUM, and reject non-two-joint\
      \ tendons:\n  t = tendon index from KF2.bound; adr = m.tendon_adr[t]; num = m.tendon_num[t]\n  W\
      \ = [w for w in range(adr, adr+num)]\n  If any w in W has m.wrap_type[w] != mjWRAP_JOINT -> N/A(tendon_not_fixed_joint_tendon).\n\
      \  If any w in W has m.wrap_objid[w] not in {jd, ji} -> N/A(tendon_has_extra_joint_members), emitting\
      \ the full member list; a three-joint tendon enforces no two-joint ratio.\n  w_d = sum(m.wrap_prm[w]\
      \ for w in W if m.wrap_objid[w] == jd)\n  w_i = sum(m.wrap_prm[w] for w in W if m.wrap_objid[w]\
      \ == ji)\n  Never index a single wrap. Add wrap_indices=[...] and n_wraps_dep / n_wraps_ind to the\
      \ evidence block so a duplicated member is visible in the report. (Verified: summing gives c_model\
      \ = 3.0 with max|efc_pos| = 0.0 on the derived manifold; first-match gives 1.0 with 10.0.)\n\n(2)\
      \ Insert a member-arity guard as step 1b, before any polycoef is read:\n  If kind in {eq_joint,\
      \ eq_tendon} and m.eq_obj2id[e] < 0: for eq_joint -> FAIL with reason single_joint_equality_pins_constant\
      \ (the model pins jd to qpos0_d + a0 and enforces no relation; a[1] is dead data and must not be\
      \ reported as c_model); for eq_tendon obj2id == -1 is legal and expected (tendon1 constrained to\
      \ a constant length) so keep it, but require m.eq_obj1id[e] == t.\n  For eq_joint additionally require\
      \ {m.eq_obj1id[e], m.eq_obj2id[e]} == {jd, ji} as a set before branching; set role_swapped = (m.eq_obj1id[e]\
      \ == ji). If jd == ji -> N/A(degenerate_self_coupling). Then steps 2 and 3 proceed unchanged (both\
      \ verified exact: direct c = a[1], b = p0d + a0 - a1*p0i; swapped c = 1/a[1], b = p0d - (p0i + a0)/a1,\
      \ each giving max|efc_pos| < 1e-15 on the derived manifold with refs 0.5/0.25 and a0 = 0.11).\n\n\
      (3) Gate the tendon_limit branch on an actually-enforcing band:\n  Require m.tendon_limited[t] ==\
      \ 1 (field confirmed present). Let width = m.tendon_range[t][1] - m.tendon_range[t][0].\n  If width\
      \ > tolerances.coupling_residual (in tendon-length units, i.e. the same units as w_d*q_dep) -> N/A(tendon_limit_band_too_wide_to_enforce_a_ratio),\
      \ emitting tendon_range and width. Only for a band at or below that width may L_target = 0.5*(lo+hi)\
      \ be used, and c_model = -w_i/w_d be claimed as enforced.\n  Also correct P0 section 14's example\
      \ XML: <fixed limited=\"true\" range=\"0 0\"> does not compile; it must be written as a narrow band,\
      \ e.g. range=\"-1e-6 1e-6\". Verify this at contract admission time (a new A13: every couplings\
      \ example must compile).\n\n(4) Restate the pass condition without the self-contradiction:\n  if\
      \ c != 0.0:  rel_err = |c_model - c| / |c|;  PASS iff rel_err <= tolerances.coupling_coefficient_rel;\
      \ emit rel_err.\n  if c == 0.0:  abs_err = |c_model|;            PASS iff abs_err <= tolerances.coupling_coefficient_rel;\
      \ emit abs_err and leave rel_err null.\n  Drop the max(|c|, 1e-9) form entirely.\n\n(5) Add coupling_coefficient_rel:\
      \ 0.02 to P0 section 12's tolerances block and to both worked examples (sections 13 and 14) so it\
      \ is inside the frozen, hashed block, rather than defaulting in code."
- item: KF2.offset
  lens: kf2
  verdict:
    sound: false
    problem: 'The b_model algebra is right (I verified `efc_pos = (c − c_model)·q_ind + (b − b_model)`
      numerically for mjEQ_JOINT, direct roles), and this is NOT a tautology — b_model comes from a0/a1/qpos0
      and is compared against a contract number, so a model can fail it. Every named array exists with
      the stated shape (eq_data is (neq,11), mjNEQDATA=11; qpos0, jnt_qposadr, wrap_prm, wrap_objid, tendon_adr,
      tendon_num, tendon_length0, tendon_range all confirmed; note `jnt_ref` does NOT exist as an mjModel
      field — ref is folded into qpos0, which the item correctly assumes). No whole-asset-diagonal normalization.
      But:


      **D1 (fatal) — the tolerance source contradicts P0-revised and makes the diagnostic disagree with
      the score it is supposed to explain.**

      The item invents `tolerances.coupling_offset_rel` (default 0.01) and hard-codes normalization by
      `dependent_range_span`. P0-revised §09 forbids exactly this in a dedicated paragraph ("归一化量要挑，别默认用行程跨度…
      齿轮的 range 常常是 ±3 圈（跨度 37.7 rad）… 对齿轮完全没有意义。所以 residual_norm 必须逐条声明"), and added `couplings[g].residual_norm.by`
      + `couplings[g].epsilon` precisely so this quantity is never normalized by span by default.

      Run it on P0''s own Example B (gear pair): span_dep = 18.850 − (−18.850) = 37.700 rad → tol_off
      = 0.01 × 37.700 = **0.377 rad ≈ 21.6°**, while the contract''s own `residual_norm: {by: absolute}`
      + `epsilon: 0.005` gives **0.005 rad ≈ 0.29°**. That is 75× looser. A model with polycoef="0.35
      3 0 0 0" PASSES KF2.offset while the KF2 residual term FAILS it by 70×. Since this item exists to
      tell the human *which* of a0/qpos0 produced a residual failure, a "PASS" verdict on the very model
      whose residual failed is worse than emitting nothing. The item''s own can_it_fail examples barely
      survive: a0=0.5 fails by only 33%, and the qpos0_dep=0.4 example fails by only 6% — both would silently
      pass if the contract writer declared ±3.5 turns instead of ±3.

      Secondary to D1: `coupling_offset_rel` appears in neither P0 §12''s frozen tolerances block nor
      either worked example, and admission check A12 tests that block for completeness — so on every contract
      that actually exists this predicate falls back to a code-side default, which is literally the failure
      R3 ("13 个未命名阈值由写代码的人默默决定") was written to eliminate.


      **D2 — the tendon binding is in scope but has no algorithm, and the one stated formula produces
      a false FAILURE on a correct model.**

      mj_inputs names tendon_adr/tendon_num/wrap_prm/wrap_objid/tendon_length0/tendon_range and evidence
      carries `binding_kind`, but the algorithm and the deviates_from_spec paragraph define b_model ONLY
      as the mjEQ_JOINT qpos0 folding. There are three distinct foldings, and they are not interchangeable
      — a fixed tendon''s length is Σ coef_i·qpos_i in ABSOLUTE qpos, with no qpos0 term at all. I built
      the correct-model case: fixed tendon coef(jB)=1, coef(jA)=−3, limited range ≈0, dependent joint
      carrying ref=0.4 → the tendon enforces q_dep = 3·q_ind + 0 exactly (ten_length = 0 at every sample,
      nefc = 0, zero violation), so b_model = 0 and b = 0 → must PASS. The item''s stated formula returns
      qpos0_dep + a0 − a1·qpos0_ind = 0.4 + 0 − 3·0 = **0.4** → FAIL, and step 6''s evidence then points
      the human at qpos0_dep, a number that has no bearing on what the tendon enforces. Two further tendon
      facts the spec must absorb: (a) P0 §09''s own model-side tendon example `range="0 0"` **does not
      compile** — MuJoCo rejects it with "invalid limits in tendon"; a limited fixed tendon needs r0 <
      r1, so what it enforces is an interval [r0/coef_dep, r1/coef_dep], not a point, and its efc rows
      are mjCNSTR_LIMIT_TENDON (type 4), never mjCNSTR_EQUALITY (type 0); (b) the compiling form is `<equality><tendon
      tendon1="t"/></equality>` (mjEQ_TENDON, eq_type 3), whose residual is tendon_length0-relative, giving
      yet a third folding. Also `m.wrap_type` is missing from mj_inputs — without it you cannot tell a
      fixed tendon''s joint wraps from a spatial tendon''s site/geom wraps.


      **D3 — the swapped-roles branch is wrong in two places.**

      (a) The claim "the offset error is exactly the residual evaluated at the reference sample" — the
      whole justification for making this diagnostic-only — is false for swapped roles. I measured: residual(q_ind=0)
      = **−a1·(b − b_model)**, i.e. scaled by a1 and expressed in the INDEPENDENT joint''s units. With
      a1 = 1/3 the residual is 0.300 while the offset error is 0.900 — a 3× gap, and it goes the dangerous
      direction (the residual looks smaller than the error) whenever |a1| < 1.

      (b) "non-invertible polycoef" is never given a numeric threshold, so the branch divides by a1 with
      no guard: polycoef="0 1e-9 0 0 0" is not exactly zero, is not N/A, and yields b_model ≈ 1e9 — an
      absurd evidence number with no defined behavior. Nothing in the item states how direct-vs-swapped
      is decided either (it must be by comparing eq_obj1id/eq_obj2id against the Gate-bound joint ids,
      never by whichever fits better — the latter is a nondeterministic tie-break).


      **Applicability note (not a soundness defect, but it voids "can_it_fail: Yes" on the real corpus).**
      The 546 measured assets are URDF. I confirmed MuJoCo''s URDF importer silently drops `<mimic joint="jA"
      multiplier="3" offset="0"/>`: the model loads with neq=0, ntendon=0, identical to a URDF that declares
      no coupling at all. So on the actual corpus bound(g) is always false → KF2.coefficient always N/A
      → KF2.offset always N/A, and a correct mimic-declaring URDF is indistinguishable from a model with
      no coupling. Every failing example given is MJCF-only.'
    fix: "**Fix D1 — delete `coupling_offset_rel`; derive the tolerance from the coupling's own frozen\
      \ normalizer, which is provably the same quantity.**\nReplace algorithm steps 3–5 and the pass_condition\
      \ with:\n\n  eps_g   = couplings[g].epsilon if present else tolerances.coupling_residual\n  scale\
      \   = 1.0                                             if residual_norm.by == absolute\n        \
      \  = |joints[dependent].range.max − .min|            if by == dependent_range_span\n          =\
      \ |joints[independent].range.max − .min|          if by == independent_range_span\n  gain    = 1.0\
      \                                             if roles are direct\n          = |a1|            \
      \                                if roles are swapped   (see D3a)\n  tol_off = eps_g * scale / gain\n\
      \n  PASS iff |b_model − b| <= tol_off\n\nThis makes the diagnostic agree with the KF2 residual term\
      \ by construction (residual at the reference sample = gain × offset error), which is the property\
      \ the item asserts but does not currently deliver. Remove `tolerances.coupling_offset_rel` from\
      \ p0_inputs entirely — no new key, no code-side default, R3 satisfied. Change `tolerance_key` in\
      \ evidence to the pair ('coupling_residual' or 'couplings[g].epsilon', residual_norm.by) and add\
      \ `eps_g`, `norm_by`, `scale`, `gain`. Add N/A when `residual_norm.unit != joints[dependent].range.unit`\
      \ (na_reason='residual_norm_unit_mismatch'). Restrict the span_dep==0 N/A to the case `by == dependent_range_span`\
      \ only (na_reason='dependent_span_zero') and add the symmetric `independent_span_zero`; when by\
      \ == absolute, span is irrelevant and the predicate must still be evaluated. On P0 Example B this\
      \ yields tol_off = 0.005 rad, and the a0=0.35 model that currently passes now fails, agreeing with\
      \ its own residual.\n\n**Fix D2 — state all three b_model foldings explicitly, keyed by binding_kind,\
      \ or declare tendons out of scope.**\nAdd to the algorithm (coef_dep, coef_ind read from wrap_prm\
      \ at the wrap indices whose wrap_objid matches the bound joint ids, restricted to entries with wrap_type\
      \ == mjWRAP_JOINT, over wrap slots [tendon_adr[t], tendon_adr[t]+tendon_num[t])):\n\n  binding_kind\
      \ == eq_joint,   direct:   c_model = a1,                 b_model = qpos0_dep + a0 − a1·qpos0_ind\n\
      \  binding_kind == eq_joint,   swapped:  c_model = 1/a1,               b_model = qpos0_dep − (qpos0_ind\
      \ + a0)/a1\n  binding_kind == eq_tendon:            c_model = −coef_ind/coef_dep, b_model = (tendon_length0[t]\
      \ + a0)/coef_dep\n  binding_kind == tendon_limit:         c_model = −coef_ind/coef_dep, b_model\
      \ = mid(tendon_range[t])/coef_dep,\n                                        and additionally emit\
      \ b_halfwidth = (r1−r0)/(2·|coef_dep|);\n                                        PASS iff |b_model\
      \ − b| <= tol_off + b_halfwidth\n                                        (a limited tendon enforces\
      \ an interval, not a point; MuJoCo rejects range=\"0 0\")\n\nN/A with na_reason='tendon_unlimited'\
      \ when tendon_limited[t]==0 and no mjEQ_TENDON references it (nothing is enforced). Add `m.wrap_type`\
      \ and `m.tendon_limited` to mj_inputs. Make the evidence a discriminated union: `polycoef_a0`/`qpos0_dep`/`qpos0_ind`\
      \ only for eq_joint; `coef_dep`/`coef_ind`/`tendon_length0`/`tendon_range`/`b_halfwidth` only for\
      \ the tendon kinds — emitting `polycoef_a0` for a tendon binding is what sends the human to the\
      \ wrong number. Also fix P0 §09's tendon example, which does not compile; use `<tendon><fixed name=\"\
      t\"><joint joint=\"gear_small_spin\" coef=\"1\"/><joint joint=\"gear_large_spin\" coef=\"-3\"/></fixed></tendon><equality><tendon\
      \ tendon1=\"t\" polycoef=\"0 0 0 0 0\"/></equality>`.\nIf instead the team wants tendons out of\
      \ scope for this item, then say so explicitly in na_condition (na_reason='binding_kind_not_eq_joint')\
      \ and strip every tendon array from mj_inputs — but do not leave the current state, where the arrays\
      \ are listed and only one folding is written down.\n\n**Fix D3 — correct the residual-equivalence\
      \ statement and guard the division.**\n(a) Rewrite deviates_from_spec: \"residual at the reference\
      \ sample = gain × (b − b_model), where gain = 1 for direct roles and |a1| for swapped roles; the\
      \ tolerance divides by gain so the diagnostic and the score term agree in both branches.\" Do not\
      \ repeat \"exactly the residual\" unqualified.\n(b) Define non-invertible numerically: swapped roles\
      \ are N/A iff |a1| < 1e-9 (na_reason='swapped_noninvertible'); additionally N/A iff |a1| < eps_g·scale/|span_dep|\
      \ would make tol_off exceed span_dep (na_reason='swapped_illconditioned'), so an ill-conditioned\
      \ inverse cannot manufacture a pass.\n(c) State the role-assignment rule as a hard determinism requirement:\
      \ direct iff eq_obj1id == gate_joint_id[dependent] and eq_obj2id == gate_joint_id[independent];\
      \ swapped iff the reverse; any other pairing is not a binding and is decided in KF2.coefficient,\
      \ never by best fit.\n(d) Add N/A when m.jnt_type[dep] is not the type joints[dependent].type declares\
      \ (na_reason='dep_joint_type_mismatch') — otherwise a KF1 failure silently turns this into a metre-vs-radian\
      \ comparison.\n(e) Add N/A with na_reason='dependent_range_undeclared' if joints[dependent].range\
      \ is absent, so an unlimited/continuous joint cannot crash step 3.\n\n**Applicability.** Add one\
      \ line to the item: on URDF-sourced assets bound(g) is structurally always false because MuJoCo's\
      \ URDF importer drops `<mimic>` (verified: neq=0, ntendon=0), so KF2.offset reports N/A for the\
      \ entire current 546-asset corpus. Either read `<mimic multiplier=M offset=O>` from the source URDF\
      \ as a fourth binding_kind (c_model = M, b_model = O — note URDF mimic is already absolute, no qpos0\
      \ folding), or record applicable-n = 0 in the report so nobody reads the N/A as a pass. This is\
      \ the same lesson as P0 §16 ④."
- item: KF2.sign
  lens: kf2
  verdict:
    sound: false
    problem: "PRIMARY (fatal): sign(c_model) is not a property of the asset. It is a property of the generator's\
      \ free choice of joint axis polarity, which P0 explicitly declines to constrain. Revised P0 fixes\
      \ axis polarity nowhere on the path this item lives on: `semantic: vertical` is judged as \"parallel\
      \ to world z\" (unsigned), `relational` is judged by |cos theta| (the doc writes the absolute value\
      \ explicitly), `symmetry_axis_of` is a line and has no direction, and the one signed form, `axis.numeric`,\
      \ is forced to N/A whenever `canonical_frame.front` is null - which is the documented default AND\
      \ is what P0's own gear-pair example B declares. So negating a member joint's axis is a legal, KF1-passing\
      \ authoring choice, and in MuJoCo it negates q for that joint, hence negates c_model.\n\nEmpirically\
      \ confirmed (script: /private/tmp/claude-501/-Users-wanglin-Projects-Articraft--claude-worktrees-evo-articraft-verifier-856ef5/b56010b7-3646-4c78-939c-312f618f2b2b/scratchpad/gear.py\
      \ and .../fix.py, MuJoCo 3.3.7), on P0 example B's declared coefficient +3.0:\n\n  A  gear_large\
      \ axis (0,0,+1), polycoef \"0 +3 0 0 0\"  -> c_model=+3, spec PASS\n  B  gear_large axis (0,0,-1),\
      \ polycoef \"0 -3 0 0 0\"  -> c_model=-3, spec FAIL\n  C  gear_small axis (0,0,-1), polycoef \"\
      0 +3 0 0 0\"  -> c_model=+3, spec PASS\n  D  both axes (0,0,+1),       polycoef \"0 -3 0 0 0\" \
      \ -> c_model=-3, spec FAIL\n\nA and B are the same gearbox: I compared world geom_xpos of a tooth\
      \ marker on each gear at the same physical drive rotation and they are bit-identical (np.allclose\
      \ atol=1e-12 on both markers). The spec FAILS B, a correct asset, and its evidence tells the reader\
      \ \"your gear pair turns the wrong way\" about a model whose gears turn exactly as A's do. C is\
      \ physically distinct from A - the small gear's marker lands at y=-0.017955 instead of +0.017955,\
      \ i.e. it spins the opposite way - and the spec PASSES it. So the predicate is orthogonal to, and\
      \ on this pair anti-correlated with, the single failure mode its own rationale names (\"the one\
      \ failure mode a reader can act on ... a gear pair that turns the wrong way\"). Being \"diagnostic\
      \ only, not a score factor\" does not rescue it: a diagnostic that fires on correct assets and stays\
      \ silent on the defect is worse than absent, and the corpus is 545 assets of unconstrained third-party\
      \ axis conventions, so the false-failure rate is expected to be near 50 percent, not rare.\n\nSECONDARY\
      \ (each independently needs a fix):\n\n1. The tendon binding path named in mj_inputs and can_it_fail\
      \ is unreachable as documented. P0's literal example `<tendon><fixed limited=\"true\" range=\"0\
      \ 0\">` does NOT compile: MuJoCo 3.3.7 rejects it with \"Error: invalid limits in tendon\". Confirmed\
      \ in .../ten.py and .../ten2.py. A limited fixed tendon is also never an equality - it yields mjCNSTR_LIMIT_TENDON,\
      \ and with range \"-1e-6 1e-6\" at length 0 it yields neq=0 and zero efc rows at all. The form that\
      \ actually works is `<equality><tendon tendon1=\"mesh\"/></equality>` -> mjEQ_TENDON -> an mjCNSTR_EQUALITY\
      \ row.\n\n2. \"-w_i/w_d\" never says how w_i and w_d are located. m.wrap_prm / m.wrap_objid are\
      \ in XML declaration order, not joint-id order: in my test wrap_objid came back [1,0] = [jS,jL]\
      \ because jS was declared first. Unstated ordering is a determinism hazard and a silent sign inversion\
      \ if an implementer assumes joint-id order. It also never mentions slicing by tendon_adr[t] : tendon_adr[t]+tendon_num[t],\
      \ so it only works by luck on a single-tendon model.\n\n3. w_d == 0 is unguarded. -w_i/w_d raises\
      \ ZeroDivisionError on Python floats, or yields inf/nan with a RuntimeWarning on numpy floats. No\
      \ N/A branch covers it.\n\n4. c_model == 0 (e.g. polycoef \"0 0 0 0 0\") falls through the pass\
      \ condition to FAIL, but sign(0) is undefined, so the emitted evidence field sign_model is meaningless.\
      \ This is a magnitude defect KF2.coefficient already owns, not a sign defect.\n\nChecks that PASS:\
      \ not a tautology (c_model comes from the model file, c from P0 - independent). No whole-asset bbox\
      \ diagonal normalization. mjNEQDATA is 11 and eq_data[e][:5] does hold polycoef, with eq_obj1id\
      \ = joint1 = dependent and eq_obj2id = joint2 = independent, both confirmed. Role-reversed authoring\
      \ (joint1 = the independent member) gives c_model = 1/c, which preserves sign, so the predicate\
      \ is at least invariant to inversion - the one good property, but it does not rescue it. Note the\
      \ environment ships MuJoCo 3.3.7, not the 3.11 the brief asserts."
    fix: "PRIMARY FIX - replace the raw-sign comparison with a polarity-invariant relative-sense predicate.\
      \ The frame-invariant quantity is the product of the coefficient sign and the world-frame axis alignment,\
      \ because flipping either member's axis flips both factors and leaves the product unchanged.\n\n\
      Restate the claim as: \"The coupling drives the dependent part in the declared relative sense (co-rotating\
      \ vs counter-rotating), independent of the generator's axis polarity convention.\"\n\nAlgorithm:\n\
      \  1. Require c_model and the selected binding record from KF2.coefficient (same record, same tie-break;\
      \ carry binding_kind through).\n  2. If |c_model| <= 1e-9 -> N/A(coefficient_model_zero). If |c|\
      \ <= 1e-9 -> N/A(coefficient_declared_zero).\n  3. Resolve j_dep, j_indep to joint ids via the Gate\
      \ binding. If j_dep == j_indep -> N/A(self_coupling).\n  4. mj_forward at qpos0 with no stepping.\
      \ a_d = d.xaxis[j_dep], a_i = d.xaxis[j_indep] (mjData.xaxis is (njnt,3), world frame, confirmed\
      \ present in 3.3.7).\n  5. Both members must be hinge, or both slide (m.jnt_type in {mjJNT_HINGE}\
      \ or {mjJNT_SLIDE}). A mixed hinge/slide pair, or any mjJNT_BALL / mjJNT_FREE member, -> N/A(sense_undefined_for_joint_types),\
      \ because \"same/opposite\" is not defined by axes alone for a rack-and-pinion or a multi-DOF joint.\n\
      \  6. dot = float(a_d @ a_i). If |dot| < cos(radians(tolerances.axis_angle_deg)) -> N/A(axes_not_parallel):\
      \ sense is undefined for skew axes.\n  7. sense_model = sign(c_model) * sign(dot), in {-1,+1}.\n\
      \  8. Declared side: add a field `relation.sense: same | opposite` to P0's couplings schema (this\
      \ is the schema change the fix requires, and it is cheap - it is one enum an author of a gear pair\
      \ can always answer, whereas a signed coefficient in unpinned joint coordinates is one they cannot).\
      \ If `relation.sense` is absent -> N/A(sense_not_declared). Do NOT try to infer it from sign(coefficient):\
      \ that is the broken quantity.\n  9. PASS iff sense_model == (+1 if declared sense == \"same\" else\
      \ -1).\n\nVerified on the four models above: A and B (physically identical) both give sense_model\
      \ = +1; C and D (the counter-rotating pair) both give -1. The predicate now separates exactly the\
      \ physical classes and merges exactly the identical ones. This also surfaces a real bug in P0 example\
      \ B, which should be reported back: it declares coefficient +3.0 with both axes \"vertical\", i.e.\
      \ sense = same, i.e. co-rotating - which is not how an external gear mesh behaves. The intended\
      \ mesh is sense: opposite.\n\nFALLBACK if the P0 schema cannot be changed - keep the literal sign\
      \ comparison but gate it on the only condition under which the declared sign is meaningful, and\
      \ correct for model polarity:\n  - Require BOTH member joints to carry `axis.numeric` AND `canonical_frame.front`\
      \ to be anchored. Otherwise N/A(axis_polarity_unpinned).\n  - Map each declared numeric axis into\
      \ world via the anchored canonical frame -> a_decl_j. sigma_j = sign(d.xaxis[j] @ a_decl_j); if\
      \ |d.xaxis[j] @ a_decl_j| < cos(radians(axis_angle_deg)) -> N/A(axis_polarity_unpinned).\n  - c_model_corrected\
      \ = c_model * sigma_dep * sigma_indep. PASS iff (c_model_corrected > 0) == (c > 0).\n  This is honest\
      \ but will report N/A on essentially the whole corpus, since `front: null` is P0's default - which\
      \ is consistent with P0's own stated stance on unpinned orientation, and is strictly better than\
      \ emitting confident wrong verdicts.\n\nSECONDARY FIXES:\n  - mj_inputs: drop `<fixed limited=\"\
      true\" range=\"0 0\">` as a recognized binding form; it does not compile. Recognize instead mjEQ_TENDON\
      \ (`<equality><tendon tendon1=.../></equality>`) over a fixed tendon, and a limited fixed tendon\
      \ only with a nonzero-width range. Fix the same example in the revised P0 doc.\n  - Specify the\
      \ wrap lookup exactly: for tendon t, iterate k in range(m.tendon_adr[t], m.tendon_adr[t] + m.tendon_num[t]);\
      \ w_j = m.wrap_prm[k] for the k with m.wrap_objid[k] == the bound joint id. Never rely on wrap order.\
      \ Emit wrap_coefficients as an ordered list of (joint_id, coef) pairs sorted by joint_id so the\
      \ evidence is byte-stable.\n  - Guard the division: if |w_d| <= 1e-9 -> N/A(dependent_wrap_coefficient_zero),\
      \ before computing -w_i/w_d.\n  - Split c_model == 0 out of FAIL into N/A(coefficient_model_zero)\
      \ (step 2 above), and drop sign_model from evidence when it is undefined rather than emitting sign(0).\n\
      \  - Evidence fields for the new predicate: coupling_id, binding_kind, c_model, c_declared, sense_model,\
      \ sense_declared, axis_dot, axis_dep_world, axis_indep_world, jnt_types, wrap_coefficients, polycoef,\
      \ na_reason.\n  - Aggregation role can stay diagnostic-only, but update the rationale: the claim\
      \ that KF2.residual always also fails on a sign error is false when the sweep contains only q_indep\
      \ = 0 (a degenerate or single-sample range), where the residual is identically 0 for any c_model."
- item: KF2.no_frozen_member
  lens: kf2
  verdict:
    sound: false
    problem: "FATAL — VACUOUS ON 100% OF THE REAL CORPUS (the exact tautology class the team was told\
      \ to hunt).\n\nMeasured, not argued. I loaded all 546 URDFs in /Users/wanglin/Desktop/articraft-data/cache/record_materialization\
      \ with the frozen recipe (inject <mujoco><compiler discardvisual=false inertiafromgeom=true balanceinertia=true\
