      \ rpy=\"0 0 0\"/><geometry><box size=\"0.015 0.02 0.87\"/></geometry></visual>\n\nand in door_knob_fix:\
      \ `xyz=\"0.385 -0.02 0.34\"`. Leave door_hinge at xyz=\"-0.2155 -0.2095 0\" and everything else\
