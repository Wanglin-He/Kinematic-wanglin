      \ All 7 compile to neq=0, ntendon=0. The canonical gear-pair asset's declared coupling is invisible\
      \ in mjModel.\n\nBoth of the item's own `can_it_fail` witnesses are MJCF <equality> snippets — a\
      \ format this pipeline never produces and the loader would drop if it did. The item's justification\
      \ never touches a model the evaluator will actually see.\n\nSECONDARY — the item points at the wrong\
      \ failure surface. In a URDF corpus a frozen member is expressed as type=\"fixed\" on a member joint\
      \ (270 fixed joints in the corpus) or multiplier=\"0\" on a mimic. MuJoCo removes fixed joints entirely,\
      \ so the member never binds, KF2.bound goes N/A, and na_condition (\"N/A when KF2.bound is N/A\"\
