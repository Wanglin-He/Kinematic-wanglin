      D. Correct the forbidden-pair evidence to what mj_geomDistance actually returns: (drawer_1,drawer_2)
      +0.040000; (door,drawer_1) +0.000000; (door,drawer_2) +0.000000 — verdict still pass 3/3 because
      penetration is 0 <= forbidden_penetration_m. Do not quote +0.30000/+0.04000 (hand-computed z-gaps;
      the true minima are 0.300666 and 0.043497).


      E. Guard the box-box distance failure at spec level, since it is the same backend every collision
      predicate uses. mj_geomDistance can return a spurious 0.0 for two separated boxes (repro above),
      which is harmless for a `forbidden` predicate (penetration-based) but is a false PASS for `required`
      stop_contact/mesh_contact (min sd <= 0.002) — a non-meshing gear pair would pass. Specify: (i) freeze
      distmax per pair to a stated value; (ii) treat any mj_geomDistance result of exactly 0.0 whose returned
      fromto segment has length > 1e-9 as unreliable and fall back to the exact AABB separation as a lower
      bound, recording backend_fallback in the evidence; (iii) never use a censored-at-distmax value as
