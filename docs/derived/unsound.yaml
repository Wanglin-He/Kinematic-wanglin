      \ plus\n  <equality><joint joint1=\"gear_small_spin\" joint2=\"gear_large_spin\" polycoef=\"0 3\
      \ 0 0 0\"/></equality>\nand gearbox_wrong_ratio is the same with polycoef=\"0 2 0 0 0\".\n\nVerified\
