      \       64\n  layer2_grid_n:       9\nState that these are protocol initial values to be calibrated\
      \ by the same deterministic fault-injection procedure P0 section 12 prescribes.\n\n--- Fix 5: degeneracies\
      \ ---\n  - Exclude mjGEOM_PLANE and mjGEOM_HFIELD from every AABB union (this is what m.geom_type\
      \ is for). If a part's admissible geom set is empty after exclusion, every pair witnessed only by\
