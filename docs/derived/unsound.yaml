      \ k=5 (θ=0.6980) = **−0.09360**; fine sweep min **−0.11110 at θ=0.7596, unique argmin (no tie)**.\
      \ True crossings θ=0.20778 (first fail) and θ=1.23501 (re-clear) — a 1.03 rad failing window, ~49%\
      \ of the range, so any grid ≥4 points hits it.\n- Everything the item wants preserved is preserved:\
      \ xanchor unchanged at (−0.2155,−0.2095,0); on_edge_of still 1.0000 (all door vertices at x_rel≥0.0005);\
      \ required stop_contact 3/3 still −0.00050 for drawer_1, drawer_2 and door vs cabinet_body; (drawer_1,\
