      \ is as named evidence for the failure KF2.residual scores, not as an independent signal.\n\nREPAIR\
      \ B (no loader change — read the coupling from the URDF DOM). Bind jd/ji to URDF <joint> elements\
      \ by name instead of to mjModel joint ids, and restate the three findings on source fields:\n  -\
      \ fixed_member: the element for jd or ji has type=\"fixed\" → FAIL (not N/A).\n  - degenerate_relation:\
      \ jd carries a <mimic joint=\"ji\"> whose multiplier parses to |m| <= 1e-9 → FAIL.\n  - pinned_member:\
      \ jd or ji has <limit lower=\"L\" upper=\"U\"/> with U - L <= 1e-9 (frozen by a zero-span range)\
      \ → FAIL.\nKeep the mjModel scan of steps 2/3 as a second, additive pass so the predicate still\
      \ works if the corpus ever gains MJCF assets.\n\nCOMMON PATCHES (apply under either repair):\n 1.\
      \ Add an explicit precondition before step 2: `if jd < 0 or ji < 0: N/A(member_unbound)`, and state\
      \ that na_condition covers binding failure only via this key. This kills defect D.\n 2. Override\
      \ the N/A for the fixed-member case: if a member joint is absent from mjModel BECAUSE its URDF type\
      \ is \"fixed\", emit FAIL(fixed_member) with evidence {joint_name, urdf_type: \"fixed\"} rather\
      \ than N/A(member_unbound). Order the two checks so fixed_member is tested first. This is the one\
      \ change that makes the predicate catch the failure it is actually named after, and it is the direction\
      \ P3's \"fixed members\" bullet was reaching for.\n 3. Define w_d/w_i verbatim, and delete eq_tendon\
      \ from step 3: \"Let T be the tendon index KF2.bound selected (step 3 applies only when bound's\
      \ kind is tendon_limit). w_d = m.wrap_prm[k] for the unique k in [m.tendon_adr[T], m.tendon_adr[T]\
      \ + m.tendon_num[T]) with m.wrap_objid[k] == jd; w_i likewise for ji. If no such k exists, step\
      \ 3 contributes nothing.\" State plainly that step 3 — unlike step 2 — DOES consume bound's winner,\
      \ so the \"independent of bound\" language applies to step 2 only. For mjEQ_TENDON either give the\
      \ two-tendon rule explicitly or declare it out of scope.\n 4. Split the evidence lists to match\
      \ what each step writes: step 3 appends to `zero_tendon_coefficient_member` [{joint_id, joint_name,\
      \ tendon_id, coefficient}], NOT to pinned_member; pass condition becomes `len(pinned_member) ==\
      \ 0 and len(degenerate_relation) == 0 and len(zero_tendon_coefficient_member) == 0`. When both w_d\
      \ and w_i are zero, append the dependent first, then the independent — state that tie-break so output\
      \ is byte-identical. Rename pinned_member's `constant` to `polycoef_a0` and note in the spec that\
      \ the pinned value is qpos0[j] + a0, not a0.\n 5. Fix P0 §09's tendon witness: `range=\"0 0\"` does\
      \ not compile (\"Error: invalid limits in tendon\"). Use `range=\"-1e-9 1e-9\"`.\n\nREPORTING: whichever\
      \ repair is chosen, the applicable population for this diagnostic is 7 of 546 assets (those declaring\
      \ <mimic>). Emit applicable-n on the report, as P0 §16 ③ already requires for KF2 — an item whose\
