- item: KF1.common
  lens: kf1
  verdict:
    sound: false
    problem: 'Two checks pass cleanly: there is no tautology risk (no scored predicate here), and S4 explicitly
      forbids the whole-asset bbox diagonal, so the normalization rule is respected. Six defects fail
      the rest.


      F1 — INVENTED API (blocking, verified). `mjData.body_xpos` and `mjData.body_xmat` do not exist.
      Named twice: in mj_inputs ("mjData: qpos, body_xpos, body_xmat, ...") and in S0 step (5) ("Cache
      body_xpos/body_xmat/..."). Verified against the installed binding: `MjData` exposes `xpos`, `xquat`,
      `xmat`, `xipos`, `ximat`, `geom_xpos`, `geom_xmat`, `site_xpos`, ... and no `body_*` world-frame
      arrays; `AttributeError: ''mujoco._structs.MjData'' object has no attribute ''body_xpos''`. `body_pos`/`body_quat`
      exist only on mjModel and are body-local, so a coder who "fixes" the name by reaching for those
      silently gets local coordinates. Related shape error: `geom_xmat` is (ngeom, 9) flat, so S2''s `geom_xpos[g]
      + geom_xmat[g] @ v` is a shape mismatch as written. Everything else named — geom_aabb (ngeom,6),
      mesh_pos (nmesh,3), mesh_quat (nmesh,4), mesh_vert float32, xanchor/xaxis (njnt,3), jnt_limited
      uint8, mj_geomDistance — checks out.


      F2 — "THE CHAIN''S SCORED JOINT" IS NEVER DEFINED (blocking). S5 returns `chain(part,parent)` =
      "the ordered list ... of every joint owned by every body on that path" — a list. But S0 needs a
      single joint ("For every declared joint j whose binding (S5) yields a MuJoCo joint k ... set d.qpos[m.jnt_qposadr[k]]"),
      S8 needs a single joint ("a = d.xaxis[k] of the chain''s scored joint"), and S9 needs a single joint
      ("with bound MuJoCo joint k of type hinge or slide"). No subroutine defines the selection rule,
      and S1 explicitly refuses the obvious fallback: "KF1 does not rely on [J(id)] and derives its own
      chain in S5". This is not an edge case — S5 says including dummy-link joints "is the point", the
      corpus median is 3 joints across 5 bodies, and P1 G2 only guarantees a unique *body path*, not a
      unique joint. Two competent engineers write two different scorers. It also leaves the "which qpos
      do I write for q_ref" question open, so REF itself is not reproducible.


      F3 — S4 diag(P) IS NOT ROTATION-INVARIANT, contradicting its own stated property and P0 R2 (verified
      numerically). Feed S4 the cube that S2''s own box rule produces (8 corners + 6 face centres): the
      covariance is exactly isotropic (I computed 0.192308·I), so `np.linalg.eigh` returns the world axes
      regardless of how the cube is oriented. Axis-aligned unit cube -> extents (1,1,1) -> diag = 1.7320508.
      Same cube after a 45 deg yaw -> eigenvectors still world axes -> extents (sqrt2, sqrt2, 1) -> diag
      = 2.2360680. A 29.1% swing on an identical part, caused only by build orientation. diag(P) scales
      tau in S7, `anchor_center_offset_max x diag(part)`, pivot_locality_max, sym_gap_min, open_separation_min_frac
      and toward_min_sep_frac — so modelling orientation leaks straight into KF1 scores, which is exactly
      the confounder P0 section 02 R2 exists to eliminate ("测出来的差异会主要反映谁读了坐标系说明"). Near-degenerate (not
      exactly degenerate) covariance is worse: eigenvectors flip discontinuously under tiny mesh changes,
      so diag is chaotic near the boundary. Drawers, knobs and boxy carcasses are the near-cubic cases.


      F4 — S2 AND S3 DISAGREE ON PLANE/HFIELD, with catastrophic weight (verified). S2 skips PLANE and
      HFIELD; S3 says "For each geom g of B(P)" with no skip list and weight `w_g = 8*geom_aabb[g][3]*[4]*[5]`.
      I compiled a plane and read its AABB: `[0, 0, -5e9, 1e10, 1e10, 5e9]`, giving w_g ≈ 4e30. One plane
      geom anywhere in B(P) pins c(P) to that plane''s geom_xpos and annihilates every real geom. The
      same applies to HFIELD. (Low incidence in a URDF corpus — URDF has only box/cylinder/sphere/mesh
      — but it is free to fix and currently unguarded.)


      F5 — DETERMINISM HOLES. (a) B(P) is declared a "set" and S2 iterates "for every body b in B(P)",
      then keeps "every ceil(n/point_cap)-th point in index order" — so which points survive the stride
      depends on unspecified set iteration order, and diag/interface sets change with it. (b) S7 declares
      I_B, I_A, N and I as *sets*: order is unspecified, and making N a set collapses duplicate direction
      vectors, which corrupts the `cone_quantile 0.05` that S10 provisions for. (c) The "64-point Fibonacci
      sphere" formula is not pinned — the offset-0.5 and offset-1 variants give different point sets.
      (d) S9 writes coupling dependents without specifying resolution order for chained couplings, and
      does not say what happens when a coupling''s dependent and independent bind to the same MuJoCo joint
      (last write wins, order unspecified).


      F6 — UNHANDLED DEGENERACIES. (a) points(P) empty (part whose geoms are all PLANE/HFIELD, or a mesh
      with mesh_vertnum 0): S4 eigendecomposes the covariance of an empty array and S7 builds a KD-tree
      on an empty array — both raise; diag = 0 also makes tau = 0 and the S7 growth loop can never recover
      since 0 * 2.0 = 0. (b) Empty chain: if b*(part) == b*(parent) — a movable part fused into its parent
      body, which is precisely the fake-joint failure KF1 exists to catch — S5 returns an empty list either
      way (and it never says whether anc(bc) includes bc). The spec never states whether an empty chain,
      or a chain with no hinge/slide, is N/A or a fail. (c) A part whose geoms all have zero AABB extent
      makes S3''s sum(w_g) <= 0; that one is handled.


      F7 — S7''s pen_frac DOES NOT MEASURE PENETRATION. "pen_frac = fraction of I_B points whose signed
      configuration is interpenetrating, approximated as |p-q| < 1e-6" detects near-*coincident* surface
      samples, i.e. exact touching. A mover buried 5 mm inside the seat has its near points 5 mm from
      the seat''s nearest surface sample, so pen_frac reads 0 exactly when penetration is worst, and reads
      high when the parts merely touch. Mislabelled evidence that a later predicate will be tempted to
      trust.


      F8 — S2''s MESH FALLBACK IS THE WRONG DIRECTION. `v'' = mesh_pos[mid] + quat2mat(mesh_quat[mid])
      @ v` re-applies a transform that MuJoCo has *already* applied: mesh_pos/mesh_quat record the transform
      used to convert asset vertices into the mesh frame, and mesh_vert is stored post-transform. I verified
      this (a tetra with asset verts at an origin corner compiles to mesh_pos [0.25,0.25,0.25] with mesh_vert
      already recentred, and the S2 startup assertion passes on the direct path). So the branch is dead
      code, and if it ever fires it double-transforms, fails the re-assertion, and throws away the whole
      asset as mesh_frame_unresolved.


      Note (not scored): S10 rewrites P0 admission rule A12 and adds 28 contract keys, but `deviates_from_spec`
      discloses only the corpus-driven choices and never mentions the contract extension. Also, "It never
      enters the numerator or the denominator" is in tension with S0/S6''s ability to set KF1 = N/A for
      the entire asset; `can_it_fail` admits this, but the claim line should too.'
    fix: "F1. Replace every `body_xpos` / `body_xmat` with `mjData.xpos` (nbody,3) and `mjData.xmat` (nbody,9,\
      \ row-major), in both mj_inputs and S0 step (5). Add to S2: \"R_g = geom_xmat[g].reshape(3,3); p\
      \ = geom_xpos[g] + v @ R_g.T\" and state the same reshape rule for xmat wherever a body frame is\
      \ used.\n\nF2. Add S5b SCORED JOINT, and have S0, S8 and S9 call it by name:\n\"k*(j) for declared\
      \ joint j with declared type T in {hinge, slide}: let C = chain(j.part, j.parent) (ordered from\
      \ the part outward) and let H = [k in C : jnt_type[k] in {mjJNT_HINGE, mjJNT_SLIDE}].\n (1) If H\
      \ is empty -> k*(j) = None, flag no_movable_joint_in_chain; every predicate that needs k*(j) reports\
      \ FAIL (not N/A) for that claim, because an empty chain is the fake-joint / fused-body defect itself,\
      \ and emits evidence {chain_len: len(C), bc, bp, parent_is_ancestor}.\n (2) Let M = [k in H : jnt_type[k]\
      \ == mjJNT_HINGE if T == 'hinge' else mjJNT_SLIDE]. If M is non-empty, k*(j) = M[0] (the member\
      \ nearest the part; C is ordered from the part outward, ties impossible since C is a strict order).\
      \ If len(M) > 1, flag multiple_type_matching_joints and record the whole list.\n (3) If M is empty,\
      \ k*(j) = H[0], flag joint_type_mismatch, and record jnt_type[H[0]].\n (4) Always emit gate_joint_agrees\
      \ = (J(j.id) == k*(j)) as evidence; never let it change k*(j).\n (5) Extra chain joints beyond k*(j)\
      \ are recorded as extra_chain_joints and are held at qpos0 by S0, not written.\"\nThen S0 reads\
      \ \"for every declared joint j with k = k*(j) not None and jnt_type[k] in {hinge, slide}\", S8 reads\
      \ \"a = d.xaxis[k*(j)]\", and S9 reads \"with k = k*(j)\".\n\nF3. Replace S4 with a genuinely invariant\
      \ scale:\n\"S4 DIAG(P). Let X = points(P). If |X| == 0 -> diag(P) = 0, flag empty_point_cloud, and\
      \ every predicate that divides by diag(P) reports N/A. If |X| < 4 or scipy.spatial.ConvexHull raises\
      \ QhullError (coplanar/collinear input), diag(P) = max over all pairs |x_i - x_j| computed by brute\
      \ force. Otherwise let V = X[ConvexHull(X).vertices] and diag(P) = max over all pairs of V |v_i\
      \ - v_j|. This is the point-cloud diameter: exactly invariant under any rigid transform, well defined\
      \ for isotropic parts, and O(|V|^2) with |V| << point_cap in practice.\"\n(If O(|V|^2) is unacceptable,\
      \ the cheap invariant substitute is diag(P) = sqrt(12 * trace(Cov)), which is exactly the box diagonal\
      \ for a uniformly sampled box and invariant because trace is basis-independent — but it changes\
      \ the numeric scale, so pick one before calibrating the tolerances.)\nDelete the sentence \"Rotation-invariant\
      \ size scale\" from the PCA formulation, and keep S4's existing \"never use a whole-asset diagonal\"\
      \ note verbatim.\n\nF4. In S3, prepend the same exclusion S2 uses: \"skip any geom with geom_type\
      \ in {mjGEOM_PLANE, mjGEOM_HFIELD} (their compiled geom_aabb half-extents are ~1e10 and would dominate\
      \ every weight); record skipped_geom_types. If no geom of B(P) survives the skip, c(P) is undefined\
      \ -> flag empty_centroid and every predicate needing c(P) reports N/A.\"\n\nF5. (a) In S1 add: \"\
      B(P) is materialised as a list in ascending body id; S2 and S3 iterate it in that order, and within\
      \ a body iterate geoms in ascending geom index. All point-cloud concatenation and the point_stride\
      \ subsample use this order.\" (b) In S7 change \"set\" to \"ordered list\" for I_B, I_A, N and I,\
      \ with I_B in the order of points(B), I_A in the order of points(A), and I = I_A concatenated with\
      \ I_B; N keeps one entry per I_B point including duplicates. (c) Pin the sphere sample literally:\
      \ \"Fibonacci sphere, n = 64: for i in 0..63, z = 1 - (2i+1)/64, r = sqrt(max(0, 1-z^2)), phi =\
      \ i * pi * (3 - sqrt(5)), dir_i = (r cos phi, r sin phi, z).\" (d) In S9 add: \"couplings are applied\
      \ in kinematic_claims.couplings declaration order, each overwriting any earlier write to the same\
      \ qpos address; if k*(dependent) == k*(independent) for any coupling, skip that coupling and flag\
      \ coupling_self_reference.\"\n\nF6. Covered by the diag(P) empty-cloud clause in F3, the empty-centroid\
      \ clause in F4, and clause (1) of S5b in F2. Additionally add to S5: \"anc(bc) excludes bc itself;\
      \ if bc == bp the chain is empty\" (making the fused-body case explicit rather than incidental),\
      \ and to S7: \"if points(A) or points(B) is empty, or tau == 0, S7 is undefined -> flag empty_interface\
      \ and the calling predicate reports N/A.\"\n\nF7. Delete pen_frac from S7 or redefine it with the\
      \ tool the item already lists: \"pen_frac is replaced by min_sd(A,B) = min over g_a in geoms(B(A)),\
      \ g_b in geoms(B(B)) of mj_geomDistance(m, d, g_a, g_b, distmax = min(diag(A), diag(B)), fromto),\
      \ reported as evidence only, together with the argmin geom pair and its fromto segment. Negative\
      \ means interpenetration.\" Note this is the only correct penetration measure available, since ncon\
      \ is always 0 in this corpus.\n\nF8. Delete the mesh_pos/mesh_quat fallback branch. Replace with:\
      \ \"If the assertion fails, abort KF1 for the asset with reason mesh_frame_unresolved (KF1 = N/A).\
      \ MuJoCo stores mesh_vert already expressed in the mesh (= geom) frame; mesh_pos/mesh_quat record\
      \ the transform that was applied to produce it, so re-applying them would double-transform. Any\
      \ assertion failure means the model was not produced by the standard compiler path and no automatic\
      \ recovery is defined.\"\n\nAlso: add S10's contract extension to deviates_from_spec explicitly\
      \ (\"amends P0 admission rule A12 and adds 28 keys under kinematic_claims.tolerances.kf1\"), publish\
      \ those 28 values as a frozen JSON literal that admission compares byte-for-byte so they cannot\
      \ drift into implicit code defaults, and soften the claim line to \"never enters any numerator or\
      \ denominator; S0 and S6 can however set KF1 = N/A for the whole asset.\""
- item: KF1.parent
  lens: kf1
  verdict:
    sound: false
    problem: 'Not a tautology (body_parentid is generator output, independent of the contract field),
      no whole-asset-diagonal normalization, and every API named exists in MuJoCo 3.11 with the stated
      shape (`mjModel.body_parentid`, int[nbody], `body_parentid[0]==0`, pure graph, no mjData, no contacts).
      It fails on DETERMINISM and DEGENERACY, in a way that flips pass/fail on ordinary correct assets.


      P1. `b*(part)` is an undefined reduction, and multi-body parts are the norm here. Revised P0 section
      04 binds each id to a "body / geom 集合" — a SET — and this item''s own N/A clause treats `B(part)`
      as a set ("if B(part) ... is empty"), yet step 1 silently collapses it to a scalar `b*` with no
      stated rule, deferring to S1. The injected compiler options include `fusestatic="false"`, so static
      sub-links are never merged. Verified: a correct cabinet URDF compiles to world -> cabinet_body ->
      cabinet_body_panel -> drawer_1, with both of the first two bound to `cabinet_body`. If S1''s representative
      is the shallowest member, the asset passes; if it is a sibling sub-link (world -> cabinet_body,
      cabinet_body -> panel, cabinet_body -> drawer_1 with b* = panel), `parent_is_ancestor` is False
      and a correct asset FAILS. Two competent engineers write different code and get different verdicts
      on the same bytes.


      P2. The word "other" in "no other declared part interposed" is never operationalized. The inputs
      list `required_parts[*].id` "to define ''other declared part''" but the algorithm just says "run
      S5 to obtain named_mid". In the verified trace above, `cabinet_body_panel` is a mid body bound to
      a declared part — namely the declared PARENT itself. Under the literal reading (any mid body bound
      to any declared id), `len(named_mid) == 0` fails and this correct cabinet is scored a KF1 defect.
      This is a systematic false-negative generator, caused by the pipeline''s own compiler flag.


      P3. `anc()` is used in step 4 without stating whether it includes self. When `bc == bp`, `inverted`
      is True under the reflexive reading and False under the strict one, and steps 3 and 4 read the two
      differently. The emitted evidence field is implementation-dependent.


      P4. The N/A clause is self-contradictory and unsafe on the real corpus: "emit N/A with reason binding_missing
      AND raise a pipeline error." Raising aborts; you cannot also emit a per-claim record. Worse, the
      justification leans on admission rule A1, which only constrains contracts admitted under the REVISED
      P0 — the existing 607-asset corpus predates it, and revised-P0 section 01 row 2 documents exactly
      this failure (drawer_side / cabinet_wall / drawer_front referenced but never declared). A crash-on-first-mismatch
      policy will kill batch runs over real data.


      P5 (coverage, and the item''s rationale is wrong about it). Interposed UNBOUND bodies carrying joints
      are invisible. Verified: world -> a -> mid(hinge) -> b passes `parent_is_ancestor` with `named_mid`
      empty, while b has 2 DOF relative to a — flatly contradicting the contract, and KF1.type also passes
      because b''s own joint is correct. With median 5 bodies / 3 joints against ~3-4 declared parts,
      unbound intermediates are common. Relatedly, "can_it_fail" asserts "none of these is detectable
      from the declaration text" — false for URDF, where body_parentid is a verbatim transcription of
      `<joint><parent link=/><child link=/>`; all three named failures are a text diff away. Given the
      team''s own measurement that declaration-reading checks carry almost no information, the path-DOF
      check in P5 is the part that actually adds signal beyond parsing the URDF. Separately, the same_body
      example in "can_it_fail" (handle merged into drawer "when the contract declares a joint between
      them") is impossible under A3/A4 — `attached` parts never appear as a joint''s `part`. same_body
      is still reachable via two movable/fixed parts merging into one body; just fix the example.'
    fix: 'Rewrite the algorithm on the binding SET, with every reduction and tie-break stated, and add
      the path-DOF conjunct.


      Definitions (state these in the item, do not defer to S1/S5):

      - depth(b) = number of steps from b to body 0 via body_parentid (depth(0)=0).

      - anc(b) = STRICT ancestors of b: repeatedly apply body_parentid until reaching 0, excluding b,
      including 0. Say "strict" explicitly.

      - anchor(P) = the member of B(P) with minimum depth; if two or more members tie at minimum depth,
      emit N/A with reason binding_disconnected, evidence tied_bodies = sorted tie list, and do NOT score
      the claim. (A part whose bodies straddle two subtrees has no well-defined attachment point; this
      is a Gate defect, not a KF1 verdict.)

      - bc = anchor(part), bp = anchor(parent).


      Steps:

      1. same_body := (bc == bp). Also set merged_binding := (B(part) & B(parent)) != empty, and emit
      it.

      2. parent_is_ancestor := bp in anc(bc).

      3. inverted := bc in anc(bp).  Drop "and not parent_is_ancestor" — with strict anc() on a tree the
      two are mutually exclusive by construction, so the conjunct is dead code that only re-encodes the
      ambiguity.

      4. mid_bodies := the strict path bc -> bp, exclusive of both endpoints, emitted in ancestor order
      (child-to-root). This order is canonical; do not sort. Empty when parent_is_ancestor is False.

      5. named_mid := [(b, pid) for b in mid_bodies for pid in sorted(parts_bound_to(b)) if pid not in
      {part, parent}]. The sorted() kills PYTHONHASHSEED-dependent set order on string ids; the `not in
      {part, parent}` clause is the missing definition of "other" and is what lets the verified cabinet_body_panel
      case pass.

      6. path_dof := sum(int(m.body_jntnum[b]) for b in mid_bodies); path_joint_ids := the joint ids on
      those bodies, in (body order, jntadr order).


      Pass condition: parent_is_ancestor and len(named_mid) == 0 and not same_body and path_dof == 0.


      N/A: (a) anchor tie -> reason binding_disconnected; (b) B(part) or B(parent) empty -> reason binding_missing.
      In case (b) emit the N/A record with contract_violation=True and CONTINUE the batch; the run driver
      counts contract_violation records and fails the RUN REPORT (non-zero exit at the end, with the offending
      asset/claim ids listed). Never raise mid-batch — the real corpus is known to contain contracts written
      before admission rule A1 existed.


      Evidence to add to the existing list: depth_child, depth_parent (already present), plus merged_binding,
      tied_bodies, path_dof, path_joint_ids, B_part (sorted body ids), B_parent (sorted body ids), and
      na_reason.


      Also correct the prose: replace the same_body example with "a model that paints the drawer face
      onto the carcass, so drawer_1 and cabinet_body bind to the same body", and drop the claim that these
      defects are undetectable from declaration text — for URDF assets they are a text diff; the load-bearing
      additions over a text diff are path_dof and the set-valued binding handling.'
- item: KF1.joint_binding
  lens: kf1
  verdict:
    sound: false
    problem: 'WHAT PASSES (verified, mujoco 3.3.7, URDF built to match the stated pipeline):


      - Not a tautology. A jointless child body genuinely survives `fusestatic="false"` (I built cabinet_body
      -> drawer_2 via a URDF `fixed` joint: drawer_2 remains body 3 with `body_jntnum=0`), so n_joints==0
      is really reachable and really scores 0. The quantity counted is not derived from the declaration
      being checked. Confirmed.

      - Computability. `body_parentid, body_jntadr, body_jntnum, jnt_type, jnt_bodyid` all exist with
      the stated shapes; `mjJNT_{FREE,BALL,SLIDE,HINGE}` all exist. No contacts, no mj_geomDistance needed.
      Confirmed. (One trap the item should name: `body_jntadr[b] == -1` whenever `body_jntnum[b] == 0`,
      and the item lists body_jntadr as an input.)

      - No whole-asset bounding-box normalization anywhere. Confirmed.


      WHY IT IS STILL UNSOUND. The item makes `len(C)` the entire score and `C[0]` the input to every
      downstream KF1 predicate, but it never pins down the three things that decide what C and C[0] actually
      are. It defers all of it to "S5" while simultaneously overriding S5''s semantics (the LCA fallback).
      Each gap has a reproduced consequence.


      (1) ENDPOINT CONVENTION UNSTATED — spurious failures on correct assets. Whether C includes the joints
      carried by b*(parent) itself is never said, and it is load-bearing. Built base -> column(revolute
      "swivel") -> head(revolute "tilt"), the exact topology of the tilt/swivel monitor family in this
      corpus. For the correct P0 row {part: head, parent: column} the body path is [head, column]. Collecting
      joints over the path inclusive gives n_joints=2 -> FAIL on a perfectly correct asset. Only the half-open
      reading (bodies from b*(part) up to but EXCLUDING b*(parent)) gives 1. An engineer writing this
      "with no further decisions" has a coin flip, and the wrong side fails every asset whose declared
      parent is itself articulated — with a median of 3 joints per asset, that is most multi-DOF assets.


      (2) k* TIE-BREAK UNDEFINED EXACTLY ON THE FAILURE THE ITEM NAMES. `can_it_fail` cites "gives the
      drawer body both a slide and a stray hinge". I built it: MuJoCo accepts `body_jntnum=2` on one body,
      joints stored at `body_jntadr..+jntnum-1` in XML declaration order. "The joint closest to the part"
      does not order two joints on the SAME body — graph distance is identical. With the natural jntadr-order
      tie-break, C[0] is whichever was declared first; in my test that is `stray_hinge`, not `the_slide`.
      Since the item states k* feeds every downstream predicate unconditionally (it does not exempt the
      n_joints>=2 case), KF1.type/axis/anchor/range would all be scored against the stray joint. The spec
      names a failure mode its own ordering rule cannot order. (Note for scoping: pure URDF can never
      produce body_jntnum>1 — one joint per child link — so this is an MJCF-only case, but the item asserts
      it as live, so it must be ordered.)


      (3) THE LCA FALLBACK PRODUCES A SILENT WRONG ANSWER. The item deliberately keeps this claim scored
      when KF1.parent fails, using an LCA chain. But (a) it never says whether parent-branch joints count
      toward n_joints — which silently changes the pass condition from "exactly one joint between them"
      to "exactly one joint on the union path"; and (b) its gloss for C[0], "the last one traversed on
      the way down from the parent", has no referent under LCA, because there is no descent from parent
      to part. Reproduced: URDF root `drawer_1` -> `cabinet_body` (prismatic), i.e. inverted parenting.
      b*(part)=body 1, b*(parent)=body 2, LCA = the part''s own body, so the part-side branch is EMPTY
      and C consists solely of the parent-branch joint. n_joints==1 -> the claim PASSES, and k* is the
      joint that articulates the parent, not the part. Every downstream KF1 predicate then measures the
      wrong joint, silently. `parent_is_ancestor=false` is emitted but nothing flags that k* is on the
      wrong branch.


      (4) `rigid_no_joint` MISLABELS TWO DISTINCT DEFECTS. n_joints==0 arises from (a) a real child body
      carrying no joint, and (b) b*(part) == b*(parent), i.e. the Gate bound both P0 parts to one MuJoCo
      body because the generator merged the drawer into the carcass mesh — guaranteed on any near-single-body
      asset. Different defect, different fix, same flag.


      (5) `gate_agrees` HAS NO DEFINED VALUE WHEN THE GATE SUPPLIED NOTHING — which is the normal case,
      since the architecture forbids name inference and P0 marks joint `id` as "reported, not matched
      by name". Emitting `false` there is indistinguishable from a real disagreement, and choosing between
      false and null is left to the implementer, so the evidence is not byte-identical across conforming
      implementations.'
    fix: "Restate the chain normatively inside this item instead of deferring to S5, and split the two\
      \ branches.\n\nCHAIN (normative here, overrides S5):\n  bp = b*(part); bq = b*(parent). If either\
      \ is missing from the binding table -> N/A, chain_undefined.\n  A = [bp, body_parentid[bp], ...,\
      \ 0]  # ancestors of bp, part first, world last\n  if bq in A:            # descent case\n     \
      \ part_bodies = A[0 : A.index(bq)]      # CLOSED at the part end, HALF-OPEN at the parent end\n\
      \      parent_bodies = []\n      parent_is_ancestor = True\n  else:                  # LCA fallback;\
      \ L always exists (world at worst)\n      L = lowest common ancestor of bp, bq via body_parentid\
      \ walks\n      part_bodies   = A[0 : A.index(L)]                  # excludes L; may be empty\n \
      \     parent_bodies = [bq, ..., ] strictly below L       # excludes L; may be empty\n      parent_is_ancestor\
      \ = False\n  joints_of(b) = range(body_jntadr[b], body_jntadr[b] + body_jntnum[b])\n           \
      \      # empty when body_jntnum[b]==0; body_jntadr[b] is -1 there, never dereference it\n  C_part\
      \   = [j for b in part_bodies   for j in joints_of(b)]   # bodies in the order listed, joints ascending\
      \ by index within a body\n  C_parent = [j for b in parent_bodies for j in joints_of(b)]   # same\
      \ ordering rule\n  C = C_part + C_parent\nOrdering is now total and deterministic: body order is\
      \ fixed by the walk, and the within-body tie-break is explicitly ascending joint index (= XML declaration\
      \ order in MuJoCo). No set or dict iteration anywhere.\n\nk*:\n  k* = C_part[0] if C_part else None.\n\
      \  k* is never taken from C_parent. When k* is None, every downstream KF1 predicate (type, axis,\
      \ anchor, range/reference) reports N/A with reason no_joint_on_part_branch — this is the only N/A\
      \ cascade permitted, and it is unavoidable because there is no joint to measure.\n\nPASS CONDITION:\n\
      \  pass iff len(C_part) == 1 and len(C_parent) == 0. No tolerance.\n  In the descent case C_parent\
      \ is empty by construction, so this reduces exactly to the item's original len(C)==1 — intent preserved.\
      \ In the LCA case it correctly fails the inverted-topology asset instead of passing it while handing\
      \ a wrong k* downstream. The denominator is not shrunk: the claim is still scored whenever both\
      \ bindings exist, which was the item's stated goal.\n\nEVIDENCE (replace the current list):\n  joint_id,\
      \ n_joints_part_branch, n_joints_parent_branch, chain_joint_ids (C_part then C_parent),\n  chain_joint_types\
      \ (mjJNT_* names, same order), chain_body_ids (part_bodies then parent_bodies),\n  k_star (int or\
      \ null), parent_is_ancestor,\n  gate_agrees: true | false | null   # null when the Gate supplied\
      \ no binding for joint_id; reported, never scored\n  flags, at most one of:\n    part_parent_same_body\
      \   # bp == bq: the two P0 parts collapsed onto one MuJoCo body\n    rigid_no_joint          # bp\
      \ != bq, C_part empty and C_parent empty: child body exists but carries no joint\n    inverted_topology\
      \       # C_part empty, C_parent non-empty: the only joint articulates the parent\n    extra_dof\
      \               # len(C_part) >= 2\n    parent_branch_joints    # len(C_parent) >= 1 while C_part\
      \ is non-empty\n\nAlso add one sentence to the claim text so it matches the algorithm: the joint\
      \ is located by body-graph topology only; `joints[j].id` is never matched against MuJoCo joint names,\
      \ and `gate_agrees` is diagnostic only.\n\nTwo scoping notes worth writing into the item: len(C_part)>=2\
      \ from two joints on one body is unreachable for URDF assets (URDF admits one joint per child link\
      \ — confirmed: every URDF body I built has body_jntnum in {0,1}); on the current corpus it can only\
      \ arise from a jointed intermediate body. And a single mjJNT_FREE or mjJNT_BALL on the part body\
      \ passes this claim while contributing 6 or 3 DOF, so the item should not advertise itself as catching\
      \ \"undeclared extra DOF\" in general — that is KF1.type's job."
- item: KF1.type
  lens: kf1
  verdict:
    sound: false
    problem: "Not a tautology (declared type is external to the model, so a hinge-built-as-slide really\
      \ fails), no forbidden whole-asset-diagonal normalization, and every named API exists with the stated\
      \ shape (verified on a live loader: jnt_type int32 (njnt,), jnt_limited uint8 (njnt,), jnt_dofadr\
      \ int32 (njnt,), jnt_range float64 (njnt,2), nv scalar; mjJNT_FREE/BALL/SLIDE/HINGE = 0/1/2/3).\
      \ But three things break.\n\n(A) TWO OF THE FOUR VOCABULARY VALUES ARE UNPASSABLE ON THE ESTABLISHED\
      \ ALL-URDF CORPUS, and the item provides no N/A for it. A predicate that cannot be passed is as\
      \ uninformative as one that cannot be failed, and here it produces guaranteed false negatives. Verified\
      \ by loading URDFs through the exact injected compiler block:\n  - free: `<joint type=\"floating\"\
      >` between two links is a HARD COMPILE ERROR — \"Error: free joint can only be used on top level\"\
      . A URDF root link gets NO free joint (root-only URDF loads as nbody=2, njnt=0, nv=0). mjJNT_FREE\
      \ is only reachable via the ROS `world`-link idiom (`<link name=\"world\"/>` + floating world->base),\
      \ which P0 cannot express because `joints[].parent` must be a declared required_part and P0 has\
      \ no world pseudo-part. So a contract declaring `type: free` for any part is satisfiable only by\
      \ an asset that fails to compile — it does not score 0, it silently vanishes at Gate G3 and is dropped\
      \ from the whole benchmark.\n  - ball: standard URDF has no ball joint at all; `type=\"ball\"` is\
      \ rejected (\"invalid joint type in URDF joint definition\"). Only MuJoCo's nonstandard `type=\"\
      spherical\"` yields mjJNT_BALL. The idiomatic URDF realization of a ball-and-socket is three stacked\
      \ revolute/continuous joints — verified to load as three separate mjJNT_HINGE with jnt_dofadr [0,1,2],\
      \ nv=3. Under `jnt_type[k*] == mjJNT_BALL` that correct gimbal scores 0.\n\n(B) k* = C[0] IS BOTH\
      \ ORDER-UNDEFINED AND OUTCOME-CHANGING. The item never says whether the chain C is ordered root->leaf\
      \ or leaf->root; walking body_parentid up from the part body naturally yields leaf-first, reversing\
      \ yields root-first, and the two disagree on any mixed chain (verified on the gimbal: bodies base(1)/a(2)/b(3)/stick(4),\
      \ joints jg0/jg1/jg2 — [jg0,jg1,jg2] vs [jg2,jg1,jg0]). That alone violates determinism. Worse,\
      \ picking the first element rather than testing membership is arbitrary and has a non-hypothetical\
      \ counterexample: a URDF `planar` joint expands into exactly one chain of three joints on a single\
      \ body, [SLIDE j_TX, SLIDE j_TY, HINGE j_RZ] (verified, jnt_limited = [1,0,0]). Declared `slide`\
      \ -> C[0]=SLIDE -> PASS, with the 3-DOF defect appearing only as evidence; declared `hinge` -> C[0]=SLIDE\
      \ -> FAIL even though the hinge is right there. Identical modeling error, opposite verdicts, decided\
      \ purely by MuJoCo's internal expansion order. Separately, `planar` RENAMES the joint (j -> j_TX/j_TY/j_RZ),\
      \ which will break any name-based joint binding upstream and is not flagged anywhere.\n\n(C) THE\
      \ \"FROZEN, EXPLICITLY NOT SCORED\" URDF PROVENANCE RULE IS FALSE, in three of four directions.\
      \ MuJoCo copies whatever `<limit>` is present regardless of URDF joint type; it does not enforce\
      \ the URDF spec's rule that revolute must have one and continuous must not. Verified: `continuous`\
      \ WITH `<limit lower=\"-1\" upper=\"1\">` -> HINGE, jnt_limited=1, range=[-1,1]. `revolute` with\
      \ NO `<limit>` -> HINGE, jnt_limited=0, range=[0,0]. `prismatic` with no `<limit>` -> SLIDE, jnt_limited=0.\
      \ So \"continuous loads as hinge+unlimited and revolute as hinge+limited\" is not an invariant,\
      \ the stated urdf_hint inference (hinge+unlimited => continuous / hinge+limited => revolute / slide\
      \ => prismatic) is simply wrong, and the item hands jnt_limited to KF1.range_ref_state wrapped in\
      \ a provenance story that does not hold. Most damaging: `revolute` with `lower=\"0\" upper=\"0\"\
      ` — a welded fake joint, precisely the defect P3 exists to catch — loads as HINGE, jnt_limited=0,\
      \ range=[0,0], and this item's evidence reports it as urdf_hint=continuous, i.e. as a legitimately\
      \ unlimited gear shaft. The evidence actively inverts the diagnosis.\n\nMinor, worth fixing while\
      \ you are in there: (D) the `binding_missing` N/A branch is dead code — P0 Gate G1 makes any unbound\
      \ part a Gate FAIL and such an asset never reaches P3. (E) dof_actual's computation is never given\
      \ (sum of per-type DOF counts vs jnt_dofadr differencing); both agree because jnt_dofadr is monotone,\
      \ but the formula must be written down. (F) the `no_joint` N/A silently discards the most common\
      \ real defect — URDF `fixed` verified to yield njnt=0 with the body still present under fusestatic=\"\
      false\" — so this item is load-bearing on KF1.joint_binding actually scoring that; state the dependency."
    fix: "Four edits.\n\nFIX A — add a source-format expressibility branch to the frozen mapping, and\
      \ close the `free` hole in P0.\n  1. At load, record source_format ∈ {urdf, mjcf}. For source_format\
      \ == urdf:\n     - declared `free`: N/A, reason `type_inexpressible_in_source_format`. Excluded\
      \ from the KF1 denominator.\n     - Add P0 admission check A13: `type: free` is rejected at contract\
      \ compile time whenever the pipeline is URDF-fed, because the only URDF encoding is a hard compile\
      \ error that drops the asset out of the benchmark entirely rather than scoring it.\n     - declared\
      \ `ball`: PASS if EITHER jnt_type[k*] == mjJNT_BALL (the MuJoCo-only `spherical` extension), OR\
      \ C is a concurrent 3-hinge gimbal, defined as: len(C) == 3; every jnt_type[k] == mjJNT_HINGE; after\
      \ mj_forward at qpos0, stack the three unit world axes mjData.xaxis[k] into a 3x3 matrix A and require\
      \ sigma_min(A) >= 0.20 (frozen constant, ~11.5 deg from degeneracy, chosen independent of axis_angle_deg\
      \ so it moves one predicate only); and all three world anchors mjData.xanchor[k] lie within anchor_center_offset_max\
      \ x diag(AABB of the part body's own geoms) of their centroid. Otherwise FAIL. Emit evidence `ball_realization`\
      \ ∈ {native_ball, gimbal_3hinge, none} and `gimbal_sigma_min`, `gimbal_anchor_spread_m`. Note this\
      \ is the ONE place where C is deliberately read as a whole rather than reduced to k*.\n     - `slide`\
      \ -> mjJNT_SLIDE and `hinge` -> mjJNT_HINGE are unchanged.\n\nFIX B — pin the chain order, and score\
      \ membership rather than the first element.\n  1. Define C explicitly, once, in KF1.joint_binding\
      \ and cite it here: walk body_parentid from the part body up to (exclusive) the parent body; for\
      \ each body visited take its joints as the contiguous id range body_jntadr[b] .. body_jntadr[b]+body_jntnum[b]-1\
      \ in ascending id; reverse the body sequence so C is ordered parent-side first, ascending joint\
      \ id within a body. C is a list, never a set — no dict/set iteration anywhere.\n  2. Pass condition\
      \ becomes: PASS iff there exists k in C with jnt_type[k] == expected_mjtype(declared). k* = the\
      \ lowest-index such k; if none exists, k* = C[0] for evidence and the item FAILs. Rationale to record:\
      \ the extra-DOF defect is already scored exactly once, by KF1.joint_binding via dof_actual vs dof_declared,\
      \ so a chain that contains the right joint plus extras must not be penalised a second time here;\
      \ a chain containing no joint of the right type is a genuine type error whatever the order.\n  3.\
      \ Add flag `urdf_planar_expansion`: true when three joints in C share a base name under the pattern\
      \ ^(.*)_(TX|TY|TZ|RX|RY|RZ)$ with the TX/TY/RZ triple present. Surface it in evidence and pass it\
      \ up to joint_binding, since the rename also breaks name-based binding.\n\nFIX C — stop inferring\
      \ provenance from jnt_limited.\n  1. Delete the frozen claim that continuous <=> hinge+unlimited\
      \ and revolute <=> hinge+limited. Replace with the verified statement: MuJoCo copies any `<limit>`\
      \ present regardless of URDF joint type, so jnt_limited is NOT a proxy for URDF joint type.\n  2.\
      \ urdf_hint must be read from the source URDF text, not inferred: parse `<joint name=... type=...>`\
      \ and map name -> declared type directly (names survive verbatim for revolute/continuous/prismatic/fixed;\
      \ only planar is suffixed, handled by the flag in Fix B). If the source text is unavailable, emit\
      \ urdf_hint = unknown. Never derive it from the compiled model.\n  3. Add evidence fields `jnt_range`\
      \ (the raw 2-vector) and `zero_span_range` = (jnt_range[k*][1] - jnt_range[k*][0] == 0.0), so a\
      \ revolute with lower==upper — the welded fake joint — is visible as such instead of being mislabelled\
      \ as a continuous shaft. This is evidence only; the travel defect stays scored in KF1.range_ref_state\
      \ / the travel_scale_min fake-joint predicate.\n  4. Keep the actual narrowing (continuous-vs-revolute\
      \ is not scored under type). It is correct; only the stated justification was wrong.\n\nFIX D —\
      \ housekeeping.\n  - Replace the `binding_missing` N/A with `chain_unresolvable`: part body and\
      \ parent body both bound (guaranteed by Gate G1) but no parent-chain path from part body to parent\
      \ body exists. That is the only reachable structural N/A at P3.\n  - Freeze dof_actual's formula:\
      \ ndof(k) = jnt_dofadr[k+1] - jnt_dofadr[k] for k < njnt-1, else nv - jnt_dofadr[k]; dof_actual\
      \ = sum over k in C. (jnt_dofadr is monotonically increasing — verified [0,1,2] on both the gimbal\
      \ and the planar expansion.)\n  - State the dependency explicitly: the `no_joint` N/A is only legitimate\
      \ because KF1.joint_binding scores len(C) == 0; verify that item actually does before shipping this\
      \ one.\n  - The Tier D / exclude-from-informative-subset call stands and is unaffected by the above."
- item: KF1.axis_relational
  lens: kf1
  verdict:
    sound: false
    problem: 'Branches (A) interface_normal and (C) toward are sound; branches (B) interface_line and
      (D) symmetry_axis_of are not, and both produce FALSE FAILURES on correct assets — the worst outcome
      for a generator-comparison benchmark. Determinism and degeneracy gaps also violate the "no further
      decisions / byte-identical" bar.


      WHAT IS FINE (verified, do not change):

      - Not a tautology. Built two models differing only in jnt_axis ("0 0 1" vs "1 0 0"): d.xaxis changes,
      every geom_xpos at REF is byte-identical (at qpos=ref the hinge/slide transform is identity regardless
      of axis). The reference direction comes from geometry that does not move when the axis is perturbed.
      The two known P3 tautologies are avoided.

      - Computability, checked against the installed mujoco: data.xaxis (njnt,3), data.xanchor (njnt,3),
      data.geom_xpos (ngeom,3), data.geom_xmat (ngeom,9), model.geom_type/geom_dataid (ngeom,), geom_size
      (ngeom,3), geom_aabb (ngeom,6), mesh_vertadr/mesh_vertnum (nmesh,), mesh_vert (nmeshvert,3), body_geomadr/body_geomnum
      all exist; mjJNT_FREE/BALL/SLIDE/HINGE = 0/1/2/3; xaxis is populated for slide joints too. No invented
      API, no reliance on mjData.contact.

      - Normalization: only diag(A), diag(B), diag(X) — each part''s own extent. No whole-asset diagonal
      anywhere.

      - Branch (A) is the correct one-sided free-motion cone {u : u.n >= 0} and behaves as claimed. Simulated
      with cone_quantile=0.10, free_cone_slack_deg=10, K=4096: 5-face cavity -> u*=+y, radius 13.2 deg;
      4-face cavity (no back contact) 13.2 deg; through bore 13.0 deg; blind bore 14.5 deg; single flat
      face 35.4 deg; side-rails-only 89.9 deg; fully enclosed s_max=-0.58 -> fully_constrained. So free_cone_radius_max_deg
      in (15,30) separates determined from underdetermined. One correction for the record: the item''s
      stated reason for the flat-face abstention is wrong — there the argmax IS exactly the face normal,
      perfectly determined; the wide U_free comes from cos being quadratically flat at its peak, not from
      ambiguity. The behavior is right, the justification is not, so the threshold must be set from these
      numbers, not from that reasoning.


      DEFECT 1 (decisive) — (B) interface_line: the ill-conditioning gate tests elongation, not whether
      the elongation direction is the hinge axis, so it cannot separate a correct asset from the fault
      it claims to catch. At snapshot REF (closed) the door/frame interface is generically the entire
      mating perimeter or the entire overlay face, whose longest principal direction is the door''s own
      longest in-plane dimension and is uncorrelated with which edge carries the hinge. Measured aniso
      = sqrt(lam2/lam1): tall door 0.5w x 1.0h perimeter 0.592 (v1 vertical), full face 0.500; wide door
      1.0w x 0.6h perimeter 0.680 (v1 HORIZONTAL), full face 0.600; near-square perimeter 0.924; genuine
      narrow hinge band (L=1.0, t=0.05) 0.050. A left-side-hinged wide door (microwave-style, in the corpus)
      and a bottom-hinged wide door produce the IDENTICAL cloud and identical aniso=0.68, yet the true
      axis is vertical in one and horizontal in the other: for one of them the branch returns a reference
      90 deg off and FAILS a correct asset. No value of iface_line_aniso_max separates them. Push the
      threshold below ~0.5 to exclude full-face/perimeter interfaces (which run 0.50-0.92) and interface_line
      abstains on essentially every door and lid — the only use case P0 section 07 lists for it ("合页轴、铰链轴")
      — so the branch is either unsound or empty. The item noticed the near-square sub-case ("abstains
      instead of failing arbitrarily") but missed that a non-square perimeter is equally uninformative
      while passing the gate.


      DEFECT 2 (decisive) — (D) symmetry_axis_of: the verification stage is vacuous, so the branch collapses
      back to the covariance-only test the item explicitly set out to avoid. e_sym is a MIN over a theta
      grid that includes both small angles and 180 deg, and two independent effects drive it to ~0 for
      non-symmetric parts. (a) e(theta) -> 0 as theta -> 0 for ANY shape about ANY axis, so the smallest
      sampled angle always wins. (b) Every centrally symmetric part — box, ellipsoid, cylinder, flat panel,
      most bracket-like parts — maps onto itself under a 180 deg rotation about each principal axis, so
      e(180) ~ 0 unconditionally. Measured (chamfer / diag, surface-sampled): a 1.0 x 0.30 x 0.10 box,
      which is not a body of revolution, gives e(5)=0.0062 and e(180)=0.0075 about its long axis — below
      any plausible sym_chamfer_max, hence "verified". Consequence: a 1.0 x 0.95 x 0.05 flat panel (lam2/lam1
      = 0.90, so oblate whenever sym_pair_tol >= 0.10) is confidently assigned symmetry axis = panel normal
      and "verified" via e(180)=0.009; a correct lid hinged about an in-plane edge is then reported 90
      deg off and FAILS. Also: step 4 divides by diag(X) with no guard — diag(X)=0 gives nan, and "nan
      > sym_chamfer_max" is False in IEEE, so the gate silently passes and the branch proceeds with a
      garbage candidate.


      DEFECT 3 — determinism (spec demands byte-identical output): (i) the Fibonacci-sphere construction
      is not pinned (offset 0.5 vs 0, golden-angle convention, parity of K) — different variants give
      different u* and different radius_deg, flipping the N/A verdict near free_cone_radius_max_deg; (ii)
      u* = argmax s_pm has no tie-break, and exact ties do occur (measured: 2 tied directions on the flat-face
      case); (iii) the quantile estimator is unspecified (numpy offers 9 methods) and it is not stated
      that each normal counts once, unweighted; (iv) eigenvector sign is implementation-defined — harmless
      for the |cos| pass condition, but it changes u_reference in the evidence and, in (D), changes e_sym
      and theta_star_deg because rotating about -v by theta equals rotating about +v by -theta and e(theta)
      is not symmetric in theta; (v) step 8''s reporting flip is undefined when dot(u*, c(B)-c(A)) ==
      0 — exactly the through-bore case s_pm exists to handle; (vi) "subsampled by a fixed stride" is
      deterministic only if S4''s point order is pinned.


      DEFECT 4 — degeneracy: no N/A when the two named parts bind to the same body or to overlapping geom
      sets. With a median of 5 bodies per real asset and contracts naming up to 7 parts, part->body collisions
      are expected. S7 on a geom set against itself yields zero-distance "interface points" with meaningless
      normals, and pen_frac (fraction of negative gaps) is 0 for exact touching, so interface_interpenetrating
      does not catch it. Separately, in (C) if diag(A)=diag(B)=0 the threshold is 0, sep=0 is not < 0,
      normalize(0) is nan, and "nan >= cos(tol)" is False — a FAIL, not an N/A. And an axis.relational.type
      outside the four-word vocabulary has no specified behavior.


      DEFECT 5 — plumbing: (i) p0_inputs names kinematic_claims.tolerances.kf1.{...}, but revised P0 section
      12 / admission A12 freeze a FLAT nine-key tolerances block and require it complete; a nested kf1
      sub-block is a P0 schema change that the item''s deviates_from_spec does not declare (it declares
      only the interface_normal reinterpretation), so contracts will either fail A12 or hit missing fields
      at runtime. (ii) mj_inputs lists mesh_vertadr/mesh_vertnum/mesh_vert but branch (A) consumes surface
      NORMALS; vertices carry none, so S7 needs mesh face arrays (mesh_faceadr/mesh_facenum/mesh_face)
      or the analytic primitives — neither is listed. (iii) (D) requires a KD-tree, but evo-p0p3 declares
      only mujoco, numpy, pyyaml (/Users/wanglin/Projects/Articraft/.claude/worktrees/evo-articraft-verifier-856ef5/evo-p0p3/pyproject.toml).'
    fix: 'FIX 1 — (B) interface_line: gate on LOCALIZATION of the tight contact, not on elongation of
      the whole interface. Replace steps 1-5 with:

      1. Run S7 to get I = I_A union I_B, with per-point gap d(p) (S7 already computes d to build the
      band; if it does not expose it, add it to S7''s return).

      2. If |I| < n_min_iface -> N/A interface_too_sparse.

      3. d_min = min over I of d(p). I_tight = {p in I : d(p) <= d_min + iface_line_tight_frac * min(diag(A),
      diag(B))}.

      4. If |I_tight| < n_min_iface -> N/A interface_line_no_tight_contact.

      5. Mean-centre I_tight, eigendecompose, lam1 >= lam2 >= lam3, axes v1,v2,v3. aniso = sqrt(lam2/lam1).
      If aniso > iface_line_aniso_max -> N/A interface_line_ill_conditioned. Freeze iface_line_aniso_max
      <= 0.25 (measured separation: genuine hinge band 0.05, full perimeter/face 0.50-0.92).

      6. NEW localization gate: let ext_k(P) = max_p dot(p - mean(I), v_k) - min_p dot(p - mean(I), v_k),
      computed with the I_tight axes. Require BOTH |I_tight| <= iface_line_cover_max * |I| AND ext_2(I_tight)
      <= iface_line_band_frac * ext_2(I); otherwise -> N/A interface_line_not_localized. Rationale: when
      the whole mating region is equidistant (uniform-gap or overlay door) the tight set is the whole
      interface and carries zero information about which edge is hinged, so the only sound answer is abstention.
      Suggested frozen starts, to be moved by fault injection per P0 section 12: iface_line_tight_frac
      0.02, iface_line_cover_max 0.35, iface_line_band_frac 0.35.

      7. u = v1; cmp(u, a).

      Add to evidence: d_min, n_tight, cover_frac = |I_tight|/|I|, band_frac = ext_2(I_tight)/ext_2(I).
      Add N/A reasons interface_line_no_tight_contact and interface_line_not_localized to na_condition.
      Optional strengthening that adds information without a tautology (anchor and axis are independent
      declared fields): when the same joint declares anchor = {on_edge_of: X}, additionally require v1
      to be within axis_angle_deg of the direction of the edge of X nearest to I_tight, else N/A interface_line_edge_disagrees.


      FIX 2 — (D) symmetry_axis_of: make the verification actually verify.

      1. Restrict the angle grid to theta in [sym_angle_min_deg, 360 - sym_angle_min_deg] stepping by
      sym_angle_step_deg, and freeze sym_angle_min_deg >= 30 (measured: e(5 deg) = 0.006-0.014 for every
      shape tested, symmetric or not, so any grid reaching small angles is vacuous). Drop sym_angle_max_deg
      in favour of the full 360 sweep so n-fold orders are all reachable.

      2. Replace "e_sym = min over theta" with an ORDER test that a lone 180 deg hit cannot satisfy: let
      theta* = argmin over the restricted grid of e(theta), n = round(360 / theta*). Require n >= 3 AND
      e(k * theta*) <= sym_chamfer_max for every k = 1..n-1; otherwise -> N/A symmetry_axis_unverified.
      This rejects every centrally symmetric non-revolution part (box, panel, bracket), which only ever
      satisfies n = 2. Report n as detected_order in the evidence alongside e_sym and theta_star_deg.

      3. Guard the normalization: if diag(X) < 1e-9 m -> N/A symmetry_axis_degenerate_extent, before any
      division. Never let nan reach the comparison (nan fails every > test and silently passes gates).


      FIX 3 — determinism, pin each of these verbatim in the spec:

      - Fibonacci sphere: for i in 0..K-1 (K = cone_dirs): z = 1 - (2*i + 1)/K; r = sqrt(max(0, 1 - z*z));
      phi = i * pi * (3 - sqrt(5)); u_i = (r*cos(phi), r*sin(phi), z).

      - argmax tie-break: among all i attaining max s_pm within 1e-12, take the smallest index i.

      - Quantile: numpy.quantile(x, cone_quantile, method="linear"), each interface normal contributing
      exactly one unweighted sample.

      - Eigenvectors: canonicalize each v so its largest-magnitude component is positive; on a tie, the
      lowest component index decides. In (D) the theta grid is symmetric about 180 deg, so the sign cannot
      change e_sym once fixed.

      - Step 8: if |dot(u*, c(B) - c(A))| < 1e-12, leave u* unflipped.

      - S4 point order: concatenation of the part''s geoms in ascending geom index, and within a mesh
      in ascending vertex index; stride = ceil(|points| / sym_sample_n), starting at index 0.


      FIX 4 — degeneracy, add to na_condition:

      - interface_parts_share_geoms: bind(A).geoms intersect bind(B).geoms is non-empty (applies to interface_normal,
      interface_line and toward).

      - toward: N/A toward_centroids_coincident when sep < toward_min_sep_frac * min(diag(A), diag(B))
      OR sep < 1e-9 m (absolute floor, so a zero-diag part abstains instead of failing on nan).

      - relational_type_unknown: axis.relational.type outside {interface_normal, interface_line, toward,
      symmetry_axis_of}; and add the matching P0 admission check A13 ("axis.relational.type must be one
      of the four frozen words") so a contract typo is rejected before generation, per R1.


      FIX 5 — plumbing:

      - Declare the tolerances change explicitly in deviates_from_spec and amend P0 section 12 / A12:
      the frozen block gains a nested kf1 sub-block whose keys are exactly those named in p0_inputs plus
      the new iface_line_tight_frac, iface_line_cover_max, iface_line_band_frac, sym_angle_min_deg, sym_min_order;
      A12''s completeness check must enumerate them so a contract missing one is rejected before generation,
      and the hash covers them.

      - Extend mj_inputs with mesh_faceadr, mesh_facenum, mesh_face (or state that S7 owns normal derivation
      and this item never recomputes normals — then delete mesh_vert* from this item''s mj_inputs, since
      only (D) reads vertices).

      - (D) KD-tree: either add scipy to evo-p0p3''s dependencies, or specify the numpy fallback — brute-force
      nearest neighbour in blocks of 256 query points against S, which at sym_sample_n <= 4096 is 16.8M
      distances per angle and well inside budget.'
- item: KF1.axis_numeric
  lens: kf1
  verdict:
    sound: false
    problem: 'What passes: this is NOT a tautology (n_X comes from X''s mesh vertices, xaxis from mjModel.jnt_axis
      + body_xmat — two independent model fields; verified even in the worst case where X is the joint''s
      own part, where the comparison reduces to local panel normal vs. local jnt_axis and can still fail).
      Every API named is real in MuJoCo 3.11 — verified live: mjData.xaxis is (njnt,3) and gives the world
      slide/hinge direction, mjData.xanchor (njnt,3), mjModel.opt.gravity (3,), geom_xmat (ngeom,9). No
      whole-asset bounding-box diagonal is used anywhere. Five defects remain, the first decisive.


      (1) DECISIVE — the object-frame convention is invented, undefined in P0, and contradicts P0''s own
      only numeric example, guaranteeing a 90-degree FAIL on a correct asset. Step 5 sets x_obj = front.
      P0 (/Users/wanglin/Desktop/task-2_08-19-p0.html, §06 and §07) never states which object-frame axis
      is "front"; §06 says only "从 X 的实际几何算出朝前方向，据此建立物体坐标系". The single numeric example in the whole contract
      is §07''s drawer: `# numeric: [0, -1, 0]` on drawer_1_slide, with `envelope_m: {x:[0.4,0.8], y:[0.3,0.6],
      z:[0.9,1.4]}` — x is width, y is depth, z is height, so a drawer pulling out toward the front travels
      along -y. That fixes P0''s implied convention at front = -y_obj. Under the item''s x_obj = front,
      R_obj = columns[(0,-1,0),(1,0,0),(0,0,1)] and w = R_obj @ [0,-1,0] = (-1,0,0), while the correct
      model''s xaxis = (0,-1,0). Computed: |cos| = 0.0, ang_deg = 90.0, versus axis_angle_deg = 15.0.
      A perfectly correct cabinet fails. `deviates_from_spec` is empty when it should have flagged this
      as an unresolved contract gap rather than silently choosing an axis.


      (2) Two tolerance keys are invented and valueless, under a sub-block that does not exist. p0_inputs
      and steps 2/4 read `tolerances.kf1.panel_planarity_max` and `tolerances.kf1.front_min_tilt_deg`.
      Grepped the revised P0: neither string appears, and there is no `kf1` nesting — §12''s tolerances
      block is flat with exactly 9 keys (axis_angle_deg, anchor_side_fraction_min, anchor_center_offset_max,
      travel_scale_min, follower_drift_m, state_match_relative, required_contact_m, forbidden_penetration_m,
      coupling_residual), and both worked examples (§13, §14) instantiate it flat. So the code KeyErrors
      on every real contract the moment front is anchored, and no numeric value for either threshold exists
      anywhere — precisely the "13 unnamed thresholds silently decided by the coder" that R3 (§02) and
      A12 (§15) exist to prevent. Again `deviates_from_spec` is empty.


      (3) The sign rule in step 3 is undefined at dot == 0, and that is guaranteed, not hypothetical.
      c_asset is the size-weighted mean over "all bound required_parts Q" — which includes X. For an asset
      where X is the only bound required part, c_asset == c(X) exactly, dot == 0, and "flip n_X so dot
      > 0" is unsatisfiable with no tie-break specified. Near zero the sign flips on last-bit noise. This
      is the single-body-asset degeneracy.


      (4) The planarity guard has a NaN hole. Step 2 tests `lam3/lam2 > panel_planarity_max`. For a collinear
      or single-point vertex set (lam2 = lam3 = 0) the ratio is 0/0 = NaN; verified that `NaN > 0.05`
      evaluates False, so the guard does not fire, execution continues, and v3 is an arbitrary LAPACK
      output. A fully degenerate anchor silently produces a score instead of N/A.


      (5) `normalize(axis.numeric)` divides by zero on a zero or near-zero declared vector; no N/A covers
      it. Related smaller gaps: no guard for opt.gravity == 0 (z_up undefined via S6); "points(X)" PCA
      is weighted by vertex count, so a front panel whose body also carries a 5000-vertex knob mesh has
      its normal set by the knob rather than the panel; the summation order for c_asset over required_parts
      is unspecified (float sum is order-sensitive); `k*` is undefined when the bound chain has more than
      one joint (N/A only covers len(chain)==0); and when numeric is parallel to z_obj the result is completely
      independent of R_obj and numerically identical to KF1.axis_semantic''s vertical test, so it adds
      a duplicate claim to the KF1 denominator — the same double-counting §07 already outlawed for states/ref/range.'
    fix: "(1) Freeze the convention in P0 §06 and restate step 5 to match P0's own example. Add a normative\
      \ sentence to §06: \"object frame: +z = up (gravity), -y = front (the direction canonical_frame.front\
      \ points), +x = right; this matches envelope_m's x=width / y=depth / z=height.\" Replace step 5\
      \ with:\n    f = normalize(h)              # world forward\n    y_obj = -f ; z_obj = z_up ; x_obj\
      \ = cross(y_obj, z_obj)\n    R_obj = columns [x_obj, y_obj, z_obj]\nVerified: with f = -y_world\
      \ this yields R_obj = I, so P0's declared [0,-1,0] maps to w = (0,-1,0), |cos| = 1.0, ang_deg =\
      \ 0.0 — PASS on the correct asset, and the frame degenerates to identity for any asset already modelled\
      \ in P0's envelope convention, which is the right sanity property. Also un-comment §07's `numeric:\
      \ [0,-1,0]` line into a worked front-anchored example so any future convention change is caught\
      \ by a regression, and set deviates_from_spec to record that P0 §06 previously left the axis assignment\
      \ undefined.\n\n(2) Add the two thresholds to P0 §12's flat block as `panel_planarity_max: 0.10`\
      \ and `front_min_tilt_deg: 20.0` (initial protocol values, to be calibrated by the §12 fault-injection\
      \ procedure — inject a progressive tilt of the anchor panel and take the knee), rename the item's\
      \ references from `tolerances.kf1.X` to `tolerances.X`, and extend A12's completeness check to require\
      \ them whenever any joint declares axis.numeric. Sanity-check the value: a 1.0 x 0.5 x 0.01 m panel\
      \ has lam3/lam2 ~ (0.01/0.5)^2 = 4e-4, three orders below 0.10; a sphere-like part gives 1.0.\n\n\
      (3) Exclude X from c_asset (c_asset = size-weighted mean over bound required_parts \\ {X}), iterate\
      \ in required_parts declaration order (which §04 makes a fully enumerated, deterministic list) and\
      \ sum in that order. Then add an N/A: if the remaining set is empty, or |dot(n_X, c(X) - c_asset)|\
      \ < front_sign_min_offset_m (add to §12, initial 1e-4), report N/A with reason front_sign_undetermined\
      \ and emit c_X, c_asset, and the dot value as evidence.\n\n(4) Reorder the step-2 guard to test\
      \ magnitudes before the ratio: if lam2 <= eig_min_variance (add to §12, initial 1e-12 m^2) report\
      \ N/A front_anchor_degenerate; only then evaluate lam3/lam2. Equivalently write the guard as `if\
      \ not (lam3 <= panel_planarity_max * lam2 and lam2 > eig_min_variance)` so any NaN falls to N/A\
      \ rather than through it. Emit panel_eigenvalues either way.\n\n(5) Add these to na_condition: |axis.numeric|\
      \ < 1e-9 (reason numeric_degenerate); |opt.gravity| < 1e-9 (reason up_undetermined); len(chain)\
      \ != 1 (replacing len(chain)==0, since k* is otherwise undefined for a multi-joint chain) with reason\
      \ chain_not_unique. Change \"points(X)\" to area-weighted PCA — accumulate the covariance over triangle\
      \ centroids weighted by triangle area, using mesh_face/mesh_vert via S2/S4, so vertex density cannot\
      \ steer the normal; state the covariance normalization (population, divide by total weight) so the\
      \ eigenvalues are reproducible. Finally, add an evidence field `redundant_with_semantic: bool`,\
      \ set true when |dot(normalize(axis.numeric), z_obj)| >= cos(radians(axis_angle_deg)) or <= sin(radians(axis_angle_deg)),\
      \ and exclude those claims from the KF1 denominator when the same joint also declares axis.semantic\
      \ — in that regime R_obj cancels out entirely and the claim is a bit-identical copy of KF1.axis_semantic."
- item: KF1.anchor
  lens: kf1
  verdict:
    sound: false
    problem: 'Passes the tautology, API and normalization checks, but fails on discrimination, on the
      canonical positive case, and on threshold freezing. I implemented form A verbatim and ran it on
      a 0.6 x 2.0 x 0.04 m door panel (axis vertical, world frame).


      (1) DECISIVE — on_edge_of does not test "on that part''s edge", only "not through the interior",
      so the anchor is unbounded outward and the mandated calibration curve has no knee. By the separating-hyperplane
      theorem, f_best = 1.0 exactly when o''s projection lies outside the convex hull of the projected
      points; distance never enters. Measured: hinge displaced 0.6 m clear of the panel (i.e. authored
      onto the cabinet''s opposite stile) -> f_best = 1.000 PASS; 5 m away -> f_best = 1.000 PASS. Now
      the jnt_pos sweep the CALIBRATION REQUIREMENT mandates, severity in units of panel width W: displacement
      INTO the panel detects (0.02W:0.91, 0.05W:0.91, 0.1W:0.86, 0.25W:0.71, 0.5W:0.55 — all FAIL); displacement
      AWAY detects nothing at any magnitude (0.02W through 10W all f_best = 1.00 PASS). So half of all
      injection directions reproduce the previous attempt''s zero-detection result by construction, and
      P0 §12''s "detection-rate vs fault-severity curve, take the knee" has no knee on that half. The
      claim string ("sits ... on that part''s edge") is not what the algorithm computes. (Note 1.0W, axis
      at the door''s opposite edge, legitimately passes — a door may hinge on either edge — so the severity
      axis is not monotone past |delta| = W either.)


      (2) DECISIVE — the half-open window rejects the canonical positive. In the natural URDF authoring
      of an edge hinge (joint origin at the hinge, child <visual> offset by (W/2,0,0), panel centred on
      the axis in thickness) the entire hinge-side face lies at exactly ±90 deg, i.e. ON the boundary
      line, not on the wrong side. [phi_i, phi_i + pi) admits the -90 deg half and discards the +90 deg
      half. Measured with eps_frac = 0.005 on the CORRECT door across eight tessellations of the same
      panel: f_best = 0.951, 0.914, 0.961, 0.940, 0.968, 0.939, 0.954, 0.913 — four of eight fall below
      anchor_side_fraction_min = 0.95 and reject a correct door, and the one that "passes" clears the
      threshold by 0.001. The verdict also flips with eps_frac (at 0.02 the same door gives 1.000, because
      the whole face gets dropped as on-axis). The item predicts "f_best ~ 1.00" here; it is not. So whether
      the gold-standard asset scores 1.0 — P0 §16''s acceptance test — is decided by mesh tessellation
      and by a constant the contract never assigns a value to.


      (3) Threshold/schema violations. p0_inputs names kinematic_claims.tolerances.kf1.anchor_edge_radius_eps_frac,
      but P0 §12''s tolerances block is FLAT with exactly nine keys and admission A12 requires it complete;
      there is no kf1 sub-block and no such key. n_valid < 32 and "more than half of P is dropped" are
      two further unfrozen magic numbers, violating R3 ("no threshold defaults scattered in the code").
      deviates_from_spec is empty although the item does deviate. Separately, scaling the radial eps by
      diag(X) is the wrong scale: on_edge_of parts are precisely those whose longest dimension IS the
      hinge axis, so for the test door diag(X) = 2.088 m against a perpendicular extent of 0.601 m — a
      3.5x overstatement that varies part to part.


      (4) Minor, but they block "no further decisions": best_half_plane_dir_world has no tie-break though
      many candidates tie at f_best = 1.0 on a correct door, so the evidence field is not reproducible;
      P = points(X) is never stated to be world-frame at REF (o and a are), and a local-frame point set
      silently breaks everything; c(X) is not stated to exclude mjModel.body_ipos / subtree_com, which
      carry the inertia we synthesize and which must never influence a score.


      Checks that PASS and should not be re-litigated: not a tautology — at qpos == qpos0 MuJoCo computes
      xpos = xanchor - R*jnt_pos = xpos_orig, so mutating jnt_pos moves xanchor while leaving the child
      body pose and every geom vertex untouched (verified numerically); (p - o) genuinely changes. mjData.xanchor/xaxis
      are (njnt,3) world-frame after mj_kinematics, mjModel.jnt_type/mjJNT_HINGE exist in 3.11, no contacts
      are needed, nothing normalizes by a whole-asset diagonal, and f_best is invariant both to the sign
      of the joint axis and to the joint''s own q.'
    fix: 'Five changes; (A) and (B) are required.


      (A) Make on_edge_of a conjunction, adding the proximity term the claim already promises. Step 3
      already computes |r_p| for every p; keep the minimum over ALL of P, before the on-axis drop: d_near
      = min_p |r2_p|. Pass form A iff f_best >= anchor_side_fraction_min AND d_near <= anchor_edge_proximity_max
      * diag_perp(X). Emit d_near, d_near/diag_perp, and margin_near = anchor_edge_proximity_max - d_near/diag_perp
      alongside the existing fields. This makes the injection curve two-sided: inward displacement kills
      f_best, outward kills d_near (at 0.05W the test door''s d_near = 0.030 m sits exactly at 0.05*diag_perp,
      giving a clean knee), and the 3W/10W cases now fail as they must. Restrict the calibration sweep
      to |delta| <= W and say so, since delta = W is the opposite edge and is a legitimate pass.


      (B) Replace the angular half-open window with a signed-distance count carrying an explicit on-plane
      band, so coplanar vertices are not split on a knife edge (this also removes the float hazard: for
      a mid-plane hinge, dot(r,e1) is ±1e-17 noise, so the current rule assigns those vertices by rounding).
      For each surviving point direction phi_i take n_i = (-sin phi_i, cos phi_i) and s_j = dot(r2_j,
      n_i); with eps_plane = anchor_edge_radius_eps_frac * diag_perp(X), let C_plus(i) = #{j : s_j >=
      -eps_plane} and C_minus(i) = #{j : s_j <= +eps_plane}. Candidate i is admissible iff #{j : |s_j|
      <= eps_plane} <= anchor_on_plane_max_frac * n_valid (freeze at 0.25); f_best = max over admissible
      i of max(C_plus, C_minus)/n_valid; if no candidate is admissible report N/A anchor_degenerate_coplanar.
      The rotate-until-you-hit-a-point argument still makes the sweep exact, the correct door now scores
      1.000 at every tessellation tested, and the admissibility guard preserves the case the half-open
      convention was protecting — a zero-thickness plate hinged on its own centreline has 100% of points
      coplanar with its own plane, so that plane is inadmissible and the best admissible plane still gives
      0.5 FAIL.


      (C) Normalize form A by diag_perp(X) = the diagonal of the 2-D bounding box of {r2_p} (all of P
      projected onto the plane perpendicular to a), not diag(X). Leave form B on diag(X) — P0 §07 specifies
      anchor_center_offset_max x diag(part) literally there, and the gear case is genuinely 3-D.


      (D) Add the constants to P0 §12''s flat tolerances block and set deviates_from_spec accordingly:
      anchor_edge_radius_eps_frac (initial 0.01), anchor_edge_proximity_max (initial 0.05), anchor_on_plane_max_frac
      (0.25), anchor_min_valid_points (32), anchor_max_dropped_frac (0.50). Each is calibrated by the
      same one-predicate injection sweep and enters the frozen hash.


      (E) State in the spec: P = points(X) is evaluated in the WORLD frame at REF, consistent with o and
      a; c(X) is the purely geometric centroid of X''s bound geoms and must never be read from mjModel.body_ipos,
      body_mass or subtree_com, because that inertia is the one we synthesize; and best_half_plane_dir_world
      reports the admissible argmax with the smallest phi_i, ties broken by that ordering.'
- item: KF1.range_ref_state
  lens: kf1
  verdict:
    sound: false
    problem: 'Four defects, the first two blocking.


      (1) FATAL — C3 is a constant on the real corpus; it can never fail because of the asset, only because
      of how the contract was written. Measured: I loaded 547 of the 551 real URDFs from /Users/wanglin/Desktop/articraft-data/cache
      and read qpos0[jnt_qposadr[k]] for all 2654 slide+hinge joints. It is exactly 0.0 for 2654/2654,
      zero exceptions. This is structural, not luck: `ref` is an MJCF-only joint attribute and MuJoCo''s
      URDF importer never sets it. I verified a revolute joint carrying <calibration rising="0.3"/> and
      <mimic multiplier="2" offset="0.1"/> still compiles to qpos0=[0.], and so does one whose own <limit
      lower="0.1" upper="0.5"/> excludes zero. The item''s sole failure story — "A drawer whose MJCF sets
      qpos0 to the half-open position fails C3" — presupposes a hand-written MJCF `ref`, which does not
      exist in this pipeline. So C3 reduces to `|0 - v_ref| <= tol`, a test of the contract, evaluated
      identically for a perfect asset and a broken one. Both directions are harmful. 1602 of 2168 limited
      joints (73.9%) have a range starting at 0, so C3 auto-passes and pads the KF1 numerator for free.
      Conversely 498 (23.0%) are two-sided (neither endpoint at 0) — a tilt/swivel stand declaring states
      {left: -0.35, right: 0.35} with no `closed` and no `home` hits the specified fallback v_ref = range.min
      = -0.35, C3 = False for every asset including a correct one, and because the four sub-conditions
      are ANDed it zeroes the whole claim. This is the same class the team was already bitten by: a quantity
      that cannot move in response to asset quality.


      (2) BLOCKING — the tolerance fields named do not exist, and neither does the namespace. p0_inputs
      reads kinematic_claims.tolerances.kf1.{range_rel_tol, range_abs_tol}. Revised P0 §12 freezes a FLAT
      nine-key block: axis_angle_deg, anchor_side_fraction_min, anchor_center_offset_max, travel_scale_min,
      follower_drift_m, state_match_relative, required_contact_m, forbidden_penetration_m, coupling_residual.
      There is no `kf1` sub-map and no range tolerance of any kind; both worked examples (§13 cabinet,
      §14 gear pair) raise KeyError at tolerances["kf1"]. A12 ("tolerances 块完整") would not validate the
      invented keys and R3 forbids thresholds that live only in code. Separately, one scalar range_abs_tol
      cannot serve both units: 0.01 means 1 cm on a slide and 0.57° on a hinge, and §12''s design rule
      is that each threshold serves exactly one predicate so fault-injection calibration of one does not
      move another.


      (3) REAL — C4 is logically implied by C2 and fires alone only when the contract is self-inconsistent,
      in which case it charges a contract typo to the asset. Proof: C2 gives |lo_m - min| <= tol and |hi_m
      - max| <= tol; for any state v with min <= v <= max, v >= min >= lo_m - tol and v <= max <= hi_m
      + tol, so C4 holds. In both unlimited branches C4 is True by construction. So C4 adds a bit only
      when some declared state lies outside [range.min, range.max] — and no admission rule A1..A12 forbids
      that. The item''s own can_it_fail ("fails C2 and C4") demonstrates the redundancy rather than refuting
      it; "the open state is unreachable" is not independent information.


      (4) UNDER-SPECIFIED — branches an engineer must still decide. (a) k* is never defined: the N/A rule
      mentions len(chain)==0 but never says which chain element is k*. (b) The ball branch is half-specified
      and dead: MuJoCo rejects a ball with jnt_range[0] != 0 at compile time (verified: "range[0] should
      be 0 in ball joint"), so C2''s |lo_m - range.min| term has no defined meaning, and the ball C3 substitute
      is given only "when v_ref == 0" with the v_ref != 0 case blank — while the corpus contains 0 ball
      and 0 free joints in 2654. (c) first_unreachable_state depends on dict iteration order with no ordering
      rule stated. (d) `states` absent or empty is not addressed.


      Clean on the rest: no whole-asset bbox diagonal anywhere (tol normalizes by the joint''s own declared
      span, exactly as prescribed); every named array (jnt_limited, jnt_range, jnt_type, jnt_qposadr,
      qpos0) exists in MuJoCo 3.x with the stated shape; no mjData needed; and the note that jnt_range
      is always radians/metres regardless of compiler angle is correct (verified: range="0 45" in degrees
      compiles to [0, 0.7854]). C1 and C2 genuinely survive the tautology check — the model side varies
      (2168 limited vs 486 unlimited, median limited span 0.175, max 200.0).'
    fix: "(1) Delete C3 from the scored conjunction. The claim becomes C1 and C2 (and C4 demoted per (3)),\
      \ i.e. \"limited flag and range values\". Emit qpos0_value and v_ref as evidence only, the same\
      \ status the item already gives contract_unit_mismatch. Also delete the v_ref fallback chain to\
      \ range.min — that fallback is the exact mechanism that manufactures the false failures on the 23%\
      \ two-sided joints; if neither `closed` nor `home` is declared there is no reference claim and nothing\
      \ to score. If a rest-state check is still wanted it cannot be a declaration read: the real content\
      \ is \"at q = v_ref the part is geometrically in its closed pose\", which under revised P0 is already\
      \ contact_policy.required {relation: stop_contact, state: closed} and belongs to KF3, not KF1. Optionally\
      \ keep one cheap model-side integrity guard in C3's place — `lo_m - tol <= qpos0 <= hi_m + tol`,\
      \ which can genuinely fail (a URDF whose <limit> excludes its own rest pose compiles fine) — but\
      \ it fired 0/2168 times on this corpus, so report it as an integrity flag (`rest_outside_own_limits`)\
      \ and keep it OUT of the applicable denominator, otherwise it just adds a term that is always 1.\n\
      \n(2) Add the thresholds to the frozen flat tolerances block, unnested, split by unit, and reference\
      \ them without the kf1 namespace:\n    range_rel_tol:      0.05    # relative to declared travel\
      \ span\n    range_abs_tol_m:    0.002   # slide\n    range_abs_tol_rad:  0.017   # hinge/ball, about\
      \ 1 degree\n  tol = range_rel_tol * span_decl + (range_abs_tol_m if range.unit == \"m\" else range_abs_tol_rad).\n\
      \  Add all three keys to A12's completeness list and to both worked examples in §13 and §14 so the\
      \ frozen-contract hash covers them.\n\n(3) Add admission rule A13: every value in joints[].states\
      \ must lie in [range.min, range.max] (for a ball, in [0, max]). Then demote C4 to evidence-only\
      \ — keep reachable_by_label and first_unreachable_state in the evidence, drop C4 from the AND. The\
      \ scored claim is then C1 and C2, which is what P0 §07's de-duplication rule actually asks for.\n\
      \n(4) Close the open branches:\n  (a) Define k* explicitly: bind part -> body b via the Gate table,\
      \ then k* = the single joint owned by b, indices body_jntadr[b] .. body_jntadr[b]+body_jntnum[b]-1.\
      \ N/A with reason `no_joint` when body_jntnum[b] == 0; N/A with reason `multi_joint_body` when body_jntnum[b]\
      \ > 1 (legal MJCF, does not occur in this URDF corpus). Drop \"len(chain)==0\" in favour of this.\n\
      \  (b) Declare the ball branch N/A with reason `ball_unsupported` and delete the half-written ball\
      \ rules; the corpus has 0 ball and 0 free joints in 2654. If you insist on keeping it: require the\
      \ contract to write a ball range as {min: 0, max: theta}, have C2 compare only max against jnt_range[k*][1],\
      \ and make the ball reference check N/A unconditionally.\n  (c) Specify the ordering: \"labels are\
      \ iterated in contract document order (YAML/JSON load order, preserved by Python 3.7+ dicts); first_unreachable_state\
      \ is the first in that order.\"\n  (d) State that an absent or empty `states` makes C4 vacuously\
      \ true and, with fix (1), makes the reference evidence N/A.\n\nTwo implementation notes to record\
