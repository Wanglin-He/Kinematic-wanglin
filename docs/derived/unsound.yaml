      \ comparison against forbidden_penetration_m is normative and that reported clearances are advisory,\
      \ or clamp/flag exact-0.0 returns as unreliable.\n- State the sweep grid explicitly in the item\
      \ (the numbers imply θ_k = 2.094·k/15, k=0..15, product grid over the three independent DOFs) and\
      \ specify the tie-break for \"worst q\" (lowest lexicographic index wins). With the fix the argmin\
      \ is unique, but the rule still has to be written down.\n- Update `defect`/`expected` prose: the\
