- item: KF3.sweep.layer3_state_combinations
  lens: kf3
  verdict:
    sound: false
    problem: 'Tautology check passes (this is a sampler, not an asset predicate) and there is no whole-asset-diagonal
      normalization. But six defects remain, two of them substantive.


      **(1) Step 6''s stated justification is arithmetically false, so the item''s own reason for existing
      is wrong.** It says that "with a relative state tolerance of 0.02 and a 33-point scan whose spacing
      is 1/32 = 0.031 of the span, a state value at an arbitrary interior point of the range can be missed
      by every layer-1 sample." 33 points → 32 intervals → worst-case distance from any interior value
      to the nearest layer-1 grid point is 1/64 = 0.015625 of the span, which is **less** than state_match_relative
      = 0.02 (frozen in the `tolerances` block, /Users/wanglin/Desktop/task-2_08-19-p0.html §12). So under
      P0 §10''s classification rule `|q_j − states_j[s]| ≤ 0.02 × span_j`, layer 1 can never miss a state
      — a miss needs fewer than 25 intervals. An engineer who checks the arithmetic concludes layer 3
      is unnecessary and deletes it. The layer *is* necessary, but for a different reason the item never
      states: classification tolerance is two orders of magnitude coarser than the contact thresholds
      the samples feed. On drawer_1_slide (span 0.40 m, Example A) a merely-classified sample sits up
      to 0.015625 × 0.40 = 6.25 mm from true `closed`, while `required_contact_m` = 0.002 m — so `{parts:
      [drawer_1, cabinet_body], state: closed, relation: stop_contact}` fails at a sample that the classifier
      happily labels `closed`. Exactness is needed for the *consumer* of the state, not for the classifier.


      **(2) The truncation seed sets (a)+(b) are indexed by numeric rank, not by label, so a genuine multi-joint
      asset_state can be dropped.** V_j is sorted ascending, so index i means different labels on different
      joints whenever a joint''s range runs negative — a door hinged the other way (`range {min: -2.094,
      max: 0.0}`, `states {closed: 0.0, open: -2.094}`) puts `open` at index 0 while every drawer puts
      `closed` at index 0. I enumerated (a) UNIFORM ∪ (b) ONE-HOT for two such drawers plus that door:
      the all-`closed` tuple survives (it is one-hot from the base) but the all-`open` tuple (0.40, 0.40,
      −2.094) is in neither set. That tuple is exactly what P0 §10 `scope: all_declaring` requires in
      order to classify the asset state at all (Example B''s `home` uses `all_declaring`). So under truncation
      the claim "every asset_state that is reachable within the declared ranges is hit exactly" is false.
      Note also that `kinematic_claims.asset_states` is listed in p0_inputs but is never read by steps
      1–6 — this missing seed set is the use it should have had.


      **(3) The cap can silently break the "certificate".** pass_condition is stated as an unconditional
      invariant, but step 4 says drawing stops when |a|+|b|+|c| = state_combo_max = 4096, and never says
      what happens if |a|+|b| alone exceeds the cap (|b| = Σ_j(|V_j|−1) grows with d). Undefined whether
      seeds get dropped, which ones, and in what order. The item also never says what the harness does
      when the certificate fails — assert and abort, or record and continue.


      **(4) Determinism gaps (three unspecified tie-breaks).** (i) The indexing j = 1..d is never bound
      to anything — "j=1 as the most significant digit" is meaningless until you say the order comes from
      the `independent_dofs` list; if D is materialized as a set anywhere, mixed-radix order, `global_sample_index_range`,
      and the Sobol dimension mapping all become build-dependent. (ii) "deduplicated at 1e-12" does not
      say absolute or relative, and does not say which of two near-equal values survives — and that choice
      directly contradicts the bitwise pass condition: if two labels differ by 5e-13 the survivor is placed
      bitwise and the other label''s value never is, so a legitimate contract fails the certificate. (iii)
      `sobol_skip` is referenced but never defined here, and "the frozen Sobol generator of KF3.sweep.layer4_sobol
      … with shift stream seed 0x5EED5081C0DE0002" pins a seed but not the generator/scramble implementation;
      `scipy.stats.qmc.Sobol` scrambling is not stable across versions.


      **(5) mj_inputs is incomplete and the multi-DOF / continuous cases are undefined.** The algorithm
      needs ref_j — that is `m.qpos0[m.jnt_qposadr[j]]`, and `m.qpos0` is not listed — and needs lo_j/hi_j
      for `state_value_outside_range`, with no statement of whether these are the P0 `range.min/max` or
      `m.jnt_range`. If `m.jnt_range` is used, a URDF `continuous` joint compiles to `jnt_limited = 0`
      with `jnt_range = [0, 0]` (established fact for this corpus), so every state value gets flagged
      outside range — Example B''s gear hinges are precisely this shape. Separately, P0 §07 permits `type:
      ball | free` and A5/A6 do not exclude such a joint from `independent_dofs`; `m.jnt_qposadr` alone
      is not enough for a 4- or 7-wide qpos block, a scalar `states` value is undefined there, and `mj_forward`
      re-normalizes the quaternion, so a "bitwise equal" certificate over qpos cannot hold. No N/A branch
      covers this.


      **(6) Step 5 under-specifies what a layer-3 "sample" is.** It says the samples feed the collision
      half, but the combination is built only over D. P0 §10 requires dependent joints to be filled from
      `couplings.relation` before `mj_forward`; if that is only stated in a sibling item it must be cross-referenced
      here, otherwise a gear-pair sample is evaluated with the dependent gear left at ref and the `mesh_contact`
      required pair fails spuriously.'
    fix: 'Six edits, all local to this item.


      **Step 6 — replace the false rationale.** "Layer 1 cannot be relied on to place a state value: its
      nearest grid point is within 1/64 = 0.0156 of the span, which does satisfy the P0 §10 classifier
      at state_match_relative = 0.02, but it is far too coarse for what the classified sample is then
      used for. On drawer_1_slide (span 0.40 m) that residual is up to 6.25 mm, while required_contact_m
      = 0.002 m, so a stop_contact obligation asserted at `closed` fails at a sample the classifier labels
      `closed`. Layer 3 places the exact declared value so that required-contact and forbidden-penetration
      queries are evaluated at the state the contract actually asserts, not within a tolerance ball of
      it. Second, layer 1 is a one-DOF-at-a-time scan, so it never realizes a joint *tuple*; asset_states
      with scope `all_declaring` are only reachable in layers 3 and 4."


      **Step 1 — fix dedup, ordering, and range source.** "Order the driven DOFs j = 1..d by their order
      of first appearance in `kinematic_claims.independent_dofs` (a list, hence total and deterministic);
      this ordering fixes the mixed-radix digits, the Sobol dimensions, and `global_sample_index`. V_j
      = the values of `joints[j].states`, sorted ascending by IEEE-754 value; break exact ties by the
      label''s order of appearance in the contract. Deduplicate only bitwise-identical doubles — remove
      the 1e-12 threshold, since any tolerance-based dedup can discard a value the bitwise pass condition
      then demands. lo_j, hi_j are the declared `range.min`/`range.max` in SI (P0 A11 guarantees m for
      slide, rad for hinge/ball); never `m.jnt_range`. If `jnt_limited[j] == 0` (URDF continuous), emit
      `range_unlimited` and skip `state_value_outside_range` entirely."


      **Step 4 — add a label-tuple seed set and make seeds unconditional.** Insert as (a0), evaluated
      before (a) and (b): "for every label s appearing in `kinematic_claims.asset_states`, the combination
      q_j = joints[j].states[s] for every j ∈ D declaring s, and q_j = V_j[0] for every j ∈ D not declaring
      s. Labels in asset_states that no j ∈ D declares are emitted as `state_label_unbacked` and produce
      no seed (their P0 §10 scope is empty, making membership vacuous — record it, do not silently pass)."
      Then: "Seeds (a0), (a), (b) are never dropped; state_combo_max bounds only the (c) fill, whose budget
      is max(0, state_combo_max − |a0 ∪ a ∪ b|). If the seeds alone exceed state_combo_max, retain them
      all and record `seed_set_exceeds_cap` with the counts." This makes the certificate a real invariant.
      Also note in (a) that UNIFORM is a rank-index sweep, not a label sweep, and carries no semantic
      meaning once (a0) exists.


      **Step 4(c) — pin the generator.** Name the concrete implementation and the digital-shift RNG (e.g.
      "the Joe–Kuo direction numbers and the counter-based shift specified in KF3.sweep.layer4_sobol §N"),
      give `sobol_skip` its numeric value here rather than by reference, and state that a version bump
      of any third-party QMC library invalidates the frozen sampler and requires a re-freeze of the tolerances
      hash.


      **mj_inputs — complete it.** `m.jnt_qposadr, m.jnt_type, m.jnt_limited, m.qpos0` (ref_j := `m.qpos0[m.jnt_qposadr[j]]`).
      Add an N/A branch: "any j ∈ D whose `m.jnt_type` is mjJNT_BALL or mjJNT_FREE is excluded from D
      for layer 3 and recorded as `multi_dof_state_unsupported`; a scalar `states` value has no defined
      meaning across a 4- or 7-wide qpos block, and mj_forward re-normalizes the quaternion so bitwise
      placement cannot be certified. If this empties D, the item is N/A."


      **Step 5 / pass_condition — close the loop.** Add: "A layer-3 sample is the full qpos vector: driven
      DOFs take the combination values; every dependent joint of every coupling is computed from `couplings.relation`
      (q_dep = coefficient·q_indep + offset) and written before mj_forward; all remaining joints stay
      at qpos0. The bitwise certificate is asserted on the sample vector as written, before mj_forward.
      On violation the harness aborts with `per_dof_state_values`, the offending (j, s), and the retained
      set — a violation is a harness bug, never an asset finding."


      Files read: /Users/wanglin/Desktop/task-2_08-19-p0.html (authoritative schema; §07 joints, §10 independent_dofs/asset_states,
      §11 contact_policy, §12 tolerances, §15 A5/A6/A11), /Users/wanglin/Library/Containers/com.tencent.xinWeChat/Data/Documents/xwechat_files/wxid_cqazuduamjmf22_ce36/temp/drag/task-2_08-16-p3.html
      (KF3 scope).'
- item: KF3.sweep.layer4_sobol
  lens: kf3
  verdict:
    sound: false
    problem: 'The generator itself (steps 1-7) is correct — I implemented it verbatim and it matches Joe
      & Kuo''s sobol.cc recurrence, direction-integer, and Gray-code construction; no invented MuJoCo
      API (only mjModel.jnt_qposadr, which exists with shape (njnt,)); no whole-asset bbox normalization;
      no unseeded randomness. But the pass_condition and steps 6/8/9/10 are unsound. Six defects, three
      of which fire on every run.


      (1) FATAL, fires always — the second moment target is wrong. "the first two moments of each coordinate
      are within 1e-3 of 0.5 and 1/12". The second RAW moment of U[0,1) is 1/3; 1/12 is the VARIANCE.
      Implemented literally (mean(u), mean(u^2)) the check compares 0.33348 against 0.08333 — off by 0.2500,
      i.e. 250x the stated tolerance — so the certificate fails for every asset, forever. Measured: d=1,
      M=256, mean(u^2)=0.333483.


      (2) FATAL, fires always when d>32 — step 9 contradicts the certificate. Step 9 freezes driven DOFs
      33..d at ref, yet the certificate demands 0.5 / 1-12 moments for "each coordinate" of the M x d
      matrix and na_condition is only d==0. A frozen column has variance exactly 0 and mean (ref-lo)/span.
      Compounding this, step 6 sets M = 256*d using the full d, not min(d,32): d=78 gives M=19968 points
      of which 46 of 78 columns are constant.


      (3) FATAL, fires always — the certificate is stated in the wrong space. Step 8 emits q_j = lo_j
      + u*span_j; the pass_condition then says "the same M x d matrix" and applies 0.5 / 1-12. In q-space
      those become lo+span/2 and span^2/12. For any real joint (span != 1, lo != 0) the check fails. The
      moments only hold for the u matrix.


      (4) The 1e-3 tolerance is not achievable by construction at M=256 — it survives only by luck of
      the frozen seed. Proof: v_{k,c} = m_{k,c} << (32-c) with m_{k,c} < 2^c occupies only the TOP c bits,
      so within an aligned dyadic block of 2^m indices the low 32-m bits of x_{k,n} are CONSTANT and the
      top m bits are a permutation of 0..2^m-1. Hence mean(u_k) = 0.5 - 2^-(m+1) + f_k exactly, f_k in
      [0, 2^-m) fixed by the shift. Max |mean-0.5| = B/(2M), B = number of aligned dyadic blocks in [1024,
      1024+M). d=1: B=1, M=256 -> 1.953e-3, nearly 2x the tolerance. d=3: 1.302e-3. Measured with SOBOL_SEED=0x5EED5081C0DE0001:
      d=1 dim1 = +1.51e-4 (passes by luck), d=2/d=3 dim1 = -8.25e-4 (82% of the budget consumed). d=1
      is the single most common case in this corpus. Any change to SOBOL_SEED, SOBOL_SKIP, or the direction-table
      row convention flips d=1 or d=3 to a hard fail with no code change.


      (5) Step 10 truncation silently voids the certificate. "drop layer-4 points from the tail" leaves
      a non-dyadic retained_points R, and the bound becomes B/(2R) with B up to ~2*log2(R): R=300 -> 6.7e-3,
      R=1000 -> 3.0e-3, both far outside 1e-3. The pass_condition never says whether it is evaluated pre-
      or post-truncation, and truncation is the common case at large d (M=19968 at d=78 alone nearly exhausts
      total_samples_max=20000).


      (6) Direction-table off-by-one breaks the "identical for every generator" claim. The data rows of
      new-joe-kuo-6.21201 begin at dimension 2, so "the first 32 rows" is dims 2..33 = 33 Sobol dimensions,
      one more than sobol_dim_max=32 (dim 1 is the implicit identity). Two engineers will embed different
      literals and emit different direction_table_hash and sweep_config_hash. The hash''s serialization
      (field order, separators, header line, newline) is also unspecified, so even the same rows hash
      differently.


      (7) Degeneracy gaps not covered by na_condition (d==0 only): (a) span_j == 0 (lo==hi) gives a constant
      column -> variance 0 -> certificate fails; (b) an unlimited joint (jnt_limited==0, URDF continuous)
      has no finite lo/span and the item gives no fallback, only "inherited from independent_dofs"; (c)
      step''s "m.jnt_qposadr for writing" plus a scalar q_j is wrong for mjJNT_BALL (4 qpos, unit quaternion)
      and mjJNT_FREE (7 qpos) — a scalar write at jnt_qposadr leaves a non-unit quaternion and stale companions.


      (8) Minor: trailing_zeros(~(n-1)) must be taken on the 32-bit complement (~(n-1) & 0xFFFFFFFF);
      in Python ~0 == -1 and a naive trailing-zero count on it is undefined. c is also unbounded in principle
      while v holds only i=1..32.'
    fix: "Rewrite step 6, step 9's M, and the pass_condition; leave steps 1-5 and 7 as written.\n\nA.\
      \ Define d_eff = min(d, sobol_dim_max=32) and set M = 2**ceil(log2(256 * d_eff)), clamped to a minimum\
      \ of 512. Powers of two make [1024, 1024+M) a single aligned dyadic block (B=1), so the exact mean\
      \ bound becomes 1/(2M) <= 9.766e-4 for every d — provably inside 1e-3 rather than seed-dependent.\
      \ Record sobol_M_rounded.\n\nB. Restate the certificate precisely, on the u matrix:\n   Let U be\
      \ the M x d_eff float64 matrix u_{k,n} of step 7, BEFORE the affine map of step 8 and BEFORE any\
      \ step-10 truncation.\n   C1 (reproducibility): regenerating in a fresh process yields the identical\
      \ M x d_eff uint32 matrix ((x_{k,n} XOR s_k) & 0xFFFFFFFF) bitwise.\n   C2 (mean): for every column\
      \ k, |mean(U[:,k]) - 0.5| <= 1/(2*M) + 1e-12. Assert the analytic bound, not a magic 1e-3.\n   C3\
      \ (variance): for every column k, |pvariance(U[:,k]) - 1/12| <= 1e-4, where pvariance = mean(u^2)\
      \ - mean(u)^2 with the /M (population) divisor. Say \"sample variance\", never \"second moment\"\
      ; if a raw second moment is wanted the target is 1/3, not 1/12.\n   C2/C3 apply only to the d_eff\
      \ Sobol columns. Columns 33..d frozen at ref by step 9 are excluded and listed in evidence as frozen_columns.\n\
      \nC. Truncation must preserve the net. Replace \"drop layer-4 points from the tail\" with \"halve\
      \ M (M <- M/2, still a power of two, floor 512) until the budget fits, then proceed to the layer-3\
      \ and layer-2 reductions as written\". Halving keeps a single aligned dyadic block, so C2 still\
      \ holds at the reduced M. Record layer4_truncated and retained_points = M_final. The certificate\
      \ is evaluated at M_final.\n\nD. Pin the direction table. \"Embed the rows of new-joe-kuo-6.21201\
      \ for dimensions k = 2..32 inclusive — 31 rows, excluding the 'd s a m_i' header. Dimension 1 is\
      \ the implicit identity m_{1,i}=1 and has no row.\" Pin the hash: direction_table_hash = sha256\
      \ over the ASCII serialization of the embedded literal, one row per line in ascending k, fields\
      \ \"k s a m_1 .. m_s\" separated by single spaces, LF terminators, no trailing LF. Publish the expected\
      \ digest in the spec so an implementer can self-check.\n\nE. Degeneracy rules (extend na_condition\
      \ beyond d==0):\n   - Any DOF whose resolved joint is not mjJNT_HINGE or mjJNT_SLIDE (i.e. mjJNT_BALL\
      \ or mjJNT_FREE) is removed from the Sobol dimension list, held at qpos0, and recorded in unsweepable_dofs.\
      \ If that empties the list, the item is N/A with reason no_scalar_dofs. Do not write a scalar into\
      \ a ball/free qpos block.\n   - span_j == 0 (|hi-lo| <= 1e-12): drop column j from the Sobol dimensions,\
      \ hold at lo, record zero_span_dofs; it is excluded from C2/C3.\n   - jnt_limited == 0 (URDF continuous)\
      \ and the P0 claim declares no finite travel: use lo = qpos0 - pi, span = 2*pi for a hinge; for\
      \ a slide with no declared travel the DOF is N/A and recorded in unbounded_dofs. Emit span_source\
      \ in {\"p0_claim\",\"jnt_range\",\"wrap_2pi\"} per DOF.\n   - After writing every q_j, call mj_forward\
      \ once (which internally normalizes quaternions); never step.\n\nF. Step 4 detail: c = 1 + trailing_zeros((~(n-1))\
      \ & 0xFFFFFFFF), with assert 1 <= c <= 32.\n\nG. Restate the claim honestly: not \"identical for\
      \ every asset\" (M and d vary per asset) but \"for any two assets the shared Sobol dimensions agree\
      \ point-for-point over the common prefix, because s_k depends only on k and points are generated\
      \ in a fixed global index order\".\n\nH. Add to evidence: d_eff, sobol_M_rounded, frozen_columns,\
      \ zero_span_dofs, unbounded_dofs, unsweepable_dofs, span_source, per_column_mean, per_column_variance,\
      \ mean_bound_used."
- item: KF3.motion.travel_scale
  lens: kf3
  verdict:
    sound: false
    problem: 'The slide branch is fine, but the hinge/ball branch is a provable tautology, the ball/free
      branches are not computable as written, and the size measure is orientation-dependent. Four defects,
      verified with MuJoCo 3.3.7 (`/private/tmp/.../scratchpad`, throwaway scripts):


      (1) TAUTOLOGY — hinge/ball can never fail, including on the exact decoy the claim targets. Step
      4 builds T_j from r_max, and r_max is measured from the very point cloud P_0 whose AABB is the left-hand
      side. Both sides are the same geometry, so the inequality is dimensionless and scale-invariant.
      Proof: if the axis line L meets A_0 at any point x0, then for every p in P_0 (all of which lie inside
      A_0), perp-dist(p, L) <= ||p - x0|| <= diag(A_0), hence r_max <= diag(A_0). The threshold is 0.5
      * T_j = r_max * sin(min(|span|,pi)/2) <= r_max <= diag(A_0). Pass is unconditional, with a factor-2
      margin to spare. In URDF-derived assets the joint anchor IS the child body frame origin, which sits
      inside the child link''s geometry in essentially every real asset, so L always meets A_0. Measured:
      a 10 mm cube on a hinge declaring 6.283 rad gives diag=0.01732, threshold=0.00707 -> PASS at 2.45x
      margin. The `can_it_fail` field only exhibits a *slide* decoy and silently generalizes; the rotational
      half of the predicate has no failing model. URDF `revolute`/`continuous` are the dominant joint
      types in this corpus (median 3 joints/asset), so most of the predicate''s denominator is dead weight.


      (2) The only way the hinge branch DOES fail is when the geometry orbits an axis outside itself —
      which is legitimate, not a decoy. Measured: a fan blade / clock hand / ferris-wheel seat (box 0.60
      x 0.10 x 0.01 spanning r = 0.10..0.70, full turn) gives diag=0.6084 vs threshold=0.7018 -> FAIL.
      So the rotational branch is not a decoy detector at all; it is an "anchor lies far outside the part"
      detector, which (a) duplicates KF1''s `on_edge_of` / `through_center_of` anchor predicates and (b)
      has its sign backwards relative to the claim, firing on correct assets and passing decoys.


      (3) COMPUTABILITY — `d.xaxis[j]` is meaningless for mjJNT_BALL, and `q_j = lo_j` is unwritable for
      ball/free. Verified: a ball joint declared `axis="0 1 0"` compiles to `jnt_axis = [0,0,1]` — the
      compiler discards the axis because a ball has no axis, so `d.xaxis[j]` is a default the model never
      asserted, and r_max about that line is noise. Separately, "layer-1 forward sample k=0 (q_j = lo_j)"
      cannot be executed for a ball (4 qpos components, a quaternion) or a free joint (7 components);
      a scalar lo has no defined image there. And "free -> T_j = |span_j| under the translation reduction"
      invokes a reduction that is defined nowhere, on a `range.unit` that P0 admission A11 does not even
      constrain for free joints (A11 covers slide<->m and hinge/ball<->rad only).


      (4) NON-DETERMINISM ACROSS EQUIVALENT MODELS — diag(world AABB) depends on how the asset happened
      to be modeled. Measured on one 0.2 m cube: axis-aligned diag=0.3464, yawed 45 deg diag=0.4472, body-diagonal-up
      diag=0.5538 — a 1.6x swing on the same object. Rotating the fan-blade asset 45 deg about z moved
      diag from 0.6084 to 0.7001 (+15%). That is exactly the orientation confounder P0 R2 and the section-16
      "rotate the correct cabinet 90 deg" experiment exist to eliminate, injected into the pass/fail decision
      of an item that has nothing to do with orientation. (It survives axis-aligned 90 deg rotations,
      so the section-16 experiment itself would not expose it — it leaks in silently on real assets.)


      Minor, but must be closed before coding: `m.geom_type` is listed in mj_inputs and never used by
      the algorithm; a plane geom''s `geom_aabb` is [0,0,-5e9, 1e10,1e10,5e9] (verified), so one plane
      anywhere in M_j inflates diag(A_0) to ~2e10 and forces an unconditional pass. `CornerCloud(...)`
      and `worldAABB(...)` are undefined helpers — corner-of-geom_aabb clouds and tight mesh-vertex hulls
      differ by up to sqrt(3) on the same part, which is larger than the effect being measured.


      NOT defective: no whole-asset bounding-box diagonal appears anywhere (correct), and for slide the
      two sides are genuinely independent — declared metres from P0 text vs measured geometry — so the
      cited gold-standard slide decoy really does fail (diag=0.01732 vs threshold=0.20000).'
    fix: "Keep the slide branch, delete the rotational chord, and make the size measure pose-invariant.\
      \ All of this stays inside P0's frozen `tolerances` block (no new threshold invented, R3 preserved).\n\
      \nFIX 1 — restrict the predicate to translational travel.\n- slide: T_j = |span_j| in metres, taken\
      \ from kinematic_claims.joints[].range (declared, never from m.jnt_range). Keep as-is; this is the\
      \ only branch where T_j is an external length not derived from the geometry under test.\n- hinge,\
      \ ball: hard N/A, evidence reason `rotational_travel_has_no_independent_length_scale`. Excluded\
      \ from the denominator, not scored 0 or 1 (same rule P0 applies to KF2 binding and to empty contact\
      \ denominators).\n- free: N/A, reason `free_joint_travel_undeclared` — P0 A11 gives no unit for\
      \ free, so no translational span is resolvable. (If free must be scored, that is a P0 change: extend\
      \ A11 with `free <-> {unit: m, axis: <relational>}`, then it reduces to the slide branch.)\nConsequently\
      \ DELETE algorithm steps 2, 3, and the hinge/ball/free lines of step 4, and DELETE `d.xanchor[j]`,\
      \ `d.xaxis[j]`, and `r_max` from mj_inputs and from `evidence`. Nothing downstream reads them once\
      \ the rotational branch is N/A.\n\nFIX 2 — replace diag(worldAABB) with a rotation-invariant extent.\n\
      E_j = max over ordered pairs (p,q) in P_0 of ||p - q||_2 — the diameter of the corner cloud. Invariant\
      \ under any rigid transform of the whole asset, so a correctly-modeled part scores identically however\
      \ the generator oriented it. (Equivalent acceptable form: the AABB diagonal of P_0 expressed in\
      \ the joint's child-body frame, i.e. after applying d.xmat[b]^T; do not use the world-axis-aligned\
      \ box.) Cost is negligible: 8 * geom_count points, median 31 geoms -> 248 points -> ~31k pairs.\
      \ Deterministic with no tie-break needed (max over a fixed point set is order-independent). Calibration\
      \ is preserved: for the gold-standard 10 mm decoy cube E_j = 0.01732, identical to the axis-aligned\
      \ AABB diagonal, still an order of magnitude under the 0.20 threshold.\n\nFIX 3 — pin the undefined\
      \ helpers, exactly.\nP_0 := for each geom g in the rigid subtree of the joint's child body (start\
      \ at b = m.jnt_bodyid[j]; walk children via m.body_parentid, stopping at any body with m.body_jntnum\
      \ > 0; collect geoms via m.body_geomadr[b] .. +m.body_geomnum[b]), and for each s in the fixed enumeration\
      \ [(-1,-1,-1), (-1,-1,+1), ..., (+1,+1,+1)]:\n  p = d.geom_xpos[g] + d.geom_xmat[g].reshape(3,3)\
      \ @ (m.geom_aabb[g][0:3] + m.geom_aabb[g][3:6] * s)\nSkip any geom whose m.geom_type is mjGEOM_PLANE\
      \ or mjGEOM_HFIELD (this is the sole use of m.geom_type; record the count as `skipped_unbounded_geoms`).\
      \ If P_0 is empty after skipping, N/A with reason `no_bounded_geometry` (deferred to KF3.motion.travel_displacement,\
      \ matching the existing empty-M_j rule).\n\nFIX 4 — restated item.\nclaim: for a joint declaring\
      \ translational travel, the geometry it drives is not a decoy: E_j >= travel_scale_min * T_j.\n\
      pass: E_j >= 0.50 * |span_j|, span from P0, travel_scale_min from the frozen tolerances block.\n\
      N/A: joint type is hinge/ball/free; span_j == 0 or declared_travel_zero; M_j empty or all geoms\
      \ unbounded.\nevidence: joint_id, joint_type, span_declared, range_unit, E_j, threshold, ratio =\
      \ E_j / T_j, geom_count, skipped_unbounded_geoms, sample_index (k=0).\ncan_it_fail: yes, and only\
      \ here — the 10 mm cube on a 0.40 m slide gives E_j = 0.0173 against 0.20.\n\nFIX 5 — record the\
      \ coverage gap you are opening, do not paper over it.\nWith hinge/ball N/A, the rotational fake\
      \ joint is measured by nothing. It cannot be recovered by any part-intrinsic measure: a small door\
      \ on a small cabinet is legitimate, so absolute size carries no signal, and every ratio of a part\
      \ against its own rotation radius is dimensionless. Two honest options, both to be decided before\
      \ freeze, not in code:\n  (a) let KF3.motion.travel_displacement carry it — a decoy centered on\
      \ the hinge axis has ~zero corner displacement over the sweep and fails there. This catches the\
      \ on-axis decoy only; an off-axis decoy (a 10 mm cube 0.5 m out on a hinge) is caught by nothing,\
      \ and note the current item *does* flag that case but for the wrong reason and at the cost of failing\
      \ every fan blade.\n  (b) add ONE new frozen tolerance to P0 section 12, e.g. `decoy_parent_ratio_min`,\
      \ comparing diag(M_j) against diag(M_parent) — the parent part's own AABB, a per-part measurement\
      \ of the same kind already used everywhere, NOT the banned whole-asset diagonal (the 19/607 problem\
      \ does not apply to a single bound part). This is the only formulation that has a chance of separating\
      \ \"tiny door on tiny cabinet\" from \"tiny decoy on full-size cabinet\", and it is a contract change\
      \ that R3 forbids the implementer from making unilaterally.\n\nSecondary note for calibration (not\
      \ a soundness defect, threshold is frozen): the AABB-diagonal/diameter measure is dominated by the\
      \ part's largest dimension, which need not be the one that matters. A drawer 0.60 m wide but 0.02\
      \ m deep along the pull direction traveling 0.40 m passes on its width alone. If travel_scale_min\
      \ is recalibrated by fault injection as P0 section 12 requires, consider measuring the extent of\
      \ P_0 projected on the slide axis u (max(P_0 @ u) - min(P_0 @ u)) instead of the diameter; it is\
      \ strictly more informative and equally pose-invariant, but it shifts the meaning of 0.50 and so\
      \ must be chosen before the injection sweep, not after."
- item: KF3.motion.travel_displacement
  lens: kf3
  verdict:
    sound: false
    problem: "Six defects, four of them measured on real MuJoCo with a script at /private/tmp/claude-501/-Users-wanglin-Projects-Articraft--claude-worktrees-evo-articraft-verifier-856ef5/b56010b7-3646-4c78-939c-312f618f2b2b/scratchpad/kf3_check.py.\
      \ Three of the six are independently fatal.\n\nP1 — TAUTOLOGY, slide branch. For a slide, every\
      \ point of the child subtree translates by exactly q*u, so the AABB centre translates identically:\
      \ Delta_j == |span_j| == X_j, ratio identically 1.0. Measured on a correct drawer: ratio = 1.0000000\
      \ (bit-exact). The second conjunct is likewise implied by the item's own N/A gate: pass needs ov\
      \ <= 0.95, i.e. shift >= 0.05 * (largest extent along which the box moves); the resolution gate\
      \ already guarantees X_j >= 0.10 * diag(A_0) >= 0.10 * largest extent > 0.05 * largest extent. So\
      \ for slide (and free, which step 4 treats the same way) BOTH conjuncts auto-pass and the only reachable\
      \ verdict other than PASS is the empty-M_j FAIL — a structural check that needs no sweep, no AABB\
      \ and no tolerance.\n\nP2 — M_j is never defined, and the two candidate definitions differ by whether\
      \ the predicate has any power at all. The evidence field `empty_child_geom_set` and can_it_fail\
      \ (a) both say \"child body\", i.e. M_j = rigid subtree of joint j's child body. Under that reading\
      \ the whole item compares MuJoCo-derived quantities to each other: the subtree provably moves whenever\
      \ the joint moves, so nothing except the empty set can fail. This is exactly the trap that produced\
      \ zero detection last time. Only the other reading — M_j = the Gate-bound body for the P0-declared\
      \ part joints[j].part, plus that body's rigid subtree — makes the predicate falsifiable (the declared\
      \ part's geometry sits outside the joint's moving subtree). The item must pin this down; as written\
      \ an implementer will code the tautological one.\n\nP3 — r_c is the wrong statistic, and it breaks\
      \ in both directions on CORRECT assets. Delta_j measures the AABB-centre displacement, but X_j and\
      \ the eccentricity gate are built from cbar = unweighted mean of the per-geom corner clouds, which\
      \ is weighted by geom COUNT, not size. Measured:\n  (a) Correct knob (one on-axis cylinder geom\
      \ + 4 small off-axis nub geoms, 90 deg): e_j = r_c/r_max = 0.382, above eccentricity_min = 0.20,\
      \ so NOT N/A; then ratio = Delta/X = 0.0019/0.076 = 0.019 vs threshold 0.50 FAIL, and ov = 0.990\
      \ vs 0.95 FAIL. A perfectly correct asset hard-fails both conjuncts. With the AABB-centre radius\
      \ instead, e = 0.007 -> correctly N/A.\n  (b) Correct door (one big panel geom + 5 small hinge-detail\
      \ geoms near the axis, 120 deg): e_j = r_c/r_max = 0.106 < 0.20 -> wrongly N/A. The single most\
      \ testable joint type in the corpus is excluded, and — worse — a BROKEN door with the same geom\
      \ layout is also excluded, so the check silently cannot catch the defect it exists for. With the\
      \ AABB-centre radius, e = 0.499 and ratio = 1.001.\n\nP4 — ov is computed against A_{N-1}, so any\
      \ joint whose declared span is a multiple of 2*pi returns to the identical pose and gets ov = 1.0\
      \ -> hard FAIL on a correct asset. Measured on a correct crank: span 2*pi -> ov = 1.0; span 6*2*pi\
      \ -> ov = 1.0 (Delta is fine, 0.37 = X). P0's own worked example 14 is a gear pair and the text\
      \ explicitly cites ranges of +/-3 turns (span 37.7 rad), so this is the standard case, not a corner.\n\
      \nP5 — ball and free are incoherent. A ball joint has 4 qpos / 3 dof and a free joint 7 qpos / 6\
      \ dof; neither has a scalar q, so \"span_j\", \"driving over its declared range\" and X_j = |span_j|\
      \ are undefined. And d.xaxis is unusable for both: verified that the compiler forces jnt_axis to\
      \ (0,0,1) for a ball regardless of what the XML declares (I wrote axis=\"0 1 0\" and read back (0,0,1)),\
      \ so d.xaxis[j] is an arbitrary direction with no relation to the actual rotation, which for a ball\
      \ has no fixed axis at all; for free, d.xaxis is the constant (0,0,1) and d.xanchor[j] is just the\
      \ body xpos. Internally inconsistent too: step 4 treats free as translational while the N/A clause\
      \ applies the rotational eccentricity gate to free.\n\nP6 — smaller, but each must be closed before\
      \ this is codeable:\n  * travel_realized_min, aabb_overlap_max, eccentricity_min, displacement_resolution_frac\
      \ are not in P0-revised's frozen `tolerances` block (9 names, incl. travel_scale_min). Violates\
      \ R3 and re-creates the exact \"thresholds silently decided by whoever writes the code\" failure\
      \ that revision #11 fixed.\n  * can_it_fail (b) cites mechanisms that verifiably cannot produce\
      \ the effect. I built the asset: an ACTIVE equality weld between the carcass and the drawer leaves\
      \ d.xpos moving normally under mj_forward (equality constraints only produce forces in the solver,\
      \ they never alter FK from a written qpos), and qpos written past jnt_range is not clamped by mj_forward\
      \ either (wrote 0.40 against range 0..0.05, body moved to 0.40). A \"stale body_pos\" only offsets\
      \ the child and it still moves. Whoever calibrates this will build that fault-injection asset and\
      \ get zero detection — a rerun of the previous failed attempt.\n  * argmax over k has no tie-break,\
      \ yet argmax_grid_index and q_at_argmax are emitted evidence.\n  * Evaluation order is unstated:\
      \ steps 1/3/6 are all undefined on an empty M_j, but the empty-set FAIL is only mentioned inside\
      \ the N/A clause.\n  * m.geom_aabb is (ngeom,6) = (center, half-extent) as assumed (verified), but\
      \ m.geom_type is listed as an input and never used by the algorithm.\n  * The degenerate-volume\
      \ fallback does not say which boxes it applies to; if A_lo and A_hi are flat in different planes,\
      \ the \"two largest extents\" of each are areas in different planes and their ratio is meaningless\
      \ (can exceed 1)."
    fix: 'Rewrite as follows. Every change below is forced by a measured counterexample.


      1. DEFINE M_j, anchored outside the model. M_j := the geoms of the body that the Gate bound to P0
      joints[j].part, union the geoms of every body reachable from it without crossing a joint (m.body_parentid
      / m.body_jntnum), enumerated in ascending geom id. Explicitly NOT "the child body of joint j". State
      the intent: the predicate tests that the geometry P0 named as the moving part is what actually moves.
      Emit bound_body_id and joint_child_body_id as evidence so the wrong-body case is legible.


      2. ORDER the evaluation, explicitly: (i) if M_j is empty -> FAIL, empty_child_geom_set = true, all
      numeric evidence null, stop. (ii) if span_j == 0 -> N/A. (iii) if m.jnt_type[j] is mjJNT_BALL or
      mjJNT_FREE -> N/A, evidence no_scalar_dof (do not invent a span or an axis; d.xaxis is meaningless
      for both — verified). (iv) compute geometry; apply the remaining N/A gates; (v) apply the pass conditions.


      3. REPLACE r_c with r_a EVERYWHERE. Let c_0 be the AABB centre at k=0, a = d.xanchor[j], u = d.xaxis[j]/||d.xaxis[j]||,
      and r_a = ||(c_0 - a) - ((c_0 - a).u) u||. Then hinge: X_j = 2 * r_a * sin(min(|span_j|, pi)/2);
      eccentricity e_j = r_a / r_max (r_max still the max perpendicular distance over the k=0 corner cloud;
      0/0 -> 0). cbar and CornerCloud are no longer needed by this item at all, which also removes the
      float-summation-order determinism hazard. Rationale to keep in the spec: Delta_j measures the AABB
      centre, so both the expectation and the applicability gate must be built from the AABB centre. Verified:
      knob 0.382 -> 0.007 (correctly N/A), door 0.106 -> 0.499 (correctly tested, ratio 1.001), crank
      ratio 1.85 -> 1.000.


      4. REPLACE A_hi. Let k* = argmax_k ||c_k - c_0||, ties broken by the SMALLEST k. A_hi := A_{k*},
      not A_{N-1}. Both conjuncts then describe the same sample, and a full-turn or multi-turn joint stops
      self-failing (verified: crank at 1 and 6 turns went from ov = 1.0 to the 90-deg-equivalent value).
      Emit argmax_grid_index = k*. Fix the claim wording too: "closed-pose and open-pose AABBs" is wrong
      — these are scan samples, and P0 permits states.closed at range.max.


      5. DROP the slide/free branch from this predicate, or demote it. For a slide, Delta_j == X_j is
      a bit-exact identity and ov <= 0.95 is implied by the resolution gate, so keep only what is falsifiable:
      for m.jnt_type[j] == mjJNT_SLIDE, evaluate ONLY "M_j non-empty AND M_j lies in the moving subtree
      of joint j", which is what Delta_j > 0 actually measures. Concretely: PASS iff Delta_j >= travel_realized_min
      * X_j with the M_j of item 1 above (so the wrong-body defect gives Delta_j = 0 and fails), and mark
      the ov conjunct N/A for slide with evidence overlap_implied_by_resolution_gate rather than reporting
      a threshold that cannot bind. Say in the item that for a correctly-bound slide the ratio is exactly
      1 by construction, so this is a binary structural test, not a calibratable continuous one.


      6. RESTATE can_it_fail truthfully. Delete "a nested weld or a stale body_pos" — both verified not
      to work (active weld: body still moves under mj_forward; qpos past jnt_range: not clamped). The
      realizable faults, and the ones fault injection must use, are: (a) M_j empty — the mesh is written
      onto the carcass body and the joint sits on an empty body; (b) the Gate-bound body for joints[j].part
      is outside joint j''s moving subtree (geometry on the parent, or the joint placed on a sibling body)
      -> Delta_j = 0, ov = 1.0, fails both. Keep the existing note that displacing jnt_pos is correctly
      NOT detected here.


      7. ADD the four thresholds to P0''s frozen tolerances block so R3 holds and they enter the contract
      hash: travel_realized_min 0.50, aabb_overlap_max 0.95, eccentricity_min 0.20, displacement_resolution_frac
      0.10. Note in the spec that travel_realized_min cannot be calibrated by a detection-rate curve for
      slide joints (ratio is 1 or 0, nothing between) and that only the hinge branch has a graded response.


      8. CLOSE the small holes: the degenerate-volume fallback picks ONE measure — the highest dimension
      whose value is non-zero for all three of A_lo, A_hi and their intersection, using the SAME axis
      pair/axis for all three (choose the axes by descending extent of A_lo, ties by ascending axis index);
      m.geom_type is either used (skip mjGEOM_PLANE, whose geom_aabb is not a finite part box) or dropped
      from mj_inputs; geom iteration order is ascending geom id.'
- item: KF3.motion.range_coverage
  lens: kf3
  verdict:
    sound: false
    problem: 'TAUTOLOGY — this is the exact failure the team was already burned by, plus both of its stated
      failure scenarios are physically unproducible under the frozen P3 protocol.


      (1) t_star is a function of span_j ALONE, not of anything the generator produced. Under a layer-1
      sweep only joint j moves, so the tracked part is rigid with respect to a single joint transform.
      For a slide, c_k - c_0 = (q_k - lo)·a_world, so f_k = t_k and t_star = 0.5 exactly. For a hinge,
      a material point at perpendicular distance r from the axis moves by the chord 2r·sin(theta/2), and
      r cancels in f_k = sin(t·s/2)/sin(s/2). Closed form: t_star = (2/s)·asin(0.5·sin(s/2)), which is
      monotone on (0, pi] with range [1/3, 1/2] — 0.5 at s→0, 0.4277 at 120 deg, exactly 1/3 at s = pi.
      Grid quantization only adds at most 1/(N-1). The window is [0.20, 0.80]. A single-DOF joint therefore
      CANNOT fail, and its t_star is independent of axis direction, anchor position, part offset, part
      size, part aspect ratio, mesh content, ref/qpos0, and jnt_range. I verified this in MuJoCo (scripts
      at /private/tmp/claude-501/-Users-wanglin-Projects-Articraft--claude-worktrees-evo-articraft-verifier-856ef5/b56010b7-3646-4c78-939c-312f618f2b2b/scratchpad/t2.py):
      60 hinge variants sweeping anchor offset r from 0.05 m to 2.0 m and part half-sizes from 0.02 to
      0.5 m produced exactly three distinct t_star values, {0.35, 0.45, 0.50}, determined solely by the
      span (10/60/120/179 deg). Displacing the anchor by 40x produced byte-identical t_star. That is the
      same signature as the joint-origin fault injection that yielded zero detection.


      (2) Both "can_it_fail" scenarios are impossible under P3''s Scope (qpos + FK + residuals, "No dynamic
      rollout"). (a) "Outer stage completes its travel in the first 8 percent and then sits still" requires
      a joint to saturate at its limit. mj_forward does NOT clamp qpos to jnt_range: I wrote q = 5.0 into
      a slide with range [0, 0.4] and the body translated 5.0 m (scratchpad/t1.py). Limits are constraints,
      and constraints only appear in efc_pos; with no stepping nothing ever stops the child. Moreover
      KF3 derives dependent joint values from the DECLARED relation, and revised P0 section 09 restricts
      relations to affine (coefficient + offset), so the driven trajectory is affine in the driven q no
      matter what the model''s polycoef says. (b) "Welded for the first 90 percent and snaps at the end"
      is not expressible at all: mj_forward leaves qpos untouched and computes xpos as a pure rigid function
      of it. I verified an equality constraint violated by 3.0 rad left both qpos and xmat unchanged and
      showed up only as efc_pos = -3.0 (scratchpad/t4.py). No MuJoCo construct makes a joint''s child
      stationary over part of its range and then jump.


      (3) The one regime where t_star does vary is the regime where it produces FALSE POSITIVES. When
      a coupling makes a second joint move during the sweep, the tracked part follows a composed two-rotation
      path and the profile is no longer a chord. A perfectly correct serial 2R linkage with the legal
      affine coupling q_B = 2.0·q_A over a 120 deg driven span gives t_star = 0.175 < 0.20 -> FAIL (scratchpad/t3.py);
      coefficient -2.0 gives 0.625, coefficient 3.0 gives 0.275. Nothing is wrong with any of these mechanisms.
      So the item has zero sensitivity to defects and a nonzero false-failure rate on exactly the coupled
      assets KF2 is meant to reward.


      Secondary defects, each independently disqualifying as written:

      - tolerances.coverage_midpoint_min / coverage_midpoint_max do not exist in the frozen P0 tolerances
      block (it has exactly 9 keys: axis_angle_deg, anchor_side_fraction_min, anchor_center_offset_max,
      travel_scale_min, follower_drift_m, state_match_relative, required_contact_m, forbidden_penetration_m,
      coupling_residual). P0 admission check A12 requires the block to be complete and R3 forbids thresholds
      living in code, so the item is unimplementable until P0 is amended.

      - Delta_j is ambiguous and the two readings disagree. The stated reference f(t) = sin(t·span/2)/sin(span/2)
      is end-normalized (f_end = 1), but the claim "f_k in [0,1]" requires max-normalization. They are
      not the same: my coef=2.0 case gave f_max = 1.01 under end-normalization. This must be pinned or
      the two implementations differ.

      - N/A "when Delta_j == 0" uses exact float equality and will essentially never fire; a rotationally
      symmetric part (gear, knob) spinning about its own axis gives Delta_j at float-noise level, and
      f_k = noise/noise makes t_star arbitrary. It is only rescued if the sibling travel_displacement
      happens to FAIL first.

      - ball and free joints have no scalar joint coordinate (ball qpos is a 4-vector quaternion, free
      is 7), so (q_k - lo_j)/span_j is undefined — yet the N/A list explicitly names ball as in-scope
      for the span > pi test, implying balls are otherwise evaluated. No N/A is declared for ball/free.

      - span_j < 0 (range with min > max) is not excluded; t_k would leave [0,1].


      COMPUTABILITY, NORMALIZATION, DETERMINISM are otherwise fine: m.geom_aabb exists with shape (ngeom,
      6) (verified), d.geom_xpos/(ngeom,3) and d.geom_xmat/(ngeom,9) exist, no whole-asset diagonal is
      used, and the smallest-k tie-break is specified.'
    fix: 'Drop KF3.motion.range_coverage as a SCORED predicate. There is no salvage that keeps both the
      slot and the window, because the two cases partition cleanly: single-joint DOFs are provably unfailable
      (t_star is pinned to [1/3, 1/2] by span alone), and multi-joint/coupled DOFs fail correct mechanisms.
      Narrowing the window makes the false-positive rate worse without buying any detection; widening
      it makes the tautology explicit.


      Concretely:


      1. Delete the pass/fail condition and the two tolerance keys. Keep the computation as REPORTED EVIDENCE
      ONLY, alongside travel_displacement: emit joint_id, Delta_j, t_star, and f_profile into the evidence
      record, and exclude the item from the KF3 S_motion numerator and denominator entirely (not N/A-with-a-slot
      — no slot). This preserves the diagnostic without letting a quantity determined by a declared field
      move a score. Since it is no longer scored, "one claim serves one check" is not violated by the
      profile also being derived from independent_dofs.


      2. Give P3''s "covers the declared range" bullet its home in the sibling instead of here. Under
      the frozen protocol (qpos written directly, FK only, no clamping, affine couplings) the ONLY model-dependent
      coverage quantity that exists is the realized displacement magnitude at the declared endpoints versus
      the declared travel, and KF3.motion.travel_displacement already owns exactly that. State this explicitly
      in that item''s deviates_from_spec so a later reader does not re-derive range_coverage.


      3. If a scored coverage item is politically required, the only non-tautological formulation is a
      RANGE-TRUNCATION check, and it must be routed to KF1, not KF3: at the declared endpoints q = lo_j
      and q = hi_j, write qpos, run mj_forward, and read the mjCNSTR_LIMIT_JOINT rows of d.efc_pos for
      joint j; a nonzero limit violation at a declared endpoint means the model''s own jnt_range does
      not cover the declared range. This is model-dependent (m.jnt_range is generator-produced) and it
      is failable. But note it is the same information as revised P0 section 07''s merged "range and reference"
      KF1 claim, so it must REPLACE part of that claim rather than be added beside it — do not create
      a second scored comparison of the same two numbers.


      4. Independently of the above, if any part of the profile computation survives as evidence, pin
      these three details so two implementations agree byte-for-byte: (a) Delta_j := max_k ||c_k - c_0||_2
      over the N samples (max-normalization, which alone guarantees f_k in [0,1] and guarantees t_star
      exists); (b) replace "Delta_j == 0" with "Delta_j <= 1e-9 m OR Delta_j <= 1e-6 * diag(part AABB
      in the reference pose)" — part-local diagonal, never a whole-asset diagonal; (c) declare ball and
      free DOFs N/A for anything using a scalar joint coordinate, with evidence code no_scalar_joint_coordinate,
      and declare span_j <= 0 N/A with evidence code non_positive_span.'
- item: KF3.motion.type_semantics
  lens: kf3
  verdict:
    sound: false
    problem: 'The core idea (test the PART''s cloud, not the joint''s child body) is correct and genuinely
      non-tautological — I confirmed both halves numerically: correctly-bound door -> rel = 1.7e-16 (tautological
      pass), same door mis-bound to the cabinet -> rel = 1.066 (detected). But the item is not implementable
      as written, and as written it hard-FAILS correct assets. Verified against mujoco (3.3.7 locally;
      all APIs used are unchanged in 3.11).


      BLOCKING


      B1. The ball branch is wrong and fails correct assets. `d.xaxis[j]` for a ball joint is NOT the
      rotation axis — MuJoCo computes it generically as xmat*jnt_axis, and jnt_axis for a ball is the
      unused compiler default. Measured: ball rotated 0.6 rad about world x and about world y both leave
      d.xaxis[jball] = [0,0,1]. A ball rotates about an arbitrary axis through the anchor, so "pure rotation
      about the joint''s world axis line" is a false statement about ball semantics. Running the spec''s
      own step 3 on a perfectly correct ball joint (u = d.xaxis, dq scalarized as the quaternion-delta
      angle) gives Res = 0.691, rel = 1.042 against a 0.02 threshold — a guaranteed false failure on every
      correct ball joint. Separately, step 3''s `dq_k = q_k - q_0` is not even defined for a ball: qpos
      is a 4-vector quaternion (measured jnt_qposadr stride 4), and the spec multiplies that 4-vector
      by a 3-vector u.


      B2. The free branch is wrong three ways. (i) The claim text "pure translation along a fixed direction
      for slide and free" is simply false — a free joint permits arbitrary rigid motion including rotation.
      (ii) `dq_k = q_k - q_0` is a 7-vector for free, and u = d.xaxis[jfree] is the unused default axis,
      so `p_i(0) + dq_k * u` is uncomputable. (iii) Step 2''s self-check is factually wrong for free joints:
      I measured d.xanchor[jfree] moving by exactly [0.5, 0, 0] when the free joint''s own x translation
      was advanced by 0.5. MuJoCo sets a free joint''s xanchor to the body position, which is the joint''s
      own qpos. So the spec would raise "harness fault" on every correct free-joint asset. (The invariance
      assertion IS correct for slide, hinge, and ball — measured zero delta for all three.)


      B3. `tolerances.rigid_motion_tol_frac` does not exist in the authoritative revised P0. Section 12
      freezes exactly nine names (axis_angle_deg, anchor_side_fraction_min, anchor_center_offset_max,
      travel_scale_min, follower_drift_m, state_match_relative, required_contact_m, forbidden_penetration_m,
      coupling_residual); this is not one of them, so admission check A12 ("tolerances 块完整") cannot pass
      and principle R3 is violated. The pass_condition also both names the contract field and hardcodes
      0.02, leaving precedence undefined when a contract supplies a different value.


      B4. Dependent joints of couplings have no defined scan. P0 A6 forbids a coupling''s `dependent`
      from appearing in independent_dofs, and KF3 drives only independent DOFs. For P0''s own worked example
      B, gear_small_spin therefore has no layer-1 scan of its own, and the na_condition (empty G_p / zero
      diag / span==0) does not cover it. Worse, step 2''s justification "Only DOF j varies in a layer-1
      scan" is false whenever j is an independent DOF that drives a coupled joint: the coupled joint moves
      in the same scan, and if it lies upstream of j the spec would then declare a harness fault on a
      correct asset.


      B5. Step 3 branches on "slide, free" vs "hinge, ball" without saying whether the branch key is `declared_type`
      (from P0) or `mj_jnt_type` (from the model) — the evidence block emits both, so the ambiguity is
      real. It is also unstated where the scan grid comes from when they disagree: a joint declared hinge
      with range 0..2.094 rad that the model built as a slide would be scanned 0..2.094 metres.


      NON-BLOCKING BUT MUST BE PINNED


      N1. Detectability floor, unbounded and unreported. A completely stationary (mis-bound) part passes
      whenever the scan is short. Measured: dial mis-bound to the cabinet, hinge span 0.02 rad -> rel
      = 0.0135, PASSES. A 2 mm-travel push button mis-bound to its panel -> rel = 0.0115, PASSES. Small-travel
      latches, buttons and dials are exactly the cases where the predicate is silently blind, and nothing
      in the evidence tells the reader that.


      N2. G_p is not defined as one body''s geoms or a whole rigid subtree. The established binding rule
      (part -> BODY, then body_geomadr/body_geomnum) gives a single body, in which case rigidity_residual
      is identically zero, can_it_fail case (b) is impossible, and rel is exactly 0 or exactly the full
      chord — the predicate is binary, not graded.


      N3. `m.geom_type` is listed as an input and never used. It matters: a plane geom''s geom_aabb is
      [0, 0, -5e9, 1e10, 1e10, 5e9] (measured). One plane in G_p inflates diag by ~1e10 and makes every
      rel pass.


      N4. p0_inputs omits `joints[].range` (needed for span_j in the na_condition and for the grid) and
      `couplings` (needed for any coupled scan). mj_inputs omits `m.jnt_qposadr` and `d.qpos`, without
      which q_k cannot be read.


      N5. Tie-breaks for `argmax_grid_index` and `worst_corner_geom_id` are unspecified — two corners
      at equal residual give non-reproducible evidence.


      N6. diag is taken at k=0, which for a hinge is pose-dependent (varies by up to sqrt(2) across the
      scan), so rel depends on which end of the sweep happens to be sample 0.


      N7. The rigidity residual is a max over all corner pairs: O(n^2) per sample per joint, unbounded
      in geom count with no cap specified.'
    fix: "Rewrite the predicate around a Kabsch-fitted rigid transform, which makes all four joint types\
      \ expressible and removes the ball/free breakage.\n\n1. Per sample k, fit the least-squares rigid\
      \ transform (R_k, t_k) from P(0) to P(k) by Kabsch/SVD on the corner cloud, with the reflection\
      \ guard (if det(R_k) < 0, negate the singular vector for the smallest singular value). Deterministic,\
      \ no randomness.\n2. Rigidity residual first, as a real gate rather than evidence-only: rigid_res\
      \ = max_i ||R_k p_i(0) + t_k - p_i(k)|| / diag. If the part is one body this is 0 by construction;\
      \ if G_p spans a joint driven during the scan it is not.\n3. Type-specific residual, all computed\
      \ from (R_k, t_k), with the branch keyed on mj_jnt_type (the actual motion is what it is) and the\
      \ declared-vs-actual type mismatch left to KF1; if declared_type != mj_jnt_type, emit both in evidence\
      \ and report N/A here so this item does not double-count KF1's type claim.\n   - slide: res = max(||R_k\
      \ - I||_F * r_max, ||t_k - dq_k * u||), where r_max = max_i ||p_i(0) - centroid||, dq_k = q_k -\
      \ q_0 (scalar), u = d.xaxis[j](0).\n   - hinge: res = max(||R_k - Rodrigues(u, dq_k)||_F * r_max,\
      \ ||R_k a + t_k - a||), a = d.xanchor[j](0). The second term is the anchor-stationarity check and\
      \ is what carries the information for a mis-bound part.\n   - ball: drop the axis entirely. res\
      \ = ||R_k a + t_k - a|| only (the anchor must be stationary; any rotation is permitted). This is\
      \ computable — I confirmed d.xanchor[jball] is the true pivot and stays fixed under ball rotation\
      \ (delta exactly 0).\n   - free: N/A, and say why in the spec text — a free joint permits arbitrary\
      \ rigid motion, so after the rigidity gate there is nothing left to falsify. Also delete \"free\"\
      \ from the claim sentence's translation clause.\n4. Fix step 2's self-check: assert invariance of\
      \ d.xanchor[j] / d.xaxis[j] only for mj_jnt_type in {slide, hinge, ball}, and only when no coupling\
      \ drives a joint on the path from world to j's body. Otherwise recompute a and u per sample and\
      \ use (a_k, u_k) in the prediction rather than raising a harness fault.\n5. Scan definition for\
      \ coupled joints: if j is a coupling's `dependent`, its scan is the induced trajectory over the\
      \ scan of its `independent` (q_j written from couplings.relation, per P0 section 09 step 4); dq_k\
      \ is still q_j(k) - q_j(0) and the predicate is unchanged. Add to na_condition: N/A when j is neither\
      \ in independent_dofs nor reachable as a coupling dependent from one. Add `couplings` and `joints[].range`\
      \ to p0_inputs, and m.jnt_qposadr / d.qpos to mj_inputs.\n6. Add the missing tolerance to P0 section\
      \ 12 as `rigid_motion_tol_frac: 0.02` (protocol initial value, to be set by the fault-injection\
      \ calibration described there), add it to A12's completeness list, and restate pass_condition as\
      \ \"rel <= tolerances.rigid_motion_tol_frac, read from the frozen contract\" with 0.02 named only\
      \ as the initial value.\n7. Report power, do not hide it. Compute rel_null = the residual the same\
      \ algorithm produces for the null hypothesis \"the cloud did not move at all\" (p_i(k) := p_i(0)).\
      \ Emit it as evidence, and mark the predicate N/A with reason `insufficient_scan_amplitude` when\
      \ rel_null <= 2 * threshold — this is what turns the measured 0.0115 button and 0.0135 dial misses\
      \ from silent passes into honest N/As.\n8. Define G_p explicitly as the geoms of the single body\
      \ bound to the part by Gate G1 (body_geomadr .. body_geomadr+body_geomnum), in index order, corners\
      \ in the frozen KF3.helper.rigid_sets order; if the intent is the rigid subtree, say so and state\
      \ the traversal order. Exclude geoms with geom_type in {mjGEOM_PLANE, mjGEOM_HFIELD} from both the\
      \ cloud and the diag, and N/A the item if that empties G_p.\n9. Take diag as the diagonal of the\
      \ AABB of the corner cloud expressed in the part body's own frame (pose-invariant), not the world\
      \ AABB at k=0.\n10. Specify tie-breaks: argmax over (k, geom_id, corner_index) lexicographically\
      \ smallest among ties. Cap the rigidity computation at max_i ||R_k p_i(0) + t_k - p_i(k)|| (O(n))\
      \ instead of the O(n^2) all-pairs form; it detects the same thing.\n11. Update `can_it_fail`: with\
      \ G_p a single body, case (b) cannot occur, so state the real failure set as (a) part bound to the\
      \ parent side or to a sibling body, (c) part bound to a body downstream of a joint that a coupling\
      \ also drives during this scan, and (d) declared type present but the model realized a different\
      \ motion — and note explicitly that for a correctly-bound part rel is exactly 0 to float precision,\
      \ so the threshold is a mis-binding detector, not a graded quality score."
- item: KF3.motion.state_reachability
  lens: kf3
  verdict:
    sound: false
    problem: 'NOT a tautology (model jnt_range comes from the asset''s URDF <limit>, v comes from the
      contract — independent), and no whole-asset-diagonal normalization. It fails on computability, determinism,
      degeneracy, and P0 routing. Ten defects, all verified against mujoco on this machine (scripts in
      /private/tmp/claude-501/-Users-wanglin-Projects-Articraft--claude-worktrees-evo-articraft-verifier-856ef5/b56010b7-3646-4c78-939c-312f618f2b2b/scratchpad/t.py,t2.py,t3.py).


      (1) COMPUTABILITY — WRONG ARRAY INDEXING, SILENT. `m.jnt_range[2j : 2j+2]` is C-API flat-array indexing.
      In the Python bindings `m.jnt_range` has shape (njnt, 2). Verified on a 4-joint model: for j=1 the
      spec''s slice returned rows 2 and 3 — a DIFFERENT joint''s range — instead of [0, 0.05]. On the
      real 2-joint URDF path it returned an EMPTY array for j=1. Both cases are silent: no exception,
      just wrong or unpackable-as-nothing. Every joint except j=0 is scored against another joint''s limits.


      (2) COMPUTABILITY — FACTUALLY WRONG UNIT STATEMENT. Step 3 says the range is in "whatever the MJCF
      compiler''s angle attribute said". False. mjModel.jnt_range is ALWAYS radians for hinge/ball. Verified:
      compiler angle="degree" with range="-30 120" compiles to jnt_range = [-0.5236, 2.0944]. An implementer
      who follows this parenthetical will insert a deg->rad conversion and corrupt every hinge comparison
      by 57x. (P0 section 07 states the correct fact; this item contradicts it.)


      (3) DETERMINISM — SELF-CONTRADICTION ON jnt_limited == 0. Step 3 says fall through to (-inf, +inf)
      — i.e. auto-PASS. na_condition says report N/A. Same input, two mandated outputs; the implementer
      picks. Worse, the auto-PASS branch is exactly the failure mode P0 flags for KF2 ("生成器什么都没写 → 最差的模型得
      KF2 = 1.0"): a generator that writes no <limit> at all scores 1.0 on every state of that joint.
      Verified this is the common case — URDF ''continuous'' compiles to jnt_limited=0 with jnt_range=[0,0].


      (4) COMPUTABILITY — N/A PREDICATE NOT COMPUTABLE FROM STATED INPUTS. "N/A when m.jnt_limited[j]
      == 0 for a hinge originating from a URDF ''continuous'' joint" requires knowing URDF provenance.
      mjModel records no such field, and mj_inputs names only mjModel arrays. The only observable is (jnt_type
      == mjJNT_HINGE and jnt_limited == 0), which does not distinguish ''continuous'' from ''revolute-with-limits-omitted''.


      (5) DETERMINISM — span_j IS NEVER DEFINED. Step 4 uses span_j; nothing defines it. Two readings
      give different verdicts: model span (lim_hi - lim_lo) or declared span (range.max - range.min).
      Step 3 has just bound lim_lo/lim_hi, so an implementer naturally uses the model span — but the can_it_fail
      worked example uses 0.008 = 0.02 x 0.40, i.e. the DECLARED span. Model span there is 0.05, giving
      slack 0.001. Different answers at every boundary, and the model span is 0 (hence slack 0, exact
      float equality required) whenever jnt_limited==0.


      (6) WRONG TOLERANCE FIELD. P0 section 10 defines state matching as |q_j - states_j[s]| <= tolerance.relative
      x (range_j.max - range_j.min), where tolerance.relative comes from asset_states[s].tolerance, which
      is per-label and overridable. The item cites only tolerances.state_match_relative and never says
      which wins when they differ.


      (7) DEGENERACY — BALL AND FREE ARE UNHANDLED. P0 A11 permits type: ball with unit: rad and therefore
      scalar states. MuJoCo requires jnt_range[0] == 0 for a ball joint (verified: range="-45 45" is a
      hard compile error, "range[0] should be 0 in ball joint") because the limit is on rotation MAGNITUDE.
      Comparing a signed declared value to [0, max] spuriously FAILS any negative ball state, which is
      perfectly reachable. Free joints always have jnt_limited=0 (verified) so they are vacuous. Neither
      is in the N/A list.


      (8) DEGENERACY — ZERO-LENGTH RANGE BECOMES UNLIMITED. Verified: range="0 0" compiles to jnt_limited=0,
      jnt_range=[0,0]. So the degenerate-model case routes into the already-broken branch (3) and silently
      auto-passes.


      (9) SCORES CONTRACT TYPOS AS ASSET DEFECTS. No admission check requires states values to lie inside
      the joint''s own declared range (A1-A12 has no such rule). If the contract says range {0, 0.30}
      but states {open: 0.40}, a model that faithfully implements [0, 0.30] FAILS. That is a prompt error
      scored against the asset — precisely the confound P0''s admission section exists to eliminate ("把契约写错和资产做错在生成之前分开").


      (10) DOUBLE COUNTING ACROSS METRICS — ROUTING VIOLATION. P0''s field routing assigns joints -> KF1,
      and section 07 states verbatim that KF1 MERGES states.closed, ref/qpos0 and range.min into ONE "范围与参考"
      claim precisely because they were "同一个数被算三次" and that "直接违反同一信息不重复计算". This item consumes joints[].states
      and joints[].range — KF1''s routed fields — and scores them a third time inside KF3''s S_motion.
      P0 registers exactly ONE deliberate overlap (part_relations.attached_to vs rigid_attachments) and
      requires it be explicitly declared; this one is not. Concretely, the item''s own worked example
      (drawer range 0..0.05 vs declared 0..0.40) is ALREADY a KF1 range-and-reference failure, so KF3
      drops for a defect KF1 already reported, correlating two of the three axes the <KF1, KF2, KF3> profile
      is supposed to keep separable. The item''s stated mitigation (its own applicable-n) prevents volume
      inflation WITHIN S_motion but does nothing about the KF1<->KF3 correlation.'
    fix: 'Either drop the item into KF1''s existing "range and reference" claim, or keep it in KF3 only
      after all of the following. Recommended: DROP IT. Its stated defect (the 5 cm drawer) is by construction
      already caught by KF1''s merged range claim, its expected yield is self-described as low, and keeping
      it correlates KF1 with KF3. If it is kept, it must be rewritten as follows.


      A. Indexing. Replace `[lim_lo, lim_hi] = m.jnt_range[2j : 2j+2]` with `lim_lo, lim_hi = float(m.jnt_range[jm][0]),
      float(m.jnt_range[jm][1])` where jm is the MuJoCo joint index. Also rename the symbol: the item
      uses `j` for both the P0 joints[] entry and the mjModel joint index. Write `jc` for the contract
      joint id and `jm = gate_binding.joint_index[jc]` for the model index, and state that when the Gate
      bound the part to a body carrying more than one joint, the item is N/A with evidence `joint_binding_ambiguous`.


      B. Units. Delete "whatever the MJCF compiler''s angle attribute said". State: mjModel.jnt_range
      is ALWAYS metres for slide and ALWAYS radians for hinge and ball, independent of the MJCF compiler
      `angle` attribute. P0 A11 already forces range.unit in {m, rad} compatibly with type, so NO unit
      conversion is ever performed; if range.unit disagrees with the joint type, that is an admission
      failure, not an asset failure.


      C. Unlimited joints. Delete the `Else [lim_lo, lim_hi] = (-inf, +inf)` branch entirely — it hands
      a free pass to the model that writes no limits at all. Replace with: if m.jnt_limited[jm] == 0,
      the instance is N/A, evidence `joint_unlimited`, regardless of URDF provenance (which is not recoverable
      from mjModel). Drop the phrase "originating from a URDF ''continuous'' joint" from na_condition.
      Note in the evidence that this makes the item N/A for every URDF ''continuous'' joint and every
      free joint, which is most of the corpus — report the resulting applicable-n prominently.


      D. Define the slack explicitly. `span_c = joints[jc].range.max - joints[jc].range.min` (the DECLARED
      travel span, matching P0 section 10''s state-matching formula and the worked example''s 0.008).
      Then `slack = tol_relative * span_c`, where `tol_relative = asset_states[s].tolerance.relative if
      s in asset_states and it defines tolerance.relative, else tolerances.state_match_relative` — state
      that precedence explicitly. Add an absolute floor so a degenerate declared range does not demand
      exact float equality: `slack = max(tol_relative * span_c, 1e-9)`. If joints[jc].range is absent,
      the instance is N/A with evidence `declared_range_absent`.


      E. Restrict joint types. Add to na_condition: N/A when m.jnt_type[jm] is mjJNT_BALL or mjJNT_FREE,
      evidence `state_not_scalar` — a ball''s jnt_range[0] is required by MuJoCo to be 0 because the limit
      is on rotation magnitude, so a signed declared value is not comparable to it, and free joints cannot
      be limited. The item applies only to mjJNT_HINGE and mjJNT_SLIDE. Then m.jnt_qposadr is genuinely
      unused; either delete it from mj_inputs or state it is used only to key the evidence record.


      F. Separate contract error from asset error. Before comparing against the model, check `joints[jc].range.min
      - slack <= v <= joints[jc].range.max + slack`. If that fails, emit `contract_inconsistent` (declared
      state outside its own declared range) and score the instance N/A — do not fail the asset. Better:
      add admission check A13 to P0 — "every value in joints[].states lies within that joint''s own range"
      — so this is rejected before generation, matching the A1 philosophy.


      G. Register the overlap. If the item is kept, P0''s section 03 routing table and the deliberate-overlap
      register must be amended to record joints[].states/range as read by BOTH KF1 (range-and-reference
      claim) and KF3 (state reachability), with the two questions stated distinctly, exactly as done for
      part_relations.attached_to vs rigid_attachments. Additionally, report S_motion both with and without
      this item so the KF1<->KF3 correlation it introduces is visible in the profile.


      H. Determinism of evidence. Specify the instance enumeration order: joints in P0 declaration order,
      and within a joint, state labels in P0 declaration order (source order of the mapping, not sorted,
      not dict-hash order). Specify `margin_violated` in {"below_lo", "above_hi"} and note both cannot
      occur simultaneously since lim_lo <= lim_hi is guaranteed by the MuJoCo compiler. Add `span_source:
      "declared"` and `tol_source` in {"asset_states", "tolerances"} to the emitted evidence so the slack
      is reproducible from the record alone.'
- item: KF3.motion.path_continuity
  lens: kf3
  verdict:
    sound: false
    problem: 'The demotion to a harness assertion is defensible, and the item avoids whole-asset-diagonal
      normalization (good), and every array it names (d.geom_xpos, d.geom_xmat, d.xaxis[njnt][3], d.xanchor[njnt][3])
      exists in MuJoCo with the stated shape. But the assertion as written both MISFIRES on correct assets
      with a correct harness and MISSES the single bug it is justified by. Six concrete defects, four
      of them verified numerically against MuJoCo:


      (1) THE BOUND IS VIOLATED BY CORRECT COUPLED ASSETS — VERIFIED. KF3''s sweep drives only independent
      DOFs and writes dependent joint values derived from couplings.relation at every sample (P0 §09 ④).
      The bound L_j*(q_{k+1}-q_k) accounts for exactly one joint, and the item never says whose q. Built
      the 3:1 gear pair of P0 example B (equality polycoef "0 3 0 0 0"), stepped the independent DOF by
      dq=0.05 and derived the dependent one at 3*dq: the dependent gear''s cloud step is 0.021193 against
      a bound of r_max*dq = 0.007071, ratio 2.997. A perfectly correct 3:1 gearbox aborts KF3 with harness_fault.
      The same holds for any M_j with a moving ancestor joint, and for any layer whose sample index advances
      more than one qpos scalar at a time.


      (2) BALL AND FREE HAVE NO SCALAR q, YET THE ITEM ASSIGNS THEM L_j. Verified layout: a ball joint
      occupies nq=4 (unit quaternion) / nv=3, a free joint nq=7 / nv=6. "(q_{k+1} - q_k)" is not a scalar
      for either, so step 3 is uncomputable — this is invented arithmetic, not an existing API. Worse,
      "L_j = 1 for slide and free (translation reduction)" is false: a free body rotated 0.2 rad with
      its translation components untouched moves a point at r=1 by 0.199667, while ||Δq_quat|| = 0.099958
      — the bound is violated 2x by a correct model with no translation at all.


      (3) IT CANNOT CATCH THE BUG THAT IS ITS ENTIRE STATED PURPOSE. can_it_fail says the value is "catching
      a harness bug that ... writes the wrong qpos address between samples." If the harness writes q_k
      to the wrong qpos address, joint j never moves, so step_k = 0 <= bound and the assertion PASSES.
      Every wrong-address write makes M_j move too LITTLE, and this is a one-sided upper bound. The item
      therefore buys nothing and costs a false-abort risk.


      (4) CornerCloud(M_j) IS NEVER DEFINED, AND THE OBVIOUS READING BREAKS THE BOUND — VERIFIED. The
      term appears in no source document; the only cloud-like vocabulary in P0 is "子体 AABB 对角线". If CornerCloud
      means the corners of the body''s WORLD axis-aligned bounding box, those are not material points:
      each coordinate of a corner can move by up to the max material displacement, but the x-extreme and
      y-extreme are attained by different points, so a corner can move up to sqrt(2)*r_max*dtheta for
      a planar hinge. Swept a hinged box (size 0.05 0.9 0.5 at pos 1 0 0, dq=0.05) and found worldAABBcorner_step
      / (r_max*dq) = 1.338 at q = 1.383 rad. Spurious harness_fault on a correct door.


      (5) THE STEP IS NOT ABSOLUTE-VALUED. Step 3 uses (q_{k+1} - q_k) raw. Nothing in this item, in P0,
      or in P3 freezes the scan as ascending — "monotone" in can_it_fail includes descending, and a scan
      ordered to end at the `closed` state is a natural implementation. A descending scan makes the right-hand
      side negative and the assertion fails at every k.


      (6) DEGENERACY AND UNDEFINED SYMBOLS. (a) na_condition says "d == 0", but `d` is bound to mjData
      in mj_inputs; the symbol is undefined in this item. (b) An empty CornerCloud is unhandled: with
      discardvisual="false" and no <collision> anywhere, a URDF link with no <visual> compiles to a body
      with body_geomnum == 0, and the env facts confirm such degenerate links exist (dummy inertials are
      injected for them). max over the empty set raises or yields -inf; na_condition covers only "d ==
      0" and span_j == 0. (c) Determinism: the item never says at which sample r_max and the axis line
      (d.xaxis[j], d.xanchor[j]) are evaluated. Two conforming implementations differ, and on a hinge
      whose parent is held at a non-zero base the choice is observable.


      (7) METHODOLOGICAL: because (1), (2) and (4) fire on real configurations, "ABORTS the asset''s KF3
      ... enters no denominator" silently deletes assets from the KF3 population, and the deletion correlates
      with having a coupling — precisely the sub-population KF2/KF3 exist to measure. A harness fault
      must be loud, not a silent per-asset drop.'
    fix: "Keep the demotion (P3's \"no discontinuity\" genuinely is not an asset predicate under the no-rollout\
      \ Scope), but replace the algorithm with a two-sided, path-aware, quaternion-correct version and\
      \ make the fault loud.\n\nA. DEFINE CornerCloud(M_j) IN THIS ITEM as body-fixed material points,\
      \ not a world AABB: for each geom g with index in [m.body_geomadr[b], m.body_geomadr[b]+m.body_geomnum[b])\
      \ where b = the Gate-bound body for part M_j, emit the 8 points d.geom_xpos[g] + d.geom_xmat[g].reshape(3,3)\
      \ @ (s_x*hx, s_y*hy, s_z*hz) for s in {-1,+1}^3, where (hx,hy,hz) is the geom's local half-extent\
      \ (m.geom_size for box; the type-specific local AABB half-extent otherwise, mesh half-extent from\
      \ m.mesh_vert over [mesh_vertadr, +mesh_vertnum)). Enumerate geoms in ascending index and corners\
      \ in fixed (s_x,s_y,s_z) lexicographic order for reproducible evidence. N/A if the cloud is empty\
      \ (body_geomnum == 0).\n\nB. REPLACE THE SINGLE-JOINT BOUND WITH A PATH SUM. Let J(M_j) = the joints\
      \ encountered walking m.body_parentid from b up to world, collecting m.body_jntadr/m.body_jntnum.\
      \ Let Delta = mj_differentiatePos(m, qvel_out, 1.0, qpos_k, qpos_{k+1}) computed on the two ACTUAL\
      \ written qpos vectors — this exists in MuJoCo 3.11, handles ball/free correctly, and returns nv-sized\
      \ differences. Then\n    bound_k = sum over c in J(M_j) of L_c * ||Delta[m.jnt_dofadr[c] : +ndof(c)]||_2\n\
      with L_c = 1 for slide; L_c = r_max(c) for hinge (max perpendicular distance of CornerCloud(M_j)\
      \ from the line through d.xanchor[c] along d.xaxis[c]); L_c = r_max(c) for ball, where the nv=3\
      \ slice norm is exactly the geodesic rotation angle; and for free, L_c contributes ||Delta[dofadr:dofadr+3]||_2\
      \ * 1 + r_max(c) * ||Delta[dofadr+3:dofadr+6]||_2. Evaluate r_max(c) and the axis line ONCE, at\
      \ sample k (state this explicitly). Assert step_k <= bound_k * (1 + 1e-6) + 1e-9. Absolute value\
      \ is now automatic — Delta is a norm — which also kills defect (5). This makes the bound correct\
      \ for descending scans, multi-DOF steps, coupling-derived dependent writes, and ball/free.\n\nC.\
      \ ADD THE CHECK THAT ACTUALLY CATCHES THE MOTIVATING BUG — a write-readback assertion, executed\
      \ after writing sample k and before mj_forward:\n   (i) for every joint c the harness intended to\
      \ set, assert d.qpos[m.jnt_qposadr[c] + i] is BITWISE equal to the intended value for all i in [0,\
      \ nq(c));\n   (ii) assert every other qpos entry is bitwise equal to the frozen base qpos_0;\n \
      \  (iii) assert the model is unmutated: a hash over m.jnt_type, m.jnt_axis, m.jnt_pos, m.jnt_range,\
      \ m.body_parentid, m.geom_size, m.geom_pos, m.geom_quat taken at sample 0 and re-checked at sample\
      \ N-1.\nThis detects a wrong qpos address and a mutated model deterministically; the Lipschitz assertion\
      \ never could. Rewrite can_it_fail accordingly rather than claiming a value the algorithm does not\
      \ deliver.\n\nD. FIX na_condition: rename the undefined `d` (say n_indep == 0 for \"no independent\
      \ DOFs resolved\"), and add: N/A when CornerCloud(M_j) is empty, and when N < 2 samples.\n\nE. FIX\
      \ THE FAULT SEMANTICS: a harness_fault must abort the RUN, not just the asset, or at minimum the\
      \ run report must carry harness_fault_count with a stated invariant that a valid run has zero. Never\
      \ silently drop an asset from the KF3 denominator.\n\nF. EVIDENCE should add body_id and part_id\
      \ of M_j, the per-joint breakdown {joint_id, L_c, ||Delta_c||} for every c in J(M_j), the corner\
      \ index i and geom index attaining step_k, and the full qpos_k / qpos_{k+1} vectors — without these\
      \ the fault is not diagnosable, and joint_id alone is insufficient once the bound is a path sum."
- item: cabinet_correct
  lens: gold
  verdict:
    sound: false
    problem: 'The URDF itself is clean — it compiles and almost every claim in `expected` is geometrically
      true. But two of the `expected` evidence numbers are **unobtainable through the mandated API**,
      and the item preemptively blames the verifier for the discrepancy ("If the verifier does not score
      this 1.0, the verifier is broken"). That will send an engineer chasing a nonexistent verifier bug.


      VERIFIED FACTS (MuJoCo 3.3.7, URDF built with the two documented injections; compiles to 8 bodies
      / 3 joints / 13 geoms, neq=0, ntendon=0, every geom contype=0 conaffinity=0 group=1, ncon=0 in every
      state).


      **PRIMARY — mj_geomDistance silently returns 0.0 for two of the three forbidden pairs.**

      `expected` claims "min signed distance over a 13x13x13 sweep is +0.04000 (drawer_1,drawer_2), +0.30000
      (door,drawer_1), +0.04000 m (door,drawer_2)". Those are the true geometric separations. But a single
      `mj_geomDistance(m,d,g1,g2,distmax,fromto)` call with any distmax large enough to *see* +0.30 returns
      exactly **0.0** — not clamped, not negative, silently wrong:

      - (door, drawer_2): 78 of 2197 sweep samples return exactly 0.0; sweep min = 0.0, not +0.04000.

      - (door, drawer_1): 26 of 2197 return exactly 0.0; sweep min = 0.0, not +0.30000.

      - (drawer_1, drawer_2) is unaffected: +0.04000 correct at all 2197 samples.


      Reproduced in a 2-box minimal model: it is a numerical degeneracy in MuJoCo''s box–box distance
      routine triggered by the door panel''s half-extents (0.215, 0.01, 0.31) against the tray (0.19,
      0.18, 0.11). It is not a smooth function of size — half-y 0.01 fails but 0.0125 works; half-x 0.20
      works, 0.215 fails, 0.25 works. There is no distmax that both exceeds 0.30 and avoids it: at distmax
      ≤ 0.04 you get the clamp, at distmax = 0.041 you already get 0.0. I tried fixing it asset-side and
      it does not work — thickening the door to 0.03 m recovers (door,drawer_1)=0.30 but leaves (door,drawer_2)=0.0;
      thickening *and* narrowing to 0.4145 leaves both at 0.0.


      Why this sinks a *control*: the verdict happens to survive (forbidden_penetration_m = 0.001, and
      0.0 ≥ −0.001), so it still scores 1.0 — but only by 0.001 m, and P3''s Reporting section mandates
      minimum clearance as evidence, which is corrupt. Worse, P0 §12 says forbidden_penetration_m gets
      calibrated by fault injection *starting from this control*. A clean baseline that already reads
      0.000 m clearance on two of three forbidden pairs makes the detection-rate-vs-severity curve for
      those pairs meaningless.


      **SECONDARY 1 — door fake_joint numbers are unreproducible.** `expected` says "door 0.8562 / chord
      0.860 = 0.995". Measured: door body own-geom AABB = 0.43 × 0.02 × 0.62, diagonal **0.7548** (not
      0.8562). Max radius from the hinge axis is 0.4306, so chord 2r·sin(θ/2) = **0.7458** and arc r·θ
      = **0.9017** — neither is 0.860. Ratio is 1.012 or 0.837, not 0.995. (The drawer figure 0.5678 /
      0.240 = 2.366 is correct.) Verdict survives (all ≥ 0.50) but no harness comparing evidence will
      agree.


      **SECONDARY 2 — fake_joint sits on the wrong side of a reading ambiguity.** The tolerance is named
      `travel_scale_min: 0.50` but its comment says "child AABB diagonal / declared travel". Comment reading:
      0.5678/0.24 = 2.366 ≥ 0.50 → pass (what `expected` asserts). Name reading (travel/diag ≥ travel_scale_min):
      0.24/0.5678 = **0.4227 < 0.50 → FAIL**. A control must not straddle that.


      **SECONDARY 3 — interface_line for door_hinge is a coin flip.** The door overlaps *both* side panels
      by 0.0005 m (measured: door_panel vs carcass_left = −0.0005 AND vs carcass_right = −0.0005). The
      door↔cabinet_body contact region is therefore two vertical strips 0.43 m apart. "Longest principal
      direction" by PCA variance gives **horizontal** (σx ≈ 0.2075 > σz ≈ 0.179) → the vertical hinge
      axis fails KF1.axis.relational by 90°; by bounding extent it gives vertical (0.62 > 0.43) → passes.
      `expected` asserts relational 3/3.


      **SECONDARY 4 — contract divergence is unstated.** P0 §13''s frozen Contract A declares drawer `range:
      {unit: m, min: 0.0, max: 0.40}` and `states: {open: 0.40}`; the URDF is 0..0.24. If `gold/contract_A_cabinet.yaml`
      is literally Contract A, KF1.range_and_reference fails 2/3. (0.40 is also geometrically impossible
      in a 0.40 m deep carcass — retention would be 0.)


      Everything else checks out: jnt_range exactly [0,0.24]/[0,0.24]/[0,2.094], jnt_limited=1, qpos0=0;
      xaxis (0,−1,0)/(0,−1,0)/(0,0,1); door xanchor (0.2155,−0.2095,0) and slide xanchor (0,0,0) correctly
      N/A; all three rigid followers have body_jntnum=0 inside their leader''s subtree; all three required
      stop_contacts read exactly −0.00050 at closed; on_edge_of fraction 1.0; retention 0.1405/0.36 =
      0.3903. No normalization by a whole-asset diagonal anywhere.'
    fix: "The fix is verifier-side, not asset-side — I confirmed no geometry tweak works. Both workarounds\
      \ below are measured, not guessed.\n\n1. **Freeze a two-stage signed-distance protocol in P0 `tolerances`\
      \ and state it in the P3 spec. Never call mj_geomDistance once with a large distmax and trust the\
      \ number.**\n   - *Verdict stage:* one call with a frozen `distmax = 0.01` (any value above both\
      \ required_contact_m = 0.002 and forbidden_penetration_m = 0.001, and below the smallest clearance\
      \ you must resolve). Verified: all 3 forbidden pairs clamp cleanly to +0.01 at all 2197 samples\
      \ with zero false penetrations, and all required pairs still read exactly −0.000500. Verdicts are\
      \ correct and deterministic.\n   - *Evidence stage* (needed because P3 Reporting mandates minimum\
      \ clearance): binary-search the largest `D` for which the call returns exactly `D`; that `D` is\
      \ the true separation. Verified to recover **+0.04000** for (door,drawer_2) and **+0.30000** for\
      \ (door,drawer_1) exactly, matching the `expected` block. Freeze the bracket [1e-6, 2.0] and the\
      \ termination width 1e-7 so it is byte-reproducible. Short-circuit: if the call at distmax = 1e-6\
      \ returns less than 1e-6, it is a genuine penetration — trust that value directly (this is what\
      \ correctly yields −0.000500 on the required pairs).\n   - Add `distmax_verdict: 0.01` and `distmax_bisect_tol:\
      \ 1.0e-7` to the frozen `tolerances` block so they hash with the contract.\n\n2. **Amend the `expected`\
      \ block** to state the protocol and to record explicitly that a naive single call with distmax >\
      \ 0.04 returns 0.0 for (door,drawer_1) and (door,drawer_2). Keep +0.04000/+0.30000 as the values,\
      \ but label them \"via bisection\". Otherwise this control silently certifies a broken distance\
      \ backbone.\n\n3. **Correct the door fake_joint figures:** AABB diagonal 0.8562 → **0.7548**; chord\
      \ 0.860 → **0.7458** (= 2·0.4306·sin(1.047)). Name which quantity is the denominator — chord (ratio\
      \ 1.012) or arc length 0.9017 (ratio 0.837). Both pass ≥ 0.50; the printed numbers must match one\
      \ definition.\n\n4. **Disambiguate fake_joint.** Either rename the tolerance to `aabb_over_travel_min`\
      \ to match its comment, or raise drawer travel to ≥ 0.284 m (= 0.5 × 0.5678) so the control passes\
      \ under both readings. Note the trade: travel 0.30 m drops retention from 0.3903 to 0.2236, and\
      \ P0's `tolerances` block has **no retention threshold field at all** — add `motion_retention_min`\
      \ and set it below whatever the control produces, otherwise KF3.motion_semantics has an unfrozen\
      \ threshold. Alternative that preserves retention: shrink tray depth to 0.30 (diag 0.5219) and set\
      \ travel 0.28 → travel/diag = 0.536 and diag/travel = 1.864, passing both readings.\n\n5. **Kill\
      \ the interface_line coin flip.** Either (a) shift/narrow the door so it overlaps only the hinge-side\
      \ panel — measured working: `<box size=\"0.4145 0.03 0.62\"/>` with origin `xyz=\"-0.20775 -0.005\
      \ 0.34\"` gives door vs carcass_left = +0.00050 (clear) and vs carcass_right = −0.00050 (contact\
      \ retained, required stop_contact still satisfied) — or (b) freeze `interface_line` as \"longest\
      \ bounding extent of the contact region\", never PCA. Do (a) regardless; a control should not depend\
      \ on which the implementer picks.\n\n6. **State the contract divergence explicitly** in the item:\
      \ `gold/contract_A_cabinet.yaml` must declare drawer `range.max = 0.24` and `states.open = 0.24`,\
      \ differing from P0 §13 Contract A's 0.40, and the item should say so rather than citing \"Contract\
      \ A\" unqualified."
- item: cabinet_fake_joint_decoy_geom
  lens: gold
  verdict:
    sound: false
    problem: "The URDF is fine and the core defect works: it loads (8 bodies / 3 joints / 14 geoms, ncon=0),\
      \ the geometry is consistent (stub fully swallowed by the decoy tray, flush at its back face, overlapping\
      \ carcass_back by 0.0005 m; trays clear the cavity by 0.01 m; hinge has 100% of door vertices on\
      \ one side of the axis plane), and the target predicate reproduces exactly: drawer_1 own-body AABB\
      \ diag 0.034641 / 0.24 = 0.144338 vs control 2.365845. KF1.rigid_follower drift is 0.000000, KF3.required_contact\
      \ for drawer_1 is exactly -0.02000, and no sample in a 13x13x13 sweep produces a spurious negative.\
      \ Two things are nevertheless wrong.\n\n(1) TWO OF THE THREE QUOTED FORBIDDEN-PAIR VALUES ARE UNOBTAINABLE\
      \ FROM mj_geomDistance. Measured over a deterministic sweep with mj_geomDistance (MuJoCo 3.3.7,\
      \ the mandated API since ncon is always 0):\n  (drawer_1, drawer_2) -> +0.00000, item says +0.14000\n\
      \  (door,     drawer_1) -> +0.417612, item says +0.41761  (only this one reproduces)\n  (door, \
      \    drawer_2) -> +0.00000, item says +0.04000\nRoot cause: MuJoCo's box-box collider is not a distance\
      \ function. For separated boxes it returns the true gap only sometimes; the answer depends on how\
      \ the pose is split between body_pos and geom_pos, not on world geometry. Minimal repro (/private/tmp/claude-501/-Users-wanglin-Projects-Articraft--claude-worktrees-evo-articraft-verifier-856ef5/b56010b7-3646-4c78-939c-312f618f2b2b/scratchpad/kf/mine_p0p3/repro_boxbox.py):\
      \ two boxes at byte-identical geom_xpos/geom_xmat return 0.14000 when authored at body_pos=0 and\
      \ 0.00000 when the same pose is authored as body_pos=(0,-0.16,0) + geom_pos offset (the URDF import\
      \ produces the latter). No distmax rescues it: below the true gap the call returns the clamp (distmax=0.05\
      \ -> +0.05000), above it returns 0.0; only distmax == 0.14 exactly happens to print 0.14. The item's\
      \ numbers were computed analytically by hand, not measured. The pass/fail verdict survives (0.0\
      \ is not a penetration, so forbidden is still 3/3), but as a regression fixture the expected block\
      \ will fail a correct implementation. Worse, the same failure mode is load-bearing for KF3.required_contact\
      \ (min sd <= 0.002): a genuinely separated pair can read 0.0 and spuriously satisfy stop_contact.\n\
      \n(2) A SECOND PREDICATE FIRES, CONTRADICTING \"EXACTLY ONE PREDICATE MUST FIRE\". Under P0's literal\
      \ tolerance definition (\"travel_scale_min 0.50 = child AABB diagonal / declared travel\") applied\
      \ per joint, door_hinge gives 0.7548 m / 2.094 rad = 0.3605 < 0.50 -> FAIL. Metres divided by radians\
      \ is dimensionally meaningless, and the value is identical in cabinet_correct (0.3605), so under\
      \ the reading this item assumes, the control asset cannot score 1.0 either. The item never states\
      \ that fake_joint is slide-only or how a hinge's travel becomes a length, and it does not quote\
      \ door_hinge's or drawer_2_slide's fake_joint values.\n\n(3) Fragility that must be pinned down\
      \ or the asset is undetectable: the whole defect rests on the AABB covering only the bound body's\
      \ own geoms. Include the welded rigid subtree (handle_1, a fixed-joint child - a natural reading\
      \ given P0's rigid_attachments says the handle rigidly follows drawer_1) and drawer_1's diag becomes\
      \ 0.4474, ratio 1.8642, PASS - the asset detects nothing. The item says \"geom count 1\" but never\
      \ states the exclusion rule."
    fix: '(1) Specify a signed distance that mj_geomDistance can actually deliver, then requote the numbers.
      Add to the KF3 spec: sd(g1,g2) = mj_geomDistance(m,d,g1,g2,DISTMAX,fromto); if that value is < 0,
      return it (penetration is reported correctly - verified -0.02000 at every distmax). Otherwise recover
      the true gap by bisecting on distmax, exploiting the fact that the call returns exactly distmax
      when distmax is below the true separation: d* = sup{ t in [0, DISTMAX] : mj_geomDistance(...,t)
      == t }, 60 fixed bisection steps, DISTMAX frozen at 5.0, tie test |w - t| <= 1e-12*max(1,t). This
      is deterministic (no randomness, no iteration-order dependence) and costs ~60 extra calls per pair-sample.
      Verified on this asset: it returns exactly +0.14000, +0.41761, +0.04000 and -0.02000. With it, the
      item''s expected block can stand as written; without it, the expected block must instead read "(drawer_1,drawer_2)
      +0.00000, (door,drawer_1) +0.41761, (door,drawer_2) +0.00000 at distmax 5.0" and the required-contact
      predicate needs the same treatment or it will pass separated pairs.


      (2) Freeze the hinge rule for fake_joint and quote all three joints. Replace "declared travel" with
      a length for every joint type: for slide, travel = |range.max - range.min| in metres; for hinge,
      travel = |range.max - range.min| (rad) x r_max, where r_max = max over the eight corners of the
      child body''s own-geom world AABB of ||(corner - d.xanchor[j]) x d.xaxis[j]||; for ball/free, fake_joint
      is N/A. For this asset r_max(door) = 0.43062, arc = 0.90171 m, ratio 0.7548/0.90171 = 0.8371 >=
      0.50 PASS. Then the expected block must read: KF1.fake_joint drawer_1_slide FAIL 0.1443, drawer_2_slide
      PASS 2.3658, door_hinge PASS 0.8371 - exactly one failure, and cabinet_correct scores 1.0.


      (3) State the geom-set rule verbatim in the item: "the AABB is built from the bound body''s own
      geoms only, indexed by m.body_geomadr[b] .. m.body_geomadr[b]+m.body_geomnum[b]; bodies welded to
      it via fixed joints (body_jntnum == 0 children) are excluded." Add the counter-value to the evidence
      so an implementer can self-check: including the welded subtree yields 0.4474 / ratio 1.8642 and
      misses the defect.'
- item: cabinet_drawer_flies_out
  lens: gold
  verdict:
    sound: false
    problem: 'The asset itself is fine — it parses, loads (nbody 8, njnt 3, ngeom 14, nq 3, neq 0, 0 collidable
      geoms), passes G0–G3, and the defect really is isolated: no frozen P3 predicate fires, so the "scores
      1.0 today" probe claim holds. What is unsound is (a) the proposed fix, which is under-specified
      in exactly the way that decides its outcome, and (b) four of the item''s "measured" evidence numbers,
      which I could not reproduce in MuJoCo 3.3.7. Measured on the URDF as given (patched with the stated
      compiler directive, mj_forward only, no stepping):


      1. THE PROPOSED FIX DOES NOT FIRE UNDER THE AABB DEFINITION ALREADY IN THIS CODEBASE. "AABB overlap
      fraction" names neither how the AABB is built nor the denominator. /Users/wanglin/Projects/Articraft/.claude/worktrees/evo-articraft-verifier-856ef5/evo-p0p3/evo_p0p3/p3/mjcf.py::subtree_aabb
      builds AABBs from geom_rbound bounding spheres. With that helper the drawer_1/cabinet_body fraction
      is 0.996618 at q1=0.32 and 0.846182 at q1=0.40 — never below 0.10, so the retention clause never
      fires and the probe still scores 1.0 after the fix is implemented. Only an exact support-mapped
      AABB (|R|·half-extent per geom) gives 0.000000. Denominator is likewise unpinned; only "intersection
      volume / child AABB volume" reproduces the quoted separation figures (I get drawer_2 at its 0.24
      travel = 0.390278, matching the quoted cabinet_correct 0.3903, and (0.3805-0.04)/0.36 = 0.945833,
      matching cabinet_range_too_small 0.9458).


      2. TWO OF THE THREE FORBIDDEN-PAIR CLEARANCES ARE UNREPRODUCIBLE WITH THE MANDATED BACKEND. Over
      a 21x13x15 sweep grid (12285 pair-samples, distmax 0.5) mj_geomDistance returns: (drawer_1,drawer_2)
      +0.040000 (matches), (door,drawer_1) +0.000000 (claim +0.30000), (door,drawer_2) +0.000000 (claim
      +0.04000). MuJoCo''s box-box distance returns a spurious zero with a garbage fromto in 427 of 12285
      samples; none negative, so the pass 3/3 verdict survives but the "minimum clearance" evidence field
      is wrong. Minimal repro, independent of distmax: two axis-aligned boxes size (0.19,0.18,0.11) at
      (0,dy,0.8) and (0.215,0.01,0.31) at (0,-0.2095,0.34), separated by exactly 0.040 in z and overlapping
      in x and y — mj_geomDistance gives 0.040000 for dy=-0.02/-0.04/-0.06/-0.2395 but 0.000000 for dy=-0.0795
      and -0.12. Separately, the quoted +0.30000 and +0.04000 are hand-computed z-gaps: the true 3-D minima
      are 0.300666 and 0.043497.


      3. THE RETENTION EVIDENCE IS INTERNALLY INCONSISTENT. Exact-AABB fractions: q1=0.00 -> 1.000000,
      0.24 -> 0.268333, 0.29 -> 0.101667, 0.30 -> 0.068333, 0.31 -> 0.035000, 0.32 -> 0.001667, 0.33+
      -> 0.000000. So "falls to 0.0000 for every q1 >= 0.32" is false (it is 0.001667 there; zero only
