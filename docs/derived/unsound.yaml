      \ item text:\n- Rewrite the `(door, drawer_1)` evidence as \"min ≥ 0 (passes)\", not \"+0.05000\"\
      . Do not assert an exact positive distance for any separated box pair — `mj_geomDistance` returns\
      \ exactly 0.0 with a bogus witness in degenerate parallel-face configurations (verified, ~8% of\
