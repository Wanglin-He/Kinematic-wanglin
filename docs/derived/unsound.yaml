      \ that row's eq_obj2id is -1 == jd. False degenerate_relation. Verified eq_obj2id == -1 is the real\
      \ sentinel (m.eq_obj2id = [-1, 0, 0] in my test), so this collision is live.\n E. Evidence-schema\
      \ mismatch. Step 3 appends into pinned_member, whose schema is {joint_id, joint_name, eq_index,\
      \ constant} — a tendon-derived pin has neither eq_index nor constant. Meanwhile the declared evidence\
      \ field `zero_tendon_coefficient_member` is never written by any step.\n F. Determinism gap. A fixed\
