- item: KF1.pivot_locality
  lens: kf1
  verdict:
    sound: false
    problem: 'FATAL: the statistic `d_min` normalized by `diag(part)` systematically inverts the ranking
      on the `through_center_of` family, and there is no threshold that both leaves correct assets alone
      and catches the defect it targets.


      I measured this on the real corpus at /Users/wanglin/Desktop/articraft-data/cache/record_materialization
      (546 model.urdf assets, 0 load failures with the stated MuJoCo injection, 1402 hinges). Harness:
      /private/tmp/claude-501/-Users-wanglin-Projects-Articraft--claude-worktrees-evo-articraft-verifier-856ef5/b56010b7-3646-4c78-939c-312f618f2b2b/scratchpad/harness.py


      1) NOT a formal tautology (this part is fine, and I verified it). Injecting an offset into the child
      link''s `<visual><origin>` moves d_min monotonically (0.007 -> 5.19 for L=0..2m), while moving the
      `<joint><origin>` produces exactly zero change (URDF folds the joint origin into the child body
      frame; jnt_pos is [0,0,0] in every asset I loaded), reproducing the prior team lesson. So the fault
      it claims to target is authorable and visible.


      2) But it is a PRACTICAL tautology at any safe threshold. Distribution of d_min/diag over 1402 real
      hinges: p50=0.040, p90=0.148, p99=0.342, max=0.489. Any pivot_locality_max >= 0.50 flags 0 of 1402
      -> constant pass, zero information. That is exactly the failure mode the brief warns about.


      3) And at any sensitive threshold the false positives are systematic, not random. The 30 worst-scoring
      hinges in the whole corpus are ALL correct rotary parts: microscope coarse_knob (0.489) and fine_knob
      (0.471), eight MIDI knobs (0.423), dishwasher rockers, camera-lens focus/zoom/aperture rings (0.30-0.34),
      lazy_susan tray (0.341), bench-vise turntable, air-fryer dials. Root cause is structural: for a
      `through_center_of` part the axis is SUPPOSED to run through the interior, where by construction
      no surface point lies, so d_min is bounded below by the part''s inner radius, and dividing by the
      3-D AABB diagonal puts a solid disc at ~0.35 and an annulus higher. I checked these same three worst
      offenders against P0''s own `through_center_of` predicate: axis-to-centroid / diag = 0.0000, 0.0056,
      0.0000 — i.e. geometrically perfect pivots, comfortably inside anchor_center_offset_max=0.05, ranked
      by pivot_locality as the corpus''s worst pivots. The item''s explicit design choice ("deliberately
      NOT conditioned on the anchor field being present") is precisely what makes it fire on gears and
      knobs.


      4) Consequent detection floor. At the only false-positive-free threshold (0.5), the injected geometry
      offset must exceed ~0.52x the part''s own diagonal before it is caught. A door hinged one full door-width
      away from itself — a blatant defect — scores 0.25 and passes. tol=0.2 flags 82/1402 (5.9%) real
      hinges, against a corpus base rate of only 47/607 true negatives; the false positives would swamp
      the signal.


      SECONDARY DEFECTS:

      5) `pivot_locality_max` does not exist. Revised P0''s `tolerances` block is FLAT with exactly nine
      keys (axis_angle_deg, anchor_side_fraction_min, anchor_center_offset_max, travel_scale_min, follower_drift_m,
      state_match_relative, required_contact_m, forbidden_penetration_m, coupling_residual). The item
      reads `kinematic_claims.tolerances.kf1.pivot_locality_max` — both a nonexistent key and a nesting
      P0 does not use. Violates R3 and admission A12; the code cannot be written as specified.


      6) Redundant where it is most harmful. For `through_center_of` parts, `anchor_center_offset_max`
      already catches a remote pivot, without the annulus artifact. The item''s marginal value is confined
      to `on_edge_of` parts and anchor-less hinges.


      7) d_min is fragile in the other direction too: 79/1402 (5.6%) of real hinges already score exactly
      0.0000, and 168 score <1e-6. One stray point on the axis (a knuckle geom, a degenerate zero-size
      geom, a mesh vertex at the origin) passes the entire part regardless of where its bulk sits.


      8) `r_perp = mean(d_p)`, declared as an export to KF1.open_direction, is a sampling-weighted average,
      not a geometric radius. Its value depends on mesh tessellation density and on whether S4''s points()
      returns mesh vertices or geom OBB corners (the corpus is mostly primitive geoms — median 3 meshes
      vs 31 geoms). Deterministic per-model, but not a well-defined geometric quantity, so it is a bad
      inter-item contract.


      9) No guard for diag(part)==0 in `d_min_over_diag` or in `margin`; not in the N/A list. And `diag(part)`''s
      frame is unspecified — a world-axis-aligned AABB diagonal is not invariant under the whole-asset
      rotation P0 section 16(1) plans as a controlled experiment, and a tall door''s height (parallel
      to the axis, contributing nothing to "orbiting") inflates the denominator.


      VERIFIED SOUND (no action needed): mjData.xanchor and mjData.xaxis are real, shape njnt x 3, populated
      by mj_kinematics inside mj_forward (checked on mujoco 3.3.7); xaxis is unit-norm so the projection
      needs no renormalization; no contacts and no mj_geomDistance are involved; it does not normalize
      by a whole-asset diagonal; and d_p is exactly invariant under the hinge''s own coordinate (identical
      to 9 decimals at q=0.0/0.4/1.0/1.45), so "at REF" is not load-bearing and the output is deterministic.'
    fix: 'Replace min-distance-to-points / 3-D-diagonal with SILHOUETTE GAP / PERPENDICULAR DIAMETER:
      "does the axis pierce the part''s outline, and if not, how far outside is it, relative to how wide
      the part is across the axis." I implemented and measured this on the same corpus (/private/tmp/claude-501/-Users-wanglin-Projects-Articraft--claude-worktrees-evo-articraft-verifier-856ef5/b56010b7-3646-4c78-939c-312f618f2b2b/scratchpad/kf1fix.py).


      ALGORITHM (fully determined, no free choices):

      1. a = xaxis[k*], o = xanchor[k*] at REF (a is unit by construction).

      2. Deterministic perpendicular basis: t = (1,0,0) if |a_x| < 0.9 else (0,1,0); u = normalize(a x
      t); v = a x u.

      3. Q = { ((p-o).u, (p-o).v) : p in points(part) } — project the part into the plane perpendicular
      to a, anchor at the 2-D origin.

      4. H = 2-D convex hull of Q by monotone chain, on the input rounded to 1e-12 and sorted lexicographically
      (fixes tie-break and ordering; no set/dict iteration).

      5. gap = 0.0 if the origin is inside or on H (all cross(V[i+1]-V[i], -V[i]) >= -1e-15); else min
      over hull edges of the point-to-segment distance from the origin. If H has fewer than 3 distinct
      vertices (collinear/degenerate projection), gap = point-to-segment distance from the origin to the
      single hull segment.

      6. W = exact hull diameter = max pairwise distance among hull vertices — the part''s extent across
      the axis.

      7. PASS iff gap <= pivot_locality_max * W.

      8. N/A adds: W == 0 (part projects to a point, e.g. a needle collinear with the axis). Keep all
      existing N/A clauses; the diag==0 division problem disappears because diag is no longer used.

      9. Evidence: joint_id, part, xanchor_world, xaxis_world, gap, W, gap_over_W = gap/W, axis_pierces_silhouette
      (bool), margin = pivot_locality_max - gap/W.


      MEASURED RESULT on the same 1402 real hinges: 93.3% score exactly 0 (the axis pierces the silhouette,
      as it should); p99 = 0.099, max = 0.231. Every knob, dial, focus/zoom/aperture ring, lazy susan
      and turntable that broke the original statistic now scores exactly 0.000. The worst remaining cases
      are genuinely marginal real geometry (helicopter cowling hinge 65mm outboard of the panel, extension-ladder
      step hinges 20mm off the step), not systematically-correct parts. With pivot_locality_max = 0.30:
      0/1402 false positives AND the injected fault is caught at an offset of 0.11x the part''s own diagonal,
      versus 0.52x for the spec as written — roughly a 5x better severity floor. With 0.05: 21/1402 flagged
      (1.5%) and detection at ~0.05x diag. The motivating case still fires hard: the door hinged 2 m away
      scores 5.70. And the fix stays correctly blind to a moved `<joint><origin>` (0.0000 at L=0 and L=1.0),
      which is a rigid re-parametrization, not a defect.


      ALSO REQUIRED:

      A. Add `pivot_locality_max` to P0''s FLAT tolerances block and to admission check A12''s completeness
      list; change p0_inputs to `kinematic_claims.tolerances.pivot_locality_max`. Protocol initial value
      0.30, to be set by the fault-injection knee per P0 section 12. This is a P0 schema amendment and
      must be declared as such in `deviates_from_spec` alongside the P3 bullet-4 replacement, since R3
      forbids thresholds that live only in code.

      B. Drop `r_perp = mean(d_p)` as the export to KF1.open_direction. Hand open_direction a genuine
      moment arm instead: the VECTOR c_perp = ((c - o) - ((c - o).a) a) where c is the part''s point-cloud
      centroid, plus its norm |c_perp|. That is a real geometric quantity (a lever arm with a direction),
      it is what open_direction actually needs, and it does not depend on tessellation density in the
      way a mean of scalar distances does. If open_direction genuinely needs a scalar radius, use |c_perp|
      and state it.

      C. Restate `can_it_fail` with the measured numbers rather than the argument, and record in the item
      that the SPEC statistic was rejected against corpus evidence, so the next reviewer does not re-propose
      it.'
- item: KF1.open_direction
  lens: kf1
  verdict:
    sound: false
    problem: "The metric is not a tautology (a model can fail it), but it fails the wrong models. I ran\
      \ the algorithm exactly as written against the real gold control /Users/wanglin/Projects/Articraft/.claude/worktrees/evo-articraft-verifier-856ef5/evo-verifier/gold/cabinet_correct.urdf\
      \ (MuJoCo 3.3.7, loaded through gold/loader.py) plus a sign-flipped fault injection (`<axis xyz=\"\
      0 -1 0\"/>` -> `0 1 0`, i.e. exactly the reversed drawer the item advertises). Five problems, the\
      \ first two fatal.\n\n(1) FATAL, slide: ZERO discriminative power on its own headline defect, and\
      \ inverted on the gold pair. Measured ratios with c() = AABB centre of the part's geoms:\n  drawer_1\
      \ CORRECT  delta_D=+0.05861  delta_exp=0.24  ratio=0.2442\n  drawer_1 REVERSED delta_D=+0.05908\
      \  delta_exp=0.24  ratio=0.2462\nThe reversed drawer scores HIGHER than the control. No open_separation_min_frac\
      \ passes the control and fails the fault. Root cause is algebraic, not tuning: for a slide, D_closed=|v|\
      \ and D_open=|v+Delta| with v = c_part_closed - c_parent and Delta = (q_o-q_c)*a_hat. delta_D =\
      \ sqrt(|v|^2 +/- 2 v.Delta + |Delta|^2) - |v|; the ONLY sign-carrying term is 2 v.Delta, which vanishes\
      \ identically when v is perpendicular to Delta. A closed drawer is nested and centred in depth,\
      \ so v is almost purely the height offset and v.Delta ~ 0 by construction. The item's assertion\
      \ \"This predicate fails both at delta_D <= 0\" is quantitatively wrong: delta_D <= 0 requires the\
      \ closed part's centroid offset ALONG the travel axis to exceed the full travel, which never happens\
      \ for a nested drawer. The reversed drawer here drives clean through the carcass_back panel and\
      \ out the back of the cabinet and the predicate sees +0.059 m of \"separation\".\n\n(2) FATAL, hinge:\
      \ chord compared against arc, so the score of a CORRECT joint decays as 1/|Delta q| and the test\
      \ inverts past pi. delta_D is bounded by ~2*d_c (a chord) while delta_exp = |Delta q|*r_perp grows\
      \ linearly, so ratio_max ~ 2/|Delta q|. Measured on the gold door (r_perp=0.2203, D_closed=0.3339),\
      \ correct-outward vs defect-inward:\n   45 deg: 0.6712 vs -0.3486    120 deg: 0.5195 vs 0.1768\n\
      \   90 deg: 0.6037 vs  0.0111    180 deg: 0.3053 vs 0.3053  <- identical, zero information\n  190\
      \ deg: 0.2675 vs 0.3069  <- INVERTED, defect outscores control\n  270 deg: 0.2012 vs 0.0037    360\
      \ deg: 0.0000 vs 0.0000\nA single frozen threshold cannot exist: passing a correct 180-degree flat-opening\
      \ door (chest-freezer lid, laptop clamshell, flip phone, cabinet door that folds against the side)\
      \ requires f <= 0.305, but the gold drawer only reaches 0.244, and a correct 270/360-degree part\
      \ scores 0.20/0.00 and always fails. The 5%-of-diagonal spin guard does not save these: the gold\
      \ door itself has d_c/diag = 0.286, and any swivel part offset by >5% of its diagonal is scored.\n\
      \n(3) DETERMINISM: the verdict flips with an unspecified primitive. The item defers c() to \"S3\"\
      . With c() = mean of geom_xpos instead of AABB centre: correct 0.3249 vs reversed 0.2236 (works,\
      \ barely). With c() = AABB centre: 0.2442 vs 0.2462 (inverted). The whole signal is smaller than\
      \ the gap between two admissible definitions of c(), and the only reason the mean-geom variant works\
      \ is that the carcass_back panel drags the mean 2.4 cm to +y - delete the back panel (a legal cabinet)\
      \ and it collapses. Same exposure for r_perp: \"points(part)\" (mesh vertices vs AABB corners vs\
      \ geom origins) scales delta_exp directly and is defined only by reference to another item.\n\n\
      (4) SCHEMA: `tolerances.kf1.open_separation_min_frac` does not exist. The authoritative /Users/wanglin/Desktop/task-2_08-19-p0.html\
      \ section 12 freezes a FLAT block of nine keys with no `kf1` namespace, and admission check A12\
      \ requires that block complete; the key would have to be added to P0 and to A12. Separately, reusing\
      \ `anchor_center_offset_max` for the spin guard directly violates P0 section 12's stated calibration\
      \ property (\"each threshold serves exactly one predicate, tuning it does not move other items\"\
      ) - retuning the guard would silently move the through_center_of anchor predicate. 0.05*diag is\
      \ also far too tight for a spin-in-place guard.\n\n(5) JUSTIFICATION ERROR pointing at the wrong\
      \ fix: the item says KF3 misses the inward door because \"drawer-vs-cabinet_body is a REQUIRED contact\
      \ pair and precedence exempts it\". In the frozen contract (gold/contract_A_cabinet.yaml) [door,\
      \ drawer_1] and [door, drawer_2] ARE in `forbidden` and are NOT in required/permitted, so precedence\
      \ exempts nothing and KF3 does catch the inward door. The real gap is the drawer, and for a different\
      \ reason: [drawer_1, cabinet_body] appears only under `required` (state: closed) and never under\
      \ `forbidden`, so no penetration test is applied to that pair at all - precedence is irrelevant.\
      \ Minor: the evidence block emits r_perp for slides too, where it is meaningless (1.0771 m for a\
      \ 0.38 m drawer, since xanchor is arbitrary for a slide); it should be null. And c()/diag() are\
      \ undefined for a bound body with zero geoms, which the N/A list (\"unbound\") does not cover."
    fix: 'Keep the insight - the sign of the realised motion is real, is deliberately discarded by the
      |cos| axis checks, and nothing else tests it - but throw away distance-to-parent-centroid. Replace
      with either of the two below; I verified both on the same gold control/fault pair. Recommend shipping
      BOTH, with (A) primary and (B) the fallback when no directed reference exists, since (B) also covers
      the exact contact_policy hole from problem (5).


      (A) SIGNED PROJECTION ONTO THE DIRECTED RELATIONAL REFERENCE.

      Inputs: joints[j].axis.relational restricted to the DIRECTED types (interface_normal {from,to},
      toward {from,to}); axis.numeric only if canonical_frame.front is anchored; the same reference vector
      KF1''s axis claim already builds at REF, before it takes abs(); one NEW flat P0 tolerance `open_direction_cos_min`
      (default 0.259 = cos 75 deg), added to section 12 and to A12.

      Algorithm: 1. r_hat = directed reference at REF (interface_normal oriented from the `from` part
      toward the `to` part; toward = normalize(c(to)-c(from))). 2. Build CLOSED and OPEN by the same S0
      procedure. 3. u_hat: for slide, normalize(c_part_OPEN - c_part_CLOSED) - exact and angle-free. For
      hinge, use the INSTANTANEOUS TANGENT at the closed state, u_hat = normalize(sign(q_o-q_c) * (a_hat
      x (c_part_CLOSED - p))) with p = xanchor[k*], a_hat = xaxis[k*] evaluated in the CLOSED snapshot;
      this is the direction the part first moves, is well defined for any travel, does not decay with
      |Delta q|, and does not wrap at pi - killing problem (2) outright. 4. Pass iff u_hat . r_hat >=
      open_direction_cos_min.

      N/A: undirected reference (interface_line, symmetry_axis_of) -> undirected_reference; numeric with
      front unanchored; ball/free; states.closed or .open absent; unbound part/parent OR zero geoms on
      either; no_usable_travel; degenerate tangent |a_hat x (c-p)| <= spin_in_place_offset_max * diag(part)
      with a NEW flat tolerance `spin_in_place_offset_max` (suggest 0.15), NOT a reuse of anchor_center_offset_max;
      and - to avoid double-counting - N/A with reason reference_not_parallel whenever KF1''s own axis
      claim for this joint already failed (|cos(r_hat, xaxis)| below axis_angle_deg), since a mis-resolved
      interface normal is that claim''s defect, not this one''s.

      Evidence: joint_id, part, parent, reference_type, r_hat, u_hat, cos = u_hat.r_hat, margin = cos
      - open_direction_cos_min, q_closed_declared/used, q_open_declared/used, state_clipped, c_part_closed,
      c_part_open, anchor, axis.

      MEASURED on the gold pair: drawer CORRECT u_hat=(0,-1,0), cos=+1.0000; drawer REVERSED u_hat=(0,+1,0),
      cos=-1.0000. Full separation, independent of centroid offset and travel magnitude.


      (B) PENETRATION GROWTH INTO THE PARENT OVER THE SWEEP (no declared direction needed, no front anchoring,
      uses only the verified call).

      pen(state) = max over (g in geoms(part)) x (h in geoms(parent)) of max(0, -mj_geomDistance(m, d,
      g, h, distmax, None)), evaluated on the CLOSED snapshot and at every sweep sample of joint k* between
      q_c and q_o. Pass iff max_over_sweep(pen) - pen(CLOSED) <= forbidden_penetration_m (already frozen
      at 0.001, no new tolerance). Referencing the delta against CLOSED is mandatory, not cosmetic: the
      gold drawer already sits at pen(CLOSED)=0.00050 m nested in the carcass, so an absolute test would
      fail the control.

      MEASURED on the gold pair: drawer CORRECT growth = +0.00000 m; drawer REVERSED growth = +0.18900
      m (it drives through carcass_back); door CORRECT growth = +0.00000 m; door REVERSED growth = +0.03568
      m. That is 189x and 36x the frozen 0.001 m threshold - and it closes the [drawer_1, cabinet_body]
      contact_policy hole from problem (5) without touching contact_policy.

      N/A for (B): part or parent unbound or with zero geoms; len(chain)==0; states missing; no_usable_travel.
      It does NOT need the spin-in-place guard (a knob spinning in its own bore shows zero penetration
      growth), which is a further reason to prefer it over the original.

      Evidence for (B): joint_id, part, parent, pen_closed, pen_max, growth = pen_max - pen_closed, q_first_exceeding,
      geom pair (g,h) at the max, distmax used.


      Also required regardless of which is adopted: pin c() and points(part) to one definition in the
      shared S3/primitives section rather than by cross-reference; add the new tolerance key(s) to P0
      section 12 and to admission check A12; stop reusing anchor_center_offset_max; and correct the item''s
      `can_it_fail` prose, which currently claims delta_D <= 0 for the reversed drawer (measured: +0.059)
      and blames precedence for a KF3 miss that is actually caused by [drawer_1, cabinet_body] never appearing
      in `forbidden`.


      Repro scripts: /private/tmp/claude-501/-Users-wanglin-Projects-Articraft--claude-worktrees-evo-articraft-verifier-856ef5/b56010b7-3646-4c78-939c-312f618f2b2b/scratchpad/kf1open.py
      (spec as written), sweep.py (angle sweep), fix.py (both replacements).'
