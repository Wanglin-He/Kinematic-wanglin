      - AABB: world axis-aligned box of a bound body''s own geoms at the current pose, computed per geom
      as centre +/- |R| @ h where R = data.geom_xmat[g].reshape(3,3) and h is the geom''s exact half-extent
      — box: model.geom_size[g]; sphere: (r,r,r); cylinder: (r,r,hz); capsule: (r,r,hz+r); mesh/other:
