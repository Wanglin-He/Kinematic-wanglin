      - KF1.rigid_follower: control drift 0.000000 / defect drift 0.240000, structural walk handle_1 ->
      cabinet_body -> world. CONFIRMED, and falsifiable (not a tautology).

      - KF3.required_contact at closed: -0.000500 for all three pairs. CONFIRMED.


