- item: KF1.follower_behavior
  lens: kf1
  verdict:
    sound: false
    problem: 'Six defects, three of them hard. All MuJoCo claims below were executed against a live install
      (3.3.7; the fields involved are unchanged across 3.x).


      F1 — INVENTED API (hard). `mjData.body_xpos` and `mjData.body_xmat` do not exist. Verified: `hasattr(mujoco.MjData,''body_xpos'')
      == False`. The real fields are `mjData.xpos` (nbody,3), `mjData.xmat` (nbody,9 — flat, needs `.reshape(3,3)`
      before the `.T @` the algorithm writes), `mjData.xquat` (nbody,4). `body_pos`/`body_quat` exist
      only on mjModel and are body-local constants, not world poses. Note also that `xipos`/`ximat` must
      never be substituted: they are the inertial frames, and the inertia here is synthesized by our own
      injection, which the ground rules forbid from influencing any score.


      F2 — CITED FAILURE CASE (i) IS UNREACHABLE (hard). The state it depends on, `jnt_range == [0,0]`
      with `jnt_limited == 1`, cannot exist in any compiled mjModel. MJCF `limited="true" range="0 0"`
      is a compile error — `Error: range[0] should be smaller than range[1] in joint` — for hinge and
      slide alike, and with `autolimits` true, false, or unset. From URDF, a `revolute` with `lower ==
      upper` compiles to `jnt_limited=0` (verified: `[0,0]` → limited 0, `[0.2,0.2]` → limited 0; only
      a nonzero span such as `[0,1e-9]` gives limited 1). Worse than unreachable: a locked joint and a
      genuinely free `continuous` joint compile to the byte-identical signature `hinge, limited=0, range=[0,0]`,
      so the modelling choice the spec wants to reward with 1/2 is indistinguishable from the defect it
      must score 0.


      F3 — CANNOT FAIL ON THE MODAL REAL DEFECT (hard). The sweep drives only "undeclared **limited**
      hinge/slide" joints, and URDF `continuous` → `jnt_limited=0` (stated in the established facts, re-verified).
      A handle hanging off a drawer through a free-spinning continuous hinge — the exact "not really rigidly
      attached" defect this field exists to catch — is therefore never driven. Measured on that asset:
      max drift_pos = 0.000e+00, drift_rot = 0.000e+00 → PASS; driving the same hinge to π/2 gives drift_rot
      = 1.571 rad → FAIL. The corpus is URDF and `continuous` is the standard idiom for handles, knobs
      and wheels. Combined with F2, cited cases (i) and (iii) both collapse into the same hole: any joint
      on the leader→follower path that the sweep does not exercise yields a silent free PASS. Ball and
      free joints on the path are likewise never driven (the rule names only hinge/slide).


      F4 — `b*` UNDEFINED, AND CITED CASE (ii) UNREACHABLE (determinism). Gate G1 binds a part to a **set**
      of bodies/geoms (P0 §04, "绑定到 MJCF 的 body / geom 集合"), but the algorithm takes a single `bf = b*(follower)`
      and indexes `xpos[bf]`. No tie-break is given, so the representative depends on iteration order.
      And cited case (ii) — "a follower bound to several bodies of which only some sit inside the leader''s
      rigid subtree" — cannot be detected at all, because only one of those bodies is ever measured. Two
      of the three claimed sources of independent information are thus unreachable as written; only (iii)
      survives, and F3 guts that one too.


      F5 — ROTATION METRIC NOISE FLOOR vs. AN UNDEFINED THRESHOLD. `arccos(clip((trace-1)/2,-1,1))` loses
      half the mantissa near θ=0. Measured over 81 rigid configurations of a leader carried by two joints
      above it: trace/arccos floor = 5.162e-08 rad, while the same configurations give a translation floor
      of 5.5e-16 m. `tolerances.kf1.follower_drift_rad` does not exist in P0 §12''s frozen tolerances
      block, and the item supplies neither a value nor a floor — an engineer reasoning "rigid means exactly
      zero, translation proves it" and choosing 1e-9 rad gets false failures on every correct asset. Same
      gap for `sweep_samples_per_dof` and `max_configs`: the item reads them from a `tolerances.kf1` sub-block
      P0 does not define, and `deviates_from_spec` declares only the rotational tolerance, not these two.


      F6 — "CLIPPED RANGE" IS DEGENERATE ON UNLIMITED JOINTS. Clipping is undefined when `jnt_limited==0`,
      where `jnt_range` is `[0,0]`. P0''s own example B declares `gear_large_spin` over ±6.283 rad, and
      the natural correct implementation is a URDF `continuous` joint → clipping collapses the declared
      sweep to the single point 0, Q_kf1 becomes {REF}, and the check is vacuous rather than N/A.


      F7 — minor. `|p_rel - p_rel0|` never says Euclidean. Zero-span limited joints give min==mid==max
      duplicates, so `n_configs` and `first_failing_config` depend on whether duplicates are deduped.
      The `max_configs` truncation rule (order, which configs survive) is unspecified here, and `configs_truncated=True`
      currently coexists with a silent PASS. Finally, the N/A rules are internally inconsistent: the empty-Q_kf1
      case correctly refuses to count an unfalsifiable claim as satisfied ("must not be counted as satisfied"),
      and `merged_body` is likewise excluded, but `entailed_by_structure` — equally unfalsifiable under
      FK-only scope — is still counted as a satisfied claim in KF1_micro. That is structurally the same
      bug P0 §09 documents for KF2''s empty-set max ("最差的模型得满分"), one free point per correct rigid attachment.'
    fix: "F1: replace `mjData.body_xpos[b]` → `mjData.xpos[b]` and `mjData.body_xmat[b]` → `mjData.xmat[b].reshape(3,3)`;\
      \ add `mjData.xquat` (nbody,4) to mj_inputs. State explicitly that `xipos`/`ximat` are forbidden\
      \ because the injected inertia must not influence any score.\n\nF2+F3+F4 — replace the whole sweep-coverage\
      \ rule with a path-based one that cannot award a vacuous pass:\n1. Let B_f = the full set of bodies\
      \ Gate-bound to the follower and B_l = the set bound to the leader. Pick `bl` = the unique element\
      \ of B_l closest to the world root (fewest `body_parentid` hops; tie-break on smallest body id —\
      \ state this). Evaluate drift for **every** b in B_f and take the max; emit `follower_bodies` and\
      \ `worst_body` as evidence. This makes cited case (ii) reachable and removes the undefined `b*`.\n\
      2. Compute J_path for each b in B_f: walk `body_parentid` from b up to `bl`, collecting each body's\
      \ joints via `body_jntadr`/`body_jntnum`. If J_path is empty for all b → `entailed_by_structure\
      \ = True`.\n3. Every joint in J_path must be exercised, and the driving span must NOT be gated on\
      \ `jnt_limited`:\n   - hinge/slide, `jnt_limited==1`: drive to [range.min, midpoint, range.max].\n\
      \   - hinge, `jnt_limited==0`: drive to [−π/2, 0, +π/2]. The compiled model declares no limit, so\
      \ the DOF is free by construction and must be treated as free — this is the F2/F3 fix and it deliberately\
      \ refuses to guess \"locked\".\n   - slide, `jnt_limited==0`: drive to [−L, 0, +L] with L = the\
      \ follower part's own AABB diagonal (never a whole-asset diagonal).\n   - ball: write qpos[qposadr:qposadr+4]\
      \ as identity plus ±30° about each body axis, then `mju_normalize4`.\n   - free: identity plus ±L\
      \ along each body axis plus one fixed 30° rotation.\n4. Pass only if every joint in J_path was exercised\
      \ AND max drift stays within tolerance. If any path joint could not be exercised (including truncation\
      \ by `max_configs`), report N/A with reason `undriveable_dof_on_path` or `partial_sweep` — never\
      \ PASS.\nDelete cited case (i) from `can_it_fail`; a locked joint is not distinguishable from a\
      \ free one in mjModel. If partial credit for a genuinely locked joint is still wanted, it must be\
      \ recovered from the pre-compile source (URDF `type=\"revolute\"` with `lower == upper`) and recorded\
      \ as a separate declared-source field, with the honest note that declaration-reading carries little\
      \ information.\n\nF5: compute the angle on quaternions, all MuJoCo-native — `mju_negQuat(q0_inv,\
      \ q_rel0)`, `mju_mulQuat(dq, q0_inv, q_rel)`, θ = 2·atan2(‖dq[1:4]‖₂, |dq[0]|). Measured floor on\
      \ the same 81 configs: 5.485e-16 rad versus 5.162e-08 for arccos-of-trace. Then add the three keys\
      \ to P0 §12's flat frozen block (not a nested `kf1` sub-block that A12 would not validate): `follower_drift_rad:\
      \ 0.001`, `sweep_samples_per_dof: 5`, `max_configs: 4096`, and extend `deviates_from_spec` to name\
      \ all three additions.\n\nF6: define clipping precisely — clip the declared P0 range against `jnt_range`\
      \ only when `jnt_limited == 1`; when `jnt_limited == 0`, use the declared P0 range unclipped (`jnt_range`\
      \ is meaningless `[0,0]` there).\n\nF7: specify the L2 norm for drift_pos; dedupe configurations\
      \ by exact qpos bytes before ordering so `n_configs`/`first_failing_config` are stable; pin the\
      \ Q_kf1 enumeration order (declared independent DOFs in `independent_dofs` order, then undeclared\
      \ path joints in ascending joint id, samples in ascending value) and state that truncation keeps\
      \ the first `max_configs` in that order; and make `entailed_by_structure == True` produce N/A in\
      \ KF1_micro exactly as `merged_body` does, so the KF1 denominator never absorbs an unfalsifiable\
      \ claim as a pass — the same rule the item already applies to empty Q_kf1 and that P0 §09 imposes\
      \ on KF2."
- item: KF2.bound
  lens: kf2
  verdict:
    sound: false
    problem: "FOUR defects; the first is decisive.\n\n(1) INVERSE TAUTOLOGY — bound(g) is identically\
      \ FALSE on 100% of the real corpus, so KF2 is a constant 0, not a discriminator. The corpus is URDF,\
      \ and MuJoCo's URDF parser cannot emit ANY of B1–B5. I verified both routes on MuJoCo 3.3.7 with\
      \ real files at /private/tmp/.../scratchpad/t.urdf and t2.urdf:\n  * a URDF joint carrying <mimic\
      \ joint=\"gear_large_spin\" multiplier=\"3.0\"/> compiles to neq=0, ntendon=0, nu=0 (mimic silently\
      \ dropped);\n  * a URDF whose <mujoco> block contains <equality><joint joint1=... joint2=... polycoef=\"\
      0 3 0 0 0\"/></equality> also compiles to neq=0 (the URDF reader accepts only <compiler>/<option>/<size>\
      \ inside <mujoco>; everything else is silently discarded).\nURDF is a strict tree, so no equality/connect/weld\
      \ can arise either. Therefore no URDF asset — correct, defective, or gold-standard — can ever reach\
      \ step 5, and the 1[bound(g)] factor drives KF2 to 0 for every asset that declares a coupling. This\
      \ is the exact failure mode that already burned the team: zero discriminative information, and worse\
      \ than the tautology it replaced, because it actively penalizes correct assets rather than merely\
      \ passing bad ones. The item's own can_it_fail concedes this and defers to \"open_decisions\" —\
      \ but the task requires a spec an engineer can code with no further decisions, and this one has\
      \ no writable behavior on the actual data.\n\n(2) INTERNAL CONTRADICTION at coefficient c == 0.0.\
      \ Step 7(a) says a single-joint mjEQ_JOINT with eq_obj1id==jd, eq_obj2id==-1 \"IS a valid B1 binding\"\
      \ when c==0.0. But B1 in step 5 requires {eq_obj1id, eq_obj2id} == {jd, ji}, i.e. {jd, -1} == {jd,\
      \ ji}, which is false; step 5 therefore never finds it, and step 8 says \"PASS iff a binding was\
      \ produced by step 5/6\". So a model that correctly implements a c==0.0 coupling FAILS, and no `binding`\
      \ record is stored, leaving every downstream KF2 predicate with an undefined input.\n\n(3) B3 is\
      \ unimplementable as written. (a) tolerances.tendon_lock_width_max does not exist: P0-revised §12\
      \ freezes exactly nine keys (axis_angle_deg, anchor_side_fraction_min, anchor_center_offset_max,\
      \ travel_scale_min, follower_drift_m, state_match_relative, required_contact_m, forbidden_penetration_m,\
      \ coupling_residual), admission check A12 demands the block be complete, and deviates_from_spec\
      \ never discloses the new key or a default value. (b) The claim names \"a zero-width-limited fixed\
      \ tendon\", and P0-revised §09's own model-side example is <fixed limited=\"true\" range=\"0 0\"\
      >. Verified: that XML does not compile — MuJoCo raises `Error: invalid limits in tendon` because\
      \ the compiler requires range[0] < range[1] strictly. range=\"-1e-9 1e-9\" compiles fine. So the\
      \ contract's reference implementation of the coupling is not loadable, and any generator copying\
      \ it fails Gate G3 instead of passing KF2. (c) A fixed tendon's length is a coefficient-weighted\
      \ sum that may mix hinge (rad) and slide (m) members, so the threshold has no coherent unit as specified.\n\
      \n(4) Three smaller breaks. (a) Step 4's \"put the model at q_ref (STEP Q of KF2.residual step 6)\
      \ and mj_forward\" buys nothing and creates a cross-item dependency: mjData.eq_active is a user-writable\
      \ input initialized from mjModel.eq_active0 by mj_resetData and is never written by mj_forward,\
      \ so every activity read is just eq_active0. (b) DETERMINISM: step 7's reasons overlap without a\
      \ precedence rule — a mjEQ_JOINT with members {jd, -1} and c!=0 matches both (a) dependent_pinned_to_constant\
      \ and (b) wrong_members, and (c) inactive overlaps (a),(b),(d),(e); no ordering for the rejected_candidates\
      \ list is given either, so two conforming implementations emit different evidence. (c) The claim's\
      \ final clause \"and it is not an actuator transmission\" is never tested by any algorithm step\
      \ — the actuator fields in mj_inputs (nu, actuator_trntype, actuator_trnid, actuator_gear, mjTRN_JOINT)\
      \ are unused. Also, na_condition says the member_unbound N/A \"must be counted in applicable-n\"\
      , which directly contradicts P3 Reporting (\"Exclude N/A dimensions from applicable-only aggregation\"\
      )."
    fix: "(1) Give URDF a real channel into the compiled model, in the loader that already rewrites the\
      \ asset. The pipeline already injects <mujoco><compiler/></mujoco> and dummy <inertial> elements;\
      \ add one more step: after parsing, scan the URDF XML for <joint name=\"D\"><mimic joint=\"I\" multiplier=\"\
      k\" offset=\"b\"/></joint> and materialize each one as an equality on the compiled model. Verified\
      \ working in 3.3.7 via mjSpec, which requires no MJCF round-trip:\n    spec = mujoco.MjSpec.from_file(urdf)\n\
      \    eq = spec.add_equality(); eq.type = mujoco.mjtEq.mjEQ_JOINT\n    eq.objtype = mujoco.mjtObj.mjOBJ_JOINT\n\
      \    eq.name1 = D; eq.name2 = I; eq.data[:5] = [b, k, 0, 0, 0]\n    m = spec.compile()\n  This yields\
      \ neq=1, eq_obj1id=D, eq_obj2id=I, eq_data[0][:5]=[b,k,0,0,0], and a live efc_pos row (I measured\
      \ efc_pos=0.5 at q_dep=0.0, q_indep=0.5 with k=3), so KF2.coefficient and KF2.residual work unchanged\
      \ downstream. The transcription MUST be verbatim — never repaired against the contract — so a generator\
      \ that writes multiplier=\"2.0\" against a contract coefficient of 3.0 still fails KF2.coefficient\
      \ and KF2.residual. Emit coupling_source ∈ {native_mjcf_equality, native_mjcf_tendon, urdf_mimic_injected}\
      \ in the evidence, and record the injection in the model hash so the score stays auditable. Add\
      \ a sixth candidate kind B0 = urdf_mimic_injected at the top of the priority order (B0>B1>B2>B3>B4>B5).\
      \ If mimic injection is rejected as policy, then bound(g) must return N/A (never FAIL) whenever\
      \ the asset's source format cannot express any candidate kind — and the report must state that KF2\
      \ has applicable-n = 0 on the URDF corpus, rather than publishing a column of zeros.\n\n(2) Move\
      \ the c==0.0 case into step 5 as rule B1b, evaluated at the same priority as B1 and before B2: e\
      \ with eq_type==mjEQ_JOINT, d.eq_active[e]!=0, int(eq_obj1id[e])==jd, int(eq_obj2id[e])==-1, and\
      \ couplings[g].relation.coefficient == 0.0. It produces binding = {kind: \"eq_joint_pin\", eq_index:\
      \ e, jd, ji, bd, bi, role_swapped: False}. Tie-break: if both a B1 and a B1b candidate exist, B1\
      \ wins (it references both members). Delete the \"unless c==0.0\" escape from step 7(a); with c\
      \ != 0.0 the pin stays a rejection.\n\n(3) Add `tendon_lock_width_max: 1.0e-6` to the P0-revised\
      \ §12 tolerances block (declared unitless-absolute, since a fixed tendon may mix rad and m members)\
      \ and disclose it in deviates_from_spec. Restate the claim and B3 as \"a limited fixed tendon whose\
      \ range width (tendon_range[t][1] - tendon_range[t][0]) is > 0 and <= tendon_lock_width_max\" —\
      \ drop the words \"zero-width\", which name an object MuJoCo refuses to compile. Correct P0-revised\
      \ §09's example MJCF from range=\"0 0\" to range=\"-1e-9 1e-9\", and add a Gate G3 note that a zero-width\
      \ tendon limit is a compile error.\n\n(4a) Delete step 4. Read activity from a freshly mj_resetData'd\
      \ mjData (or read m.eq_active0 directly) and remove the forward reference to KF2.residual STEP Q;\
      \ state explicitly that eq_active is an input, not a forward-kinematics output. (4b) Specify that\
      \ step 7 reasons are evaluated in the fixed order a→b→c→d→e→f with first match winning, exactly\
      \ one reason per candidate, and that rejected_candidates is emitted sorted by (kind_rank, index)\
      \ with kind_rank = [eq_joint, eq_tendon, tendon_limit, eq_weld, eq_connect, actuator]. (4c) Either\
      \ add an explicit step — \"if the only object relating jd and ji is an actuator with actuator_trntype==mjTRN_JOINT,\
      \ record reason actuator_transmission_not_a_constraint and do not bind\" — or strike \"and it is\
      \ not an actuator transmission\" from the claim and cite KF2.gear_transmission. Reword na_condition\
