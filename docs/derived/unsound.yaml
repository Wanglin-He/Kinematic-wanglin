- item: gearbox_wrong_ratio
  lens: gold
  verdict:
    sound: false
    problem: 'The asset is URDF, and MuJoCo''s URDF reader silently discards the `<equality>` block. Verified
      on the installed MuJoCo 3.3.7 with the exact harness injection from the established facts: the model
      loads fine (nbody=4, njnt=2, ngeom=5, nv=2) but **neq=0**. Moving `<equality>` inside the `<mujoco>`
      element gives neq=0 too; the fixed-tendon alternative P0 §09 also accepts gives ntendon=0; `MjSpec.from_file()`
      reports 0 equalities. A garbage element (`<totally_bogus_element/>`) at robot level also loads with
      no error and no warning, confirming the URDF reader silently drops every unrecognized `<robot>`
      child. MuJoCo''s URDF extension only ever accepted `<compiler>`, `<option>`, `<size>` under `<mujoco>`.


      Consequence: the asset does not implement a 2:1 gearbox, it implements **no coupling at all**, so
      it is byte-for-byte the same fixture as P0 §14''s separate hole ② ("根本没实现耦合"). It fails to isolate
      the predicate it targets, and all four KF2 sub-verdicts in `expected` are wrong:

      - KF2.bound — expected PASS, actually FAIL (no equality, no tendon, nothing to bind).

      - KF2.coefficient (a stated target) — expected FAIL citing "eq id 0 … eq_data[1] 2.0", actually
      N/A; there is no eq id 0 to read.

      - KF2.residual (the other stated target) — expected FAIL at 6.283 rad, actually the equality row
      set is empty, i.e. exactly the vacuous-max degenerate case P0''s own bound-factor discussion warns
      about.

      - KF2.expected_dof — expected PASS (nv 2 − rank 1 = 1), actually nv 2 − rank 0 = 2, a FAIL. So the
      asset incidentally breaks a predicate it claims to leave passing.


      The KF1/KF3 half of the expected string is fine — I measured gear–gear min signed distance −0.000500
      m and gear–housing max penetration 0.000000 m over a 41-sample sweep on the loaded URDF, matching
      the expected values exactly.


      Two secondary defects, both real independent of the above:

      (a) The evidence numbers contradict each other. "first failing q_large 0.3142 rad" cannot coexist
      with "worst q_large −6.283 rad": the residual is |q_large|, so under any monotone min→max sweep
      of the declared range the *first* sample already fails. Measured on an MJCF equivalent with linspace(-6.283,
      6.283, 41): first-failing = −6.283 = worst. 0.3142 (= 12.566/40) only arises if the sweep starts
      at the home state 0 and walks outward — an ordering nothing states. Since sweep order alone determines
      this evidence field, it is also a determinism hole.

      (b) Field names in the evidence schema are wrong for the Python bindings: there is no `eq_obj1`/`eq_obj2`;
      MuJoCo exposes `m.eq_obj1id` / `m.eq_obj2id`. `m.eq_data` is shaped (neq, 11), so polycoef is `eq_data[i][:5]`.'
    fix: "1. Re-author this fixture — and its `gearbox_correct` sibling and the \"no coupling declared\"\
      \ fixture — as **MJCF (.xml), not URDF**. There is no URDF path to `<equality>` or `<tendon>` in\
      \ any released MuJoCo, and the failure mode is silent, so it will never surface as a load error.\
      \ P0 §16 ④ already flags that the pipeline assumes MJCF; the coupling fixtures are exactly where\
      \ that assumption becomes load-bearing.\n\n   To keep the fixture faithful to the real-corpus regime,\
      \ carry the URDF-parity conditions explicitly into the MJCF: every geom gets `contype=\"0\" conaffinity=\"\
      0\" group=\"1\"` so `ncon` stays 0 and all distance work still goes through `mj_geomDistance`, and\
      \ keep the same body/joint/geom layout. I verified this transcription reproduces every number the\
      \ item claims:\n\n   ```xml\n   <mujoco model=\"gearbox_wrong_ratio\">\n     <compiler angle=\"\
      radian\"/>\n     <worldbody>\n       <body name=\"housing\">\n         <geom name=\"housing_base\"\
      \ type=\"box\" size=\"0.16 0.1 0.01\" pos=\"0 0 0.01\"\n               contype=\"0\" conaffinity=\"\
      0\" group=\"1\"/>\n         <geom name=\"housing_boss_large\" type=\"cylinder\" size=\"0.008 0.129\"\
      \ pos=\"-0.06 0 0.149\"\n               contype=\"0\" conaffinity=\"0\" group=\"1\"/>\n        \
      \ <geom name=\"housing_boss_small\" type=\"cylinder\" size=\"0.008 0.129\" pos=\"0.0595 0 0.149\"\
      \n               contype=\"0\" conaffinity=\"0\" group=\"1\"/>\n         <body name=\"gear_large\"\
      \ pos=\"-0.06 0 0.29\">\n           <joint name=\"gear_large_spin\" type=\"hinge\" axis=\"0 0 1\"\
      \ limited=\"true\" range=\"-6.283 6.283\"/>\n           <geom name=\"gear_large_disc\" type=\"cylinder\"\
      \ size=\"0.09 0.01\"\n                 contype=\"0\" conaffinity=\"0\" group=\"1\"/>\n         </body>\n\
      \         <body name=\"gear_small\" pos=\"0.0595 0 0.29\">\n           <joint name=\"gear_small_spin\"\
      \ type=\"hinge\" axis=\"0 0 1\" limited=\"true\" range=\"-18.85 18.85\"/>\n           <geom name=\"\
      gear_small_disc\" type=\"cylinder\" size=\"0.03 0.01\"\n                 contype=\"0\" conaffinity=\"\
      0\" group=\"1\"/>\n         </body>\n       </body>\n     </worldbody>\n     <equality>\n      \
      \ <joint joint1=\"gear_small_spin\" joint2=\"gear_large_spin\" polycoef=\"0 2 0 0 0\"/>\n     </equality>\n\
      \   </mujoco>\n   ```\n\n   Measured on this file: `neq=1`, `eq_type=[mjEQ_JOINT]`, `eq_obj1id=[1]`\
      \ (gear_small_spin), `eq_obj2id=[0]` (gear_large_spin), `eq_data[0][:5]=[0,2,0,0,0]`; sweeping q_large\
      \ over [-6.283, 6.283] with q_small := 3·q_large gives `max |efc_pos| = 6.283000 rad` and equality-row\
      \ `rank(efc_J) = 1` so `nv − rank = 1`; gear–gear min sd = −0.000500 m; gear–housing max penetration\
      \ = 0.000000 m. Flipping polycoef to `0 3 0 0 0` gives `max |efc_pos| = 0.000000` with every other\
      \ number unchanged, so the pair really does isolate KF2.coefficient + KF2.residual with bound and\
      \ expected_dof both passing on each side.\n\n   Do **not** patch this by having the harness inject\
      \ the equality post-load (MjSpec or a merged sidecar). An evaluator-supplied constraint makes KF2.bound\
      \ unfalsifiable, which is precisely the hole P0 §09's bound factor exists to close.\n\n2. Fix the\
      \ evidence-field names: `m.eq_obj1id` / `m.eq_obj2id` (not `eq_obj1`/`eq_obj2`); for `mjEQ_JOINT`\
      \ these are joint ids. Polycoef is `m.eq_data[i][:5]` out of an (neq, 11) array.\n\n3. Pin the sweep\
      \ order and correct the first-failing value. Specify \"independent DOF sampled as `numpy.linspace(range.min,\
      \ range.max, N)`, visited in ascending index order, first-failing = the first such sample whose\
      \ |r_norm| > epsilon\", then set the expected evidence to `first failing q_large -6.283 rad`, which\
      \ then coincides with the worst sample. If instead the intended sweep is home-state-outward, say\
      \ so explicitly and state N, since 0.3142 is only correct for N=41 on this range."
- item: gearbox_missing_coupling
  lens: gold
  verdict:
    sound: false
    problem: "The asset is geometrically and numerically exactly as advertised, but it is authored in\
      \ the wrong container, and that destroys the one thing it exists to do.\n\nMEASURED (MuJoCo 3.3.7,\
      \ the frozen loader from ESTABLISHED FACTS: `<mujoco><compiler discardvisual=\"false\" inertiafromgeom=\"\
      true\" balanceinertia=\"true\" strippath=\"false\" fusestatic=\"false\"/></mujoco>` injected into\
      \ `<robot>`):\n\nThe URDF front end SILENTLY DISCARDS every construct that could implement a coupling.\
      \ I tested all four placements plus the standard URDF element:\n  * `<equality>` as a direct child\
      \ of `<robot>`      -> LOADED, neq=0, ntendon=0\n  * `<equality>` inside the injected `<mujoco>`\
      \ block -> LOADED, neq=0, ntendon=0\n  * `<tendon><fixed>` as a child of `<robot>`         -> LOADED,\
      \ neq=0, ntendon=0\n  * `<tendon><fixed>` inside `<mujoco>`               -> LOADED, neq=0, ntendon=0\n\
      \  * standard URDF `<mimic joint=\"gear_large_spin\" multiplier=\"3.0\" offset=\"0.0\"/>` inside\
      \ `<joint>` -> LOADED, neq=0, ntendon=0\nNo warning, no error, no promotion, in any position.\n\n\
      Consequence 1 — the defect is a ZERO-DELTA EDIT. \"The entire <equality> element is deleted from\
      \ gearbox_correct; nothing else changes\" describes a diff that changes nothing in the compiled\
      \ model. gearbox_correct-as-URDF and this file compile to identical mjModels: nq=nv=2, njnt=2, nbody=4,\
      \ ngeom=5, neq=0, ntendon=0, ncon=0, nefc=0 at every sweep sample. The asset therefore has ZERO\
      \ discriminative power: the verifier emits the same KF2.bound FAIL / expected_dof FAIL / KF2=0 verdict\
      \ for the CORRECT asset. A fault-injection asset that scores identically to its control validates\
      \ nothing and calibrates nothing — it is the mirror image of the tautology failure the team already\
      \ hit, a constant-FALSE predicate instead of a constant-TRUE one.\n\nThe item's own text hedges\
      \ this as a conditional (\"the difference ... VANISHES if the loader does not promote the <equality>\
      \ element ... so this pair is simultaneously the regression test for the loader\"). It is not a\
      \ conditional — it is the measured behavior, and it is not fixable by fixing the loader, because\
      \ MuJoCo's URDF parser has no equality/tendon/mimic support to promote in the first place. A \"\
      regression test\" that no achievable loader can pass is not a regression test.\n\nConsequence 2\
      \ — corpus-wide. All 546 real assets go through this same URDF path, so neq==0 and ntendon==0 for\
      \ every one of them. KF2.bound is constant-FALSE for every asset that declares a coupling, KF2 collapses\
      \ to identically 0 whenever applicable, and KF2.coefficient and KF2.residual are permanently N/A.\
      \ The entire residual pipeline the P0 revision specifies (equality rows of efc_pos, sweep, epsilon_g,\
      \ residual_norm) is unreachable dead code on real data. This must be recorded in the spec, not discovered\
      \ at run time.\n\nEverything else in the item checks out and I confirmed it numerically, so the\
      \ fix is narrow:\n  * mesh_contact min signed distance gear_large_disc/gear_small_disc = -0.000499999\
      \ m (claimed -0.000500), constant over a 41-sample sweep -> pass vs required_contact_m 0.002\n \
      \ * forbidden gear_large/housing = +0.002000000 m (closest pair gear_large_disc/housing_boss_large),\
      \ gear_small/housing = +0.002000000 m (gear_small_disc/housing_boss_small) -> 2/2 pass, zero penetration\
      \ vs forbidden_penetration_m 0.001. Values are distmax-invariant over 0.01..1.0.\n  * anchor through_center_of\
      \ offset = 0.000000000 m on BOTH gears at q=0, 1.234, -5.0 (claimed 0.000000)\n  * jnt_type=3 (hinge)\
      \ x2, jnt_limited=1 x2, jnt_range [-6.283,6.283] and [-18.85,18.85], qpos0=0 -> KF1.parent/type/axis/range\
      \ all 2/2\n  * fake_joint chord form: gear_large chord 2R=0.18 vs AABB diag 0.255343 (0.705); gear_small\
      \ chord 0.06 vs diag 0.087178 (0.688) -> both pass travel_scale_min 0.50 in either orientation of\
      \ the ratio\n  * nefc=0 at every sample INCLUDING the exact endpoints q_large=+/-6.283, q_small=+/-18.849\
      \ (no limit rows fire; jnt_margin=0), so the max-over-empty-set trap fires exactly as described\n\
      \  * geomDistance sweep is bit-reproducible across reloads (sha1 identical over 3 loads)"
    fix: "Move the gearbox pair to MJCF. P0-revised's own 下一步 already says \"1 份正确的 MJCF + 3 份带已知缺陷\"\
      \ — the `urdf` field on this item contradicts it. Replace the `urdf` field with an `mjcf` field\
      \ carrying this exact model (verified to reproduce every measured number above: same 5 geoms, same\
      \ -0.0005 mesh overlap, same +0.002 boss clearances, nv=2):\n\n<mujoco model=\"gearbox_missing_coupling\"\
      >\n  <compiler discardvisual=\"false\" inertiafromgeom=\"true\" balanceinertia=\"true\" angle=\"\
      radian\"/>\n  <worldbody>\n    <body name=\"housing\">\n      <geom name=\"housing_base\" type=\"\
      box\" size=\"0.16 0.1 0.01\" pos=\"0 0 0.01\" contype=\"0\" conaffinity=\"0\" group=\"1\"/>\n  \
      \    <geom name=\"housing_boss_large\" type=\"cylinder\" size=\"0.008 0.129\" pos=\"-0.06 0 0.149\"\
      \ contype=\"0\" conaffinity=\"0\" group=\"1\"/>\n      <geom name=\"housing_boss_small\" type=\"\
      cylinder\" size=\"0.008 0.129\" pos=\"0.0595 0 0.149\" contype=\"0\" conaffinity=\"0\" group=\"\
      1\"/>\n      <body name=\"gear_large\" pos=\"-0.06 0 0.29\">\n        <joint name=\"gear_large_spin\"\
      \ type=\"hinge\" axis=\"0 0 1\" limited=\"true\" range=\"-6.283 6.283\"/>\n        <geom name=\"\
      gear_large_disc\" type=\"cylinder\" size=\"0.09 0.01\" contype=\"0\" conaffinity=\"0\" group=\"\
      1\"/>\n      </body>\n      <body name=\"gear_small\" pos=\"0.0595 0 0.29\">\n        <joint name=\"\
      gear_small_spin\" type=\"hinge\" axis=\"0 0 1\" limited=\"true\" range=\"-18.85 18.85\"/>\n    \
      \    <geom name=\"gear_small_disc\" type=\"cylinder\" size=\"0.03 0.01\" contype=\"0\" conaffinity=\"\
      0\" group=\"1\"/>\n      </body>\n    </body>\n  </worldbody>\n  <!-- DEFECT: the <equality> block\
