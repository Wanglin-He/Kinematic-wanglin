- item: cabinet_wrong_joint_type
  lens: gold
  verdict:
    sound: false
    problem: 'Most of the item checks out — I built it and ran it. The URDF parses and compiles with the
      pipeline''s injected `<mujoco><compiler discardvisual="false" inertiafromgeom="true" balanceinertia="true"
      strippath="false" fusestatic="false"/></mujoco>` block (8 bodies, 3 joints, 13 geoms, ncon=0 as
      expected). Geometry is consistent: interior x[-0.20,0.20] y[-0.20,0.18] z[0.02,1.18]; drawer_1 z[0.95,1.17]
      and drawer_2 z[0.69,0.91] each sit between shelves with 0.01 m clearance; the only overlaps are
      the intentional -0.0005 m stop contacts. The target predicate fires and is not a tautology: m.jnt_type[door_hinge]
      compiles to mjJNT_SLIDE (vs mjJNT_HINGE in the control), read from the model and compared to external
      contract text. Isolation was verified numerically against a control built by flipping only those
      two attributes: xaxis (0,0,-1) -> |angle| to world z = 0.00 deg; on_edge_of(door) same-side fraction
      = 1.0000 about the model joint line; jnt_range [0, 2.094], jnt_limited=1, qpos0=0 — all identical
      to the control; follower drift for door_knob->door = 5.6e-17 m; required-contact min sd = -0.00050
      m at closed for all three pairs. Two problems remain.


      (1) PRIMARY — COMPUTABILITY. The expected forbidden-pair evidence "+0.04000, +0.30000, +0.04000
      m" is analytically right but is NOT what the mandated tooling produces. A plain mj_geomDistance(m,
      d, g1, g2, distmax, fromto) is not a reliable signed-distance oracle for box-box in this environment
      (mujoco 3.3.7). Running the full 9^3 sweep on the asset: (drawer_1,drawer_2) = +0.04000 correct,
      but (door,drawer_1) = +0.00000 for distmax >= 0.5 and (door,drawer_2) = +0.00000 for every distmax
      >= 0.05. It returns exactly 0.0 where the true distance is large. Reproduced in a minimal hand-written
      MJCF with no URDF and no injected compiler flags (two boxes, one 0.02 m thin panel): 55 of 101 separated
      configurations returned a wrong value, most of them exactly 0.0. Isolated example, door panel moved
      away from a frame box: true gap 0.200 m -> mj_geomDistance returns 0.0 at distmax 0.3/1.0/5.0; true
      gap 0.400 m -> returns 0.0 at distmax 1.0/5.0; true gap 0.002 m -> returns 0.0. The established-facts
      block''s "verified working: +0.345 for a separated one" is one lucky sample. Two consequences: the
      item''s stated evidence numbers are unreproducible, and more seriously "required stop_contact: min
      sd <= required_contact_m (0.002)" becomes un-failable — a door left 0.20 m clear of the frame reports
      sd = 0.0 and passes, so a sibling gold-standard asset targeting KF3.required_contact would silently
      score PASS. The forbidden-pair verdicts survive (0.0 is not a penetration > 0.001), so this item''s
      pass/fail column is safe, but its evidence column and the whole KF3 collision half are not.


      (2) SECONDARY — unflagged spec decision. The item flags KF1.anchor as "SPEC DECISION REQUIRED" but
      silently asserts KF1.range_and_reference PASS. The contract declares range {unit: rad, min 0, max
      2.094} while the bound joint is a slide whose jnt_range is in metres. P0 §07 / admission check A11
      explicitly pairs slide<->m and hinge<->rad, so a range_and_reference implementation that validates
      the declared unit against the bound joint type will FAIL here and double-count the type defect —
      exactly the failure mode the item was careful to guard against for anchor and motion_semantics.
      (Same class of hidden coupling, though defensible: KF1.axis PASS depends on the semantic-vertical
      test using unsigned |cos| rather than a signed angle; the deliberate 0 0 -1 sign flip fails a signed
      test at 180 deg. P0''s "vertical 要求 ∥" supports unsigned, and the expected pins "0.00 deg", so this
      one is adequately pinned.)'
    fix: "(1) Do not call mj_geomDistance once with a large frozen distmax. Freeze instead a bisection-on-distmax\
      \ wrapper, which exploits the one regime where the call IS reliable — whenever distmax < true distance\
      \ it returns exactly distmax, verified in every test:\n\n  def pair_sd(m, d, g1, g2, hi=2.0, tol=1e-6):\n\
      \      ft = np.zeros(6)\n      v = mj_geomDistance(m, d, g1, g2, tol, ft)\n      if v < tol - 1e-12:\
      \            # touching or penetrating: reliable at tiny distmax\n          return v           \
      \        # negative values were correct at every distmax tested\n      lo = tol\n      while hi\
      \ - lo > tol:           # fixed iteration count -> deterministic, ~21 calls\n          mid = 0.5\
      \ * (lo + hi)\n          if mj_geomDistance(m, d, g1, g2, mid, ft) >= mid - 1e-12:\n           \
      \   lo = mid               # still capped => true distance >= mid\n          else:\n           \
      \   hi = mid\n      return 0.5 * (lo + hi)\n\nI ran this over the asset's full 9^3 sweep and it\
      \ reproduces the item's numbers exactly: (drawer_1,drawer_2) +0.04000, (door,drawer_1) +0.30000,\
      \ (door,drawer_2) +0.04000 — bit-identical to the analytic AABB distances. Freeze `hi` (2.0 m) and\
      \ `tol` (1e-6) in the tolerances block alongside the existing thresholds so the sweep stays deterministic,\
      \ and add a clause to the item: \"clearance evidence is produced by the frozen distmax-bisection\
      \ wrapper; a single mj_geomDistance call at distmax >= 0.05 returns 0.00000 for the two (door, drawer_i)\
      \ pairs.\" Also add a self-test to the harness — two separated boxes at a known 0.20 m gap must\
      \ report 0.20, not 0.0 — so this regression is caught if the wrapper is ever bypassed.\n\n(2) Add\
      \ an explicit pin to the expected block, in the same style as the KF1.anchor note: \"KF1.range_and_reference\
      \ compares jnt_range / jnt_limited / qpos0 to range.min / range.max / states.closed as bare numbers\
      \ only. It does NOT check range.unit against the bound joint's model type — unit-vs-type consistency\
      \ is a P0 admission check (A11) on the contract, not a KF1 claim on the asset. Evaluated that way\
      \ it is PASS here (jnt_range [0, 2.094], jnt_limited 1, qpos0 0). A FAIL would double-count the\
      \ type defect.\""
