    fix: "Pick ONE of the two repairs below, then apply the five common patches. Both make the predicate\
      \ falsifiable on data the evaluator will actually see; neither reintroduces a whole-asset diagonal.\n\
      \nREPAIR A (preferred — keeps the predicate on mjModel and revives all of KF2, which is equally\
