      required_parts[4].role: ''follows_drawer'' is not one of: fixed, movable, attached` — admission
      never runs. The item''s claim "this kills `role: follows_drawer`" is false as written; the loader
      kills it. Either layer may own the vocabulary, but both cannot, and the item asserts an evidence
      code the architecture cannot emit. This is exactly the "check that cannot fail" failure mode the
