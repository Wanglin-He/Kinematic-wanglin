- name: gearbox_wrong_ratio
  targets: KF2.coefficient, KF2.residual
  defect: 'One number differs from gearbox_correct: the promoted equality''s polycoef becomes "0 2 0 0
    0" instead of "0 3 0 0 0", so the model implements a 2:1 reduction where contract B declares 3:1.
    Links, joints, radii, ranges, mesh overlap and housing clearances are untouched, so the geometry still
    looks like a 3:1 pair (radii 0.09 and 0.03) while the constraint disagrees with it. This is the case
    P0''s overturned-judgement note is about: the residual is NOT identically zero even though the evaluator
    itself writes the dependent state, because efc_pos measures the violation of the MODEL''s own constraint
    at the qpos the evaluator wrote. Sweeping the independent DOF over its declared range with q_small
    written as 3 q_large gives efc_pos = q_small - 2 q_large = q_large, so the residual grows linearly
    and peaks at the range ends.'
