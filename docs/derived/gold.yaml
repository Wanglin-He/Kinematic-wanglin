- name: gearbox_correct
  targets: none
  defect: 'None. This is the coupling control. A housing (0.32 x 0.20 x 0.02 base plate plus two 0.008
    m radius bosses of length 0.258 rising to z = 0.278) carries two hinges on parallel vertical axes
    at x = -0.06 and x = +0.0595, both at z = 0.29. gear_large is a 0.09 m radius, 0.02 m thick disc centred
    exactly on its own axis; gear_small is a 0.03 m radius disc likewise centred, so through_center_of
    measures offset 0.000000 for both. Centre distance is 0.1195 m against a radius sum of 0.12 m, so
    the rims overlap by 0.0005 m at every angle, satisfying the required mesh_contact at every sample;
    the discs clear the boss tops by 0.002 m so both (gear, housing) forbidden pairs stay non-penetrating.
    Radii are exactly 3:1 and gear_small''s range is exactly three times gear_large''s, so the whole independent
    range maps inside the dependent range. The coupling is a literal MJCF <equality><joint joint1="gear_small_spin"
    joint2="gear_large_spin" polycoef="0 3 0 0 0"/></equality> written as a direct child of <robot>. MEASURED
    ON MuJoCo 3.11.0: URDF cannot express a coupling at all -- <mimic> is silently ignored, <equality>
    and <tendon> inside <robot>/<mujoco> are silently dropped (neq stays 0), and a second <mujoco> element
    under <robot> is a hard XML error, so an asset cannot carry its own compiler block beside the standard
    injection. A bare <equality> under <robot> is likewise silently ignored, so the file still loads as
    plain URDF, and gold/loader.py lifts it into the compiled model with MjSpec.add_equality after the
    standard injection.'
