  defect: None. This is the control. A 0.44 x 0.40 x 1.20 m carcass built from seven boxes leaves an interior
    of x in [-0.20,0.20], y in [-0.20,0.18], z in [0.02,1.18], divided into a drawer_1 cavity z in [0.94,1.18],
    a drawer_2 cavity z in [0.68,0.92] and a door compartment z in [0.02,0.66]. Each drawer is one 0.38
    x 0.36 x 0.22 box with 0.01 m clearance on all four sides of its cavity; closed, its back overlaps
    the carcass back panel by 0.0005 m, which is what satisfies the required stop_contact, and its front
    sits 0.0205 m behind the front plane so the door plane is free. Travel is 0.24 m along -y, leaving
    39% of the tray AABB still inside the carcass at open. The door is one 0.43 x 0.02 x 0.62 panel lying
    across the front at y in [-0.2195,-0.1995], overlapping the two side panels by 0.0005 m at closed;
    its hinge is a vertical axis at (0.2155, -0.2095), 0.5 mm outside its own right edge, so 100% of the
    panel's vertices lie strictly on one side of the pivot plane. The door's z-band never meets either
    drawer's z-band, so both (door, drawer_i) forbidden pairs stay at least +0.04 m clear through the
    whole 3-DOF sweep. handle_1, handle_2 and door_knob are joined by URDF fixed joints to drawer_1, drawer_2
    and door, so with fusestatic=false they compile to their own bodies with zero joints inside their
    leader's rigid subtree. Every geom is <visual> only, exactly like the real corpus, so contype=0 conaffinity=0
    group=1 and ncon=0 in every state.
