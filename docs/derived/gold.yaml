    discs still mesh geometrically, but the model contains no equality, no tendon and no weld, so the
    two gears spin independently. This is the asset that proves the P0 revision''s point about the KF2
    formula: with no constraint instantiated there are no equality rows in efc_pos, a max over the empty
    set conventionally returns -inf, the indicator 1[max |r| <= epsilon] evaluates true, and the worst
