    \ KF predicate must PASS.\n-->\n<robot name=\"gearbox_correct\">\n  <link name=\"housing\">\n    <inertial><origin\
    \ xyz=\"0 0 0\" rpy=\"0 0 0\"/><mass value=\"10.0\"/><inertia ixx=\"0.01\" ixy=\"0\" ixz=\"0\" iyy=\"\
    0.01\" iyz=\"0\" izz=\"0.01\"/></inertial>\n    <visual name=\"housing_base\"><origin xyz=\"0 0 0.01\"\
    \ rpy=\"0 0 0\"/><geometry><box size=\"0.32 0.2 0.02\"/></geometry></visual>\n    <visual name=\"\
    housing_boss_large\"><origin xyz=\"-0.06 0 0.149\" rpy=\"0 0 0\"/><geometry><cylinder radius=\"0.008\"\
    \ length=\"0.258\"/></geometry></visual>\n    <visual name=\"housing_boss_small\"><origin xyz=\"0.0595\
    \ 0 0.149\" rpy=\"0 0 0\"/><geometry><cylinder radius=\"0.008\" length=\"0.258\"/></geometry></visual>\n\
    \  </link>\n  <link name=\"gear_large\">\n    <inertial><origin xyz=\"0 0 0\" rpy=\"0 0 0\"/><mass\
    \ value=\"1.0\"/><inertia ixx=\"0.01\" ixy=\"0\" ixz=\"0\" iyy=\"0.01\" iyz=\"0\" izz=\"0.01\"/></inertial>\n\
    \    <visual name=\"gear_large_disc\"><origin xyz=\"0 0 0\" rpy=\"0 0 0\"/><geometry><cylinder radius=\"\
    0.09\" length=\"0.02\"/></geometry></visual>\n  </link>\n  <link name=\"gear_small\">\n    <inertial><origin\
    \ xyz=\"0 0 0\" rpy=\"0 0 0\"/><mass value=\"0.4\"/><inertia ixx=\"0.01\" ixy=\"0\" ixz=\"0\" iyy=\"\
    0.01\" iyz=\"0\" izz=\"0.01\"/></inertial>\n    <visual name=\"gear_small_disc\"><origin xyz=\"0 0\
    \ 0\" rpy=\"0 0 0\"/><geometry><cylinder radius=\"0.03\" length=\"0.02\"/></geometry></visual>\n \
    \ </link>\n  <joint name=\"gear_large_spin\" type=\"revolute\">\n    <parent link=\"housing\"/>\n\
    \    <child link=\"gear_large\"/>\n    <origin xyz=\"-0.06 0 0.29\" rpy=\"0 0 0\"/>\n    <axis xyz=\"\
    0 0 1\"/>\n    <limit lower=\"-6.283\" upper=\"6.283\" effort=\"100\" velocity=\"1\"/>\n  </joint>\n\
    \  <joint name=\"gear_small_spin\" type=\"revolute\">\n    <parent link=\"housing\"/>\n    <child\
    \ link=\"gear_small\"/>\n    <origin xyz=\"0.0595 0 0.29\" rpy=\"0 0 0\"/>\n    <axis xyz=\"0 0 1\"\
    />\n    <limit lower=\"-18.85\" upper=\"18.85\" effort=\"100\" velocity=\"1\"/>\n  </joint>\n  <equality>\n\
    \    <joint joint1=\"gear_small_spin\" joint2=\"gear_large_spin\" polycoef=\"0 3 0 0 0\"/>\n  </equality>\n\
    </robot>\n"
  expected: 'Contract B (gold/contract_B_gearbox.yaml). KF1.parent pass 2/2. KF1.type pass 2/2 hinge.
    KF1.axis pass -- semantic 2/2 (both xaxis (0,0,1), 0.00 deg from world z), relational 2/2 (symmetry_axis_of
    a cylinder is its z axis), numeric na. KF1.anchor pass -- through_center_of offset/diag 0.000000 on
    both gears, far inside anchor_center_offset_max 0.05. KF1.range_and_reference pass 2/2 ([-6.283,6.283]
    and [-18.850,18.850], both limited, qpos0 0 = states.home). KF1.rigid_follower na (rigid_attachments
    empty). KF1.fake_joint pass ONLY under a chord-based hinge form: 0.2553/0.18 = 1.42 for gear_large,
    0.0872/0.06 = 1.45 for gear_small. Under an arc-length form (range span x radius = 1.131 m) the ratios
    are 0.226 and 0.077, both under travel_scale_min 0.50, and this correct control would FAIL -- so KF1.fake_joint
    must be slide-only or chord-based for hinges. KF2.bound pass (neq 1, mjEQ_JOINT, active, members exactly
    the two bound joints). KF2.coefficient pass (eq_data polycoef 0 3 0 0 0, matching dependent = 3.0
    x independent + 0.0 field for field). KF2.expected_dof pass (nv 2 - rank 1 = 1). KF2.residual pass
    (max |efc_pos| 0.000000 rad over 41 samples of q_large in [-6.283,6.283] with q_small written as 3
    q_large, epsilon 0.005). KF3.reachability pass (home reachable). KF3.continuity pass. KF3.motion_semantics
    pass. KF3.forbidden_pair pass 2/2 (gear-housing penetration 0.000000 m). KF3.required_contact pass
    (mesh_contact min sd -0.000500 m at every sample). Must score 1.0.'
